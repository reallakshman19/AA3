name: EMP.1.C gamma5 full Table5 oracle materialization

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: emp1-gamma5-full-table5-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/emp1-c-exact-gamma-qualified-route-issue1261'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Freeze or re-observe independent full Table 5 oracle
        run: node scripts/emp1-wrc-gamma5-full-table5-oracle-materialize.mjs
      - name: Commit exact generated oracle bytes when state advances
        shell: bash
        run: |
          set -euo pipefail
          target='validation/emp1/wrc537-2013/gamma5-full-table5-oracle-v1.json'
          if git ls-files --error-unmatch "$target" >/dev/null 2>&1 && git diff --quiet -- "$target"; then
            echo EMP1_GAMMA5_FULL_TABLE5_ORACLE_ALREADY_STEADY
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'EMP.1.C: freeze/reobserve independent gamma5 Table 5 oracle'
          git pull --rebase origin "${GITHUB_HEAD_REF}"
          git push origin HEAD:"${GITHUB_HEAD_REF}"

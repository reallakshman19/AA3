name: M047 BM4_L F2.8c authenticated committed friction replay

on:
  push:
    branches:
      - agent/m047-bm4l-f28c-authenticated-committed-friction-replay
    paths:
      - '.github/workflows/m047-bm4l-f28c-authenticated-committed-friction-replay.yml'
      - 'benchmarks/LFEA/CAESAR_ACCDB/m047-bm4l-f28c-authenticated-committed-friction-evidence.json'
      - 'scripts/lfea-m047-bm4l-f28c-authenticated-committed-friction-replay.mjs'
      - 'scripts/lfea-m047-bm4l-accdb-provenance.ps1'
      - 'scripts/lfea-caesar-accdb-*.mjs'
      - 'src/core/fea-benchmarks/**'
      - 'src/core/linear-fea-*/**'
      - 'src/core/lafea-linear-solve/**'

permissions:
  contents: read

jobs:
  authenticated-replay:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      BM4L_COMMON_COMMIT: '45d51ea18624f5775805f399110c1738301c0d90'
      BM4L_ZIP_SHA256: '978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9'
      BM4L_ZIP_SIZE: '582488'
      BM4L_ACCDB_SHA256: '64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8'
      BM4L_ACCDB_SIZE: '5136384'
      BM4NL_COMMON_COMMIT: '179c4831cf521cf797c13699cfbbd118315c9244'
      BM4NL_ZIP_GIT_BLOB: '86a803ed27ebdbd2836452dc2e874c3458aa204c'
      BM4NL_ACCDB_SHA256: '85d39463296e569da811d8572e2eff680b858097f76fdf0f47d1755f0b161c21'
      ACE_INSTALLER_URL: 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe'
      ACE_INSTALLER_SHA256: '04e96c9f1a1f7d251a88aececf1dc10ff65950392787427c00814a43308003de'

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Syntax-check replay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --check scripts/lfea-m047-bm4l-f28c-authenticated-committed-friction-replay.mjs
          pwsh -NoProfile -Command "[void][scriptblock]::Create((Get-Content -Raw 'scripts/lfea-m047-bm4l-accdb-provenance.ps1'))"

      - name: Authenticate and install Microsoft ACE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts/f28c/provider | Out-Null
          $installer = Join-Path $PWD 'artifacts/f28c/provider/accessdatabaseengine_X64.exe'
          Invoke-WebRequest -Uri $env:ACE_INSTALLER_URL -OutFile $installer
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:ACE_INSTALLER_SHA256) { throw "ACE installer hash mismatch: $hash" }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw "ACE installer signature invalid: $($signature.Status), $($signature.SignerCertificate.Subject)"
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if ($process.ExitCode -notin @(0,3010)) { throw "ACE installer exited $($process.ExitCode)." }

      - name: Fetch and authenticate pinned BM4_L source
        id: bm4l
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts/f28c/bm4l | Out-Null
          $zip = Join-Path $PWD 'artifacts/f28c/bm4l/BM4_L.zip'
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/reallaksh19/Common/$env:BM4L_COMMON_COMMIT/LFEA/BM4/BM4_L.zip" -OutFile $zip
          $zipItem = Get-Item -LiteralPath $zip
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipItem.Length -ne [int64]$env:BM4L_ZIP_SIZE -or $zipHash -ne $env:BM4L_ZIP_SHA256) {
            throw "BM4_L.zip custody mismatch: bytes=$($zipItem.Length), sha=$zipHash"
          }
          $dir = Join-Path $PWD 'artifacts/f28c/bm4l/source'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $members = @(Get-ChildItem -LiteralPath $dir -File -Recurse)
          if ($members.Count -ne 1 -or $members[0].Name -ne 'BM4_L.ACCDB') { throw 'BM4_L.zip member inventory mismatch.' }
          $accdb = $members[0].FullName
          $sha = (Get-FileHash -LiteralPath $accdb -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($members[0].Length -ne [int64]$env:BM4L_ACCDB_SIZE -or $sha -ne $env:BM4L_ACCDB_SHA256) {
            throw "BM4_L.ACCDB custody mismatch: bytes=$($members[0].Length), sha=$sha"
          }
          "accdb=$accdb" >> $env:GITHUB_OUTPUT

      - name: Emit fresh BM4_L restraint provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tables = @(
            'INPUT_BASIC_ELEMENT_DATA','INPUT_BENDS','INPUT_CONTROL','INPUT_FORCMNT',
            'INPUT_NODAL_COORDINATES','INPUT_OFFSETS','INPUT_REDUCERS','INPUT_RESTRAINTS',
            'INPUT_RIGIDS','INPUT_SIFTEES','INPUT_UNITS',
            'OUTPUT_DISPLACEMENTS','OUTPUT_RESTRAINTS_SUMMARY','OUTPUT_GLOBAL_ELEMENT_FORCES'
          ) -join ','
          .\scripts\lfea-m047-bm4l-accdb-provenance.ps1 `
            -AccdbPath "${{ steps.bm4l.outputs.accdb }}" `
            -ProfilePath .\benchmarks\LFEA\CAESAR_ACCDB\bm4l-validation.profile.json `
            -TablesCsv $tables `
            -ExpectedAccdbSha256 $env:BM4L_ACCDB_SHA256 `
            -ExpectedAccdbBytes ([int64]$env:BM4L_ACCDB_SIZE) `
            -OutPath .\artifacts\f28c\bm4l-provenance.json

      - name: Regenerate exact BM4_L L6 mechanics and reference report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb "${{ steps.bm4l.outputs.accdb }}" `
            --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json `
            --solve-linear true `
            --solve-cases L2,L3,L4,L5,L6,L14 `
            --actual-out artifacts/f28c/bm4l-actual.json `
            --out artifacts/f28c/bm4l-report.json `
            --summary-out artifacts/f28c/bm4l-summary.md

      - name: Fetch and authenticate independent BM4_NL source
        id: bm4nl
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts/f28c/bm4nl | Out-Null
          $zip = Join-Path $PWD 'artifacts/f28c/bm4nl/BM4_NL.zip'
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/reallaksh19/Common/$env:BM4NL_COMMON_COMMIT/LFEA/BM4/BM4_NL.zip" -OutFile $zip
          $blob = (& git hash-object -- $zip).Trim().ToLowerInvariant()
          if ($blob -ne $env:BM4NL_ZIP_GIT_BLOB) { throw "BM4_NL.zip Git blob mismatch: $blob" }
          $dir = Join-Path $PWD 'artifacts/f28c/bm4nl/source'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $members = @(Get-ChildItem -LiteralPath $dir -File -Recurse)
          if ($members.Count -ne 1 -or $members[0].Name -ne 'BM4_NL.ACCDB') { throw 'BM4_NL.zip member inventory mismatch.' }
          $accdb = $members[0].FullName
          $sha = (Get-FileHash -LiteralPath $accdb -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $env:BM4NL_ACCDB_SHA256) { throw "BM4_NL.ACCDB SHA-256 mismatch: $sha" }
          "accdb=$accdb" >> $env:GITHUB_OUTPUT

      - name: Extract independent BM4_NL case 17/19 endpoints read-only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $accdb = "${{ steps.bm4nl.outputs.accdb }}"
          function Convert-DbValue {
            param([object]$Value)
            if ($null -eq $Value -or $Value -is [System.DBNull]) { return $null }
            if ($Value -is [byte[]]) { return [Convert]::ToBase64String($Value) }
            if ($Value -is [DateTime]) { return $Value.ToUniversalTime().ToString('o') }
            return $Value
          }
          function Read-Rows {
            param([object]$Connection,[string]$Sql)
            $rs = New-Object -ComObject ADODB.Recordset
            try {
              $rs.Open($Sql,$Connection,0,1)
              $rows = @()
              while (-not $rs.EOF) {
                $row = [ordered]@{}
                for ($i=0; $i -lt $rs.Fields.Count; $i += 1) {
                  $field = $rs.Fields.Item($i)
                  $row[[string]$field.Name] = Convert-DbValue -Value $field.Value
                }
                $rows += $row
                $rs.MoveNext()
              }
              return @($rows)
            } finally {
              if ($rs.State -ne 0) { $rs.Close() }
              [void][System.Runtime.InteropServices.Marshal]::ReleaseComObject($rs)
            }
          }
          $connection = New-Object -ComObject ADODB.Connection
          try {
            $connection.Open("Provider=Microsoft.ACE.OLEDB.12.0;Data Source=$accdb;Mode=Read;Persist Security Info=False;")
            $displacements = @(Read-Rows $connection "SELECT NODE,LCASE_NUM,[CASE],LCASE_NAME,DX,DY,DZ,DUNITS,RX,RY,RZ,RUNITS FROM OUTPUT_DISPLACEMENTS WHERE LCASE_NUM IN (17,19) ORDER BY LCASE_NUM,NODE")
            $restraints = @(Read-Rows $connection "SELECT NODE,NODE_NAME,LCASE_NUM,[CASE],LCASE_NAME,FX,FY,FZ,RESULTANTF,FUNITS,MX,MY,MZ,RESULTANTM,MUNITS,[TYPE],RES_TAG,RES_GUID FROM OUTPUT_RESTRAINTS WHERE LCASE_NUM IN (17,19) ORDER BY LCASE_NUM,NODE,[TYPE],RES_TAG")
            if ($displacements.Count -ne 224) { throw "Expected 224 displacement rows; got $($displacements.Count)." }
            if ($restraints.Count -ne 92) { throw "Expected 92 restraint rows; got $($restraints.Count)." }
            [ordered]@{
              schema='m047-bm4l-f28c-bm4nl-endpoints/v1'
              exactHead='${{ github.sha }}'
              commonCommit=$env:BM4NL_COMMON_COMMIT
              zipGitBlobSha=$env:BM4NL_ZIP_GIT_BLOB
              accdbSha256=$env:BM4NL_ACCDB_SHA256
              outputDisplacements=$displacements
              outputRestraints=$restraints
              policy=[ordered]@{
                readOnly=$true
                bm4lReferenceUsedToSelectState=$false
                responseFittingAllowed=$false
              }
            } | ConvertTo-Json -Depth 64 | Set-Content -Encoding utf8 artifacts/f28c/bm4nl-endpoints.json
          } finally {
            if ($connection.State -ne 0) { $connection.Close() }
            [void][System.Runtime.InteropServices.Marshal]::ReleaseComObject($connection)
          }

      - name: Recompute authenticated committed-vector L13 diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/lfea-m047-bm4l-f28c-authenticated-committed-friction-replay.mjs `
            --actual=artifacts/f28c/bm4l-actual.json `
            --report=artifacts/f28c/bm4l-report.json `
            --provenance=artifacts/f28c/bm4l-provenance.json `
            --bm4nl=artifacts/f28c/bm4nl-endpoints.json `
            --contract=benchmarks/LFEA/CAESAR_ACCDB/m047-bm4l-f28c-authenticated-committed-friction-evidence.json `
            --out=artifacts/f28c/bm4l-f28c-authenticated-committed-friction-replay.json
          $evidence = Get-Content -Raw artifacts/f28c/bm4l-f28c-authenticated-committed-friction-replay.json | ConvertFrom-Json
          if ($evidence.authenticatedCommittedVectorDiagnostic.passed -ne 1872 `
              -or $evidence.authenticatedCommittedVectorDiagnostic.failed -ne 42 `
              -or $evidence.authenticatedCommittedVectorDiagnostic.total -ne 1914) {
            throw 'Authenticated committed-vector replay score drifted from 1872/42/1914.'
          }
          if ($evidence.authority.productionMechanicsAuthorized -ne $false `
              -or $evidence.authority.qualifiedL13AccuracyAuthorized -ne $false) {
            throw 'Evidence-only replay illegally authorized production mechanics or qualified L13 accuracy.'
          }

      - name: Upload exact replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: m047-bm4l-f28c-authenticated-committed-friction-${{ github.sha }}
          path: |
            artifacts/f28c/bm4l-provenance.json
            artifacts/f28c/bm4nl-endpoints.json
            artifacts/f28c/bm4l-f28c-authenticated-committed-friction-replay.json
            artifacts/f28c/bm4l-summary.md
          if-no-files-found: error
          retention-days: 14

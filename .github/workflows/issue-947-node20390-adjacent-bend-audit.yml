name: Issue 947 node 20390 adjacent bend audit
# Rerun after restoring the read-only production mechanics inspector.

on:
  push:
    branches:
      - codex/issue-947-bm4nl-qualification
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci(issue947): audit node20390 adjacent bends' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download retained canonical BM4_NL package
        uses: actions/download-artifact@v4
        with:
          name: issue-947-bm4nl-qualification
          path: .work/package
          github-token: ${{ github.token }}
          repository: reallaksh19/Advanced_Analysis
          run-id: 31321930058

      - name: Condense upstream BEND_PTR 3 / source E20
        run: |
          node scripts/lfea-issue947-bend-descendant-condensation-audit.mjs \
            --package .work/package/bm4nl-canonical-package.json \
            --source-element 20 \
            --out .work/node20390-e20-bend-condensation.json

      - name: Condense downstream BEND_PTR 4 / source E25
        run: |
          node scripts/lfea-issue947-bend-descendant-condensation-audit.mjs \
            --package .work/package/bm4nl-canonical-package.json \
            --source-element 25 \
            --out .work/node20390-e25-bend-condensation.json

      - name: Upload adjacent-bend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-947-node20390-adjacent-bends
          if-no-files-found: error
          path: |
            .work/node20390-e20-bend-condensation.json
            .work/node20390-e25-bend-condensation.json

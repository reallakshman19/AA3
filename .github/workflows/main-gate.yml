name: main-gate

# The single always-on required check for main.
#
# Almost every other workflow in this repository is path-filtered, which makes
# it unusable as a required status check: a pull request that does not touch the
# filtered paths never reports the context, and GitHub blocks the merge forever
# waiting for a status that will never arrive. Ten of them also share the job
# name "qualify", so that context cannot identify a single workflow either.
#
# This job therefore runs on every pull request, carries a name no other
# workflow uses, and executes the repository-wide checks that must hold for any
# change. Path-filtered workflows stay advisory and keep doing the deep,
# slice-specific qualification they were written for.
#
# Every step below was observed green on main before this gate was introduced.
# Do not add a check here until it passes on main, or this gate stops being a
# quality signal and becomes a blocked merge queue.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # scripts/syntax-check.mjs parses with @babel/parser, so it requires the
      # install step above; running it without node_modules reports spurious
      # "Invalid or unexpected token" failures across the tree.
      - name: Syntax and import graph
        run: |
          set -euo pipefail
          npm run syntax:strict
          node scripts/import-check.mjs

      - name: Workspace and UI containment
        run: |
          set -euo pipefail
          node scripts/ui-invariant-check.mjs
          node scripts/check-enrichment-ui-phase0-antidrift.mjs
          node scripts/linear-piping-workspace-integration-check.mjs

      - name: Pre-flight Phase-1 indexed model, virtualization and review custody
        run: |
          set -euo pipefail
          node scripts/lfea-preflight-phase1-indexed-model-check.mjs
          node scripts/lfea-preflight-phase1-review-source-check.mjs
          node scripts/lfea-preflight-phase1-review-session-check.mjs
          node scripts/lfea-preflight-phase1-review-surface-check.mjs
          node scripts/lfea-preflight-phase1-virtualization-check.mjs
          node scripts/lfea-preflight-phase1-virtualization-v2-check.mjs
          node scripts/lfea-preflight-phase1-virtualization-v3-check.mjs
          node scripts/lfea-preflight-phase1-live-ui-check.mjs

      - name: Support-action engineering triad
        run: |
          set -euo pipefail
          node scripts/linear-piping-support-action-triad-check.mjs
          node scripts/linear-piping-support-action-triad-source-guard.mjs

      - name: Governed pre-FEA solve authorization
        run: node --test test/lfea-prefea-gateway.test.js

      - name: Production build
        run: npx vite build

name: EMP.1.C production dataset qualification

on:
  pull_request:

permissions:
  contents: write

jobs:
  qualify-production-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare PDF text tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Generate deterministic candidate production package
        run: node scripts/emp1-wrc-cylindrical-production-package-generate.mjs test-results/emp1-cylindrical-production-package.json
      - name: Cross-check all packaged scalars against frozen primary PDF
        run: node scripts/emp1-wrc-cylindrical-production-package-pdf-crosscheck.mjs test-results/emp1-cylindrical-production-package.json docs/emp1/WRC537_2013.pdf
      - name: Prove a coefficient mutation is rejected
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const source='test-results/emp1-cylindrical-production-package.json';
          const target='test-results/emp1-cylindrical-production-package-mutated.json';
          const pkg=JSON.parse(await readFile(source,'utf8'));
          pkg.semanticPayload.curves[0].coefficients[0]+=0.123456789;
          await writeFile(target,JSON.stringify(pkg,null,2)+'\n');
          NODE
          set +e
          node scripts/emp1-wrc-cylindrical-production-package-pdf-crosscheck.mjs \
            test-results/emp1-cylindrical-production-package-mutated.json docs/emp1/WRC537_2013.pdf \
            > test-results/mutation-crosscheck.log 2>&1
          code=$?
          set -e
          cat test-results/mutation-crosscheck.log
          if [ "$code" -eq 0 ]; then
            echo 'Mutated coefficient unexpectedly passed primary-PDF cross-check'
            exit 1
          fi
          echo EMP1_PRODUCTION_DATASET_MUTATION_REJECTED
      - name: Generate compact production core module from qualified package
        run: node scripts/emp1-wrc-cylindrical-production-module-generate.mjs test-results/emp1-cylindrical-production-package.json src/core/emp1/emp1-wrc537-cylindrical-data.generated.js
      - name: Verify generated core module identity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {
            EMP1_WRC537_CYL_DATASET_HASH,
            EMP1_WRC537_CYL_SOURCE_SHA256,
            EMP1_WRC537_CYL_CURVES,
            EMP1_WRC537_CYL_EXCLUDED,
            EMP1_WRC537_CYL_PACKAGE_COUNTS,
          } from './src/core/emp1/emp1-wrc537-cylindrical-data.generated.js';
          if (EMP1_WRC537_CYL_DATASET_HASH!=='fb440a292f8794430977f60f5365a678a9aff62a4dae3397621902964a0db73c') throw new Error(`EMP1_PRODUCTION_DATASET_HASH:${EMP1_WRC537_CYL_DATASET_HASH}`);
          if (EMP1_WRC537_CYL_SOURCE_SHA256!=='698fcdc3e676e3bc6bbf710bc28ea8b666ac9511a81a0067a5d01088ae4c27b2') throw new Error('EMP1_PRODUCTION_DATASET_SOURCE_SHA');
          if (EMP1_WRC537_CYL_CURVES.length!==321 || EMP1_WRC537_CYL_PACKAGE_COUNTS.scalarCoefficients!==3210) throw new Error('EMP1_PRODUCTION_DATASET_CARDINALITY');
          if (EMP1_WRC537_CYL_EXCLUDED.length!==1 || EMP1_WRC537_CYL_EXCLUDED[0][0]!=='1B' || EMP1_WRC537_CYL_EXCLUDED[0][2]!==null) throw new Error('EMP1_PRODUCTION_DATASET_EXCLUSION');
          console.log(JSON.stringify({status:'PASS',datasetHash:EMP1_WRC537_CYL_DATASET_HASH,curves:EMP1_WRC537_CYL_CURVES.length,excluded:EMP1_WRC537_CYL_EXCLUDED.length},null,2));
          NODE
      - name: Materialize exact generated bytes onto PR branch
        if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/emp1-c-exact-gamma-qualified-route-issue1261'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/core/emp1/emp1-wrc537-cylindrical-data.generated.js && git ls-files --error-unmatch src/core/emp1/emp1-wrc537-cylindrical-data.generated.js >/dev/null 2>&1; then
            echo EMP1_PRODUCTION_DATASET_ALREADY_MATERIALIZED
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/emp1/emp1-wrc537-cylindrical-data.generated.js
          git commit -m 'EMP.1.C: materialize qualified cylindrical coefficient package'
          git push origin HEAD:${GITHUB_HEAD_REF}
      - name: Upload candidate dataset evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emp1-cylindrical-production-dataset-${{ github.sha }}
          path: |
            test-results/emp1-cylindrical-production-package.json
            test-results/mutation-crosscheck.log
            src/core/emp1/emp1-wrc537-cylindrical-data.generated.js
          if-no-files-found: error
          retention-days: 30

name: Issue 947 reducer pressure and shear audit

on:
  push:
    branches:
      - codex/issue-947-bm4nl-qualification
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download current-schema canonical BM4_NL package
        uses: actions/download-artifact@v4
        with:
          name: issue-947-bm4nl-qualification
          path: .work/package
          github-token: ${{ github.token }}
          repository: reallaksh19/Advanced_Analysis
          run-id: 31302834835

      - name: Run reducer pressure/shear constitutive audit
        run: |
          node scripts/lfea-issue947-reducer-pressure-shear-audit.mjs \
            --package .work/package/bm4nl-canonical-package.json \
            --out .work/issue947-reducer-pressure-shear-audit.json

      - name: Run existing reducer condensation qualification unchanged
        run: node scripts/lfea-b3.23-reducer-condensation-check.mjs

      - name: Run CAESAR pipe shear authority regression
        run: node scripts/lfea-issue947-caesar-pipe-shear-authority-check.mjs

      - name: Run Bourdon subdivision regression
        run: node scripts/lfea-issue947-bourdon-subdivision-check.mjs

      - name: Upload reducer audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-947-reducer-pressure-shear-audit
          if-no-files-found: error
          path: .work/issue947-reducer-pressure-shear-audit.json

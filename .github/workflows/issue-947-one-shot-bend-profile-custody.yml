name: Issue 947 one-shot bend profile custody

on:
  push:
    branches:
      - codex/issue-947-bm4nl-qualification

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore(issue947): apply bend profile custody' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4
        with:
          ref: codex/issue-947-bm4nl-qualification

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic profile-custody patch
        run: node scripts/lfea-issue947-apply-bend-profile-custody.mjs

      - name: Run frame-element qualification
        run: node scripts/lfea-b3.1-frame-element-check.mjs

      - name: Run Bourdon subdivision regression
        run: node scripts/lfea-issue947-bourdon-subdivision-check.mjs

      - name: Run bend pressure authority regression
        run: node scripts/lfea-issue947-bend-pressure-stiffening-check.mjs

      - name: Commit production custody fix
        shell: bash
        run: |
          set -euo pipefail
          git add src/core/fea-benchmarks/caesar-accdb-linear-solve.js
          if git diff --cached --quiet; then
            echo 'Expected bend profile-custody patch produced no source diff.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(lfea): pass solve profile into bend definitions'
          git push origin HEAD:codex/issue-947-bm4nl-qualification

name: Issue 947 bend scalar flexibility falsification

on:
  push:
    branches:
      - codex/issue-947-bm4nl-qualification
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sweep:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci(issue947): falsify scalar bend flexibility factor' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download retained qualified canonical BM4_NL package
        uses: actions/download-artifact@v4
        with:
          name: issue-947-bm4nl-qualification
          path: .work/package
          github-token: ${{ github.token }}
          repository: reallaksh19/Advanced_Analysis
          run-id: 31322888839

      - name: Run diagnostic-only scalar flexibility sweep
        run: |
          python scripts/lfea-issue947-bend-scalar-flexibility-falsification.py \
            --package .work/package/bm4nl-canonical-package.json \
            --out .work/bm4nl-bend-scalar-flexibility-falsification.json

      - name: Verify diagnostic restored production source
        run: git diff --exit-code -- src/core/linear-fea-b31-factor-calculator/records.js

      - name: Upload scalar-flexibility falsification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-947-bend-scalar-flexibility-falsification
          if-no-files-found: error
          path: .work/bm4nl-bend-scalar-flexibility-falsification.json

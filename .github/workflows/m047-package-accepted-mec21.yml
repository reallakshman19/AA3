name: M047 package accepted MEC-21 patch bytes

on:
  push:
    branches: [agent/m047-bm4l-root-cause]
    paths: ['.github/workflows/m047-package-accepted-mec21.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m047-bm4l-root-cause
      - name: Apply exact previously-validated candidate step
        shell: python
        run: |
          from pathlib import Path
          import os
          p=Path('.github/workflows/m047-one-shot-mec21-bend-shear-v2.yml')
          lines=p.read_text().splitlines()
          start=next(i for i,l in enumerate(lines) if l.strip()=='- name: Apply geometry-derived MEC-21 bend shear candidate')
          end=next(i for i in range(start+1,len(lines)) if lines[i].startswith('      - name:') and i>start)
          block=lines[start:end]
          env={}
          for line in block:
            stripped=line.strip()
            if stripped.startswith('MODULE_B64:') or stripped.startswith('CHECK_B64:'):
              k,v=stripped.split(':',1)
              env[k]=v.strip().strip("'")
          if set(env)!={'MODULE_B64','CHECK_B64'}:
            raise SystemExit(f'failed to recover candidate payloads: {env.keys()}')
          os.environ.update(env)
          run_i=next(i for i,l in enumerate(block) if l.strip()=='run: |')
          script=[]
          for line in block[run_i+1:]:
            if line.startswith('          '): script.append(line[10:])
            elif line.strip(): raise SystemExit(f'unexpected candidate run indentation: {line!r}')
            else: script.append('')
          source='\n'.join(script)+'\n'
          exec(compile(source,'m047-mec21-candidate-step','exec'),{'__name__':'__main__'})
      - name: Package exact modified files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/package
          tar -czf artifacts/package/mec21-files.tgz \
            src/core/linear-fea-piping-components/mec21-bend-shear.js \
            src/core/linear-fea-piping-components/index.js \
            src/core/fea-benchmarks/caesar-accdb-linear-solve.js \
            scripts/lfea-m047-caesar-mec21-bend-shear-authority-check.mjs
          git diff -- src/core/linear-fea-piping-components/index.js src/core/fea-benchmarks/caesar-accdb-linear-solve.js > artifacts/package/patch.diff
          sha256sum artifacts/package/mec21-files.tgz > artifacts/package/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m047-accepted-mec21-files-${{ github.sha }}
          path: artifacts/package
          retention-days: 7
          if-no-files-found: error

name: LAFEA B01 restored scalar-Jacobi L4 baseline temporary

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/lafea-b01-compensated-assembly-temp.yml'

permissions:
  contents: read

jobs:
  l4-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Execute exact L4 near-incompressible B01 case with production solver
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { executeLameBbarQualificationCase } from './scripts/lib/lafea-plane-strain-bbar-lame-fixture.mjs';
          const definition = JSON.parse(fs.readFileSync('validation/lafea-incompressible/plane-strain-bbar-v1.json', 'utf8'));
          const meshPolicy = JSON.parse(fs.readFileSync('validation/lafea-incompressible/plane-strain-bbar-probe-mesh-policy-v1.json', 'utf8'));
          const level = definition.benchmarks.THICK_CYLINDER.meshLadder.levels.find((row) => row.levelId === 'L4');
          const distortion = definition.distortionMatrix.find((row) => row.distortionId === 'REGULAR');
          const run = executeLameBbarQualificationCase(definition, meshPolicy, {
            elementType: 'T6', poissonRatio: 0.4999, level, distortion,
          });
          console.log(JSON.stringify({
            case: 'T6/0.4999/L4/REGULAR',
            state: run.result.qualification.state,
            diagnostics: run.result.diagnostics,
            solverEvidence: run.loadCase?.solverEvidence ?? null,
            equilibrium: run.loadCase?.equilibrium ?? null,
          }, null, 2));
          NODE

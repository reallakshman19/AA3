module: EI-P0-AIV
title: High Frequency Acoustic Excitation (AIV) Method Source Register
governing_source:
  publication: Energy Institute Guidelines 2nd Edition (2008)
  section: T2.7
  source_pdf_git_blob: 9d3eccc56429411e17c07a579bdebbd13cb0bdc5
authority_state: SOURCE_CORROBORATED_AND_WORKED_EXAMPLE_REPRODUCED
engineering_use: QUALIFICATION_EVIDENCE_ONLY

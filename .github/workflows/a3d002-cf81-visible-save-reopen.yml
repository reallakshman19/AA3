name: A3D-002 visible save reopen exact-head

on:
  push:
    branches:
      - qualification/a3d002-cf81-visible-save-reopen

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 98a2fb55011e867c6a47bbbe8a3b166d5f639207
      CANDIDATE_SHA: 5bccfa02f950d223d7df3da4420db36805eb7317
      PLAYWRIGHT_BROWSERS_PATH: '0'
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: 5bccfa02f950d223d7df3da4420db36805eb7317
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 5bccfa02f950d223d7df3da4420db36805eb7317
          fetch-depth: 0

      - name: Verify exact one-file ledger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA")" = 'e2e/topology-edit-a3d002-save-reopen.spec.js'
          git diff --check "$BASE_SHA" "$CANDIDATE_SHA"
          node --check e2e/topology-edit-a3d002-save-reopen.spec.js

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Differential-gate pre-existing Wave 4C line-budget failure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          git checkout --detach "$BASE_SHA" >/dev/null
          node --test tests/topology-edit-wave4c-lifecycle-ui.test.mjs > artifacts/base-wave4c.log 2>&1
          base_exit=$?
          git checkout --detach "$CANDIDATE_SHA" >/dev/null
          node --test tests/topology-edit-wave4c-lifecycle-ui.test.mjs > artifacts/candidate-wave4c.log 2>&1
          candidate_exit=$?
          set -e
          test "$base_exit" -eq 1
          test "$candidate_exit" -eq 1
          grep -F "assert.ok(wrapper.split(/\\r?\\n/).length <= 300)" artifacts/base-wave4c.log
          grep -F "assert.ok(wrapper.split(/\\r?\\n/).length <= 300)" artifacts/candidate-wave4c.log
          grep -F "# pass 2" artifacts/base-wave4c.log
          grep -F "# pass 2" artifacts/candidate-wave4c.log
          grep -F "# fail 1" artifacts/base-wave4c.log
          grep -F "# fail 1" artifacts/candidate-wave4c.log
          printf '{\n  "schema": "A3D002BaselineDifferential.v1",\n  "baseSha": "%s",\n  "candidateSha": "%s",\n  "baseExit": %s,\n  "candidateExit": %s,\n  "knownBaselineFailure": "Wave4C wrapper physical-line <=300 assertion",\n  "candidateIntroducesNewFailure": false\n}\n' \
            "$BASE_SHA" "$CANDIDATE_SHA" "$base_exit" "$candidate_exit" \
            > artifacts/a3d002-baseline-differential.json

      - name: Run focused lifecycle behavior and stale-authority tests
        run: >-
          node --test
          --test-name-pattern="production lifecycle saves|persisted draft clears|worker client accepts|client rejects stale|exact old response|validation refuses|cancellation terminates|newer request supersedes|constructor failure|postMessage failure|production worker URL|requestId deterministically|worker state rejects|missing identity material|runtime validation identity|active interaction identity|selection, dataset activation|runtime identity fails"
          tests/topology-edit-wave4c-lifecycle-ui.test.mjs
          tests/topology-edit-professional-validation-worker-client.test.mjs
          tests/topology-edit-professional-validation-worker-identity.test.mjs
          tests/topology-edit-validation-runtime-identity.test.mjs

      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete visible A3D-002 lifecycle
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/a3d002-playwright.json
        run: >-
          node scripts/run-playwright.mjs
          e2e/topology-edit-a3d002-save-reopen.spec.js
          --workers=1
          --retries=0
          --trace=on
          --reporter=line,json

      - name: Record exact-head run identity
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          node - <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('artifacts/a3d002-run-identity.json', JSON.stringify({
            schema: 'A3D002RunIdentity.v1',
            baseSha: process.env.BASE_SHA,
            candidateSha: process.env.CANDIDATE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            workers: 1,
            retries: 0,
            trace: 'on',
          }, null, 2));
          NODE

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a3d002-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: |
            artifacts
            reports/qualification/topology-edit-a3d002-save-reopen.json
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 30

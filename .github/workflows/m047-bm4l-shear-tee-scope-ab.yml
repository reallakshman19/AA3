name: M047 BM4_L tee-carrier shear scope A/B

on:
  push:
    branches: [agent/m047-bm4l-root-cause]
    paths: ['.github/workflows/m047-bm4l-shear-tee-scope-ab.yml']

permissions:
  contents: read

jobs:
  ab:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m047-bm4l-root-cause
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Install authenticated ACE and fetch canonical source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/tee-scope | Out-Null
          $installer=Join-Path $PWD 'artifacts/tee-scope/accessdatabaseengine_X64.exe'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe' -OutFile $installer
          if((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()-ne'04e96c9f1a1f7d251a88aececf1dc10ff65950392787427c00814a43308003de'){throw'ACE installer hash mismatch'}
          $sig=Get-AuthenticodeSignature $installer;if($sig.Status-ne'Valid'-or$sig.SignerCertificate.Subject-notmatch'Microsoft'){throw'ACE signature invalid'}
          $p=Start-Process $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru;if($p.ExitCode-notin@(0,3010)){throw"ACE install failed $($p.ExitCode)"};Remove-Item $installer -Force
          $zip=Join-Path $PWD 'artifacts/tee-scope/BM4_L.zip'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/reallaksh19/Common/45d51ea18624f5775805f399110c1738301c0d90/LFEA/BM4/BM4_L.zip' -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()-ne'978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9'){throw'ZIP hash mismatch'}
          Expand-Archive $zip -DestinationPath artifacts/tee-scope/source -Force
          $accdb=Join-Path $PWD 'artifacts/tee-scope/source/BM4_L.ACCDB'
          if((Get-FileHash $accdb -Algorithm SHA256).Hash.ToLowerInvariant()-ne'64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8'){throw'ACCDB hash mismatch'}

      - name: Apply authority-backed kappa 0.5 to non-tee physical straight spans
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/core/fea-benchmarks/caesar-accdb-linear-solve.js');t=p.read_text()
          reps=[
          ("""  const frame = input.stiffnessFrame ?? compileUnloadedFrame({\n    elementId: input.elementId,\n    axesResult,\n    material: input.material,\n    section: input.section,\n  });""","""  const frame = input.stiffnessFrame ?? compileUnloadedFrame({\n    elementId: input.elementId,\n    axesResult,\n    material: input.material,\n    section: input.section,\n    profile: (input.kind === 'FRAME' || input.kind === 'BEND_INCOMING_STRAIGHT')\n      && teeModifier === null\n      ? caesarStraightPipeFrameProfile()\n      : frameProfile(),\n  });"""),
          ("""    profile: frameProfile(),\n    distributedLoads: [],""","""    profile: input.profile ?? frameProfile(),\n    distributedLoads: [],"""),
          ("""function frameProfile() {\n  return sealFrameElementProfile({""","""function caesarStraightPipeFrameProfile() {\n  return sealFrameElementProfile({\n    schema: 'fea-linear-frame-element-profile/v1',\n    profileId: 'CAESAR-THIN-WALL-STRAIGHT-PIPE-R1',\n    straightPipeFormulation: 'PIPE_FRAME3D_TIMOSHENKO_V1',\n    shearDeformation: true,\n    shearCorrectionFactorY: { value: 0.5, source: 'INTERGRAPH-CAESAR-II-CAUX-2015-FKX-SHEAR-COEFFICIENT-2' },\n    shearCorrectionFactorZ: { value: 0.5, source: 'INTERGRAPH-CAESAR-II-CAUX-2015-FKX-SHEAR-COEFFICIENT-2' },\n    releaseRule: 'STATIC_CONDENSATION_V1',\n    thermalStrainApproximation: 'UNIFORM_TEMPERATURE_ALPHA_DELTA_T_V1',\n    releaseSingularityTolerance: { value: 1e-12, source: PROFILE_SOURCE },\n    semanticHash: '',\n  });\n}\n\nfunction frameProfile() {\n  return sealFrameElementProfile({""")]
          for old,new in reps:
              if t.count(old)!=1: raise SystemExit(f'guard expected 1, found {t.count(old)}')
              t=t.replace(old,new)
          p.write_text(t)

      - name: Run non-tee state
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node scripts/lfea-m047-caesar-pipe-shear-authority-check.mjs
          New-Item -ItemType Directory -Force artifacts/tee-scope/nontee | Out-Null
          node scripts/lfea-caesar-accdb-benchmark.mjs --accdb artifacts/tee-scope/source/BM4_L.ACCDB --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json --solve-linear true --solve-cases L2,L3,L4,L5,L6,L14 --actual-out artifacts/tee-scope/nontee/actual.json --out artifacts/tee-scope/nontee/report.json

      - name: Change only tee-carrier scope
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/core/fea-benchmarks/caesar-accdb-linear-solve.js');t=p.read_text()
          old="""    profile: (input.kind === 'FRAME' || input.kind === 'BEND_INCOMING_STRAIGHT')\n      && teeModifier === null\n      ? caesarStraightPipeFrameProfile()\n      : frameProfile(),"""
          new="""    profile: (input.kind === 'FRAME' || input.kind === 'BEND_INCOMING_STRAIGHT')\n      ? caesarStraightPipeFrameProfile()\n      : frameProfile(),"""
          if t.count(old)!=1: raise SystemExit(f'tee scope guard expected 1, found {t.count(old)}')
          p.write_text(t.replace(old,new))

      - name: Run all-straight-span state and integrity gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check src/core/fea-benchmarks/caesar-accdb-linear-solve.js
          node scripts/lfea-m047-caesar-pipe-shear-authority-check.mjs
          node scripts/lfea-b3.1-frame-element-check.mjs
          node scripts/lfea-b3.2-piping-component-check.mjs
          node scripts/lfea-b3.3-solver-check.mjs
          node scripts/lfea-b3.4-recovery-check.mjs
          node scripts/lfea-b3.6-sparse-assembly-check.mjs
          node scripts/lfea-b3.9-gravity-self-weight-check.mjs
          New-Item -ItemType Directory -Force artifacts/tee-scope/allstraight | Out-Null
          node scripts/lfea-caesar-accdb-benchmark.mjs --accdb artifacts/tee-scope/source/BM4_L.ACCDB --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json --solve-linear true --solve-cases L2,L3,L4,L5,L6,L14 --actual-out artifacts/tee-scope/allstraight/actual.json --out artifacts/tee-scope/allstraight/report.json
          node scripts/lfea-m047-bm4l-recovery-proof.mjs --actual artifacts/tee-scope/allstraight/actual.json --expected-source-sha 64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8 --out artifacts/tee-scope/allstraight/recovery-proof.json

      - name: Quantify tee-scope-only delta
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $a=Get-Content -Raw artifacts/tee-scope/nontee/report.json|ConvertFrom-Json -Depth 100;$b=Get-Content -Raw artifacts/tee-scope/allstraight/report.json|ConvertFrom-Json -Depth 100
          $aa=Get-Content -Raw artifacts/tee-scope/nontee/actual.json|ConvertFrom-Json -Depth 100;$ba=Get-Content -Raw artifacts/tee-scope/allstraight/actual.json|ConvertFrom-Json -Depth 100;$proof=Get-Content -Raw artifacts/tee-scope/allstraight/recovery-proof.json|ConvertFrom-Json -Depth 100
          function Counts($r,$c){$case=@($r.qualification.cases|?{$_.caseId-eq$c})[0];$rows=@($case.comparison.rows);[ordered]@{restraint=@($rows|?{$_.status-eq'FAIL'-and$_.entityKind-eq'NODE'-and$_.quantity-in@('FORCE','MOMENT')}).Count;displacementRotation=@($rows|?{$_.status-eq'FAIL'-and$_.entityKind-eq'NODE'-and$_.quantity-in@('DISPLACEMENT','ROTATION')}).Count;elementEnd=@($rows|?{$_.status-eq'FAIL'-and$_.entityKind-eq'ELEMENT'-and$_.quantity-like'GLOBAL_END_*'}).Count}}
          $counts=[ordered]@{};foreach($c in @('L2','L3','L4','L5','L6','L14')){$counts[$c]=[ordered]@{nontee=(Counts $a $c);allStraight=(Counts $b $c)}}
          if([math]::Abs([double]$aa.mechanics.cases.L2.gravityWeightN-[double]$ba.mechanics.cases.L2.gravityWeightN)-gt1e-9){throw'gravity changed'}
          if($proof.status-ne'PASS'-or$proof.commonOperator.status-ne'PASS'){throw'recovery/operator proof failed'}
          foreach($c in @('L2','L3','L4','L5','L6','L14')){if($ba.mechanics.cases.$c.recoveredEquilibrium.status-ne'PASS'){throw "$c equilibrium failed"}}
          $teeSources=@($ba.mechanics.cases.L2.elementLedger|?{$null-ne$_.teeJunctionNodeId}|%{$_.sourceElementId}|Sort-Object -Unique)
          [ordered]@{schema='m047-bm4l-tee-carrier-shear-scope-ab/v1';classification='AUTHORITY_SCOPE_TEST_FIXED_KAPPA_0_5';caesarSource='INTERGRAPH-CAESAR-II-CAUX-2015-FKX';nonteeScope='(FRAME || BEND_INCOMING_STRAIGHT) && no tee modifier';allStraightScope='FRAME || BEND_INCOMING_STRAIGHT, including tee-modified carriers';teeModifiedSourceElementIds=$teeSources;failureCounts=$counts;recoveryAndEquilibriumPass=$true}|ConvertTo-Json -Depth 20|Set-Content -Encoding utf8 artifacts/tee-scope/tee-scope-evidence.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m047-bm4l-shear-tee-scope-ab
          path: artifacts/tee-scope
          if-no-files-found: error

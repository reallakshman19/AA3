name: M047 MEC21 bend shear diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/m047-bm4l-mec21-bend-shear-diagnostic.yml'
      - 'scripts/lfea-m047-bm4l-mec21-bend-matrix-gap.mjs'
      - 'scripts/lfea-caesar-accdb-bend-axial-shape-authority.mjs'
      - 'scripts/lfea-m047-bm4l-bend-effective-stiffness.mjs'
      - 'scripts/lfea-caesar-accdb-export.ps1'
      - 'src/core/fea-benchmarks/**'
      - 'src/core/linear-fea-*/**'
      - 'src/core/centerline-beam-fea/**'

permissions:
  contents: read

jobs:
  source-bound-bend-shear:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      BM4L_COMMON_COMMIT: '45d51ea18624f5775805f399110c1738301c0d90'
      BM4L_ZIP_SHA256: '978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9'
      BM4L_PINNED_MEMBER_SHA256: '64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8'
      ACE_INSTALLER_URL: 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe'
      ACE_INSTALLER_SHA256: '04e96c9f1a1f7d251a88aececf1dc10ff65950392787427c00814a43308003de'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Syntax and primary fixture checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node --check scripts/lfea-m047-bm4l-mec21-bend-matrix-gap.mjs
          node --check scripts/lfea-caesar-accdb-bend-axial-shape-authority.mjs
          node --check scripts/lfea-m047-bm4l-bend-effective-stiffness.mjs
          node --check src/core/fea-benchmarks/caesar-accdb-linear-solve.js
          New-Item -ItemType Directory -Force -Path artifacts/bm4l-shear | Out-Null
          node scripts/lfea-caesar-accdb-bend-axial-shape-authority.mjs `
            --out artifacts/bm4l-shear/bend-axial-shape-authority.json

      - name: Authenticate and install Microsoft ACE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $PWD 'artifacts/bm4l-shear/accessdatabaseengine_X64.exe'
          Invoke-WebRequest -Uri $env:ACE_INSTALLER_URL -OutFile $installer
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:ACE_INSTALLER_SHA256) {
            throw "Microsoft ACE installer SHA-256 mismatch: $hash != $env:ACE_INSTALLER_SHA256"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw "Microsoft ACE installer signature invalid: $($signature.Status), $($signature.SignerCertificate.Subject)"
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "Microsoft ACE installer exited $($process.ExitCode)." }

      - name: Fetch and authenticate pinned BM4_L ACCDB
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zipPath = Join-Path $PWD 'artifacts/bm4l-shear/BM4_L.zip'
          $url = "https://raw.githubusercontent.com/reallaksh19/Common/$env:BM4L_COMMON_COMMIT/LFEA/BM4/BM4_L.zip"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          $zipHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          if ($zipHash -ne $env:BM4L_ZIP_SHA256) { throw "Pinned BM4_L.zip hash mismatch: $zipHash" }
          $extractDir = Join-Path $PWD 'artifacts/bm4l-shear/source'
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractDir -Force
          $members = @(Get-ChildItem -LiteralPath $extractDir -File -Recurse)
          if ($members.Count -ne 1 -or $members[0].Name -ne 'BM4_L.ACCDB') {
            throw "Pinned ZIP must contain exactly BM4_L.ACCDB; found $($members.Count) members."
          }
          $accdbPath = $members[0].FullName
          $accdbHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $accdbPath).Hash.ToLowerInvariant()
          if ($accdbHash -ne $env:BM4L_PINNED_MEMBER_SHA256) { throw "Pinned ACCDB hash mismatch: $accdbHash" }
          "accdb_path=$accdbPath" >> $env:GITHUB_OUTPUT

      - name: Export exact ACCDB bend source fields read-only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $before = (Get-FileHash -Algorithm SHA256 -LiteralPath "${{ steps.source.outputs.accdb_path }}").Hash.ToLowerInvariant()
          $raw = & .\scripts\lfea-caesar-accdb-export.ps1 `
            -AccdbPath "${{ steps.source.outputs.accdb_path }}" `
            -TablesCsv 'INPUT_BASIC_ELEMENT_DATA'
          $raw | Set-Content -Encoding utf8 artifacts/bm4l-shear/bend-source-export.json
          $after = (Get-FileHash -Algorithm SHA256 -LiteralPath "${{ steps.source.outputs.accdb_path }}").Hash.ToLowerInvariant()
          if ($before -ne $env:BM4L_PINNED_MEMBER_SHA256 -or $after -ne $env:BM4L_PINNED_MEMBER_SHA256) {
            throw 'Read-only ACE export changed or lost pinned ACCDB source identity.'
          }

      - name: Reproduce six-case operator and source residuals
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb "${{ steps.source.outputs.accdb_path }}" `
            --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json `
            --solve-linear true `
            --solve-cases L2,L3,L4,L5,L6,L14 `
            --actual-out artifacts/bm4l-shear/bm4l-actual.json `
            --out artifacts/bm4l-shear/bm4l-report.json `
            --summary-out artifacts/bm4l-shear/bm4l-summary.md
          node scripts/lfea-m047-bm4l-recovery-proof.mjs `
            --actual artifacts/bm4l-shear/bm4l-actual.json `
            --expected-source-sha $env:BM4L_PINNED_MEMBER_SHA256 `
            --out artifacts/bm4l-shear/recovery-proof.json
          node scripts/lfea-m047-bm4l-numeric-operator-proof.mjs `
            --actual artifacts/bm4l-shear/bm4l-actual.json `
            --out artifacts/bm4l-shear/numeric-operator-proof.json
          node scripts/lfea-m047-bm4l-bend-effective-stiffness.mjs `
            --actual artifacts/bm4l-shear/bm4l-actual.json `
            --report artifacts/bm4l-shear/bm4l-report.json `
            --out artifacts/bm4l-shear/bend-effective-stiffness.json

      - name: Evaluate source-derived MEC21 transverse shear
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/lfea-m047-bm4l-mec21-bend-matrix-gap.mjs `
            --actual artifacts/bm4l-shear/bm4l-actual.json `
            --bend-profile artifacts/bm4l-shear/bend-effective-stiffness.json `
            --source artifacts/bm4l-shear/bend-source-export.json `
            --out artifacts/bm4l-shear/mec21-bend-matrix-gap.json
          $gap = Get-Content -Raw artifacts/bm4l-shear/mec21-bend-matrix-gap.json | ConvertFrom-Json
          if ($gap.status -ne 'PASS_DIAGNOSTIC_ONLY' -or $gap.summary.bendCount -ne 12) {
            throw 'Source-derived MEC-21 shear diagnostic did not pass for all 12 bends.'
          }
          if (@($gap.falsificationCases).Count -ne 2) {
            throw 'Predeclared bend 1 / bend 9 falsification set is incomplete.'
          }
          if (-not $gap.summary.allCurrentBendChordsEulerBernoulli) {
            throw 'Baseline bend chords unexpectedly already contain transverse shear.'
          }
          if ($gap.sourceAccdbSha256 -ne $env:BM4L_PINNED_MEMBER_SHA256 -or $gap.sourceExportSha256 -ne $env:BM4L_PINNED_MEMBER_SHA256) {
            throw 'MEC-21 shear diagnostic source binding is not the pinned ACCDB member.'
          }

      - name: Publish source-bound shear evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m047-mec21-bend-shear-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/bm4l-shear
          if-no-files-found: error
          retention-days: 14

name: LAFEA B01 final exact-head qualification
on:
  push:
    branches: [agent/issue-1100-b01-freeze]
    paths:
      - 'validation/lafea-benchmark-data/B01/**'
      - 'validation/lafea-benchmark-program/**'
      - 'scripts/lafea-b01-*.mjs'
      - 'scripts/lafea.3-*.mjs'
      - 'scripts/lafea-stage15-neutral-shared-primitives-check.mjs'
      - 'src/core/local-continuum/**'
      - 'src/core/shared-primitives/**'
      - 'src/workspace/lafea-stage-*.js'
      - 'src/workspace/lafea-workbench-*.js'
      - 'src/workspace/lafea-continuum-probe-convergence.js'
      - 'reports/qualification/B01/**'
      - '.github/workflows/lafea-b01-final.yml'
  pull_request:
    paths:
      - 'validation/lafea-benchmark-data/B01/**'
      - 'validation/lafea-benchmark-program/**'
      - 'scripts/lafea-b01-*.mjs'
      - 'scripts/lafea.3-*.mjs'
      - 'scripts/lafea-stage15-neutral-shared-primitives-check.mjs'
      - 'src/core/local-continuum/**'
      - 'src/core/shared-primitives/**'
      - 'src/workspace/lafea-stage-*.js'
      - 'src/workspace/lafea-workbench-*.js'
      - 'src/workspace/lafea-continuum-probe-convergence.js'
      - 'reports/qualification/B01/**'
      - '.github/workflows/lafea-b01-final.yml'
permissions: {contents: read}
jobs:
  final-exact-head:
    runs-on: ubuntu-latest
    env:
      B01_FINAL_DIR: /tmp/lafea-b01-final
      B01_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact branch head and clean tree
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$B01_EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Check final runner syntax
        run: node --check scripts/lafea-b01-final-qualification.mjs
      - name: Execute integrated B01 qualification
        id: final
        continue-on-error: true
        shell: bash
        run: |
          rm -rf "$B01_FINAL_DIR"; mkdir -p "$B01_FINAL_DIR"
          set +e
          node scripts/lafea-b01-final-qualification.mjs --report-dir "$B01_FINAL_DIR" --expected-head "$B01_EXPECTED_HEAD" > "$B01_FINAL_DIR/final-driver.stdout" 2> "$B01_FINAL_DIR/final-driver.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$B01_FINAL_DIR/final-driver.exit-code"
          exit "$status"
      - name: Upload exact-head integrated B01 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'lafea-b01-final-${{ github.event.pull_request.head.sha || github.sha }}'
          path: /tmp/lafea-b01-final
          if-no-files-found: error
          retention-days: 30
      - name: Propagate final B01 qualification
        if: always()
        shell: bash
        run: |
          status=$(cat "$B01_FINAL_DIR/final-driver.exit-code")
          if [ "$status" -ne 0 ]; then
            echo 'Final integrated B01 qualification failed; exact-head artifact retained.'
            exit "$status"
          fi
          echo 'Final integrated B01 qualification passed; exact-head artifact retained.'

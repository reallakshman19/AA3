name: M047 BM4_L combined bend Bourdon translation A-B
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  combined-bourdon-ab:
    if: github.head_ref == 'agent/m047-bm4l-root-cause-991'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 45d51ea18624f5775805f399110c1738301c0d90
          path: _common
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install signed Microsoft ACE 2016 x64
        shell: pwsh
        run: |
          $i=Join-Path $env:RUNNER_TEMP 'ace.exe'; Invoke-WebRequest 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe' -OutFile $i
          $s=Get-AuthenticodeSignature $i; if($s.Status-ne'Valid'-or[string]$s.SignerCertificate.Subject-notmatch'Microsoft'){throw 'ACE signature'}
          $p=Start-Process $i -ArgumentList '/quiet','/norestart' -Wait -PassThru; if($p.ExitCode-notin@(0,3010)){throw "ACE $($p.ExitCode)"}
      - name: Extract source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts|Out-Null; $z='_common/LFEA/BM4/BM4_L.zip'
          if((Get-FileHash $z -Algorithm SHA256).Hash.ToLowerInvariant()-ne'978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9'){throw 'ZIP'}
          $d=Join-Path $env:RUNNER_TEMP 'bm4l-bourdon-combined'; Expand-Archive $z $d -Force; $a=Join-Path $d 'BM4_L.ACCDB'
          if((Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant()-ne'64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8'){throw 'ACCDB'}
          "BM4L_ACCDB=$a" >> $env:GITHUB_ENV
      - name: Baseline L4
        shell: pwsh
        run: |
          node scripts/lfea-caesar-accdb-benchmark.mjs --accdb "$env:BM4L_ACCDB" --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json --solve-linear true --solve-cases L4 --actual-out artifacts/base-actual.json --out artifacts/base-report.json --summary-out artifacts/base.md
      - name: Add uniform pressure translation to existing MEC21 bend opening field
        shell: pwsh
        run: |
          $p='src/core/fea-benchmarks/caesar-accdb-linear-solve.js'; $t=Get-Content $p -Raw
          $a='const startTranslationGlobal = abcVectorToGlobal(input.segment.referenceAxes, startState.translationAbc);'
          $b='const endTranslationGlobal = abcVectorToGlobal(input.segment.referenceAxes, endState.translationAbc);'
          if(-not$t.Contains($a)-or-not$t.Contains($b)){throw 'Bourdon translation source shape'}
          $ra="const startTranslationGlobal = abcVectorToGlobal(input.segment.referenceAxes, startState.translationAbc.map((value, index) => value + startState.uniformPressureTranslationAbc[index]));"
          $rb="const endTranslationGlobal = abcVectorToGlobal(input.segment.referenceAxes, endState.translationAbc.map((value, index) => value + endState.uniformPressureTranslationAbc[index]));"
          $t=$t.Replace($a,$ra).Replace($b,$rb); Set-Content $p $t -Encoding utf8
          $diff=(git diff -- $p)-join"`n"; $diff>artifacts/combined-bourdon.patch
          if(-not$diff.Contains('uniformPressureTranslationAbc')){throw 'patch missing'}
      - name: Combined translational plus rotational L4
        shell: pwsh
        run: |
          node scripts/lfea-caesar-accdb-benchmark.mjs --accdb "$env:BM4L_ACCDB" --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json --solve-linear true --solve-cases L4 --actual-out artifacts/test-actual.json --out artifacts/test-report.json --summary-out artifacts/test.md
      - name: Compare
        shell: pwsh
        run: |
          $b=Get-Content artifacts/base-report.json -Raw|ConvertFrom-Json; $t=Get-Content artifacts/test-report.json -Raw|ConvertFrom-Json
          function C($r){$q=$r.qualification.cases[0];$f=@($q.comparison.rows|? status -eq 'FAIL');$rr=@($f|?{$_.entityKind-eq'NODE'-and$_.quantity-in@('FORCE','MOMENT')}).Count;$dd=@($f|?{$_.entityKind-eq'NODE'-and$_.quantity-in@('DISPLACEMENT','ROTATION')}).Count;$ee=@($f|?{$_.entityKind-eq'ELEMENT'-and$_.quantity-like'GLOBAL_END_*'}).Count;[ordered]@{r=$rr;d=$dd;e=$ee;total=$rr+$dd+$ee;equilibrium=$q.actualEvidence.recoveredEquilibrium}}
          $o=[ordered]@{hypothesis='TRANSLATION_AND_ROTATION_MUST_INCLUDE_UNIFORM_BEND_TRANSLATION_PLUS_MEC21_OPENING';base=C $b;test=C $t};$o|ConvertTo-Json -Depth 16|Tee-Object -FilePath artifacts/combined-bourdon-ab.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bm4l-combined-bourdon-ab-${{ github.sha }}
          path: artifacts/
          retention-days: 14

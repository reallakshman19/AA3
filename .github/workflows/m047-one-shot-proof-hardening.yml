name: M047 one-shot proof hardening

on:
  push:
    branches: [agent/m047-bm4l-root-cause]
    paths: ['.github/workflows/m047-one-shot-proof-hardening.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m047-bm4l-root-cause
          fetch-depth: 0

      - name: Apply guarded proof-tool edits
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new)

          recovery = Path('scripts/lfea-m047-bm4l-recovery-proof.mjs')
          text = recovery.read_text()
          text = replace_once(text,
              "const EXPECTED_ACCDB_SHA256 = 'e21b0862851ea2bb6f20d55e4a3a94f501537b618b98dd46afa9f6777ee38d3c';",
              "const DEFAULT_EXPECTED_ACCDB_SHA256 = 'e21b0862851ea2bb6f20d55e4a3a94f501537b618b98dd46afa9f6777ee38d3c';",
              'recovery constant')
          text = replace_once(text,
              "const actual = args.get('--actual');\n  if (!actual) throw new TypeError('Usage: --actual <bm4l-actual.json> [--out <proof.json>].');\n  const unknown = [...args.keys()].filter((key) => !['--actual', '--out'].includes(key));\n  if (unknown.length > 0) throw new TypeError(`Unknown arguments: ${unknown.join(', ')}.`);\n  return Object.freeze({ actualPath: resolve(actual), outPath: args.has('--out') ? resolve(args.get('--out')) : null });",
              "const actual = args.get('--actual');\n  const expectedSourceSha256 = String(args.get('--expected-source-sha') ?? DEFAULT_EXPECTED_ACCDB_SHA256).toLowerCase();\n  if (!actual || !/^[a-f0-9]{64}$/u.test(expectedSourceSha256)) {\n    throw new TypeError('Usage: --actual <bm4l-actual.json> [--expected-source-sha <sha256>] [--out <proof.json>].');\n  }\n  const unknown = [...args.keys()].filter((key) => !['--actual', '--expected-source-sha', '--out'].includes(key));\n  if (unknown.length > 0) throw new TypeError(`Unknown arguments: ${unknown.join(', ')}.`);\n  return Object.freeze({ actualPath: resolve(actual), expectedSourceSha256, outPath: args.has('--out') ? resolve(args.get('--out')) : null });",
              'recovery args')
          text = replace_once(text,
              "function requireActual(actual) {",
              "function requireActual(actual, expectedSourceSha256) {",
              'recovery require signature')
          text = replace_once(text,
              "if (actual.sourceAccdbSha256 !== EXPECTED_ACCDB_SHA256) {\n    throw new TypeError(`Recovery proof is pinned to BM4_L ACCDB ${EXPECTED_ACCDB_SHA256}.`);\n  }",
              "if (actual.sourceAccdbSha256 !== expectedSourceSha256) {\n    throw new TypeError(`Recovery proof expected ACCDB ${expectedSourceSha256}, found ${String(actual.sourceAccdbSha256)}.`);\n  }",
              'recovery source check')
          text = replace_once(text,
              "if (!/^[a-f0-9]{64}$/u.test(caseHash)) throw new TypeError(`${caseId} lacks a valid cases[].stiffnessStateHash.`);",
              "if (!caseHash) throw new TypeError(`${caseId} lacks cases[].stiffnessStateHash.`);",
              'operator hash format')
          text = replace_once(text,
              "status: identity.status === 'PASS' && transformation.status === 'PASS' ? 'PASS' : 'FAIL',",
              "status: identity.status === 'PASS' ? 'PASS' : 'FAIL',",
              'report path status')
          text = replace_once(text,
              "function buildProof(actual) {\n  requireActual(actual);",
              "function buildProof(actual, expectedSourceSha256) {\n  requireActual(actual, expectedSourceSha256);",
              'build proof signature')
          text = replace_once(text,
              "sourceAccdbSha256: actual.sourceAccdbSha256,\n    commonOperator,",
              "sourceAccdbSha256: actual.sourceAccdbSha256,\n    expectedSourceAccdbSha256: expectedSourceSha256,\n    proofScope: 'ASSEMBLY_CONSISTENT_GLOBAL_REPORT_PATH',\n    alternateLocalRecoveryIsDiagnostic: true,\n    commonOperator,",
              'proof metadata')
          text = replace_once(text,
              "const proof = buildProof(readJson(args.actualPath));",
              "const proof = buildProof(readJson(args.actualPath), args.expectedSourceSha256);",
              'proof main')
          recovery.write_text(text)

          diag = Path('scripts/lfea-m047-bm4l-root-cause-diagnostics.mjs')
          text = diag.read_text()
          text = replace_once(text,
              "const EXPECTED_ACCDB_SHA256 = 'e21b0862851ea2bb6f20d55e4a3a94f501537b618b98dd46afa9f6777ee38d3c';",
              "const DEFAULT_EXPECTED_ACCDB_SHA256 = 'e21b0862851ea2bb6f20d55e4a3a94f501537b618b98dd46afa9f6777ee38d3c';",
              'diagnostic constant')
          text = replace_once(text,
              "const outPath = args.get('--out');\n  if (!actualPath || !reportPath || !outPath) {\n    throw new TypeError('Usage: --actual <bm4l-actual.json> --report <bm4l-report.json> --out <diagnostics.json>.');\n  }\n  const unknown = [...args.keys()].filter((key) => !['--actual', '--report', '--out'].includes(key));\n  if (unknown.length > 0) throw new TypeError(`Unknown command arguments: ${unknown.join(', ')}.`);\n  return Object.freeze({ actualPath: resolve(actualPath), reportPath: resolve(reportPath), outPath: resolve(outPath) });",
              "const outPath = args.get('--out');\n  const expectedSourceSha256 = String(args.get('--expected-source-sha') ?? DEFAULT_EXPECTED_ACCDB_SHA256).toLowerCase();\n  if (!actualPath || !reportPath || !outPath || !/^[a-f0-9]{64}$/u.test(expectedSourceSha256)) {\n    throw new TypeError('Usage: --actual <bm4l-actual.json> --report <bm4l-report.json> --out <diagnostics.json> [--expected-source-sha <sha256>].');\n  }\n  const unknown = [...args.keys()].filter((key) => !['--actual', '--report', '--out', '--expected-source-sha'].includes(key));\n  if (unknown.length > 0) throw new TypeError(`Unknown command arguments: ${unknown.join(', ')}.`);\n  return Object.freeze({ actualPath: resolve(actualPath), reportPath: resolve(reportPath), outPath: resolve(outPath), expectedSourceSha256 });",
              'diagnostic args')
          text = replace_once(text,
              "function requireInput(actual, report) {",
              "function requireInput(actual, report, expectedSourceSha256) {",
              'diagnostic require signature')
          text = replace_once(text,
              "if (actual.sourceAccdbSha256 !== EXPECTED_ACCDB_SHA256 || report.source?.sha256 !== EXPECTED_ACCDB_SHA256) {\n    throw new TypeError('BM4_L diagnostics require the pinned ACCDB SHA-256 from M047 issue #991.');\n  }",
              "if (actual.sourceAccdbSha256 !== expectedSourceSha256 || report.source?.sha256 !== expectedSourceSha256) {\n    throw new TypeError(`BM4_L diagnostics expected ACCDB ${expectedSourceSha256}.`);\n  }",
              'diagnostic source check')
          old_linearity = """function buildLinearityAuthority(actual) {\n  const cases = {};\n  for (const caseId of EXPECTED_CASES) {\n    const evidence = actual.mechanics?.cases?.[caseId] ?? {};\n    cases[caseId] = Object.freeze({\n      formula: evidence.formula ?? null,\n      gravityIncluded: evidence.gravityIncluded ?? null,\n      thermalIncluded: evidence.thermalIncluded ?? null,\n      pressureIncluded: evidence.pressureIncluded ?? null,\n      friction: evidence.effectiveConfiguration?.friction ?? null,\n      executionStatus: evidence.executionStatus ?? null,\n      executionSemanticHash: actual.cases[caseId].executionSemanticHash ?? null,\n      note: 'Execution semantic hashes include case loads and therefore are not, by themselves, proof of an identical stiffness operator.',\n    });\n  }\n  return Object.freeze({\n    selectedCases: EXPECTED_CASES,\n    cases,\n    commonOperatorHashAvailable: false,\n    status: 'INCOMPLETE_OPERATOR_PROOF',\n    requiredNextEvidence: 'Expose a case-independent assembled stiffness/operator semantic hash and compare it across L2/L3/L4/L5/L6/L14 before using superposition as a mechanics proof.',\n  });\n}"""
          new_linearity = """function buildLinearityAuthority(actual) {\n  const cases = {};\n  const stiffnessHashes = [];\n  for (const caseId of EXPECTED_CASES) {\n    const evidence = actual.mechanics?.cases?.[caseId] ?? {};\n    const stiffnessStateHash = actual.cases?.[caseId]?.stiffnessStateHash ?? evidence.stiffnessStateHash ?? null;\n    if (stiffnessStateHash !== null) stiffnessHashes.push(String(stiffnessStateHash));\n    cases[caseId] = Object.freeze({\n      formula: evidence.formula ?? null,\n      gravityIncluded: evidence.gravityIncluded ?? null,\n      thermalIncluded: evidence.thermalIncluded ?? null,\n      pressureIncluded: evidence.pressureIncluded ?? null,\n      friction: evidence.effectiveConfiguration?.friction ?? null,\n      executionStatus: evidence.executionStatus ?? null,\n      stiffnessStateHash,\n      executionSemanticHash: actual.cases[caseId].executionSemanticHash ?? null,\n    });\n  }\n  const distinct = [...new Set(stiffnessHashes)];\n  const complete = stiffnessHashes.length === EXPECTED_CASES.length;\n  const common = complete && distinct.length === 1;\n  return Object.freeze({\n    selectedCases: EXPECTED_CASES,\n    cases,\n    commonOperatorHashAvailable: complete,\n    distinctStiffnessStateHashes: Object.freeze(distinct),\n    commonStiffnessStateHash: common ? distinct[0] : null,\n    status: common ? 'PASS_COMMON_OPERATOR' : complete ? 'FAIL_OPERATOR_MISMATCH' : 'INCOMPLETE_OPERATOR_PROOF',\n  });\n}"""
          text = replace_once(text, old_linearity, new_linearity, 'linearity authority')
          text = replace_once(text,
              "requireInput(actualFile.value, reportFile.value);",
              "requireInput(actualFile.value, reportFile.value, input.expectedSourceSha256);",
              'diagnostic main require')
          text = replace_once(text,
              "unresolvedEvidence: Object.freeze([\n    'Raw element-end action decomposition K_global*u - f_fixed - f_initial is not exposed by the current actual-result evidence package.',\n    'A case-independent assembled stiffness/operator hash is not exposed, so common-operator linearity is not yet proven by artifact.',\n    'ACCDB table/field canonical hashes and provider binary version are not yet carried in the benchmark report.',\n  ]),",
              "unresolvedEvidence: Object.freeze([\n    'ACCDB table/field canonical hashes and provider binary version are emitted separately by the provenance artifact when its source/provider gate is satisfied.',\n  ]),",
              'diagnostic unresolved')
          diag.write_text(text)

      - name: Validate proof tooling
        run: |
          node --check scripts/lfea-m047-bm4l-recovery-proof.mjs
          node --check scripts/lfea-m047-bm4l-root-cause-diagnostics.mjs
          node scripts/lfea-b3.3-solver-check.mjs
          node scripts/lfea-b3.4-recovery-check.mjs
          node scripts/lfea-b3.6-sparse-assembly-check.mjs

      - name: Commit proof hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lfea-m047-bm4l-recovery-proof.mjs scripts/lfea-m047-bm4l-root-cause-diagnostics.mjs
          git diff --cached --check
          git commit -m "harden BM4_L operator and recovery proofs"
          git push origin HEAD:agent/m047-bm4l-root-cause

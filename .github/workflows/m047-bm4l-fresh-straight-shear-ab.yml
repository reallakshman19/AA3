name: M047 fresh BM4_L straight-pipe shear A-B

on:
  push:
    branches: [agent/m047-bm4l-fresh-qualification]
    paths: ['.github/workflows/m047-bm4l-fresh-straight-shear-ab.yml']

permissions:
  contents: read

jobs:
  straight-shear-ab:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      COMMON_COMMIT: '45d51ea18624f5775805f399110c1738301c0d90'
      ZIP_SHA256: '978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9'
      MEMBER_SHA256: '64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8'
      ACE_URL: 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe'
      ACE_SHA256: '04e96c9f1a1f7d251a88aececf1dc10ff65950392787427c00814a43308003de'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m047-bm4l-fresh-qualification
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Install authenticated ACE and fetch pinned BM4_L
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/fresh-shear/source,artifacts/fresh-shear/before,artifacts/fresh-shear/after | Out-Null
          $installer=Join-Path $PWD 'artifacts/fresh-shear/accessdatabaseengine_X64.exe'
          Invoke-WebRequest -Uri $env:ACE_URL -OutFile $installer
          if((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ACE_SHA256){ throw 'ACE installer hash mismatch.' }
          $sig=Get-AuthenticodeSignature $installer
          if($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft'){ throw 'ACE signature validation failed.' }
          $p=Start-Process $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if($p.ExitCode -notin @(0,3010)){ throw "ACE install failed: $($p.ExitCode)" }
          Remove-Item $installer -Force
          $zip=Join-Path $PWD 'artifacts/fresh-shear/BM4_L.zip'
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/reallaksh19/Common/$env:COMMON_COMMIT/LFEA/BM4/BM4_L.zip" -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ZIP_SHA256){ throw 'ZIP hash mismatch.' }
          Expand-Archive $zip -DestinationPath artifacts/fresh-shear/source -Force
          $accdb=Join-Path $PWD 'artifacts/fresh-shear/source/BM4_L.ACCDB'
          if((Get-FileHash $accdb -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:MEMBER_SHA256){ throw 'ACCDB member hash mismatch.' }
          "ACCDB=$accdb" >> $env:GITHUB_ENV

      - name: Reproduce clean current-main six-case baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb $env:ACCDB `
            --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json `
            --solve-linear true `
            --solve-cases L2,L3,L4,L5,L6,L14 `
            --actual-out artifacts/fresh-shear/before/actual.json `
            --out artifacts/fresh-shear/before/report.json `
            --summary-out artifacts/fresh-shear/before/summary.md

      - name: Apply diagnostic straight-span transverse shear only
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/core/fea-benchmarks/caesar-accdb-linear-solve.js')
          t=p.read_text()

          needle="    section: input.section,\n  });\n  const length = frame.geometry.length;"
          replacement="    section: input.section,\n    profile: isCaesarStraightPipeSpan(input.kind) ? caesarStraightPipeFrameProfile() : frameProfile(),\n  });\n  const length = frame.geometry.length;"
          if t.count(needle)!=1:
              raise SystemExit(f'buildFrameElement semantic site count {t.count(needle)}')
          t=t.replace(needle,replacement,1)

          needle2="    profile: frameProfile(),\n    distributedLoads: [],"
          replacement2="    profile: input.profile ?? frameProfile(),\n    distributedLoads: [],"
          if t.count(needle2)!=1:
              raise SystemExit(f'compileUnloadedFrame profile site count {t.count(needle2)}')
          t=t.replace(needle2,replacement2,1)

          marker="function frameProfile() {\n  return sealFrameElementProfile({"
          helper="""function isCaesarStraightPipeSpan(kind) {
            return kind === 'FRAME' || kind === 'BEND_INCOMING_STRAIGHT';
          }

          function caesarStraightPipeFrameProfile() {
            return sealFrameElementProfile({
              schema: 'fea-linear-frame-element-profile/v1',
              profileId: 'LINEAR-FRAME-ELEMENT-R1',
              straightPipeFormulation: 'PIPE_FRAME3D_TIMOSHENKO_V1',
              shearDeformation: true,
              shearCorrectionFactorY: { value: 0.5, source: 'M047-FRESH-CAESAR-PIPE-SHEAR-COEFFICIENT-2' },
              shearCorrectionFactorZ: { value: 0.5, source: 'M047-FRESH-CAESAR-PIPE-SHEAR-COEFFICIENT-2' },
              releaseRule: 'STATIC_CONDENSATION_V1',
              thermalStrainApproximation: 'UNIFORM_TEMPERATURE_ALPHA_DELTA_T_V1',
              releaseSingularityTolerance: { value: 1e-12, source: PROFILE_SOURCE },
              semanticHash: '',
            });
          }

          function frameProfile() {
            return sealFrameElementProfile({"""
          if t.count(marker)!=1:
              raise SystemExit(f'frameProfile insertion site count {t.count(marker)}')
          p.write_text(t.replace(marker,helper,1))

      - name: Run candidate six cases and reusable mechanics gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check src/core/fea-benchmarks/caesar-accdb-linear-solve.js
          node scripts/lfea-b3.1-frame-element-check.mjs
          node scripts/lfea-b3.1-reviewer-check.mjs
          node scripts/lfea-b3.3-solver-check.mjs
          node scripts/lfea-b3.4-recovery-check.mjs
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb $env:ACCDB `
            --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json `
            --solve-linear true `
            --solve-cases L2,L3,L4,L5,L6,L14 `
            --actual-out artifacts/fresh-shear/after/actual.json `
            --out artifacts/fresh-shear/after/report.json `
            --summary-out artifacts/fresh-shear/after/summary.md
          npm run check:core-fea

      - name: Build before-after evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync('artifacts/fresh-shear/before/report.json','utf8').replace(/^\uFEFF/,''));
          const after=JSON.parse(fs.readFileSync('artifacts/fresh-shear/after/report.json','utf8').replace(/^\uFEFF/,''));
          const ba=JSON.parse(fs.readFileSync('artifacts/fresh-shear/before/actual.json','utf8').replace(/^\uFEFF/,''));
          const aa=JSON.parse(fs.readFileSync('artifacts/fresh-shear/after/actual.json','utf8').replace(/^\uFEFF/,''));
          const cases=['L2','L3','L4','L5','L6','L14'];
          const counts=(r,c)=>({restraint:r.restraintBasis.cases[c].exceedingComponentCount,displacementRotation:r.displacementBasis.cases[c].exceedingComponentCount,elementEnd:r.elementBasis.cases[c].exceedingComponentCount});
          const rows=(r,c)=>r.qualification.cases.find(x=>x.caseId===c).comparison.rows;
          function find(r,c,kind,prefix,quantity,component){const m=rows(r,c).filter(x=>x.entityKind===kind&&String(x.entityId).startsWith(prefix)&&x.quantity===quantity&&x.component===component);if(m.length!==1)throw new Error(`row ${c} ${prefix} ${quantity} ${component}: ${m.length}`);return m[0];}
          const targets=[['L2 node 20090 UY','L2','NODE','20090','FORCE','UY'],['L2 E4 TO FY','L2','ELEMENT','INPUT_ELEMENT:4|','GLOBAL_END_FORCE_TO','FY'],['L2 E4 TO MZ','L2','ELEMENT','INPUT_ELEMENT:4|','GLOBAL_END_MOMENT_TO','MZ'],['L2 E5 FROM FY','L2','ELEMENT','INPUT_ELEMENT:5|','GLOBAL_END_FORCE_FROM','FY'],['L2 E5 FROM MZ','L2','ELEMENT','INPUT_ELEMENT:5|','GLOBAL_END_MOMENT_FROM','MZ'],['L2 node 20120 RZ','L2','NODE','20120','ROTATION','RZ']];
          const highSignal=targets.map(t=>{const b=find(before,...t.slice(1)),a=find(after,...t.slice(1));const be=Math.abs(b.actualValue-b.referenceValue),ae=Math.abs(a.actualValue-a.referenceValue);return {name:t[0],reference:b.referenceValue,before:b.actualValue,after:a.actualValue,beforeAbsoluteError:be,afterAbsoluteError:ae,errorReductionFraction:be>0?(be-ae)/be:null,beforePercentError:b.rawRelativeError===null?null:100*b.rawRelativeError,afterPercentError:a.rawRelativeError===null?null:100*a.rawRelativeError};});
          const equilibrium={};for(const c of cases){equilibrium[c]={before:ba.mechanics.cases[c].recoveredEquilibrium,after:aa.mechanics.cases[c].recoveredEquilibrium};if(aa.mechanics.cases[c].executionStatus!=='QUALIFIED'||aa.mechanics.cases[c].recoveredEquilibrium.status!=='PASS')throw new Error(`${c} candidate integrity failed`);}
          const bw=ba.mechanics.cases.L2.gravityWeightN,aw=aa.mechanics.cases.L2.gravityWeightN;if(Math.abs(aw-bw)>1e-9*Math.max(1,Math.abs(bw)))throw new Error(`gravity changed ${bw} -> ${aw}`);
          const out={schema:'m047-bm4l-fresh-straight-shear-ab/v1',baseCommit:'7a08f9db84f298990250793226b36d4a82dbe01e',source:{commonCommit:process.env.COMMON_COMMIT,zipSha256:process.env.ZIP_SHA256,accdbMemberSha256:process.env.MEMBER_SHA256},candidate:{scope:['FRAME','BEND_INCOMING_STRAIGHT'],formulation:'PIPE_FRAME3D_TIMOSHENKO_V1',kappaY:0.5,kappaZ:0.5,bendArcs:false,reducers:false,rigids:false,benchmarkFitted:false},counts:Object.fromEntries(cases.map(c=>[c,{before:counts(before,c),after:counts(after,c)}])),highSignal,gravityWeightN:{before:bw,after:aw},equilibrium:Object.fromEntries(cases.map(c=>[c,{before:equilibrium[c].before.status,after:equilibrium[c].after.status,afterMaxResidual:equilibrium[c].after.maximumAbsoluteResidual}]))};
          fs.writeFileSync('artifacts/fresh-shear/ab.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          '@ | node

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m047-bm4l-fresh-straight-shear-${{ github.sha }}
          path: artifacts/fresh-shear
          retention-days: 30
          if-no-files-found: error

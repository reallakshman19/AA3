name: EMP.1.C exact-gamma qualification

on:
  pull_request:

permissions:
  contents: read

jobs:
  qualify-exact-gamma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Re-observe inherited primary qualification boundary
        shell: bash
        run: |
          set +e
          node scripts/emp1-c-primary-qualification-state-check.mjs > /tmp/emp1-primary-v2.json
          status=$?
          set -e
          cat /tmp/emp1-primary-v2.json
          if [ "$status" -ne 2 ]; then
            echo "Expected inherited full-domain state to remain blocked only on non-tabulated gamma authority"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const state=JSON.parse(await readFile('/tmp/emp1-primary-v2.json','utf8'));
          if (state.status!=='BLOCKED') throw new Error(`EMP1_EXACT_GAMMA_INHERITED_STATE:${state.status}`);
          const codes=state.blockers?.map((row)=>row.code)??[];
          if (codes.length!==1 || codes[0]!=='WRC537_NON_TABULATED_GAMMA_SELECTION_UNQUALIFIED') {
            throw new Error(`EMP1_EXACT_GAMMA_INHERITED_BLOCKERS:${codes.join(',')}`);
          }
          if (state.routeRegistrationAllowed!==false || state.productionAuthority!==false) {
            throw new Error('EMP1_EXACT_GAMMA_PREMATURE_FULL_ROUTE_AUTHORITY');
          }
          NODE
      - name: Qualify exact source-tabulated gamma selector
        run: node scripts/emp1-wrc-cylindrical-exact-gamma-self-test.mjs
      - name: Re-observe WRC page 95 coefficient table from frozen PDF
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          pdftotext -f 95 -l 95 -layout docs/emp1/WRC537_2013.pdf /tmp/wrc-page95.txt
          sed -n '1,180p' /tmp/wrc-page95.txt
      - name: Bind capability record to live source observation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { parseCylindricalExactGammaPackage } from './scripts/emp1-wrc-cylindrical-exact-gamma-lib.mjs';
          const capability=JSON.parse(await readFile('validation/emp1/wrc537-2013/exact-gamma-capability-v1.json','utf8'));
          const markdown=await readFile('docs/emp1/WRC537_2013_Tables_and_Charts.md','utf8');
          const pkg=parseCylindricalExactGammaPackage(markdown);
          if (capability.status!=='PASS_BOUNDED_EXACT_TABULATED_GAMMA_SELECTION') throw new Error(`EMP1_EXACT_GAMMA_CAPABILITY_STATE:${capability.status}`);
          if (capability.source?.rawPdfSha256!==pkg.source.rawPdfSha256) throw new Error('EMP1_EXACT_GAMMA_SOURCE_SHA_DRIFT');
          for (const [key,value] of Object.entries(capability.inventory ?? {})) {
            const packageKey={coefficientTables:'tables'}[key] ?? key;
            if (pkg.counts[packageKey]!==value) throw new Error(`EMP1_EXACT_GAMMA_INVENTORY_DRIFT:${key}:${pkg.counts[packageKey]}:${value}`);
          }
          if (capability.qualifiedDomain?.gammaSelection!=='EXACT_SOURCE_TABULATED_GAMMA_ONLY') throw new Error('EMP1_EXACT_GAMMA_POLICY_DRIFT');
          if (capability.qualifiedDomain?.nonTabulatedGamma!=='BLOCKED_NO_INTERPOLATION_AUTHORITY') throw new Error('EMP1_EXACT_GAMMA_NON_TABULATED_POLICY_DRIFT');
          if (capability.authorization?.boundedProductionComparisonAllowed!==false || capability.authorization?.globalEmp1CRouteRegistrationAllowed!==false) {
            throw new Error('EMP1_EXACT_GAMMA_PREMATURE_AUTHORITY');
          }
          console.log(JSON.stringify({schema:'emp1-exact-gamma-capability-binding/v1',status:'PASS',inventory:capability.inventory},null,2));
          NODE

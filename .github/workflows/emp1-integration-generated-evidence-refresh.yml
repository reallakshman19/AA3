name: EMP.1 integration generated evidence refresh

on:
  push:
    branches:
      - agent/emp1-a-run-state-retention-issue1261
    paths:
      - .github/workflows/emp1-integration-generated-evidence-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/emp1-a-run-state-retention-issue1261
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate deterministic qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/emp1-c-qualification-evidence-build.mjs
          node scripts/emp1-c-qualification-evidence-check.mjs
          node scripts/emp1-c-qualification-evidence-self-test.mjs
      - name: Commit exact generated artifact and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/emp1-integration-generated-evidence-refresh.yml
          git add -- src/core/emp1/emp1-c-qualification-evidence.generated.js
          git diff --cached --check
          git diff --cached --exit-code --quiet && { echo 'No deterministic generated-artifact change found'; exit 1; } || true
          git commit -m 'fix(emp1): regenerate retained qualification evidence'
          git push origin HEAD:agent/emp1-a-run-state-retention-issue1261

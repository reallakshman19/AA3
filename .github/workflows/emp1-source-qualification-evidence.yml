name: EMP.1 source qualification evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  source-qualification-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Advanced_Analysis candidate
        uses: actions/checkout@v4

      - name: Checkout pinned EMP.1 source repository
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/XML_Compare_Utilities
          ref: dc1371afcd44c12de86b2dad6eddf00f1f0b3c55
          path: .source/XML_Compare_Utilities
          fetch-depth: 1

      - name: Verify pinned source commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C .source/XML_Compare_Utilities rev-parse HEAD)"
          expected="dc1371afcd44c12de86b2dad6eddf00f1f0b3c55"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Prepare PDF inspection tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null 2>&1 || ! command -v pdftoppm >/dev/null 2>&1 || ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi

      - name: Observe raw-byte custody and extract bounded source evidence
        shell: bash
        run: |
          set -euo pipefail
          source_root="$PWD/.source/XML_Compare_Utilities/docs/emp.1"
          out="$PWD/test-results/emp1-source-qualification"
          mkdir -p "$out/caux-pages"

          set +e
          node scripts/emp1-source-custody-check.mjs --source-root "$source_root" > "$out/source-custody.json" 2> "$out/source-custody.stderr.txt"
          custody_rc=$?
          set -e
          cat "$out/source-custody.json"
          if [ "$custody_rc" -ne 0 ] && [ "$custody_rc" -ne 2 ]; then
            echo "EMP1_SOURCE_CUSTODY_OBSERVATION_FAILED rc=$custody_rc" >&2
            cat "$out/source-custody.stderr.txt" >&2 || true
            exit "$custody_rc"
          fi
          printf '%s\n' "$custody_rc" > "$out/source-custody.exit-code.txt"

          wrc="$source_root/WRC537_2013.pdf"
          caux="$source_root/CAUx 2017 - WRC01f.pdf"

          sha256sum "$wrc" "$caux" > "$out/raw-sha256.txt"
          stat --printf='%s  %n\n' "$wrc" "$caux" > "$out/byte-counts.txt"
          git -C .source/XML_Compare_Utilities hash-object "docs/emp.1/WRC537_2013.pdf" > "$out/wrc-git-blob-sha1.txt"
          git -C .source/XML_Compare_Utilities hash-object "docs/emp.1/CAUx 2017 - WRC01f.pdf" > "$out/caux-git-blob-sha1.txt"

          pdfinfo "$wrc" > "$out/WRC537_2013.pdfinfo.txt"
          pdfinfo "$caux" > "$out/CAUx_2017_WRC01f.pdfinfo.txt"
          pdftotext -layout "$wrc" "$out/WRC537_2013.txt"
          pdftotext -f 24 -l 31 -layout "$caux" "$out/CAUx_2017_WRC01f_pp24-31.txt"
          pdftoppm -f 24 -l 31 -png -r 150 "$caux" "$out/caux-pages/page" >/dev/null

          {
            echo "source_commit=dc1371afcd44c12de86b2dad6eddf00f1f0b3c55"
            echo "wrc_path=docs/emp.1/WRC537_2013.pdf"
            echo "caux_path=docs/emp.1/CAUx 2017 - WRC01f.pdf"
            echo "custody_exit_code=$custody_rc"
          } > "$out/manifest.txt"

      - name: Upload source qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emp1-source-qualification-${{ github.sha }}
          path: test-results/emp1-source-qualification
          if-no-files-found: error
          retention-days: 30

# Trusted default-branch DELP reconciliation. This file becomes active only
# after an authorized merge. It NEVER checks out, executes, or imports PR code.
# A projection controls GitHub status only; it grants no engineering/merge authority.
name: BM4_L V3.5 live evidence scoreboard

on:
  workflow_dispatch:
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  check_suite:
    types: [completed]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read

concurrency:
  group: bm4l-v35-delp-managed-status
  cancel-in-progress: false

jobs:
  publish-trusted-delp:
    # Avoid recursive event churn from the workflow's managed status comments.
    if: ${{ github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Checkout immutable Common V3.5 projector only
        uses: actions/checkout@v4
        with:
          repository: reallakshman19/Common
          ref: d006990b6637b5cabba656883c905c42cc8e947d
          path: .bm4l-v35-common
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic YAML parser
        run: python -m pip install PyYAML
      - name: Derive and publish issue status and titles from live fact ledger
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONUTF8: '1'
        run: |
          set -eu
          GRAPH=docs/lfea/BM4L_V35_EXECUTION_GRAPH.yaml
          ENGINE=.bm4l-v35-common/skills/engineering-pr-delivery-v3.5/scripts/delp_projection_v35.py
          # Graph correctness is a scoreboard-functional check, not a coding-admission gate.
          python "$ENGINE" validate-graph --graph "$GRAPH"
          python "$ENGINE" sync-github --graph "$GRAPH" --repository "$GH_REPO" --repo-root .

name: Engineering Table merge build comparison
on:
  pull_request:
    paths:
      - 'src/workspace/topology-edit/table/**'
      - 'src/workspace/topology-edit/draft/**'
      - 'src/workspace/viewport-productivity/topology-edit-table-*.js'
      - '.github/workflows/engineering-table-merge-build-comparison.yml'
permissions:
  contents: read
jobs:
  base-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Record current base
        run: |
          echo "BASE_REF=${{ github.event.pull_request.base.ref }}"
          git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build current base
        run: npm run build
  merge-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
      - name: Record merge candidate
        run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build merge result
        run: npm run build

name: LAFEA.1/.2 independent analytical oracle qualification

on:
  pull_request:
    paths:
      - 'src/core/local-stress/**'
      - 'src/core/local-attachment-screening/**'
      - 'src/workspace/lafea-analytical-result-authority.js'
      - 'src/workspace/lafea-result-presenters/**'
      - 'src/workspace/lafea-stage-composition-root.js'
      - 'scripts/lafea.1-*.mjs'
      - 'scripts/lafea.2-*.mjs'
      - 'scripts/lafea.12-*.mjs'
      - 'agents/qualifications/ADV-LAFEA12-ANALYTICAL-QUALIFICATION/**'
      - '.github/workflows/lafea12-analytical-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytical-oracle:
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head and clean tree
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check bounded analytical qualification syntax
        run: |
          node --check scripts/lafea.12-independent-oracle-check.mjs
          node --check scripts/lafea.12-analytical-qualification-check.mjs
          node --check scripts/lafea.12-analytical-qualification-registration-check.mjs

      - name: Verify qualification registration and seven-family source custody
        run: node scripts/lafea.12-analytical-qualification-registration-check.mjs

      - name: Execute LAFEA.1/.2 bounded analytical qualification
        run: node scripts/lafea.12-analytical-qualification-check.mjs

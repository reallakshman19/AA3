name: M047 BM4_L assembled rigid shear A-B

on:
  push:
    branches: [agent/m047-bm4l-root-cause]
    paths: ['.github/workflows/m047-bm4l-rigid-assembled-shear-diagnostic.yml']

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      COMMON_COMMIT: '45d51ea18624f5775805f399110c1738301c0d90'
      ZIP_SHA256: '978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9'
      MEMBER_SHA256: '64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8'
      ACE_URL: 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe'
      ACE_SHA256: '04e96c9f1a1f7d251a88aececf1dc10ff65950392787427c00814a43308003de'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m047-bm4l-root-cause
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Install authenticated ACE and fetch pinned BM4_L
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/rigid-assembled/source,artifacts/rigid-assembled/before,artifacts/rigid-assembled/after | Out-Null
          $installer=Join-Path $PWD 'artifacts/rigid-assembled/accessdatabaseengine_X64.exe'
          Invoke-WebRequest -Uri $env:ACE_URL -OutFile $installer
          if((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ACE_SHA256){ throw 'ACE installer hash mismatch.' }
          $sig=Get-AuthenticodeSignature $installer
          if($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft'){ throw 'ACE signature validation failed.' }
          $p=Start-Process $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if($p.ExitCode -notin @(0,3010)){ throw "ACE install failed: $($p.ExitCode)" }
          Remove-Item $installer -Force
          $zip=Join-Path $PWD 'artifacts/rigid-assembled/BM4_L.zip'
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/reallaksh19/Common/$env:COMMON_COMMIT/LFEA/BM4/BM4_L.zip" -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ZIP_SHA256){ throw 'ZIP hash mismatch.' }
          Expand-Archive $zip -DestinationPath artifacts/rigid-assembled/source -Force
          $accdb=Join-Path $PWD 'artifacts/rigid-assembled/source/BM4_L.ACCDB'
          if((Get-FileHash $accdb -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:MEMBER_SHA256){ throw 'ACCDB member hash mismatch.' }
          "ACCDB=$accdb" >> $env:GITHUB_ENV

      - name: Capture governed six-case baseline and L2 replay
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb $env:ACCDB `
            --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json `
            --solve-linear true `
            --solve-cases L2,L3,L4,L5,L6,L14 `
            --actual-out artifacts/rigid-assembled/before/actual.json `
            --out artifacts/rigid-assembled/before/report.json
          node scripts/lfea-m047-bm4l-source-replay.mjs `
            --actual artifacts/rigid-assembled/before/actual.json `
            --report artifacts/rigid-assembled/before/report.json `
            --case L2 `
            --out artifacts/rigid-assembled/before/source-replay.json

      - name: Include only RIGID in the assembled CAESAR pipe shear profile
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/core/fea-benchmarks/caesar-accdb-linear-solve.js')
          t=p.read_text()
          old="""function isCaesarStraightPipeSpan(kind) {\n  return kind === 'FRAME' || kind === 'BEND_INCOMING_STRAIGHT';\n}"""
          new="""function isCaesarStraightPipeSpan(kind) {\n  return kind === 'FRAME' || kind === 'BEND_INCOMING_STRAIGHT' || kind === 'RIGID';\n}"""
          if t.count(old)!=1:
              raise SystemExit(f'expected one CAESAR pipe shear scope selector, found {t.count(old)}')
          p.write_text(t.replace(old,new,1))

      - name: Run candidate six cases and integrity gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check src/core/fea-benchmarks/caesar-accdb-linear-solve.js
          node scripts/lfea-b3.22-rigid-element-authority-check.mjs
          node scripts/lfea-b3.3-solver-check.mjs
          node scripts/lfea-b3.4-recovery-check.mjs
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb $env:ACCDB `
            --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json `
            --solve-linear true `
            --solve-cases L2,L3,L4,L5,L6,L14 `
            --actual-out artifacts/rigid-assembled/after/actual.json `
            --out artifacts/rigid-assembled/after/report.json
          node scripts/lfea-m047-bm4l-source-replay.mjs `
            --actual artifacts/rigid-assembled/after/actual.json `
            --report artifacts/rigid-assembled/after/report.json `
            --case L2 `
            --out artifacts/rigid-assembled/after/source-replay.json
          npm run check:core-fea

      - name: Build signed evidence and enforce non-leak controls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync('artifacts/rigid-assembled/before/report.json','utf8').replace(/^\uFEFF/,''));
          const after=JSON.parse(fs.readFileSync('artifacts/rigid-assembled/after/report.json','utf8').replace(/^\uFEFF/,''));
          const ba=JSON.parse(fs.readFileSync('artifacts/rigid-assembled/before/actual.json','utf8').replace(/^\uFEFF/,''));
          const aa=JSON.parse(fs.readFileSync('artifacts/rigid-assembled/after/actual.json','utf8').replace(/^\uFEFF/,''));
          const br=JSON.parse(fs.readFileSync('artifacts/rigid-assembled/before/source-replay.json','utf8').replace(/^\uFEFF/,''));
          const ar=JSON.parse(fs.readFileSync('artifacts/rigid-assembled/after/source-replay.json','utf8').replace(/^\uFEFF/,''));
          const cases=['L2','L3','L4','L5','L6','L14'];
          const rows=(r,c)=>r.qualification.cases.find(x=>x.caseId===c).comparison.rows;
          const counts=(r,c)=>{const q=rows(r,c);return {restraint:q.filter(x=>x.status==='FAIL'&&x.entityKind==='NODE'&&['FORCE','MOMENT'].includes(x.quantity)).length,displacementRotation:q.filter(x=>x.status==='FAIL'&&x.entityKind==='NODE'&&['DISPLACEMENT','ROTATION'].includes(x.quantity)).length,elementEnd:q.filter(x=>x.status==='FAIL'&&x.entityKind==='ELEMENT'&&x.quantity.startsWith('GLOBAL_END_')).length};};
          const bm=new Map(br.sources.map(x=>[String(x.sourceElementId),x]));
          const am=new Map(ar.sources.map(x=>[String(x.sourceElementId),x]));
          const rigidIds=['47','52','54','59','61','64','65','76','79','96'];
          const controlIds=['16','36','37'];
          const replay={};
          for(const id of [...rigidIds,...controlIds]){const b=bm.get(id),a=am.get(id);const bv=b?.caesarReferenceReplay?.maximumAbsoluteDifference,av=a?.caesarReferenceReplay?.maximumAbsoluteDifference;replay[id]={topology:b?.topology,before:bv,after:av,improvementFraction:Number.isFinite(bv)&&bv!==0&&Number.isFinite(av)?(bv-av)/bv:null};}
          for(const id of controlIds){const x=replay[id];if(Math.abs((x.after??0)-(x.before??0))>1e-8*Math.max(1,Math.abs(x.before??0))){throw new Error(`non-rigid source replay control ${id} changed: ${x.before} -> ${x.after}`);}}
          if(Math.abs(aa.mechanics.cases.L2.gravityWeightN-ba.mechanics.cases.L2.gravityWeightN)>1e-9)throw new Error('rigid shear scope changed gravity weight');
          function find(r,c,kind,prefix,quantity,component){const m=rows(r,c).filter(x=>x.entityKind===kind&&String(x.entityId).startsWith(prefix)&&x.quantity===quantity&&x.component===component);if(m.length!==1)throw new Error(`row ${c} ${prefix} ${quantity} ${component}: ${m.length}`);return m[0];}
          const targets=[['L2 node 22140 RX','L2','NODE','22140','ROTATION','RX'],['L2 E37 TO MZ','L2','ELEMENT','INPUT_ELEMENT:37|','GLOBAL_END_MOMENT_TO','MZ'],['L2 E38 FROM MZ','L2','ELEMENT','INPUT_ELEMENT:38|','GLOBAL_END_MOMENT_FROM','MZ'],['L2 node 20500 UY','L2','NODE','20500','DISPLACEMENT','UY'],['L4 node 22260 RY','L4','NODE','22260','ROTATION','RY'],['L4 E85 FROM MZ','L4','ELEMENT','INPUT_ELEMENT:85|','GLOBAL_END_MOMENT_FROM','MZ']];
          const highSignal=targets.map(t=>{const b=find(before,...t.slice(1)),a=find(after,...t.slice(1));const be=Math.abs(b.actualValue-b.referenceValue),ae=Math.abs(a.actualValue-a.referenceValue);return {name:t[0],reference:b.referenceValue,before:b.actualValue,after:a.actualValue,beforeAbsoluteError:be,afterAbsoluteError:ae,errorRatio:be>0?ae/be:null};});
          const integrity={};for(const c of cases){integrity[c]={beforeExecution:ba.mechanics.cases[c].executionStatus,afterExecution:aa.mechanics.cases[c].executionStatus,beforeEquilibrium:ba.mechanics.cases[c].recoveredEquilibrium.status,afterEquilibrium:aa.mechanics.cases[c].recoveredEquilibrium.status};if(aa.mechanics.cases[c].executionStatus!=='QUALIFIED'||aa.mechanics.cases[c].recoveredEquilibrium.status!=='PASS')throw new Error(`${c} candidate integrity failed`);}
          const out={schema:'m047-bm4l-rigid-assembled-shear-diagnostic/v1',classification:'DIAGNOSTIC_ONLY_AUTHORITY_SCOPE_TEST',hypothesis:'buildRigidElement already converts the rigid to CAESAR same-ID 10x-wall section, but assembled buildFrameElement excludes kind RIGID from the CAESAR pipe shear profile. Test adding only RIGID to that selector.',authority:{rigidRule:'HEXAGON: same inside diameter, wall thickness ten times entered; long rigid elements may bend',pipeShearRule:'INTERGRAPH CAUx straight thin-wall pipe shear coefficient 2 / kappa 0.5',promotionBoundary:'No primary source located that explicitly states CAESAR rigid elements retain the straight-pipe shear-deformation coefficient; physical A-B evidence alone does not authorize promotion.'},failureCounts:Object.fromEntries(cases.map(c=>[c,{before:counts(before,c),after:counts(after,c)}])),gravityWeightN:{before:ba.mechanics.cases.L2.gravityWeightN,after:aa.mechanics.cases.L2.gravityWeightN},l2SourceReplay:replay,highSignal,integrity,commonOperator:{before:[...new Set(cases.map(c=>ba.mechanics.cases[c].stiffnessStateHash))],after:[...new Set(cases.map(c=>aa.mechanics.cases[c].stiffnessStateHash))]},benchmarkFitting:false};
          fs.writeFileSync('artifacts/rigid-assembled/diagnostic.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          '@ | node

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m047-bm4l-rigid-assembled-shear-${{ github.sha }}
          path: artifacts/rigid-assembled
          retention-days: 30
          if-no-files-found: error

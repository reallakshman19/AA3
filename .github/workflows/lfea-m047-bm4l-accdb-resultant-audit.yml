name: M047 BM4_L ACCDB local/global resultant audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accdb-resultant-audit:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/m047-bm4l-root-cause-991'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout Advanced_Analysis
        uses: actions/checkout@v4

      - name: Checkout pinned BM4_L source container
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 45d51ea18624f5775805f399110c1738301c0d90
          path: _common
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install signed Microsoft ACE 2016 x64
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'accessdatabaseengine_X64.exe'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe' -OutFile $installer
          $sig=Get-AuthenticodeSignature $installer
          if($sig.Status-ne'Valid' -or [string]$sig.SignerCertificate.Subject-notmatch'Microsoft'){throw 'ACE signature check failed.'}
          $p=Start-Process $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if($p.ExitCode-notin@(0,3010)){throw "ACE install failed: $($p.ExitCode)"}

      - name: Extract and verify BM4_L.ACCDB custody
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path artifacts|Out-Null
          $zip='_common/LFEA/BM4/BM4_L.zip'
          if((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()-ne'978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9'){throw 'ZIP custody mismatch.'}
          $dir=Join-Path $env:RUNNER_TEMP 'bm4l-accdb-resultant-audit'
          Expand-Archive $zip $dir -Force
          $accdb=Join-Path $dir 'BM4_L.ACCDB'
          if((Get-FileHash -Algorithm SHA256 $accdb).Hash.ToLowerInvariant()-ne'64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8'){throw 'ACCDB custody mismatch.'}
          "BM4L_ACCDB=$accdb"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Export BM4_L ACCDB input and local/global force tables
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $json=& scripts/lfea-caesar-accdb-export.ps1 `
            -AccdbPath $env:BM4L_ACCDB `
            -TablesCsv 'INPUT_BASIC_ELEMENT_DATA,INPUT_NODAL_COORDINATES,OUTPUT_GLOBAL_ELEMENT_FORCES,OUTPUT_LOCAL_ELEMENT_FORCES'
          if($null-eq$json -or $json.Count-eq0){throw 'ACCDB export returned no JSON.'}
          $json|Out-File artifacts/bm4l-resultant-source.json -Encoding utf8

      - name: Run retained BM4_L solver state
        shell: pwsh
        run: |
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb "$env:BM4L_ACCDB" `
            --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json `
            --solve-linear true `
            --solve-cases L2,L3,L4,L5,L6,L14 `
            --actual-out artifacts/retained-actual.json `
            --out artifacts/retained-report.json `
            --summary-out artifacts/retained-summary.md

      - name: Verify retained 788 family counts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r=Get-Content artifacts/retained-report.json -Raw|ConvertFrom-Json
          $expected=[ordered]@{L2=227;L3=129;L4=120;L5=97;L6=86;L14=129}
          $total=0
          foreach($id in $expected.Keys){
            $c=$r.qualification.cases|Where-Object caseId -eq $id
            $fails=@($c.comparison.rows|Where-Object status -eq 'FAIL')
            $target=@($fails|Where-Object{
              ($_.entityKind-eq'ELEMENT' -and $_.quantity-like'GLOBAL_END_*') -or
              ($_.entityKind-eq'NODE' -and $_.quantity-in@('DISPLACEMENT','ROTATION','FORCE','MOMENT'))
            }).Count
            if($target-ne$expected[$id]){throw "Retained baseline drift in ${id}: $target != $($expected[$id])"}
            $total+=$target
          }
          if($total-ne788){throw "Retained total drift: $total"}

      - name: Run ACCDB-only resultant audit
        shell: pwsh
        run: |
          node --check scripts/lfea-m047-bm4l-accdb-resultant-audit.mjs
          node scripts/lfea-m047-bm4l-accdb-resultant-audit.mjs `
            --raw artifacts/bm4l-resultant-source.json `
            --actual artifacts/retained-actual.json `
            --report artifacts/retained-report.json `
            --out artifacts/bm4l-accdb-resultant-audit.json `
            --summary-out artifacts/bm4l-accdb-resultant-audit.md

      - name: Upload ACCDB-only resultant evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bm4l-accdb-resultant-audit-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

name: Issue 947 node 22130 coupled kinematic audit
# Diagnostic only: preserves the original 1% RZ gate and tests the governing coupled bending DOFs.

on:
  push:
    branches:
      - codex/issue-947-bm4nl-qualification
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci(issue947): run node 22130 coupled kinematic audit' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download pinned canonical BM4_NL package
        uses: actions/download-artifact@v4
        with:
          name: issue-947-bm4nl-qualification
          path: .work/package
          github-token: ${{ github.token }}
          repository: reallaksh19/Advanced_Analysis
          run-id: 31302834835

      - name: Download production-faithful two-sided RZ reconstruction
        uses: actions/download-artifact@v4
        with:
          name: issue-947-node22130-two-sided-rz-reconstruction
          path: .work/reconstruction
          github-token: ${{ github.token }}
          repository: reallaksh19/Advanced_Analysis
          run-id: 31313813802

      - name: Run source-derived coupled kinematic audit
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/lfea-issue947-node22130-coupled-kinematic-audit.mjs
          node scripts/lfea-issue947-node22130-coupled-kinematic-audit.mjs \
            --package .work/package/bm4nl-canonical-package.json \
            --reconstruction .work/reconstruction/issue947-node22130-two-sided-rz-reconstruction.json \
            --out .work/issue947-node22130-coupled-kinematic-audit.json \
            | tee .work/issue947-node22130-coupled-kinematic-audit.log

      - name: Upload coupled kinematic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-947-node22130-coupled-kinematic-audit
          if-no-files-found: error
          path: |
            .work/issue947-node22130-coupled-kinematic-audit.json
            .work/issue947-node22130-coupled-kinematic-audit.log

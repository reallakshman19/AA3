name: M047 promote CAESAR straight-pipe shear

on:
  push:
    branches: [agent/m047-bm4l-fresh-qualification]
    paths: ['.github/workflows/m047-bm4l-promote-straight-shear.yml']

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m047-bm4l-fresh-qualification
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Prove independent CAESAR shear mapping
        run: node scripts/lfea-m047-caesar-straight-pipe-shear-authority-check.mjs

      - name: Apply production straight-span profile only
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/core/fea-benchmarks/caesar-accdb-linear-solve.js')
          t=p.read_text()

          # 1. The generic unloaded-frame compiler accepts an explicitly selected
          #    profile while retaining the existing default for every other caller.
          needle="    profile: frameProfile(),\n    distributedLoads: [],"
          replacement="    profile: input.profile ?? frameProfile(),\n    distributedLoads: [],"
          if t.count(needle)!=1:
              raise SystemExit(f'compileUnloadedFrame profile site count={t.count(needle)}')
          t=t.replace(needle,replacement,1)

          # 2. Only physical straight pipe spans select the CAESAR Timoshenko
          #    profile. Bend arcs/reducers/rigids keep their governed formulations.
          needle="    section: input.section,\n  });\n  const length = frame.geometry.length;"
          replacement="    section: input.section,\n    profile: isCaesarStraightPipeSpan(input.kind) ? caesarStraightPipeFrameProfile() : frameProfile(),\n  });\n  const length = frame.geometry.length;"
          if t.count(needle)!=1:
              raise SystemExit(f'buildFrameElement profile site count={t.count(needle)}')
          t=t.replace(needle,replacement,1)

          # 3. Add the authority-derived profile immediately before the existing
          #    generic frame profile. kappa=0.5 follows A/shear with shear=2.
          marker="function frameProfile() {\n  return sealFrameElementProfile({"
          helper="""function isCaesarStraightPipeSpan(kind) {
            return kind === 'FRAME' || kind === 'BEND_INCOMING_STRAIGHT';
          }

          function caesarStraightPipeFrameProfile() {
            return sealFrameElementProfile({
              schema: 'fea-linear-frame-element-profile/v1',
              profileId: 'LINEAR-FRAME-ELEMENT-R1',
              straightPipeFormulation: 'PIPE_FRAME3D_TIMOSHENKO_V1',
              shearDeformation: true,
              shearCorrectionFactorY: {
                value: 0.5,
                source: 'INTERGRAPH_CAUX_2015_F_EQUALS_KX_STRAIGHT_PIPE_SHEAR_DIVISOR_2',
              },
              shearCorrectionFactorZ: {
                value: 0.5,
                source: 'INTERGRAPH_CAUX_2015_F_EQUALS_KX_STRAIGHT_PIPE_SHEAR_DIVISOR_2',
              },
              releaseRule: 'STATIC_CONDENSATION_V1',
              thermalStrainApproximation: 'UNIFORM_TEMPERATURE_ALPHA_DELTA_T_V1',
              releaseSingularityTolerance: { value: 1e-12, source: PROFILE_SOURCE },
              semanticHash: '',
            });
          }

          function frameProfile() {
            return sealFrameElementProfile({"""
          if t.count(marker)!=1:
              raise SystemExit(f'frameProfile insertion site count={t.count(marker)}')
          t=t.replace(marker,helper,1)

          # Keep retained mechanics limitations truthful after the already-promoted
          # smooth-90 correction and this straight-pipe correction.
          old="        'Bend stiffness uses the qualified B31.3/B31J factor calculator and true tangent-to-tangent arc components; smooth-90/Note-3 correction remains disabled because its file/case authority is unresolved.',"
          new="        'Bend stiffness uses the qualified B31.3/B31J factor calculator and true tangent-to-tangent arc components; the smooth-90 correction follows the resolved BM4_L profile authority.',\n        'Physical straight pipe spans (FRAME and BEND_INCOMING_STRAIGHT) use the CAESAR straight-pipe transverse-shear effective area A/2, mapped to the qualified Timoshenko kernel as kappa=0.5; bend arcs, reducers and rigids remain separately governed.',"
          if t.count(old)!=1:
              raise SystemExit(f'limitation site count={t.count(old)}')
          t=t.replace(old,new,1)

          p.write_text(t)

      - name: Validate scoped production change
        run: |
          node --check src/core/fea-benchmarks/caesar-accdb-linear-solve.js
          node scripts/lfea-m047-caesar-straight-pipe-shear-authority-check.mjs
          node scripts/lfea-b3.1-frame-element-check.mjs
          node scripts/lfea-b3.1-reviewer-check.mjs
          node scripts/lfea-b3.2-piping-component-check.mjs
          node scripts/lfea-b3.3-solver-check.mjs
          node scripts/lfea-b3.4-recovery-check.mjs
          npm run check:core-fea

      - name: Publish production patch and retire promoter
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/m047-bm4l-promote-straight-shear.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/fea-benchmarks/caesar-accdb-linear-solve.js .github/workflows/m047-bm4l-promote-straight-shear.yml
          git diff --cached --check
          git commit -m "apply CAESAR straight-pipe transverse shear"
          git push origin HEAD:agent/m047-bm4l-fresh-qualification

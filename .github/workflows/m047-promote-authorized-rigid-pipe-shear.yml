name: M047 promote authorized rigid pipe shear

on:
  push:
    branches:
      - agent/m047-bm4l-root-cause
    paths:
      - .github/workflows/m047-promote-authorized-rigid-pipe-shear.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m047-bm4l-root-cause
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply one authorized stiffness-scope correction
        shell: python
        run: |
          from pathlib import Path

          solve = Path('src/core/fea-benchmarks/caesar-accdb-linear-solve.js')
          text = solve.read_text()
          old = "return kind === 'FRAME' || kind === 'BEND_INCOMING_STRAIGHT';"
          new = "return kind === 'FRAME' || kind === 'BEND_INCOMING_STRAIGHT' || kind === 'RIGID';"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one rigid selector target, found {text.count(old)}')
          solve.write_text(text.replace(old, new))

          rigid = Path('src/core/linear-fea-rigid-element/rigid-element.js')
          text = rigid.read_text()
          old = """    shearDeformation: false,\n  }).matrix;"""
          new = """    // Hexagon defines rigid stiffness from the matching pipe using 10x wall.\n    // The retained CAESAR pipe formulation uses shear coefficient 2, so the\n    // frame kernel's shear-area convention uses kappa = 1/2.\n    shearDeformation: true,\n    shearCorrectionFactorY: 0.5,\n    shearCorrectionFactorZ: 0.5,\n  }).matrix;"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one rigid local-stiffness target, found {text.count(old)}')
          rigid.write_text(text.replace(old, new))

          check = Path('scripts/lfea-b3.22-rigid-element-authority-check.mjs')
          text = check.read_text()
          anchor = "assert.equal(authority.stiffnessSection.localStiffness.length, 144);\n"
          addition = """assert.equal(authority.stiffnessSection.localStiffness.length, 144);\nconst expectedRigidPhi = (12 * acceptedRequest.material.elasticModulus\n  * authority.stiffnessSection.secondMomentZ)\n  / (acceptedRequest.material.shearModulus * 0.5 * authority.stiffnessSection.area\n    * acceptedRequest.length ** 2);\nconst expectedRigidTransverseK = (12 * acceptedRequest.material.elasticModulus\n  * authority.stiffnessSection.secondMomentZ)\n  / ((1 + expectedRigidPhi) * acceptedRequest.length ** 3);\nclose(authority.stiffnessSection.localStiffness[13], expectedRigidTransverseK,\n  'rigid matching-pipe transverse stiffness with CAESAR shear');\n"""
          if text.count(anchor) != 1:
              raise SystemExit(f'expected exactly one rigid check anchor, found {text.count(anchor)}')
          check.write_text(text.replace(anchor, addition))
      - name: Run rigid/frame/recovery/core gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/lfea-b3.22-rigid-element-authority-check.mjs
          node scripts/lfea-b3.1-frame-element-check.mjs
          node scripts/lfea-b3.4-recovery-check.mjs
          npm run check:core-fea
          git diff --check -- \
            src/core/fea-benchmarks/caesar-accdb-linear-solve.js \
            src/core/linear-fea-rigid-element/rigid-element.js \
            scripts/lfea-b3.22-rigid-element-authority-check.mjs
      - name: Commit production source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/core/fea-benchmarks/caesar-accdb-linear-solve.js \
            src/core/linear-fea-rigid-element/rigid-element.js \
            scripts/lfea-b3.22-rigid-element-authority-check.mjs
          git diff --cached --quiet && { echo 'No production changes staged'; exit 1; }
          git commit -m 'fix(lfea): apply CAESAR pipe shear to rigid stiffness'
          git push origin HEAD:agent/m047-bm4l-root-cause

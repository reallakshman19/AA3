name: Issue 947 reducer ten-cylinder sampling audit

on:
  push:
    branches:
      - codex/issue-947-bm4nl-qualification
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci(issue947): run reducer ten-cylinder sampling audit' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download current rigid-pressure BM4_NL replay
        uses: actions/download-artifact@v4
        with:
          name: issue-947-bm4nl-qualification
          path: .work/current
          github-token: ${{ github.token }}
          repository: reallaksh19/Advanced_Analysis
          run-id: 31314047095

      - name: Run discrete ten-cylinder section-sampling falsification
        run: |
          mkdir -p .work
          node scripts/lfea-issue947-reducer-ten-cylinder-sampling-audit.mjs \
            --package .work/current/bm4nl-canonical-package.json \
            --out .work/issue947-reducer-ten-cylinder-sampling-audit.json

      - name: Upload reducer sampling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-947-reducer-ten-cylinder-sampling-audit
          if-no-files-found: error
          path: .work/issue947-reducer-ten-cylinder-sampling-audit.json

name: M047 Stage 2 L1 committed-source runtime transport

on:
  push:
    branches:
      - agent/m047-stage2-binary-transfer-20260813

permissions:
  contents: read

jobs:
  package-exact-committed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact committed L1 production-candidate source
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Advanced_Analysis
          ref: 2d01d78037b73f4cd3bde909488a7a4a644d74dc
          path: candidate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - name: Install production-only dependencies
        working-directory: candidate
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Package exact committed runtime bytes only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = '2d01d78037b73f4cd3bde909488a7a4a644d74dc'
          test "$(git -C candidate hash-object src/core/fea-benchmarks/caesar-accdb-linear-solve.js)" = '06e1645cfd8a957f5a5ef787c159c0d8d9094508'
          test "$(git -C candidate hash-object src/core/fea-benchmarks/caesar-accdb-friction-solve.js)" = '5b3ba1ce89f6ff7509bf8be82361993a32497ad2'
          mkdir -p transport
          tar --exclude=.git --exclude=node_modules -C candidate -czf transport/source.tgz .
          tar -C candidate -czf transport/prod-node-modules.tgz node_modules
          cat > transport/manifest.txt <<'EOF'
          boundary=BYTE_TRANSPORT_ONLY_NO_ACCDB_SOLVE_NO_ACCURACY
          commit=2d01d78037b73f4cd3bde909488a7a4a644d74dc
          linear_blob=06e1645cfd8a957f5a5ef787c159c0d8d9094508
          friction_blob=5b3ba1ce89f6ff7509bf8be82361993a32497ad2
          node=22
          EOF
          sha256sum transport/source.tgz transport/prod-node-modules.tgz > transport/sha256sums.txt

      - name: Upload exact committed runtime transport
        uses: actions/upload-artifact@v4
        with:
          name: m047-stage2-l1-committed-source-runtime
          path: transport/
          if-no-files-found: error
          retention-days: 1

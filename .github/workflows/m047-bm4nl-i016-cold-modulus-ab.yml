name: m047-bm4nl-i016-cold-modulus-ab

on:
  push:
    branches:
      - agent/m047-qualified-shear-draft
    paths:
      - '.github/workflows/m047-bm4nl-i016-cold-modulus-ab.yml'
      - 'scripts/lfea-m047-apply-b31-cold-modulus-candidate.mjs'
      - 'scripts/lfea-m047-b31-cold-modulus-candidate-check.mjs'
      - 'scripts/lfea-m047-i016-thermal-delta.mjs'
      - 'scripts/lfea-m047-apply-plain-frame-timoshenko-candidate.mjs'
      - 'scripts/lfea-m047-plain-frame-timoshenko-candidate-check.mjs'
      - 'scripts/lfea-m047-benchmark-ab.mjs'
      - 'scripts/lfea-m047-target-node-evidence.mjs'
      - 'scripts/lfea-m047-provision-ace.ps1'
      - 'scripts/lfea-caesar-accdb-export.ps1'
      - 'benchmarks/LFEA/CAESAR_ACCDB/m047/M047-I016.request.json'
      - 'agent/status/status978.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ab:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout I016 orchestration exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact orchestration head and clean checkout
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') { throw 'I016 orchestration checkout drifted.' }
          if (git status --porcelain) { throw 'I016 orchestration checkout is dirty.' }

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout exact clean mechanics baseline
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Advanced_Analysis
          ref: 882d59a99c3a03847d20bec34770ba57ff479d91
          path: baseline-source
          fetch-depth: 1

      - name: Prove frozen mechanics baseline
        shell: pwsh
        run: |
          if ((git -C baseline-source rev-parse HEAD).Trim() -ne '882d59a99c3a03847d20bec34770ba57ff479d91') { throw 'I016 mechanics baseline drifted.' }
          if (git -C baseline-source status --porcelain) { throw 'I016 mechanics baseline checkout is dirty.' }

      - name: Qualify existing frame solver recovery authority
        shell: pwsh
        run: |
          node baseline-source/scripts/lfea-b3.1-frame-element-check.mjs
          node baseline-source/scripts/lfea-b3.1-reviewer-check.mjs
          node baseline-source/scripts/lfea-b3.3-solver-check.mjs
          node baseline-source/scripts/lfea-b3.4-recovery-check.mjs
          node baseline-source/scripts/lfea-b3.8-thermal-expansion-check.mjs

      - name: Checkout pinned Common BM4 source
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 1728651c94504b497aae4041578b1095fd8e292e
          path: common-source
          fetch-depth: 1

      - name: Expand and verify locked BM4_NL ACCDB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'm047-i016-bm4nl'
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          New-Item -ItemType Directory -Path $root | Out-Null
          Expand-Archive -LiteralPath 'common-source/LFEA/BM4/BM4_NL.zip' -DestinationPath $root -Force
          $files = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter '*.accdb')
          if ($files.Count -ne 1) { throw "Expected one ACCDB; found $($files.Count)." }
          $sha = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $locked = '85d39463296e569da811d8572e2eff680b858097f76fdf0f47d1755f0b161c21'
          if ($sha -ne $locked) { throw "Locked ACCDB mismatch: $sha" }
          New-Item -ItemType Directory -Path 'artifacts/m047/I016' -Force | Out-Null
          "BM4NL_ACCDB=$($files[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          [ordered]@{
            schema='lfea-m047-i016-source/v1'
            orchestrationHead='${{ github.sha }}'
            commonCommit='1728651c94504b497aae4041578b1095fd8e292e'
            accdbSha256=$sha
            baselineCommit='882d59a99c3a03847d20bec34770ba57ff479d91'
            parentAcceptedIteration='M047-I015'
          } | ConvertTo-Json | Set-Content 'artifacts/m047/I016/source.json' -Encoding utf8

      - name: Provision Microsoft 365 Access Runtime
        shell: powershell
        run: .\scripts\lfea-m047-provision-ace.ps1 -OutputPath 'artifacts/m047/I016/ace.json'

      - name: Capture ACCDB material authority fields
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\lfea-caesar-accdb-export.ps1 `
            -AccdbPath "$env:BM4NL_ACCDB" `
            -TablesCsv 'INPUT_BASIC_ELEMENT_DATA,INPUT_CONTROL' `
            | Set-Content 'artifacts/m047/I016/input-material.raw.json' -Encoding utf8
          $raw = Get-Content 'artifacts/m047/I016/input-material.raw.json' -Raw | ConvertFrom-Json
          $rows = @($raw.tables.INPUT_BASIC_ELEMENT_DATA.rows)
          $modulus = @($rows | ForEach-Object { [double]$_.MODULUS } | Sort-Object -Unique)
          $hot = @($rows | ForEach-Object { [double]$_.HOT_MOD1 } | Sort-Object -Unique)
          $temperature = @($rows | ForEach-Object { [double]$_.TEMP_EXP_C1 } | Sort-Object -Unique)
          $poisson = @($rows | ForEach-Object { [double]$_.POISSONS } | Sort-Object -Unique)
          [ordered]@{
            schema='lfea-m047-i016-material-fields/v1'
            sourceAccdbSha256=$raw.source.sha256
            elementCount=$rows.Count
            modulusKPa=$modulus
            hotMod1KPa=$hot
            hotToColdRatio=if ($modulus.Count -eq 1 -and $hot.Count -eq 1) { $hot[0] / $modulus[0] } else { $null }
            temperatureC1=$temperature
            poissons=$poisson
            authorityNote='HOT_MOD1 is retained as ACCDB evidence; I016 tests whether B31.3 flexibility must instead use cold MODULUS per Hexagon CAESAR II authority.'
          } | ConvertTo-Json -Depth 6 | Set-Content 'artifacts/m047/I016/material-fields.json' -Encoding utf8

      - name: Bind portable read-only ACCDB exporter
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'scripts/lfea-caesar-accdb-export.ps1' -Destination 'baseline-source/scripts/lfea-caesar-accdb-export.ps1' -Force
          $status = @(git -C baseline-source status --porcelain)
          if ($status.Count -ne 1 -or $status[0] -notmatch 'scripts/lfea-caesar-accdb-export\.ps1$') {
            throw "Baseline portability mutation exceeded exporter boundary: $($status -join '; ')"
          }

      - name: Apply accepted I015 parent mechanics
        shell: pwsh
        run: |
          node scripts/lfea-m047-apply-plain-frame-timoshenko-candidate.mjs `
            --source baseline-source/src/core/fea-benchmarks/caesar-accdb-linear-solve.js `
            --manifest artifacts/m047/I016/i015-parent.manifest.json
          node scripts/lfea-m047-plain-frame-timoshenko-candidate-check.mjs `
            --source baseline-source/src/core/fea-benchmarks/caesar-accdb-linear-solve.js
          node --check baseline-source/src/core/fea-benchmarks/caesar-accdb-linear-solve.js

      - name: Run accepted I015 parent baseline
        shell: pwsh
        run: |
          node baseline-source/scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb "$env:BM4NL_ACCDB" `
            --profile baseline-source/benchmarks/LFEA/CAESAR_ACCDB/bm4nl-l19-l20-linear-solve.profile.json `
            --solve-linear true `
            --actual-out artifacts/m047/I016/before.actual.json `
            --summary-out artifacts/m047/I016/before.summary.md `
            --out artifacts/m047/I016/before.benchmark.json
          node scripts/lfea-m047-target-node-evidence.mjs `
            --benchmark artifacts/m047/I016/before.benchmark.json `
            --actual artifacts/m047/I016/before.actual.json `
            --out artifacts/m047/I016/before.targets.json

      - name: Prove accepted I015 parent result custody
        shell: pwsh
        run: |
          $before = Get-Content 'artifacts/m047/I016/before.benchmark.json' -Raw | ConvertFrom-Json
          $l19 = @($before.qualification.cases | Where-Object { $_.caseId -eq 'L19' })[0]
          $l20 = @($before.qualification.cases | Where-Object { $_.caseId -eq 'L20' })[0]
          $l19Restraints = @($l19.comparison.rows | Where-Object { $_.entityKind -eq 'NODE' -and @('FORCE','MOMENT') -contains $_.quantity -and $_.status -eq 'FAIL' }).Count
          $l19Disp = @($l19.comparison.rows | Where-Object { $_.entityKind -eq 'NODE' -and @('DISPLACEMENT','ROTATION') -contains $_.quantity -and $_.status -eq 'FAIL' }).Count
          $l19Actions = @($l19.comparison.rows | Where-Object { $_.entityKind -eq 'ELEMENT' -and $_.quantity -like 'GLOBAL_END_*' -and $_.status -eq 'FAIL' }).Count
          $l20Restraints = @($l20.comparison.rows | Where-Object { $_.entityKind -eq 'NODE' -and @('FORCE','MOMENT') -contains $_.quantity -and $_.status -eq 'FAIL' }).Count
          if ($l19Restraints -ne 0 -or $l19Disp -ne 66 -or $l19Actions -ne 23 -or $l20Restraints -ne 6) {
            throw "Accepted I015 parent drifted: L19 restraint=$l19Restraints disp=$l19Disp actions=$l19Actions; L20 restraint=$l20Restraints"
          }

      - name: Apply only I016 B31.3 cold-flexibility-modulus delta
        shell: pwsh
        run: |
          node scripts/lfea-m047-apply-b31-cold-modulus-candidate.mjs `
            --source baseline-source/src/core/fea-benchmarks/caesar-accdb-linear-solve.js `
            --manifest artifacts/m047/I016/i016.manifest.json
          node scripts/lfea-m047-b31-cold-modulus-candidate-check.mjs `
            --source baseline-source/src/core/fea-benchmarks/caesar-accdb-linear-solve.js
          node --check baseline-source/src/core/fea-benchmarks/caesar-accdb-linear-solve.js
          $status = @(git -C baseline-source status --porcelain)
          $hasExporter = @($status | Where-Object { $_ -match 'scripts/lfea-caesar-accdb-export\.ps1$' }).Count -eq 1
          $hasSolver = @($status | Where-Object { $_ -match 'src/core/fea-benchmarks/caesar-accdb-linear-solve\.js$' }).Count -eq 1
          if ($status.Count -ne 2 -or -not $hasExporter -or -not $hasSolver) {
            throw "I016 mutation exceeded exporter + ACCDB solver boundary: $($status -join '; ')"
          }

      - name: Run I016 system candidate
        shell: pwsh
        run: |
          node baseline-source/scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb "$env:BM4NL_ACCDB" `
            --profile baseline-source/benchmarks/LFEA/CAESAR_ACCDB/bm4nl-l19-l20-linear-solve.profile.json `
            --solve-linear true `
            --actual-out artifacts/m047/I016/after.actual.json `
            --summary-out artifacts/m047/I016/after.summary.md `
            --out artifacts/m047/I016/after.benchmark.json
          node scripts/lfea-m047-target-node-evidence.mjs `
            --benchmark artifacts/m047/I016/after.benchmark.json `
            --actual artifacts/m047/I016/after.actual.json `
            --out artifacts/m047/I016/after.targets.json

      - name: Governed I016 A/B and thermal delta custody
        shell: pwsh
        run: |
          node scripts/lfea-m047-benchmark-ab.mjs `
            --baseline artifacts/m047/I016/before.benchmark.json `
            --candidate artifacts/m047/I016/after.benchmark.json `
            --manifest artifacts/m047/I016/i016.manifest.json `
            --out artifacts/m047/I016/i016.ab.json
          node scripts/lfea-m047-i016-thermal-delta.mjs `
            --before artifacts/m047/I016/before.benchmark.json `
            --after artifacts/m047/I016/after.benchmark.json `
            --manifest artifacts/m047/I016/i016.manifest.json `
            --out artifacts/m047/I016/i016.thermal-delta.json
          $ab = Get-Content 'artifacts/m047/I016/i016.ab.json' -Raw | ConvertFrom-Json
          if ([int]$ab.cases.L19.actualRowChange.changedActualRowCount -ne 0) {
            throw "I016 changed L19 physical rows: $($ab.cases.L19.actualRowChange.changedActualRowCount)."
          }
          $beforeActual = Get-Content 'artifacts/m047/I016/before.actual.json' -Raw | ConvertFrom-Json
          $afterActual = Get-Content 'artifacts/m047/I016/after.actual.json' -Raw | ConvertFrom-Json
          foreach ($caseId in @('L19','L20')) {
            if ($beforeActual.mechanics.cases.$caseId.bendPointerCount -ne 12) { throw "Before $caseId bend coverage drifted." }
            if ($afterActual.mechanics.cases.$caseId.bendPointerCount -ne 12) { throw "After $caseId bend coverage drifted." }
          }
          $targets = Get-Content 'artifacts/m047/I016/after.targets.json' -Raw | ConvertFrom-Json
          foreach ($target in $targets.targets) {
            if ([math]::Abs([double]$target.balance.actionSumResidual) -gt 0.1) { throw "I016 action-sum custody exceeded 0.1 at $($target.caseId)/$($target.nodeId)." }
            if ([math]::Abs([double]$target.balance.equilibriumResidual) -gt 0.1) { throw "I016 equilibrium custody exceeded 0.1 at $($target.caseId)/$($target.nodeId)." }
          }
          $thermal = Get-Content 'artifacts/m047/I016/i016.thermal-delta.json' -Raw | ConvertFrom-Json
          Add-Content $env:GITHUB_STEP_SUMMARY '# M047 I016 B31.3 cold flexibility modulus A/B'
          Add-Content $env:GITHUB_STEP_SUMMARY "- A/B evidence: ``$($ab.semanticHash)``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- thermal-delta evidence: ``$($thermal.semanticHash)``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- L19 changed physical rows: $($ab.cases.L19.actualRowChange.changedActualRowCount)"
          foreach ($caseId in @('L19','L20')) {
            $c = $ab.cases.$caseId
            Add-Content $env:GITHUB_STEP_SUMMARY "- $($caseId) restraints: $($c.before.restraint.failingComponentCount) -> $($c.after.restraint.failingComponentCount); RMSnorm $($c.before.restraint.rmsNormalizedError) -> $($c.after.restraint.rmsNormalizedError)"
            Add-Content $env:GITHUB_STEP_SUMMARY "- $($caseId) displacement/rotation: $($c.before.displacementRotation.failingComponentCount) -> $($c.after.displacementRotation.failingComponentCount); RMSnorm $($c.before.displacementRotation.rmsNormalizedError) -> $($c.after.displacementRotation.rmsNormalizedError)"
            Add-Content $env:GITHUB_STEP_SUMMARY "- $($caseId) source actions: $($c.before.sourceEndAction.failingComponentCount) -> $($c.after.sourceEndAction.failingComponentCount); RMSnorm $($c.before.sourceEndAction.rmsNormalizedError) -> $($c.after.sourceEndAction.rmsNormalizedError)"
          }
          foreach ($family in @('restraint','displacementRotation','sourceEndAction')) {
            Add-Content $env:GITHUB_STEP_SUMMARY "- r_T $($family): RMSnorm $($thermal.before.$family.rmsNormalizedResidual) -> $($thermal.after.$family.rmsNormalizedResidual); improved=$($thermal.comparison.$family.improvedRowCount), regressed=$($thermal.comparison.$family.regressedRowCount)"
          }

      - name: Retain I016 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m047-i016-cold-modulus-${{ github.sha }}
          path: artifacts/m047/I016/**
          if-no-files-found: error
          retention-days: 90

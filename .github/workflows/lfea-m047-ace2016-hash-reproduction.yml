name: M047 ACE 2016 BM4_L hash reproduction

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ace2016-hash-reproduction:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/m047-bm4l-root-cause-991'
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout Advanced_Analysis
        uses: actions/checkout@v4

      - name: Checkout pinned Common custody source
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 45d51ea18624f5775805f399110c1738301c0d90
          path: _common
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install signed Microsoft Access Database Engine 2016 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $installer = Join-Path $env:RUNNER_TEMP 'accessdatabaseengine_X64.exe'
          $uri = 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe'
          Invoke-WebRequest -Uri $uri -OutFile $installer
          $installerHash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid') { throw "Microsoft ACE installer signature is not valid: $($signature.Status)" }
          if ([string]$signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw "Microsoft ACE installer signer is unexpected: $($signature.SignerCertificate.Subject)"
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "Microsoft ACE installer failed with exit $($process.ExitCode)" }

          $providerKey = 'Registry::HKEY_CLASSES_ROOT\Microsoft.ACE.OLEDB.12.0\CLSID'
          if (-not (Test-Path $providerKey)) { throw 'Microsoft.ACE.OLEDB.12.0 was not registered after installation.' }
          $clsid = (Get-ItemProperty -Path $providerKey).'(default)'
          $serverKey = "Registry::HKEY_CLASSES_ROOT\CLSID\$clsid\InprocServer32"
          $providerDll = (Get-ItemProperty -Path $serverKey).'(default)'
          $dllInfo = Get-Item $providerDll
          $dllHash = (Get-FileHash -Algorithm SHA256 $providerDll).Hash.ToLowerInvariant()

          $provider = [ordered]@{
            schema = 'lfea-m047-ace-provider/v1'
            installerUrl = $uri
            installerSha256 = $installerHash
            installerSignatureStatus = [string]$signature.Status
            installerSigner = [string]$signature.SignerCertificate.Subject
            providerProgId = 'Microsoft.ACE.OLEDB.12.0'
            providerClsid = $clsid
            providerDll = $providerDll
            providerDllFileVersion = $dllInfo.VersionInfo.FileVersion
            providerDllProductVersion = $dllInfo.VersionInfo.ProductVersion
            providerDllSha256 = $dllHash
            runnerOs = [Environment]::OSVersion.VersionString
            process64Bit = [Environment]::Is64BitProcess
          }
          $provider | ConvertTo-Json -Depth 5 | Out-File artifacts/bm4l-ace-provider.json -Encoding utf8

      - name: Extract pinned BM4_L member and record pre-ACE hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD '_common/LFEA/BM4/BM4_L.zip'
          $zipHash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($zipHash -ne '978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9') {
            throw "Pinned BM4_L ZIP mismatch: $zipHash"
          }
          $extract = Join-Path $env:RUNNER_TEMP 'bm4l-ace2016'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $accdb = Join-Path $extract 'BM4_L.ACCDB'
          $preHash = (Get-FileHash -Algorithm SHA256 $accdb).Hash.ToLowerInvariant()
          if ($preHash -ne '64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8') {
            throw "Pinned BM4_L pre-ACE member mismatch: $preHash"
          }
          "BM4L_ACCDB=$accdb" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BM4L_PRE_ACE_SHA256=$preHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prove ACE connection opens the real pinned ACCDB
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $connection = New-Object -ComObject ADODB.Connection
          try {
            $connection.Open("Provider=Microsoft.ACE.OLEDB.12.0;Data Source=$env:BM4L_ACCDB;Mode=Read;Persist Security Info=False;")
            if ($connection.State -eq 0) { throw 'ACE connection did not open.' }
          } finally {
            if ($connection.State -ne 0) { $connection.Close() }
            [void][System.Runtime.InteropServices.Marshal]::ReleaseComObject($connection)
          }
          $postOpenCloseHash = (Get-FileHash -Algorithm SHA256 $env:BM4L_ACCDB).Hash.ToLowerInvariant()
          "BM4L_POST_OPEN_CLOSE_SHA256=$postOpenCloseHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run unchanged six-case exporter and benchmark
        id: benchmark
        shell: pwsh
        continue-on-error: true
        run: |
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb "$env:BM4L_ACCDB" `
            --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json `
            --solve-linear true `
            --solve-cases L2,L3,L4,L5,L6,L14 `
            --actual-out artifacts/bm4l-actual.json `
            --out artifacts/bm4l-report.json `
            --summary-out artifacts/bm4l-summary.md

      - name: Record exporter and post-close hash phases
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $postHash = (Get-FileHash -Algorithm SHA256 $env:BM4L_ACCDB).Hash.ToLowerInvariant()
          $runtimeHash = $null
          if (Test-Path artifacts/bm4l-report.json) {
            $report = Get-Content artifacts/bm4l-report.json -Raw | ConvertFrom-Json
            $runtimeHash = [string]$report.source.sha256
          }
          $probe = [ordered]@{
            schema = 'lfea-m047-bm4l-ace-hash-probe/v2'
            preAceExtractedSha256 = $env:BM4L_PRE_ACE_SHA256
            postSimpleOpenCloseSha256 = $env:BM4L_POST_OPEN_CLOSE_SHA256
            exporterRuntimeSha256 = $runtimeHash
            postExporterCloseSha256 = $postHash
            historicalDeclaredSha256 = 'e21b0862851ea2bb6f20d55e4a3a94f501537b618b98dd46afa9f6777ee38d3c'
            simpleOpenMutatedBytes = ($env:BM4L_POST_OPEN_CLOSE_SHA256 -ne $env:BM4L_PRE_ACE_SHA256)
            exporterMatchesHistorical = ($runtimeHash -eq 'e21b0862851ea2bb6f20d55e4a3a94f501537b618b98dd46afa9f6777ee38d3c')
          }
          $probe | ConvertTo-Json -Depth 5 | Out-File artifacts/bm4l-ace-hash-probe.json -Encoding utf8
          $probe | ConvertTo-Json -Depth 5

      - name: Build root-cause evidence if benchmark artifacts exist
        if: always() && hashFiles('artifacts/bm4l-actual.json') != '' && hashFiles('artifacts/bm4l-report.json') != ''
        shell: pwsh
        run: |
          node scripts/lfea-m047-bm4l-root-cause.mjs `
            --actual artifacts/bm4l-actual.json `
            --report artifacts/bm4l-report.json `
            --out artifacts/bm4l-root-cause.json `
            --summary-out artifacts/bm4l-root-cause.md

      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bm4l-ace2016-hash-reproduction-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

name: LAFEA B01 case diagnostic temporary

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/lafea-b01-case-diagnostic-temp.yml'
      - 'src/core/local-continuum/jacobi-equilibrated-cg.js'
      - 'scripts/lib/lafea-plane-strain-bbar-lame-fixture.mjs'

permissions:
  contents: read

jobs:
  case-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Add case identity to assertion in runner workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/lib/lafea-plane-strain-bbar-lame-fixture.mjs')
          s = p.read_text()
          old = "assert.equal(result.qualification.state, 'ACCEPTED', JSON.stringify(result.diagnostics));"
          new = "assert.equal(result.qualification.state, 'ACCEPTED', `${elementType}/${poissonRatio}/${level.levelId}/${distortion.distortionId}: ${JSON.stringify(result.diagnostics)}`);"
          if s.count(old) != 1:
              raise RuntimeError('expected one Lamé acceptance assertion')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check scripts/lib/lafea-plane-strain-bbar-lame-fixture.mjs
      - name: Identify first full Lamé matrix failure
        run: node scripts/lafea-plane-strain-bbar-lame-check.mjs

name: Issue 947 E36 B31J smooth-90 Note 3 audit

on:
  push:
    branches:
      - codex/issue-947-bm4nl-qualification
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci(issue947): run E36 smooth90 note3 audit' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download pinned canonical BM4_NL package
        uses: actions/download-artifact@v4
        with:
          name: issue-947-bm4nl-qualification
          path: .work/package
          github-token: ${{ github.token }}
          repository: reallaksh19/Advanced_Analysis
          run-id: 31314047095

      - name: Expose read-only production mechanics inspection seam
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          path = Path('src/core/fea-benchmarks/caesar-accdb-linear-solve.js')
          text = path.read_text()
          before = hashlib.sha256(text.encode()).hexdigest()
          return_old = "  return {\n    execution,\n    rows: resultRows({ benchmarkPackage, execution, recovered, analysis }),"
          return_new = "  return {\n    analysis,\n    execution,\n    rows: resultRows({ benchmarkPackage, execution, recovered, analysis }),"
          count = text.count(return_old)
          if count != 1:
              raise SystemExit(f'Expected exactly one solveCase return patch site; found {count}.')
          text = text.replace(return_old, return_new)
          anchor = "\nfunction solveCase(benchmarkPackage, caseRecord, solveProfile) {"
          count = text.count(anchor)
          if count != 1:
              raise SystemExit(f'Expected exactly one solveCase anchor; found {count}.')
          helper_lines = [
              '', '',
              '/** Diagnostic-only read access to the exact production case construction. */',
              'export function inspectCaesarAccdbLinearCaseMechanics(benchmarkPackage, caseId) {',
              '  requireBenchmarkPackage(benchmarkPackage);',
              '  const solveProfile = benchmarkPackage.profile.linearSolve;',
              "  if (solveProfile === null) throw new TypeError('The ACCDB profile does not declare linearSolve authorities.');",
              '  const caseRecord = benchmarkPackage.cases.find((entry) => entry.caseId === caseId);',
              "  if (!caseRecord) throw new TypeError(`ACCDB benchmark package lacks case ${String(caseId)}.`);",
              '  const solved = solveCase(benchmarkPackage, caseRecord, solveProfile);',
              '  return deepFreeze({',
              "    schema: 'lfea-accdb-linear-case-mechanics-inspection/v1',",
              '    sourceAccdbSha256: benchmarkPackage.source.sha256,',
              '    caseId: caseRecord.caseId,',
              '    formula: caseRecord.formula,',
              '    executionStatus: solved.execution.status,',
              '    rows: solved.rows.map((row) => ({ ...row })),',
              '    elements: solved.analysis.elements.map((entry) => ({',
              '      elementId: entry.elementId,',
              '      sourceElementId: entry.sourceElementId,',
              '      nodeI: entry.nodeI,',
              '      nodeJ: entry.nodeJ,',
              '      kind: entry.kind,',
              '      teeJunctionNodeId: entry.teeJunctionNodeId,',
              '      globalStiffness: [...entry.contribution.globalStiffness],',
              '      equivalentLoadGlobal: [...entry.contribution.equivalentLoadGlobal],',
              '      initialStrainLoadGlobal: [...entry.contribution.initialStrainLoadGlobal],',
              '      pressureAxialStrain: entry.pressureAxialStrain,',
              '      bourdonRotationRadians: entry.bourdonRotationRadians,',
              '      bourdonFreeEndTranslationM: [...entry.bourdonFreeEndTranslationM],',
              '      gravityWeightN: entry.gravityWeightN,',
              '    })),',
              '  });',
              '}',
          ]
          text = text.replace(anchor, '\n'.join(helper_lines) + anchor)
          path.write_text(text)
          after = hashlib.sha256(text.encode()).hexdigest()
          Path('.work').mkdir(exist_ok=True)
          Path('.work/issue947-e36-note3-production-inspection-patch.json').write_text(json.dumps({
              'schema': 'lfea-issue947-diagnostic-patch/v1',
              'scope': 'DIAGNOSTIC_ONLY_READ_ONLY_PRODUCTION_MECHANICS_INSPECTION',
              'productionSourceChanged': False,
              'beforeSha256': before,
              'afterSha256': after,
          }, indent=2) + '\n')
          PY

      - name: Align E36 diagnostic source-action custody
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/lfea-issue947-e36-production-descendant-condensation-audit.mjs')
          text = path.read_text()
          old = """function sourceAction(rows, row) {\n  const entityId = sourceResultElementId(row);\n  const index = new Map(rows\n    .filter((entry) => entry.entityKind === 'ELEMENT' && entry.entityId === entityId)\n    .map((entry) => [`${entry.quantity}:${entry.component}`, Number(entry.value)]));"""
          new = """function sourceAction(rows, row) {\n  const requestedEntityId = sourceResultElementId(row);\n  const prefix = `INPUT_ELEMENT:${String(row.ELEMENTID)}|`;\n  const candidateIds = [...new Set(rows\n    .filter((entry) => entry.entityKind === 'ELEMENT' && String(entry.entityId).startsWith(prefix))\n    .map((entry) => String(entry.entityId)))];\n  const entityId = candidateIds.includes(requestedEntityId)\n    ? requestedEntityId\n    : candidateIds.length === 1 ? candidateIds[0] : null;\n  if (entityId === null) throw new TypeError(`Expected one emitted source entity for E${row.ELEMENTID}; found ${JSON.stringify(candidateIds)}.`);\n  const index = new Map(rows\n    .filter((entry) => entry.entityKind === 'ELEMENT' && entry.entityId === entityId)\n    .map((entry) => [`${entry.quantity}:${entry.component}`, Number(entry.value)]));"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one sourceAction identity patch site; found {text.count(old)}.')
          text = text.replace(old, new)

          old = "const caesarSourceAction = sourceAction(referenceRows, sourceRow);"
          new = "const caesarReference = deriveCaesarE36SourceAction(referenceRows, pkg);\nconst caesarSourceAction = caesarReference.action;"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one direct E36 reference lookup; found {text.count(old)}.')
          text = text.replace(old, new)
          output_old = "  referenceUsage: 'DIAGNOSTIC_ONLY_NO_PARAMETER_FIT_NO_REFERENCE_MUTATION',"
          output_new = "  referenceUsage: 'DIAGNOSTIC_ONLY_NO_PARAMETER_FIT_NO_REFERENCE_MUTATION',\n  referenceDerivation: caesarReference,"
          if text.count(output_old) != 1:
              raise SystemExit(f'Expected one referenceUsage anchor; found {text.count(output_old)}.')
          text = text.replace(output_old, output_new)
          helper_anchor = "function actionScaleVector(reference, tolerances) {"
          helper = """function deriveCaesarE36SourceAction(rows, pkg) {\n  const e17 = sourceAction(rows, requireSourceRow(pkg, '17'));\n  const e18 = sourceAction(rows, requireSourceRow(pkg, '18'));\n  const e37 = sourceAction(rows, requireSourceRow(pkg, '37'));\n  const e17To = e17.slice(6, 12);\n  const e18From = e18.slice(0, 6);\n  const e37From = e37.slice(0, 6);\n  const from = e17To.map((value, index) => -(value + e18From[index]));\n  const to = e37From.map((value) => -value);\n  return {\n    rule: 'E36_FROM_EQUALS_NEGATIVE_E17_TO_PLUS_E18_FROM_AT_NODE_20295_AND_E36_TO_EQUALS_NEGATIVE_E37_FROM_AT_NODE_21430',\n    source: 'PINNED_L19_JUNCTION_EQUILIBRIUM_NO_DIRECT_E36_REFERENCE_ROW',\n    action: [...from, ...to],\n  };\n}\n\n"""
          if text.count(helper_anchor) != 1:
              raise SystemExit(f'Expected one actionScaleVector anchor; found {text.count(helper_anchor)}.')
          text = text.replace(helper_anchor, helper + helper_anchor)

          old = "const stiffnessAction = multiplyVector(condensed.stiffness, caesarDisplacement);"
          new = "const stiffnessAction = multiplyFlat12(condensed.stiffness, caesarDisplacement);"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one flattened stiffness call; found {text.count(old)}.')
          path.write_text(text.replace(old, new))
          PY

      - name: Run baseline E36 condensation
        run: |
          mkdir -p .work/out
          node scripts/lfea-issue947-e36-production-descendant-condensation-audit.mjs \
            --package .work/package/bm4nl-canonical-package.json \
            --out .work/out/issue947-e36-note3-baseline.json

      - name: Run governed B31J Note 3 smooth-90 candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          module_path = Path('src/core/fea-benchmarks/caesar-accdb-linear-solve.js')
          baseline_text = module_path.read_text()
          audit_script = 'scripts/lfea-issue947-e36-production-descendant-condensation-audit.mjs'
          package = '.work/package/bm4nl-canonical-package.json'
          out_dir = Path('.work/out')
          baseline = json.loads((out_dir / 'issue947-e36-note3-baseline.json').read_text())

          old = "        smooth90FlexibilityCorrection: input.solveProfile.b31jSmooth90FlexibilityCorrection.enabled,"
          new = "        smooth90FlexibilityCorrection: input.solveProfile.b31jSmooth90FlexibilityCorrection.enabled || pointer === 7,"
          count = baseline_text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one smooth-90 factor-selection patch site; found {count}.')
          candidate_text = baseline_text.replace(old, new)
          module_path.write_text(candidate_text)
          candidate_path = out_dir / 'issue947-e36-note3-candidate.json'
          try:
              completed = subprocess.run(
                  ['node', audit_script, '--package', package, '--out', str(candidate_path)],
                  text=True, capture_output=True,
              )
              if completed.returncode != 0:
                  raise SystemExit(f'Note-3 candidate audit failed:\nSTDOUT:\n{completed.stdout}\nSTDERR:\n{completed.stderr}')
          finally:
              module_path.write_text(baseline_text)

          candidate = json.loads(candidate_path.read_text())
          def metrics(result):
              inj = result['caesarInjection']
              return {
                  'classification': result['classification'],
                  'productionParityMaxAbs': result['productionParity']['maxAbsResidual'],
                  'maxAbsNormalizedResidual': inj['maxAbsNormalizedResidual'],
                  'normalizedResidualL2': inj['normalizedResidualL2'],
                  'normalizedResidual': inj['normalizedResidual'],
                  'residual': inj['residual'],
              }
          b = metrics(baseline)
          c = metrics(candidate)
          summary = {
              'schema': 'lfea-issue947-e36-b31j-note3-smooth90-audit/v1',
              'issue': 947,
              'caseId': 'L19',
              'sourceElementId': '36',
              'purpose': 'CONTROLLED_GOVERNED_B31J_NOTE3_CANDIDATE_NO_PRODUCTION_UPDATE',
              'authority': {
                  'ruleId': 'B31J_TABLE_1_1_NOTE_3_SMOOTH_90',
                  'generalBendFlexibilityCoefficient': 1.65,
                  'smooth90FlexibilityCoefficient': 1.3,
                  'existingRepositoryEquationOwner': 'src/core/linear-fea-b31-factor-calculator/equations.js',
                  'sourceSettingStatus': 'NON_EXPORTED_CAESAR_JOB_SETTING_NOT_YET_CUSTODIED',
              },
              'controlledChange': 'E36/BEND_PTR=7 selects existing smooth90FlexibilityCorrection=true path; all tee, pressure, MEC21, geometry, solver and comparison gates unchanged.',
              'baseline': b,
              'candidate': c,
              'deltaNormalizedResidualL2': c['normalizedResidualL2'] - b['normalizedResidualL2'],
              'deltaMaxAbsNormalizedResidual': c['maxAbsNormalizedResidual'] - b['maxAbsNormalizedResidual'],
              'classification': 'NOTE3_IMPROVES_E36_LOCAL_VECTOR_REQUIRES_SOURCE_SETTING_CUSTODY' if c['normalizedResidualL2'] < b['normalizedResidualL2'] else 'NOTE3_FALSIFIED_FOR_E36_LOCAL_VECTOR',
              'falsificationRule': 'The Note-3 candidate is falsified for E36 if it fails production parity or does not reduce the full normalized CAESAR-injection residual vector relative to the unchanged baseline. Even improvement cannot authorize production use until CAESAR job-setting/source custody establishes Note-3 applicability.',
          }
          if c['productionParityMaxAbs'] > 1e-3:
              summary['classification'] = 'NOTE3_DIAGNOSTIC_INVALID_PRODUCTION_PARITY_FAILED'
          (out_dir / 'issue947-e36-note3-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload E36 Note 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-947-e36-smooth90-note3-audit
          if-no-files-found: error
          path: |
            .work/out/issue947-e36-note3-*.json
            .work/issue947-e36-note3-production-inspection-patch.json

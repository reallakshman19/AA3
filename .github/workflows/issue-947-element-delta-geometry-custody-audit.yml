name: Issue 947 element DELTA geometry custody audit

on:
  push:
    branches:
      - codex/issue-947-bm4nl-qualification
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci(issue947): run element DELTA geometry custody audit' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download pinned canonical BM4_NL package
        uses: actions/download-artifact@v4
        with:
          name: issue-947-bm4nl-qualification
          path: .work/package
          github-token: ${{ github.token }}
          repository: reallaksh19/Advanced_Analysis
          run-id: 31302834835

      - name: Run element DELTA geometry custody audit
        run: |
          mkdir -p .work
          node scripts/lfea-issue947-element-delta-geometry-custody-audit.mjs \
            --package .work/package/bm4nl-canonical-package.json \
            --out .work/issue947-element-delta-geometry-custody-audit.json

      - name: Upload DELTA geometry custody evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-947-element-delta-geometry-custody-audit
          if-no-files-found: error
          path: .work/issue947-element-delta-geometry-custody-audit.json

name: M047 BM4_L rigid input audit

on:
  push:
    branches: [agent/m047-bm4l-fresh-qualification]
    paths: ['.github/workflows/m047-bm4l-rigid-input-audit.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      COMMON_COMMIT: '45d51ea18624f5775805f399110c1738301c0d90'
      ZIP_SHA256: '978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9'
      MEMBER_SHA256: '64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8'
      ACE_URL: 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe'
      ACE_SHA256: '04e96c9f1a1f7d251a88aececf1dc10ff65950392787427c00814a43308003de'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m047-bm4l-fresh-qualification
      - name: Bind source and install ACE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $PSNativeCommandUseErrorActionPreference=$true
          New-Item -ItemType Directory -Force artifacts/rigid-input/source | Out-Null
          $installer='artifacts/rigid-input/accessdatabaseengine_X64.exe'
          Invoke-WebRequest -Uri $env:ACE_URL -OutFile $installer
          if((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ACE_SHA256){throw 'ACE hash mismatch'}
          $sig=Get-AuthenticodeSignature $installer
          if($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft'){throw 'ACE signature failure'}
          $p=Start-Process $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if($p.ExitCode -notin @(0,3010)){throw "ACE install failed $($p.ExitCode)"}
          Remove-Item $installer -Force
          $zip='artifacts/rigid-input/BM4_L.zip'
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/reallaksh19/Common/$env:COMMON_COMMIT/LFEA/BM4/BM4_L.zip" -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ZIP_SHA256){throw 'ZIP hash mismatch'}
          Expand-Archive $zip -DestinationPath artifacts/rigid-input/source -Force
          $accdb=Join-Path $PWD 'artifacts/rigid-input/source/BM4_L.ACCDB'
          if((Get-FileHash $accdb -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:MEMBER_SHA256){throw 'ACCDB hash mismatch'}
          "ACCDB=$accdb" >> $env:GITHUB_ENV

      - name: Export rigid-related raw rows and schemas
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $conn=New-Object System.Data.OleDb.OleDbConnection("Provider=Microsoft.ACE.OLEDB.12.0;Data Source=$env:ACCDB;Persist Security Info=False;")
          $conn.Open()
          try {
            function Read-Table([string]$name,[string]$where='') {
              $cmd=$conn.CreateCommand(); $cmd.CommandText="SELECT * FROM [$name] $where"
              $ad=New-Object System.Data.OleDb.OleDbDataAdapter($cmd); $dt=New-Object System.Data.DataTable
              [void]$ad.Fill($dt)
              $rows=@()
              foreach($r in $dt.Rows){$o=[ordered]@{};foreach($c in $dt.Columns){$v=$r[$c.ColumnName];$o[$c.ColumnName]=if($v -is [DBNull]){$null}else{$v}};$rows+=[pscustomobject]$o}
              return $rows
            }
            $elements=Read-Table 'INPUT_BASIC_ELEMENT_DATA' 'WHERE ELEMENTID IN (75,76,77,78,79,80,81)'
            $ptrs=@($elements | Where-Object {$_.RIGID_PTR -gt 0} | ForEach-Object {[int]$_.RIGID_PTR} | Sort-Object -Unique)
            $where=if($ptrs.Count){'WHERE RIGID_PTR IN ('+($ptrs -join ',')+')'}else{'WHERE 1=0'}
            $rigids=Read-Table 'INPUT_RIGIDS' $where
            $units=Read-Table 'INPUT_UNITS'
            $schema=$conn.GetSchema('Columns') | Where-Object {$_.TABLE_NAME -in @('INPUT_BASIC_ELEMENT_DATA','INPUT_RIGIDS')} | Select-Object TABLE_NAME,COLUMN_NAME,DATA_TYPE,ORDINAL_POSITION
            $out=[ordered]@{schema='m047-bm4l-rigid-input-audit/v1';sourceAccdbSha256=$env:MEMBER_SHA256;elementRows=$elements;rigidRows=$rigids;units=$units;columnSchema=$schema}
            $out | ConvertTo-Json -Depth 12 | Set-Content -Encoding UTF8 artifacts/rigid-input/audit.json
            $out | ConvertTo-Json -Depth 12
          } finally {$conn.Close()}

      - uses: actions/upload-artifact@v4
        with:
          name: m047-bm4l-rigid-input-audit-${{ github.sha }}
          path: artifacts/rigid-input/audit.json
          retention-days: 30
          if-no-files-found: error

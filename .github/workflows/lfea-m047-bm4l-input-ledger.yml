name: M047 BM4_L input ledger

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bm4l-input-ledger:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/m047-bm4l-root-cause-991'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout Advanced_Analysis
        uses: actions/checkout@v4

      - name: Checkout pinned Common source
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 45d51ea18624f5775805f399110c1738301c0d90
          path: _common
          fetch-depth: 1

      - name: Install signed Microsoft ACE 2016 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'accessdatabaseengine_X64.exe'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid' -or [string]$signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw 'Microsoft ACE installer signature check failed.'
          }
          $p = Start-Process -FilePath $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if ($p.ExitCode -notin @(0,3010)) { throw "ACE install failed with exit $($p.ExitCode)" }

      - name: Extract and verify pinned ACCDB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $zip = Join-Path $PWD '_common/LFEA/BM4/BM4_L.zip'
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant() -ne '978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9') { throw 'ZIP custody mismatch.' }
          $extract = Join-Path $env:RUNNER_TEMP 'bm4l-input-ledger'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $accdb = Join-Path $extract 'BM4_L.ACCDB'
          if ((Get-FileHash -Algorithm SHA256 $accdb).Hash.ToLowerInvariant() -ne '64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8') { throw 'ACCDB custody mismatch.' }
          "BM4L_ACCDB=$accdb" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Export governed geometry and component tables
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $json = & scripts/lfea-caesar-accdb-export.ps1 `
            -AccdbPath $env:BM4L_ACCDB `
            -TablesCsv 'INPUT_BASIC_ELEMENT_DATA,INPUT_BENDS,INPUT_NODAL_COORDINATES,INPUT_OFFSETS,INPUT_REDUCERS,INPUT_RESTRAINTS,INPUT_RIGIDS,INPUT_SIFTEES,INPUT_UNITS'
          if ($LASTEXITCODE -ne 0) { throw "ACCDB export failed with exit $LASTEXITCODE" }
          $json | Out-File artifacts/bm4l-input-ledger.json -Encoding utf8

      - name: Upload input ledger
        uses: actions/upload-artifact@v4
        with:
          name: bm4l-input-ledger-${{ github.sha }}
          path: artifacts/bm4l-input-ledger.json
          if-no-files-found: error
          retention-days: 14

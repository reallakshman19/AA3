name: Issue 947 one-shot bend pressure source patch

on:
  push:
    branches:
      - codex/issue-947-bm4nl-qualification

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore(issue947): apply max bend pressure source authority'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4
        with:
          ref: codex/issue-947-bm4nl-qualification

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic source patch
        run: node scripts/lfea-issue947-apply-bend-pressure-authority.mjs

      - name: Run independent pressure-selection regression
        run: node scripts/lfea-issue947-bend-pressure-stiffening-check.mjs

      - name: Commit authoritative source change
        shell: bash
        run: |
          set -euo pipefail
          git add src/core/fea-benchmarks/caesar-accdb-linear-solve.js
          if git diff --cached --quiet; then
            echo 'Expected bend pressure authority patch produced no source diff.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(lfea): use max declared pressure for bend stiffening'
          git push origin HEAD:codex/issue-947-bm4nl-qualification

name: Issue 947 E48 same-load differential stiffness audit

on:
  push:
    branches:
      - codex/issue-947-bm4nl-qualification
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci(issue947): run E48 differential stiffness audit' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download authoritative Version-14 BM4_NL replay
        uses: actions/download-artifact@v4
        with:
          name: issue-947-bm4nl-qualification
          path: .work/package
          github-token: ${{ github.token }}
          repository: reallaksh19/Advanced_Analysis
          run-id: 31324887225

      - name: Download preserved raw ACCDB output custody
        uses: actions/download-artifact@v4
        with:
          name: issue-947-node22130-reference-custody
          path: .work/raw
          github-token: ${{ github.token }}
          repository: reallaksh19/Advanced_Analysis
          run-id: 31311427176

      - name: Run current 5-degree same-load differential stiffness audit
        run: |
          mkdir -p .work/out
          node scripts/lfea-issue947-e48-same-load-differential-stiffness-audit.mjs \
            --package .work/package/bm4nl-canonical-package.json \
            --raw .work/raw/node22130-raw-export.json \
            --out .work/out/e48-differential-5deg.json

      - name: Refine bend chord representation without changing mechanics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/core/fea-benchmarks/caesar-accdb-linear-solve.js')
          text = p.read_text()
          old = "bendMaxAngleDegrees: { value: 5, source: PROFILE_SOURCE },"
          new = "bendMaxAngleDegrees: { value: 0.625, source: PROFILE_SOURCE },"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one bend subdivision anchor, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY

      - name: Run refined same-load differential stiffness audit
        run: |
          node scripts/lfea-issue947-e48-same-load-differential-stiffness-audit.mjs \
            --package .work/package/bm4nl-canonical-package.json \
            --raw .work/raw/node22130-raw-export.json \
            --out .work/out/e48-differential-0_625deg.json

      - name: Restore and verify production source
        shell: bash
        run: |
          git checkout -- src/core/fea-benchmarks/caesar-accdb-linear-solve.js
          git diff --exit-code -- src/core/fea-benchmarks/caesar-accdb-linear-solve.js

      - name: Summarize stiffness-only mesh result
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=json.loads(Path('.work/out/e48-differential-5deg.json').read_text())
          fine=json.loads(Path('.work/out/e48-differential-0_625deg.json').read_text())
          out={
            'schema':'lfea-issue947-e48-same-load-differential-stiffness-convergence/v1',
            'issue':947,
            'casePair':[17,19],
            'equation':'Delta q = K Delta d because both raw cases are SUS W+P1 and all element load vectors cancel.',
            'baseline':{
              'nearMax':base['nearHalf']['maxAbsNormalizedResidual'],
              'farMax':base['farHalf']['maxAbsNormalizedResidual'],
              'classification':base['classification'],
            },
            'refined':{
              'nearMax':fine['nearHalf']['maxAbsNormalizedResidual'],
              'farMax':fine['farHalf']['maxAbsNormalizedResidual'],
              'classification':fine['classification'],
            },
            'classification':(
              'E48_NEAR_HALF_STIFFNESS_SHAPE_MISMATCH_SURVIVES_REFINEMENT_WITH_LOAD_VECTORS_CANCELLED'
              if fine['nearHalf']['maxAbsNormalizedResidual'] > 0.1 and fine['farHalf']['maxAbsNormalizedResidual'] <= 0.1
              else 'E48_DIFFERENTIAL_STIFFNESS_RESULT_REQUIRES_REVIEW'
            ),
            'falsificationRule':'No W/P/Bourdon/MEC21 initial-load change may be used to explain a residual that survives the same-W+P1 differential identity Delta q = K Delta d.'
          }
          Path('.work/out/e48-differential-summary.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Upload differential stiffness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-947-e48-same-load-differential-stiffness-audit
          if-no-files-found: error
          path: .work/out/*.json

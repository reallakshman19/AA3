name: m047-bm4nl-i032-short-straight-ab

on:
  push:
    branches:
      - agent/m047-qualified-shear-draft
    paths:
      - '.github/workflows/m047-bm4nl-i032-short-straight-ab.yml'
      - 'benchmarks/LFEA/CAESAR_ACCDB/m047/M047-I032.request.json'
      - 'scripts/lfea-m047-i032-short-straight-evidence.mjs'
      - 'scripts/lfea-m047-apply-smooth90-candidate.mjs'
      - 'scripts/lfea-m047-smooth90-candidate-check.mjs'
      - 'scripts/lfea-m047-apply-reducer-bourdon-candidate.mjs'
      - 'scripts/lfea-m047-reducer-bourdon-candidate-check.mjs'
      - 'scripts/lfea-m047-apply-plain-frame-timoshenko-candidate.mjs'
      - 'scripts/lfea-m047-plain-frame-timoshenko-candidate-check.mjs'
      - 'scripts/lfea-m047-benchmark-ab.mjs'
      - 'scripts/lfea-m047-target-node-evidence.mjs'
      - 'scripts/lfea-m047-provision-ace.ps1'
      - 'scripts/lfea-caesar-accdb-export.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ab:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout I032 exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove orchestration boundary
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') { throw 'I032 orchestration checkout drifted.' }
          if (git status --porcelain) { throw 'I032 orchestration checkout is dirty.' }
          New-Item -ItemType Directory -Path 'artifacts/m047/I032' -Force | Out-Null

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout accepted-parent source
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Advanced_Analysis
          ref: 882d59a99c3a03847d20bec34770ba57ff479d91
          path: parent-source
          fetch-depth: 1

      - name: Checkout short-straight candidate source
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Advanced_Analysis
          ref: 882d59a99c3a03847d20bec34770ba57ff479d91
          path: candidate-source
          fetch-depth: 1

      - name: Prove frozen source custody and qualify core
        shell: pwsh
        run: |
          foreach ($dir in @('parent-source','candidate-source')) {
            if ((git -C $dir rev-parse HEAD).Trim() -ne '882d59a99c3a03847d20bec34770ba57ff479d91') { throw "$dir baseline drifted." }
            if (git -C $dir status --porcelain) { throw "$dir baseline checkout dirty." }
          }
          node parent-source/scripts/lfea-b3.1-frame-element-check.mjs
          node parent-source/scripts/lfea-b3.2-piping-component-check.mjs
          node parent-source/scripts/lfea-b3.3-solver-check.mjs
          node parent-source/scripts/lfea-b3.4-recovery-check.mjs

      - name: Checkout pinned Common BM4 source
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 1728651c94504b497aae4041578b1095fd8e292e
          path: common-source
          fetch-depth: 1

      - name: Expand and verify locked BM4_NL ACCDB
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'm047-i032-bm4nl'
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          New-Item -ItemType Directory -Path $root | Out-Null
          Expand-Archive -LiteralPath 'common-source/LFEA/BM4/BM4_NL.zip' -DestinationPath $root -Force
          $files=@(Get-ChildItem -LiteralPath $root -Recurse -File -Filter '*.accdb')
          if ($files.Count -ne 1) { throw "Expected one ACCDB; found $($files.Count)." }
          $sha=(Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '85d39463296e569da811d8572e2eff680b858097f76fdf0f47d1755f0b161c21') { throw "Locked ACCDB mismatch: $sha" }
          "BM4NL_ACCDB=$($files[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          [ordered]@{schema='lfea-m047-i032-source/v1';orchestrationHead='${{ github.sha }}';baselineCommit='882d59a99c3a03847d20bec34770ba57ff479d91';commonCommit='1728651c94504b497aae4041578b1095fd8e292e';accdbSha256=$sha} | ConvertTo-Json | Set-Content 'artifacts/m047/I032/source.json' -Encoding utf8

      - name: Provision Microsoft 365 Access Runtime
        shell: powershell
        run: .\scripts\lfea-m047-provision-ace.ps1 -OutputPath 'artifacts/m047/I032/ace.json'

      - name: Bind accepted smooth-90 and reducer-pressure parent mechanics
        shell: pwsh
        run: |
          foreach ($dir in @('parent-source','candidate-source')) {
            Copy-Item -LiteralPath 'scripts/lfea-caesar-accdb-export.ps1' -Destination "$dir/scripts/lfea-caesar-accdb-export.ps1" -Force
            node scripts/lfea-m047-apply-smooth90-candidate.mjs --source "$dir/src/core/fea-benchmarks/caesar-accdb-linear-solve.js" --manifest "artifacts/m047/I032/$dir-smooth90.manifest.json"
            node scripts/lfea-m047-smooth90-candidate-check.mjs --source "$dir/src/core/fea-benchmarks/caesar-accdb-linear-solve.js"
            node scripts/lfea-m047-apply-reducer-bourdon-candidate.mjs --source "$dir/src/core/fea-benchmarks/caesar-accdb-linear-solve.js" --manifest "artifacts/m047/I032/$dir-reducer-pressure.manifest.json"
            node scripts/lfea-m047-reducer-bourdon-candidate-check.mjs --source "$dir/src/core/fea-benchmarks/caesar-accdb-linear-solve.js"
          }

      - name: Apply isolated ordinary-FRAME Timoshenko candidate
        shell: pwsh
        run: |
          node scripts/lfea-m047-apply-plain-frame-timoshenko-candidate.mjs --source candidate-source/src/core/fea-benchmarks/caesar-accdb-linear-solve.js --manifest artifacts/m047/I032/plain-frame.manifest.json
          node scripts/lfea-m047-plain-frame-timoshenko-candidate-check.mjs --source candidate-source/src/core/fea-benchmarks/caesar-accdb-linear-solve.js
          node --check candidate-source/src/core/fea-benchmarks/caesar-accdb-linear-solve.js
          foreach ($dir in @('parent-source','candidate-source')) {
            $status=@(git -C $dir status --porcelain)
            $solver=@($status | Where-Object { $_ -match 'src/core/fea-benchmarks/caesar-accdb-linear-solve\.js$' }).Count -eq 1
            $exporter=@($status | Where-Object { $_ -match 'scripts/lfea-caesar-accdb-export\.ps1$' }).Count -eq 1
            if ($status.Count -ne 2 -or -not $solver -or -not $exporter) { throw "I032 $dir runtime mutation exceeded solver+exporter boundary: $($status -join '; ')" }
          }

      - name: Run accepted parent and short-straight candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($c in @(@{name='parent';dir='parent-source'},@{name='candidate';dir='candidate-source'})) {
            node "$($c.dir)/scripts/lfea-caesar-accdb-benchmark.mjs" `
              --accdb "$env:BM4NL_ACCDB" `
              --profile "$($c.dir)/benchmarks/LFEA/CAESAR_ACCDB/bm4nl-l19-l20-linear-solve.profile.json" `
              --solve-linear true `
              --actual-out "artifacts/m047/I032/$($c.name).actual.json" `
              --summary-out "artifacts/m047/I032/$($c.name).summary.md" `
              --out "artifacts/m047/I032/$($c.name).benchmark.json"
          }

      - name: Compare system and target evidence
        shell: pwsh
        run: |
          node scripts/lfea-m047-benchmark-ab.mjs --baseline artifacts/m047/I032/parent.benchmark.json --candidate artifacts/m047/I032/candidate.benchmark.json --manifest artifacts/m047/I032/plain-frame.manifest.json --out artifacts/m047/I032/system.ab.json
          node scripts/lfea-m047-i032-short-straight-evidence.mjs `
            --baseline-benchmark artifacts/m047/I032/parent.benchmark.json `
            --candidate-benchmark artifacts/m047/I032/candidate.benchmark.json `
            --baseline-actual artifacts/m047/I032/parent.actual.json `
            --candidate-actual artifacts/m047/I032/candidate.actual.json `
            --out artifacts/m047/I032/short-straight.evidence.json `
            --summary artifacts/m047/I032/short-straight.summary.md
          node scripts/lfea-m047-target-node-evidence.mjs --benchmark artifacts/m047/I032/candidate.benchmark.json --actual artifacts/m047/I032/candidate.actual.json --out artifacts/m047/I032/candidate.targets.json
          Get-Content 'artifacts/m047/I032/short-straight.summary.md' | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Govern I032 custody without forcing performance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ab=Get-Content 'artifacts/m047/I032/system.ab.json' -Raw | ConvertFrom-Json
          if ($ab.cases.L19.before.restraint.failingComponentCount -ne 2 -or $ab.cases.L19.before.displacementRotation.failingComponentCount -ne 57 -or $ab.cases.L19.before.sourceEndAction.failingComponentCount -ne 5) { throw 'I032 L19 parent drifted from accepted I031.' }
          if ($ab.cases.L20.before.restraint.failingComponentCount -ne 1 -or $ab.cases.L20.before.displacementRotation.failingComponentCount -ne 47 -or $ab.cases.L20.before.sourceEndAction.failingComponentCount -ne 31) { throw 'I032 L20 parent drifted from accepted I031.' }
          $e=Get-Content 'artifacts/m047/I032/short-straight.evidence.json' -Raw | ConvertFrom-Json
          foreach ($caseId in @('L19','L20')) {
            if (@($e.cases.$caseId.reducerCustody).Count -ne 4) { throw "I032 $caseId expected four reducers." }
            if (@($e.cases.$caseId.reducerCustody | Where-Object { [math]::Abs([double]$_.pressureStrainDelta) -gt 1e-15 }).Count -ne 0) { throw "I032 $caseId changed accepted reducer pressure strain." }
            if (@($e.cases.$caseId.reducerCustody | Where-Object { -not ([double]$_.afterPressureAxialStrain -gt 0) }).Count -ne 0) { throw "I032 $caseId lost accepted reducer pressure ownership." }
          }
          $actual=Get-Content 'artifacts/m047/I032/candidate.actual.json' -Raw | ConvertFrom-Json
          foreach ($caseId in @('L19','L20')) {
            if ($actual.mechanics.cases.$caseId.bendPointerCount -ne 12) { throw "I032 $caseId bend coverage drifted." }
            if ($actual.mechanics.cases.$caseId.reducerElementCount -ne 4) { throw "I032 $caseId reducer coverage drifted." }
          }
          $targets=Get-Content 'artifacts/m047/I032/candidate.targets.json' -Raw | ConvertFrom-Json
          foreach ($t in $targets.targets) {
            if ([math]::Abs([double]$t.balance.actionSumResidual) -gt 0.1) { throw "I032 action-sum custody failed $($t.caseId)/$($t.nodeId)." }
            if ([math]::Abs([double]$t.balance.equilibriumResidual) -gt 0.1) { throw "I032 equilibrium custody failed $($t.caseId)/$($t.nodeId)." }
          }
          if (git status --porcelain -- 'src/core' 'benchmarks/LFEA/CAESAR_ACCDB/bm4nl-l19-l20-linear-solve.profile.json') { throw 'I032 orchestration branch must contain no production mechanics/profile edit.' }
          Add-Content $env:GITHUB_STEP_SUMMARY "- system semantic hash: $($ab.semanticHash)"

      - name: Retain I032 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m047-i032-short-straight-ab-${{ github.sha }}
          path: artifacts/m047/I032/**
          if-no-files-found: error
          retention-days: 90

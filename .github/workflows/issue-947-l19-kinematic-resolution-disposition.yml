name: Issue 947 L19 kinematic resolution disposition

on:
  push:
    branches:
      - codex/issue-947-bm4nl-qualification
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci(issue947): classify L19 sub-resolution rotations' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download exact-head BM4_NL qualification evidence
        uses: actions/download-artifact@v4
        with:
          name: issue-947-bm4nl-qualification
          path: .work/report
          github-token: ${{ github.token }}
          repository: reallaksh19/Advanced_Analysis
          run-id: 31329371567

      - name: Download preserved raw ACCDB output custody
        uses: actions/download-artifact@v4
        with:
          name: issue-947-node22130-reference-custody
          path: .work/raw
          github-token: ${{ github.token }}
          repository: reallaksh19/Advanced_Analysis
          run-id: 31311427176

      - name: Classify only source-output resolution, preserving original FAIL rows
        run: |
          mkdir -p .work/out
          node scripts/lfea-issue947-l19-kinematic-resolution-disposition.mjs \
            --raw .work/raw/node22130-raw-export.json \
            --report .work/report/bm4nl-report.json \
            --out .work/out/l19-kinematic-resolution-disposition.json

      - name: Upload resolution disposition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-947-l19-kinematic-resolution-disposition
          if-no-files-found: error
          path: .work/out/l19-kinematic-resolution-disposition.json

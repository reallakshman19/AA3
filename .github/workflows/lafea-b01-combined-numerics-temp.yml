name: LAFEA B01 nodal block-Jacobi PCG temporary

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/lafea-b01-combined-numerics-temp.yml'

permissions:
  contents: read

jobs:
  block-jacobi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Install runner-only nodal block-Jacobi PCG
        shell: bash
        run: |
          cat > src/core/local-continuum/block-jacobi-cg-temp.js <<'EOF'
          import { canonicalNumber, maxAbs, tolerance } from './numeric.js';
          import {
            sparseMatrixVectorCompensatedRaw,
            sparseMatrixVectorRaw,
          } from './sparse-matrix.js';

          export function blockJacobiCgSolve(matrix, rightHandSide, profile, dofIdentities) {
            if (!Array.isArray(dofIdentities) || dofIdentities.length !== matrix.size) {
              throw new TypeError('Block-Jacobi PCG requires one DOF identity per free equation.');
            }
            const diagonalScale = Math.max(1, ...matrix.diagonal.map((value) => Math.abs(value)));
            const diagonalTolerance = tolerance(profile, 'choleskyPivot', diagonalScale);
            const blocks = buildBlocks(matrix, dofIdentities, diagonalTolerance);
            const residualScale = Math.max(1, maxAbs(rightHandSide));
            const residualTolerance = tolerance(profile, 'freeDofResidual', residualScale);
            const convergenceTarget = residualTolerance / 10;
            const iterationLimit = Math.min(50000, Math.max(1000, matrix.size * 16));
            const solution = Array(matrix.size).fill(0);
            const solutionCompensation = Array(matrix.size).fill(0);
            const residualCompensation = Array(matrix.size).fill(0);
            let residual = [...rightHandSide];
            let preconditioned = applyBlocks(blocks, residual);
            let direction = [...preconditioned];
            let rho = compensatedDot(residual, preconditioned);
            let iterations = 0;
            let originalResidualInfinity = maxAbs(residual);
            if (!(rho > 0) || !Number.isFinite(rho)) {
              throw solverError('BLOCK_JACOBI_PCG_INITIAL_PRODUCT_INVALID', rho);
            }
            while (iterations < iterationLimit) {
              const action = sparseMatrixVectorRaw(matrix, direction);
              const curvature = compensatedDot(direction, action);
              if (!(curvature > 0) || !Number.isFinite(curvature)) {
                throw solverError('BLOCK_JACOBI_PCG_NONPOSITIVE_CURVATURE', curvature);
              }
              const alpha = rho / curvature;
              for (let index = 0; index < matrix.size; index += 1) {
                kahanAdd(solution, solutionCompensation, index, alpha * direction[index]);
                kahanAdd(residual, residualCompensation, index, -alpha * action[index]);
              }
              iterations += 1;
              const recursiveResidualInfinity = maxAbs(residual);
              if (iterations % 100 === 0 || recursiveResidualInfinity <= convergenceTarget) {
                const exact = exactResidual(matrix, rightHandSide, solution);
                originalResidualInfinity = maxAbs(exact);
                if (originalResidualInfinity <= convergenceTarget) {
                  return result(solution, iterations, iterationLimit, residualScale,
                    residualTolerance, convergenceTarget, originalResidualInfinity,
                    diagonalScale, diagonalTolerance, matrix.diagonal, blocks);
                }
                if (recursiveResidualInfinity <= convergenceTarget) {
                  residual = exact;
                  residualCompensation.fill(0);
                  preconditioned = applyBlocks(blocks, residual);
                  direction = [...preconditioned];
                  rho = compensatedDot(residual, preconditioned);
                  if (!(rho > 0) || !Number.isFinite(rho)) {
                    throw solverError('BLOCK_JACOBI_PCG_RELIABLE_UPDATE_INVALID', rho);
                  }
                  continue;
                }
              }
              preconditioned = applyBlocks(blocks, residual);
              const nextRho = compensatedDot(residual, preconditioned);
              if (!(nextRho > 0) || !Number.isFinite(nextRho)) {
                throw solverError('BLOCK_JACOBI_PCG_RESIDUAL_PRODUCT_INVALID', nextRho);
              }
              const beta = nextRho / rho;
              rho = nextRho;
              for (let index = 0; index < matrix.size; index += 1) {
                direction[index] = preconditioned[index] + beta * direction[index];
              }
            }
            originalResidualInfinity = maxAbs(exactResidual(matrix, rightHandSide, solution));
            if (originalResidualInfinity > convergenceTarget) {
              throw solverError(
                'BLOCK_JACOBI_PCG_DID_NOT_CONVERGE',
                `${originalResidualInfinity} > ${convergenceTarget} after ${iterations}`,
              );
            }
            return result(solution, iterations, iterationLimit, residualScale,
              residualTolerance, convergenceTarget, originalResidualInfinity,
              diagonalScale, diagonalTolerance, matrix.diagonal, blocks);
          }

          function buildBlocks(matrix, identities, diagonalTolerance) {
            const nodes = new Map();
            identities.forEach((identity, position) => {
              const axis = identity.endsWith(':UX') ? 'UX' : identity.endsWith(':UY') ? 'UY' : null;
              if (!axis) throw new TypeError(`Unsupported continuum DOF identity ${identity}.`);
              const node = identity.slice(0, -3);
              const row = nodes.get(node) ?? { node, UX: null, UY: null };
              row[axis] = position;
              nodes.set(node, row);
            });
            const blocks = [];
            for (const row of nodes.values()) {
              if (row.UX !== null && row.UY !== null) {
                const i = row.UX;
                const j = row.UY;
                const a = matrix.diagonal[i];
                const d = matrix.diagonal[j];
                const b = csrValue(matrix, i, j);
                const determinant = a * d - b * b;
                if (!(a > diagonalTolerance) || !(d > diagonalTolerance)
                  || !(determinant > 0) || !Number.isFinite(determinant)) {
                  throw solverError('BLOCK_JACOBI_2X2_INVALID', `${row.node}:${a},${b},${d},${determinant}`);
                }
                blocks.push({ kind: 'PAIR', i, j, a, b, d, determinant });
              } else {
                const i = row.UX ?? row.UY;
                const a = matrix.diagonal[i];
                if (!(a > diagonalTolerance) || !Number.isFinite(a)) {
                  throw solverError('BLOCK_JACOBI_1X1_INVALID', `${row.node}:${a}`);
                }
                blocks.push({ kind: 'SINGLE', i, a });
              }
            }
            return blocks;
          }

          function applyBlocks(blocks, residual) {
            const output = Array(residual.length).fill(0);
            for (const block of blocks) {
              if (block.kind === 'SINGLE') {
                output[block.i] = residual[block.i] / block.a;
              } else {
                output[block.i] = (block.d * residual[block.i] - block.b * residual[block.j]) / block.determinant;
                output[block.j] = (-block.b * residual[block.i] + block.a * residual[block.j]) / block.determinant;
              }
            }
            return output;
          }

          function csrValue(matrix, row, column) {
            let low = matrix.rowPointers[row];
            let high = matrix.rowPointers[row + 1] - 1;
            while (low <= high) {
              const middle = (low + high) >> 1;
              const actual = matrix.columnIndices[middle];
              if (actual === column) return matrix.values[middle];
              if (actual < column) low = middle + 1;
              else high = middle - 1;
            }
            return 0;
          }

          function exactResidual(matrix, rhs, solution) {
            const action = sparseMatrixVectorCompensatedRaw(matrix, solution);
            return rhs.map((value, index) => value - action[index]);
          }

          function compensatedDot(left, right) {
            let sum = 0;
            let compensation = 0;
            for (let index = 0; index < left.length; index += 1) {
              const term = left[index] * right[index];
              const next = sum + term;
              compensation += Math.abs(sum) >= Math.abs(term)
                ? (sum - next) + term
                : (term - next) + sum;
              sum = next;
            }
            return sum + compensation;
          }

          function kahanAdd(values, compensation, index, increment) {
            const corrected = increment - compensation[index];
            const next = values[index] + corrected;
            compensation[index] = (next - values[index]) - corrected;
            values[index] = next;
          }

          function result(solution, iterations, iterationLimit, residualScale,
            residualTolerance, convergenceTarget, finalResidualInfinity,
            diagonalScale, diagonalTolerance, diagonal, blocks) {
            const pairCount = blocks.filter((row) => row.kind === 'PAIR').length;
            const singleCount = blocks.length - pairCount;
            const minimumDiagonal = Math.min(...diagonal);
            const maximumDiagonal = Math.max(...diagonal);
            return {
              solution: solution.map((value) => canonicalNumber(value, 'block-Jacobi PCG displacement')),
              evidence: {
                method: 'DETERMINISTIC_JACOBI_PCG',
                algorithm: 'NODE_BLOCK_JACOBI_PCG_DIAGNOSTIC',
                preconditioner: 'NODE_BLOCK_JACOBI_2X2',
                blockPairCount: pairCount,
                blockSingleCount: singleCount,
                iterationLimit,
                iterations,
                residualScale: canonicalNumber(residualScale),
                finalResidualInfinity: canonicalNumber(finalResidualInfinity),
                convergenceTarget: canonicalNumber(convergenceTarget),
                residualTolerance: canonicalNumber(residualTolerance),
                diagonalScale: canonicalNumber(diagonalScale),
                diagonalTolerance: canonicalNumber(diagonalTolerance),
                minimumDiagonal: canonicalNumber(minimumDiagonal),
                maximumDiagonal: canonicalNumber(maximumDiagonal),
                diagonalRatio: canonicalNumber(minimumDiagonal / maximumDiagonal),
                accepted: true,
              },
            };
          }

          function solverError(code, value) {
            const error = new Error(`${code}: ${value}`);
            error.code = code;
            return error;
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          p = Path('src/core/local-continuum/solver.js')
          s = p.read_text()
          old = "import { jacobiEquilibratedCgSolve } from './jacobi-equilibrated-cg.js';\n"
          new = old + "import { blockJacobiCgSolve } from './block-jacobi-cg-temp.js';\n"
          if s.count(old) != 1:
              raise RuntimeError('expected equilibrated-CG import')
          s = s.replace(old, new, 1)
          old = """    return jacobiEquilibratedCgSolve(\n      freeStiffness,\n      rightHandSide,\n      model.qualificationProfile,\n    );\n"""
          new = """    return blockJacobiCgSolve(\n      freeStiffness,\n      rightHandSide,\n      model.qualificationProfile,\n      free.map((index) => mesh.dofOrdering[index]),\n    );\n"""
          if s.count(old) != 1:
              raise RuntimeError('expected sparse equilibrated-CG call')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check src/core/local-continuum/block-jacobi-cg-temp.js
          node --check src/core/local-continuum/solver.js
      - name: Execute exact L4 near-incompressible B01 case
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { executeLameBbarQualificationCase } from './scripts/lib/lafea-plane-strain-bbar-lame-fixture.mjs';
          const definition = JSON.parse(fs.readFileSync('validation/lafea-incompressible/plane-strain-bbar-v1.json', 'utf8'));
          const meshPolicy = JSON.parse(fs.readFileSync('validation/lafea-incompressible/plane-strain-bbar-probe-mesh-policy-v1.json', 'utf8'));
          const level = definition.benchmarks.THICK_CYLINDER.meshLadder.levels.find((row) => row.levelId === 'L4');
          const distortion = definition.distortionMatrix.find((row) => row.distortionId === 'REGULAR');
          const run = executeLameBbarQualificationCase(definition, meshPolicy, {
            elementType: 'T6', poissonRatio: 0.4999, level, distortion,
          });
          console.log(JSON.stringify({
            case: 'T6/0.4999/L4/REGULAR',
            state: run.result.qualification.state,
            solverEvidence: run.loadCase.solverEvidence,
            equilibrium: run.loadCase.equilibrium,
          }, null, 2));
          NODE

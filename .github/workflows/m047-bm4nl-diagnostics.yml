name: m047-bm4nl-diagnostics

on:
  push:
    branches:
      - agent/m047-i007-diagnostics
    paths:
      - '.github/workflows/m047-bm4nl-diagnostics.yml'
      - 'scripts/lfea-m047-residual-decomposition*.mjs'
      - 'scripts/lfea-m047-element-replay*.mjs'
      - 'scripts/lfea-m047-instrument-baseline-replay*.mjs'
      - 'scripts/lfea-m047-thermal-axial-fingerprint*.mjs'
      - 'scripts/lfea-m047-thermal-alpha-ab*.mjs'
      - 'scripts/lfea-m047-benchmark-ab.mjs'
      - 'scripts/lfea-m047-apply-bourdon-final-axis-candidate.mjs'
      - 'scripts/lfea-m047-bourdon-final-axis-candidate-check.mjs'
      - 'scripts/lfea-m047-provision-ace.ps1'
      - 'scripts/lfea-caesar-accdb-export.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout diagnostic tooling exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact diagnostic head and clean checkout
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') {
            throw 'Diagnostic workflow did not checkout the triggering commit.'
          }
          if (git status --porcelain) {
            throw 'Diagnostic checkout is dirty before qualification.'
          }

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: I007 residual decomposition synthetic qualification
        shell: pwsh
        run: node scripts/lfea-m047-residual-decomposition-check.mjs

      - name: I008 element replay synthetic qualification
        shell: pwsh
        run: node scripts/lfea-m047-element-replay-check.mjs

      - name: I008 replay instrumentation line-ending qualification
        shell: pwsh
        run: node scripts/lfea-m047-instrument-baseline-replay-check.mjs

      - name: I009 thermal axial fingerprint synthetic qualification
        shell: pwsh
        run: node scripts/lfea-m047-thermal-axial-fingerprint-check.mjs

      - name: I010 thermal alpha A/B synthetic qualification
        shell: pwsh
        run: node scripts/lfea-m047-thermal-alpha-ab-check.mjs

      - name: Checkout original baseline mechanics
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Advanced_Analysis
          ref: 882d59a99c3a03847d20bec34770ba57ff479d91
          path: baseline-source
          fetch-depth: 1

      - name: Prove baseline mechanics commit
        shell: pwsh
        run: |
          Push-Location baseline-source
          try {
            if ((git rev-parse HEAD).Trim() -ne '882d59a99c3a03847d20bec34770ba57ff479d91') {
              throw 'Baseline mechanics checkout drifted.'
            }
          }
          finally {
            Pop-Location
          }

      - name: Checkout pinned Common BM4 source
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 1728651c94504b497aae4041578b1095fd8e292e
          path: common-source
          fetch-depth: 1

      - name: Expand and verify locked BM4_NL ACCDB
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD 'common-source/LFEA/BM4/BM4_NL.zip'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'm047-bm4nl-i007'
          if (Test-Path -LiteralPath $extractRoot) {
            Remove-Item -LiteralPath $extractRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $extractRoot | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $extractRoot -Force
          $accdb = @(Get-ChildItem -LiteralPath $extractRoot -Recurse -File -Filter '*.accdb')
          if ($accdb.Count -ne 1) {
            throw "Expected exactly one ACCDB; found $($accdb.Count)."
          }
          $locked = '85d39463296e569da811d8572e2eff680b858097f76fdf0f47d1755f0b161c21'
          $actual = (Get-FileHash -LiteralPath $accdb[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $locked) {
            throw "ACCDB SHA-256 $actual does not match locked M047 source $locked."
          }
          "BM4NL_ACCDB=$($accdb[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Provision Microsoft 365 Access Runtime
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path 'artifacts/m047/I007' -Force | Out-Null
          & .\scripts\lfea-m047-provision-ace.ps1 -OutputPath 'artifacts/m047/I007/ace-provisioning.json'

      - name: Probe Microsoft ACE OLE DB provider
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $connection = New-Object -ComObject ADODB.Connection
          try {
            $connection.Open("Provider=Microsoft.ACE.OLEDB.12.0;Data Source=$env:BM4NL_ACCDB;Mode=Read;Persist Security Info=False;")
          }
          finally {
            if ($connection.State -ne 0) { $connection.Close() }
            [void][System.Runtime.InteropServices.Marshal]::ReleaseComObject($connection)
          }

      - name: Bind baseline to portable read-only ACCDB exporter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baselineExporter = 'baseline-source/scripts/lfea-caesar-accdb-export.ps1'
          $portableExporter = 'scripts/lfea-caesar-accdb-export.ps1'
          $originalSha = (Get-FileHash -LiteralPath $baselineExporter -Algorithm SHA256).Hash.ToLowerInvariant()
          $portableSha = (Get-FileHash -LiteralPath $portableExporter -Algorithm SHA256).Hash.ToLowerInvariant()
          Copy-Item -LiteralPath $portableExporter -Destination $baselineExporter -Force
          $status = @(git -C baseline-source status --porcelain)
          if ($status.Count -ne 1 -or $status[0] -notmatch 'scripts/lfea-caesar-accdb-export\.ps1$') {
            throw "Baseline checkout mutation exceeded exporter portability boundary: $($status -join '; ')"
          }
          [ordered]@{
            schema = 'lfea-m047-baseline-exporter-portability/v1'
            baselineCommit = '882d59a99c3a03847d20bec34770ba57ff479d91'
            changedPath = 'scripts/lfea-caesar-accdb-export.ps1'
            originalExporterSha256 = $originalSha
            portableExporterSha256 = $portableSha
            mechanicsChanged = $false
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath 'artifacts/m047/I007/exporter-portability.json' -Encoding utf8

      - name: Instrument baseline element-contribution evidence
        shell: pwsh
        run: |
          node scripts/lfea-m047-instrument-baseline-replay.mjs `
            --source baseline-source/src/core/fea-benchmarks/caesar-accdb-linear-solve.js `
            --manifest artifacts/m047/I007/replay-instrumentation.json
          $status = @(git -C baseline-source status --porcelain)
          $hasExporter = @($status | Where-Object { $_ -match 'scripts/lfea-caesar-accdb-export\.ps1$' }).Count -eq 1
          $hasLedger = @($status | Where-Object { $_ -match 'src/core/fea-benchmarks/caesar-accdb-linear-solve\.js$' }).Count -eq 1
          if ($status.Count -ne 2 -or -not $hasExporter -or -not $hasLedger) {
            throw "Baseline checkout mutation exceeded exporter + evidence-instrumentation boundary: $($status -join '; ')"
          }

      - name: Reproduce original baseline mechanics from locked ACCDB
        shell: pwsh
        run: |
          node baseline-source/scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb "$env:BM4NL_ACCDB" `
            --profile baseline-source/benchmarks/LFEA/CAESAR_ACCDB/bm4nl-l19-l20-linear-solve.profile.json `
            --solve-linear true `
            --actual-out artifacts/m047/I007/baseline-actual.json `
            --summary-out artifacts/m047/I007/baseline-summary.md `
            --out artifacts/m047/I007/baseline-benchmark.json

      - name: Generate I007 W+P and thermal residual decomposition
        shell: pwsh
        run: |
          node scripts/lfea-m047-residual-decomposition.mjs `
            --report artifacts/m047/I007/baseline-benchmark.json `
            --out artifacts/m047/I007/residual-decomposition.json `
            --summary-out artifacts/m047/I007/residual-decomposition.md

      - name: Generate I008 CAESAR endpoint element replay
        shell: pwsh
        run: |
          node scripts/lfea-m047-element-replay.mjs `
            --report artifacts/m047/I007/baseline-benchmark.json `
            --out artifacts/m047/I007/element-replay.json

      - name: Generate I009 thermal axial fingerprint
        shell: pwsh
        run: |
          node scripts/lfea-m047-thermal-axial-fingerprint.mjs `
            --report artifacts/m047/I007/baseline-benchmark.json `
            --replay artifacts/m047/I007/element-replay.json `
            --out artifacts/m047/I007/thermal-axial-fingerprint.json

      - name: Prepare I010 non-production diagnostic alpha profile
        shell: pwsh
        run: |
          node scripts/lfea-m047-thermal-alpha-ab.mjs `
            --mode prepare `
            --base-profile baseline-source/benchmarks/LFEA/CAESAR_ACCDB/bm4nl-l19-l20-linear-solve.profile.json `
            --fingerprint artifacts/m047/I007/thermal-axial-fingerprint.json `
            --profile-out artifacts/m047/I007/i010-diagnostic-alpha.profile.json `
            --manifest-out artifacts/m047/I007/i010-diagnostic-alpha.manifest.json

      - name: Run I010 non-production diagnostic alpha A/B
        shell: pwsh
        run: |
          node baseline-source/scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb "$env:BM4NL_ACCDB" `
            --profile artifacts/m047/I007/i010-diagnostic-alpha.profile.json `
            --solve-linear true `
            --actual-out artifacts/m047/I007/i010-diagnostic-alpha.actual.json `
            --summary-out artifacts/m047/I007/i010-diagnostic-alpha.summary.md `
            --out artifacts/m047/I007/i010-diagnostic-alpha.benchmark.json

      - name: Compare I010 diagnostic alpha A/B
        shell: pwsh
        run: |
          node scripts/lfea-m047-thermal-alpha-ab.mjs `
            --mode compare `
            --baseline artifacts/m047/I007/baseline-benchmark.json `
            --diagnostic artifacts/m047/I007/i010-diagnostic-alpha.benchmark.json `
            --manifest artifacts/m047/I007/i010-diagnostic-alpha.manifest.json `
            --out artifacts/m047/I007/i010-diagnostic-alpha.ab.json

      - name: Apply I011 MEC-21 final-axis mechanics candidate
        shell: pwsh
        run: |
          node scripts/lfea-m047-apply-bourdon-final-axis-candidate.mjs `
            --source baseline-source/src/core/linear-fea-piping-components/bourdon-pressure-expansion.js `
            --manifest artifacts/m047/I007/i011-bourdon-final-axis.manifest.json
          node scripts/lfea-m047-bourdon-final-axis-candidate-check.mjs `
            --module baseline-source/src/core/linear-fea-piping-components/bourdon-pressure-expansion.js
          $status = @(git -C baseline-source status --porcelain)
          $required = @(
            'scripts/lfea-caesar-accdb-export.ps1',
            'src/core/fea-benchmarks/caesar-accdb-linear-solve.js',
            'src/core/linear-fea-piping-components/bourdon-pressure-expansion.js'
          )
          foreach ($path in $required) {
            if (@($status | Where-Object { $_ -match [regex]::Escape($path) + '$' }).Count -ne 1) {
              throw "I011 baseline mutation custody is missing $path: $($status -join '; ')"
            }
          }
          if ($status.Count -ne 3) {
            throw "I011 baseline mutation exceeded exporter + evidence + Bourdon candidate boundary: $($status -join '; ')"
          }

      - name: Run I011 MEC-21 final-axis candidate
        shell: pwsh
        run: |
          node baseline-source/scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb "$env:BM4NL_ACCDB" `
            --profile baseline-source/benchmarks/LFEA/CAESAR_ACCDB/bm4nl-l19-l20-linear-solve.profile.json `
            --solve-linear true `
            --actual-out artifacts/m047/I007/i011-bourdon-final-axis.actual.json `
            --summary-out artifacts/m047/I007/i011-bourdon-final-axis.summary.md `
            --out artifacts/m047/I007/i011-bourdon-final-axis.benchmark.json

      - name: Compare I011 against exact baseline
        shell: pwsh
        run: |
          node scripts/lfea-m047-benchmark-ab.mjs `
            --baseline artifacts/m047/I007/baseline-benchmark.json `
            --candidate artifacts/m047/I007/i011-bourdon-final-axis.benchmark.json `
            --manifest artifacts/m047/I007/i011-bourdon-final-axis.manifest.json `
            --out artifacts/m047/I007/i011-bourdon-final-axis.ab.json

      - name: Summarize I007 through I011
        shell: pwsh
        run: |
          $residual = Get-Content -LiteralPath 'artifacts/m047/I007/residual-decomposition.json' -Raw | ConvertFrom-Json
          $replay = Get-Content -LiteralPath 'artifacts/m047/I007/element-replay.json' -Raw | ConvertFrom-Json
          $thermal = Get-Content -LiteralPath 'artifacts/m047/I007/thermal-axial-fingerprint.json' -Raw | ConvertFrom-Json
          $alpha = Get-Content -LiteralPath 'artifacts/m047/I007/i010-diagnostic-alpha.ab.json' -Raw | ConvertFrom-Json
          $bourdon = Get-Content -LiteralPath 'artifacts/m047/I007/i011-bourdon-final-axis.ab.json' -Raw | ConvertFrom-Json
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '# M047 diagnostic qualification'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Baseline mechanics: ``882d59a99c3a03847d20bec34770ba57ff479d91``"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Locked ACCDB: ``$($residual.sourceAccdbSha256)``"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- I007 residual evidence: ``$($residual.semanticHash)``"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- I008 replay evidence: ``$($replay.semanticHash)``"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- I009 thermal fingerprint evidence: ``$($thermal.semanticHash)``"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- I010 diagnostic A/B evidence: ``$($alpha.semanticHash)``"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- I011 Bourdon-axis A/B evidence: ``$($bourdon.semanticHash)``"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- I009 diagnostic implied alpha: $($thermal.summary.gravityWeightedMedianImpliedThermalExpansionCoefficientPerKelvin) 1/K; production authority=false"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- I010 L20 restraint failures: $($alpha.cases.L20.before.restraint.failingComponentCount) -> $($alpha.cases.L20.after.restraint.failingComponentCount)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- I010 L20 displacement/rotation failures: $($alpha.cases.L20.before.displacementRotation.failingComponentCount) -> $($alpha.cases.L20.after.displacementRotation.failingComponentCount)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- I010 L20 source-end-action failures: $($alpha.cases.L20.before.sourceEndAction.failingComponentCount) -> $($alpha.cases.L20.after.sourceEndAction.failingComponentCount)"
          foreach ($caseId in @('L19', 'L20')) {
            $case = $bourdon.cases.$caseId
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- I011 ${caseId} restraints: $($case.before.restraint.failingComponentCount) -> $($case.after.restraint.failingComponentCount)"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- I011 ${caseId} displacement/rotation: $($case.before.displacementRotation.failingComponentCount) -> $($case.after.displacementRotation.failingComponentCount)"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- I011 ${caseId} source-end-actions: $($case.before.sourceEndAction.failingComponentCount) -> $($case.after.sourceEndAction.failingComponentCount)"
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- I011 tracked L19/20090 FY: $($bourdon.tracked.L19_20090_FY.before.relativeError) -> $($bourdon.tracked.L19_20090_FY.after.relativeError)"

      - name: Retain I007-I011 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m047-i007-i011-${{ github.sha }}
          path: artifacts/m047/I007/**
          if-no-files-found: error
          retention-days: 90

name: M047 promote BM4_L P1 pressure stiffening

on:
  push:
    branches: [agent/m047-bm4l-fresh-qualification]
    paths: ['.github/workflows/m047-bm4l-promote-p1-pressure-stiffening.yml']

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m047-bm4l-fresh-qualification
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Apply report-bound P1 pressure source
        shell: python
        run: |
          import json
          from pathlib import Path

          p=Path('benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json')
          data=json.loads(p.read_text())
          entry=data['linearSolve']['bendPressureStiffening']
          if entry['pressureSource'] != 'MAX_DEFINED':
              raise SystemExit(f"unexpected current pressureSource {entry['pressureSource']}")
          entry['pressureSource']='P1'
          entry['authorityStatus']='RESOLVED'
          entry['source']='COMMON_179c4831cf521cf797c13699cfbbd118315c9244:LFEA/BM4/Miscdata_BM4_L.txt; P1=11.6MPa reproduces all 12 printed CAESAR bend flexibility minima, while hydro-inclusive MAX_DEFINED over-stiffens all 12'
          p.write_text(json.dumps(data,indent=2)+'\n')

      - name: Validate authority evidence and reusable mechanics
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json','utf8'));
          const e=p.linearSolve.bendPressureStiffening;
          if(e.pressureSource!=='P1'||e.authorityStatus!=='RESOLVED') throw new Error(JSON.stringify(e));
          const q=JSON.parse(fs.readFileSync('benchmarks/LFEA/CAESAR_ACCDB/bm4l-pressure-stiffening-p1-qualification.json','utf8'));
          if(q.decision!=='PROMOTE_P1_AS_BM4_L_BEND_PRESSURE_STIFFENING_SOURCE'||q.factorComparisons.length!==12||q.factorComparisons.some(x=>x.status!=='MATCH')) throw new Error('P1 authority evidence is incomplete');
          console.log(JSON.stringify({status:'PASS',pressureSource:e.pressureSource,matchedBends:q.factorComparisons.length},null,2));
          NODE
          node scripts/lfea-m047-caesar-straight-pipe-shear-authority-check.mjs
          node scripts/lfea-m047-mec21-bend-shear-authority-check.mjs
          node scripts/lfea-b3.1-frame-element-check.mjs
          node scripts/lfea-b3.2-piping-component-check.mjs
          node scripts/lfea-b3.3-solver-check.mjs
          node scripts/lfea-b3.4-recovery-check.mjs
          npm run check:core-fea

      - name: Publish profile change and retire promoter
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/m047-bm4l-promote-p1-pressure-stiffening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json .github/workflows/m047-bm4l-promote-p1-pressure-stiffening.yml
          git diff --cached --check
          git commit -m "bind BM4_L bend pressure stiffening to P1"
          git push origin HEAD:agent/m047-bm4l-fresh-qualification

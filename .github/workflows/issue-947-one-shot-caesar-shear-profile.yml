name: Issue 947 one-shot CAESAR pipe shear profile

on:
  push:
    branches:
      - codex/issue-947-bm4nl-qualification

permissions:
  contents: write
  actions: read

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore(issue947): apply CAESAR pipe shear profile' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4
        with:
          ref: codex/issue-947-bm4nl-qualification

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run CAESAR shear-authority mapping regression
        run: node scripts/lfea-issue947-caesar-pipe-shear-authority-check.mjs

      - name: Apply deterministic CAESAR shear-profile patch
        run: node scripts/lfea-issue947-apply-caesar-shear-profile.mjs

      - name: Run generic frame-element qualification unchanged
        run: node scripts/lfea-b3.1-frame-element-check.mjs

      - name: Run Bourdon subdivision regression
        run: node scripts/lfea-issue947-bourdon-subdivision-check.mjs

      - name: Run bend pressure authority regression
        run: node scripts/lfea-issue947-bend-pressure-stiffening-check.mjs

      - name: Commit CAESAR-specific frame-profile authority
        shell: bash
        run: |
          set -euo pipefail
          git add src/core/fea-benchmarks/caesar-accdb-linear-solve.js
          if git diff --cached --quiet; then
            echo 'Expected CAESAR shear-profile patch produced no source diff.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(lfea): use CAESAR thin-wall pipe shear coefficient'
          git push origin HEAD:codex/issue-947-bm4nl-qualification

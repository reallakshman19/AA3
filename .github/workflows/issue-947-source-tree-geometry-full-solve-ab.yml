name: Issue 947 source-tree geometry full-solve A-B

on:
  push:
    branches:
      - codex/issue-947-bm4nl-qualification
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci(issue947): run source-tree geometry full-solve ab' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download pinned canonical BM4_NL package
        uses: actions/download-artifact@v4
        with:
          name: issue-947-bm4nl-qualification
          path: .work/package
          github-token: ${{ github.token }}
          repository: reallaksh19/Advanced_Analysis
          run-id: 31302834835
      - name: Run baseline versus coherent-tree candidate
        run: |
          mkdir -p .work
          node scripts/lfea-issue947-source-tree-geometry-full-solve-ab.mjs \
            --package .work/package/bm4nl-canonical-package.json \
            --out .work/issue947-source-tree-geometry-full-solve-ab.json
      - name: Upload A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-947-source-tree-geometry-full-solve-ab
          if-no-files-found: error
          path: .work/issue947-source-tree-geometry-full-solve-ab.json

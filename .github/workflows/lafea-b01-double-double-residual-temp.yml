name: LAFEA B01 double-double exact residual temporary

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/lafea-b01-double-double-residual-temp.yml'

permissions:
  contents: read

jobs:
  double-double-residual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Install runner-only double-double exact residual oracle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/core/local-continuum/sparse-matrix.js')
          s = p.read_text()
          marker = "export function sparseMatrixScale(matrix) {\n"
          helper = r'''export function sparseMatrixVectorDoubleDoubleRaw(matrix, vector) {
  requireCsr(matrix);
  if (!Array.isArray(vector) || vector.length !== matrix.size) {
    throw new TypeError('Sparse matrix-vector dimensions differ.');
  }
  const output = Array(matrix.size).fill(0);
  for (let row = 0; row < matrix.size; row += 1) {
    const partials = [];
    for (let offset = matrix.rowPointers[row];
      offset < matrix.rowPointers[row + 1]; offset += 1) {
      const left = matrix.values[offset];
      const right = vector[matrix.columnIndices[offset]];
      const product = left * right;
      addAccuratePartial(partials, product);
      const error = twoProductError(left, right, product);
      if (error !== 0) addAccuratePartial(partials, error);
    }
    let value = 0;
    for (let index = partials.length - 1; index >= 0; index -= 1) {
      value += partials[index];
    }
    output[row] = value;
  }
  return output;
}

const DOUBLE_SPLITTER = 134217729;

function twoProductError(left, right, product) {
  const leftSplit = DOUBLE_SPLITTER * left;
  const leftHigh = leftSplit - (leftSplit - left);
  const leftLow = left - leftHigh;
  const rightSplit = DOUBLE_SPLITTER * right;
  const rightHigh = rightSplit - (rightSplit - right);
  const rightLow = right - rightHigh;
  return ((leftHigh * rightHigh - product)
    + leftHigh * rightLow
    + leftLow * rightHigh)
    + leftLow * rightLow;
}

function addAccuratePartial(partials, input) {
  let value = input;
  let write = 0;
  for (let index = 0; index < partials.length; index += 1) {
    let partial = partials[index];
    if (Math.abs(value) < Math.abs(partial)) {
      const swap = value;
      value = partial;
      partial = swap;
    }
    const high = value + partial;
    const low = partial - (high - value);
    if (low !== 0) {
      partials[write] = low;
      write += 1;
    }
    value = high;
  }
  partials.length = write;
  partials.push(value);
}

'''
          if s.count(marker) != 1:
              raise RuntimeError('expected sparseMatrixScale marker')
          p.write_text(s.replace(marker, helper + marker, 1))

          p = Path('src/core/local-continuum/jacobi-equilibrated-cg.js')
          s = p.read_text()
          old = """import {\n  sparseMatrixVectorCompensatedRaw,\n  sparseMatrixVectorRaw,\n} from './sparse-matrix.js';\n"""
          new = """import {\n  sparseMatrixVectorCompensatedRaw,\n  sparseMatrixVectorDoubleDoubleRaw,\n  sparseMatrixVectorRaw,\n} from './sparse-matrix.js';\n"""
          if s.count(old) != 1:
              raise RuntimeError('expected sparse-matrix import block')
          s = s.replace(old, new, 1)
          old = "const action = sparseMatrixVectorCompensatedRaw(matrix, solution);"
          new = "const action = sparseMatrixVectorDoubleDoubleRaw(matrix, solution);"
          if s.count(old) != 1:
              raise RuntimeError('expected exact residual action')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check src/core/local-continuum/sparse-matrix.js
          node --check src/core/local-continuum/jacobi-equilibrated-cg.js
      - name: Execute exact L4 near-incompressible B01 case
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { executeLameBbarQualificationCase } from './scripts/lib/lafea-plane-strain-bbar-lame-fixture.mjs';
          const definition = JSON.parse(fs.readFileSync('validation/lafea-incompressible/plane-strain-bbar-v1.json', 'utf8'));
          const meshPolicy = JSON.parse(fs.readFileSync('validation/lafea-incompressible/plane-strain-bbar-probe-mesh-policy-v1.json', 'utf8'));
          const level = definition.benchmarks.THICK_CYLINDER.meshLadder.levels.find((row) => row.levelId === 'L4');
          const distortion = definition.distortionMatrix.find((row) => row.distortionId === 'REGULAR');
          const run = executeLameBbarQualificationCase(definition, meshPolicy, {
            elementType: 'T6', poissonRatio: 0.4999, level, distortion,
          });
          console.log(JSON.stringify({
            case: 'T6/0.4999/L4/REGULAR',
            state: run.result.qualification.state,
            solverEvidence: run.loadCase.solverEvidence,
            equilibrium: run.loadCase.equilibrium,
          }, null, 2));
          NODE

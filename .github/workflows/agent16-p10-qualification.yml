name: agent16-p10-p09-p07-p08-p06a-governed-workflow

on:
  pull_request:
    paths:
      - 'src/core/linear-piping-analysis-consumer/inputxml-linear-prefea-findings.js'
      - 'src/analyze/analyze-controller.js'
      - 'src/main.js'
      - 'src/workspace/linear-piping-run-request.js'
      - 'src/workspace/linear-piping-run-gate.js'
      - 'src/workspace/linear-piping-run-analysis.js'
      - 'src/workspace/linear-piping-prerun-check.js'
      - 'src/workspace/linear-piping-prerun-view.js'
      - 'src/workspace/linear-piping-results-workbench.js'
      - 'src/workspace/linear-piping-inputxml-intake.js'
      - 'src/workspace/linear-piping-inputxml-prefea.js'
      - 'src/workspace/linear-piping-inputxml-source-workflow.js'
      - 'src/workspace/linear-piping-inputxml-diagnostics-view.js'
      - 'src/workspace/linear-piping-analyzer-integration.js'
      - 'src/workspace/lfea-preflight-phase1-schema.js'
      - 'src/workspace/lfea-preflight-phase1-bitset.js'
      - 'src/workspace/lfea-preflight-phase1-index.js'
      - 'src/workspace/lfea-preflight-phase1-review-ledger.js'
      - 'scripts/lfea-p10-capability-effects-traceability-check.mjs'
      - 'scripts/linear-piping-run-gate-check.mjs'
      - 'scripts/linear-piping-live-run-workbench-check.mjs'
      - 'scripts/linear-piping-inputxml-native-intake-check.mjs'
      - 'scripts/linear-piping-inputxml-source-workflow-check.mjs'
      - 'scripts/linear-piping-inputxml-analyzer-integration-check.mjs'
      - 'scripts/lfea-preflight-phase1-indexed-model-check.mjs'
      - '.github/workflows/agent16-p10-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prove exact head and stacked containment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --exit-code
          base='0cb5c6a04f865a4d6890edc59b29c3892af8c5ba'
          p10='5353ae5eb0f441652db8227c64674ecb4694f950'
          p09='b8232673bc2ff560c1037c1741a6354fe5bcaebe'
          p07='80fc8ebd0d6dec6164ed6d1cdbea7759bf9509af'
          p08='71ceeef52f800c6552d349572b5c0fbd25e74b22'

          git diff --name-only "$base" "$p10" > /tmp/p10-paths.txt
          while IFS= read -r changed; do
            case "$changed" in
              src/core/linear-piping-analysis-consumer/inputxml-linear-prefea-findings.js|scripts/lfea-p10-capability-effects-traceability-check.mjs|.github/workflows/agent16-p10-qualification.yml) ;;
              *) echo "Frozen P-10 anchor contains an unexpected path: $changed" >&2; exit 1 ;;
            esac
          done < /tmp/p10-paths.txt

          git diff --name-only "$p10" "$p09" > /tmp/p09-paths.txt
          while IFS= read -r changed; do
            case "$changed" in
              src/workspace/linear-piping-run-request.js|src/workspace/linear-piping-run-gate.js|src/workspace/linear-piping-run-analysis.js|src/workspace/linear-piping-prerun-check.js|src/workspace/linear-piping-prerun-view.js|src/workspace/linear-piping-results-workbench.js|scripts/linear-piping-run-gate-check.mjs|scripts/linear-piping-live-run-workbench-check.mjs|.github/workflows/agent16-p10-qualification.yml) ;;
              *) echo "Frozen P-09 anchor contains an unexpected path: $changed" >&2; exit 1 ;;
            esac
          done < /tmp/p09-paths.txt

          git diff --name-only "$p09" "$p07" > /tmp/p07-paths.txt
          while IFS= read -r changed; do
            case "$changed" in
              src/main.js|src/workspace/linear-piping-inputxml-intake.js|src/workspace/linear-piping-inputxml-prefea.js|src/workspace/linear-piping-inputxml-source-workflow.js|scripts/linear-piping-inputxml-native-intake-check.mjs|scripts/linear-piping-inputxml-source-workflow-check.mjs|.github/workflows/agent16-p10-qualification.yml) ;;
              *) echo "Frozen P-07 anchor contains an unexpected path: $changed" >&2; exit 1 ;;
            esac
          done < /tmp/p07-paths.txt

          git diff --name-only "$p07" "$p08" > /tmp/p08-paths.txt
          while IFS= read -r changed; do
            case "$changed" in
              src/analyze/analyze-controller.js|src/main.js|src/workspace/linear-piping-inputxml-source-workflow.js|src/workspace/linear-piping-inputxml-diagnostics-view.js|src/workspace/linear-piping-analyzer-integration.js|scripts/linear-piping-inputxml-analyzer-integration-check.mjs|.github/workflows/agent16-p10-qualification.yml) ;;
              *) echo "Frozen P-08 anchor contains an unexpected path: $changed" >&2; exit 1 ;;
            esac
          done < /tmp/p08-paths.txt

          git diff --name-only "$p08" HEAD > /tmp/p06a-paths.txt
          cat /tmp/p06a-paths.txt
          while IFS= read -r changed; do
            case "$changed" in
              src/workspace/lfea-preflight-phase1-schema.js|src/workspace/lfea-preflight-phase1-bitset.js|src/workspace/lfea-preflight-phase1-index.js|src/workspace/lfea-preflight-phase1-review-ledger.js|scripts/lfea-preflight-phase1-indexed-model-check.mjs|.github/workflows/agent16-p10-qualification.yml) ;;
              *) echo "P-06A changed an unqualified path: $changed" >&2; exit 1 ;;
            esac
          done < /tmp/p06a-paths.txt

      - name: Install dependencies
        run: npm ci

      - name: Materialize frozen P-08 anchor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p08-anchor
          git worktree add --detach /tmp/p08-anchor 71ceeef52f800c6552d349572b5c0fbd25e74b22
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/p08-anchor/node_modules

      - name: Preserve P-10 lossless capability-effects projection
        run: node scripts/lfea-p10-capability-effects-traceability-check.mjs

      - name: Preserve P-09 sealed PASS WARN BLOCK authorization contract
        run: node scripts/linear-piping-run-gate-check.mjs

      - name: Preserve P-09 legacy M003 governed BLOCK
        run: node scripts/linear-piping-live-run-workbench-check.mjs

      - name: Preserve P-07 native InputXML intake and source-to-preflight contract
        run: node scripts/linear-piping-inputxml-native-intake-check.mjs

      - name: Preserve P-07 visible LFEA native Source and Pre-flight workflow
        run: node scripts/linear-piping-inputxml-source-workflow-check.mjs

      - name: Preserve P-08 governed diagnostics and Analyzer integration
        run: node scripts/linear-piping-inputxml-analyzer-integration-check.mjs

      - name: P-06A indexed review model and immutable ledger
        run: node scripts/lfea-preflight-phase1-indexed-model-check.mjs

      - name: M003 core mechanics P-08 P-06A equivalence
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/p06a-m003-core-oracle.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const root = path.resolve(process.argv[2]);
          const { buildM003LiveRunRequest } = await import(pathToFileURL(path.join(root, 'scripts/m003-live-run-analysis-fixture.mjs')));
          const { compileLinearPipingInputXmlAnalysisContext } = await import(pathToFileURL(path.join(root, 'src/core/linear-piping-analysis-consumer/index.js')));
          const high = buildM003LiveRunRequest().cases.find((entry) => entry.caseId === 'HIGH');
          const context = compileLinearPipingInputXmlAnalysisContext(high.inputXmlAnalysisRequest, { factorizationCache: new Map() });
          const result = context.sourceAnalysisContext.analysisResult;
          const reaction = (dof) => result.execution.reactions.find((entry) => entry.nodeId === 'RED-001.N0' && entry.dof === dof)?.value;
          const uy = reaction('UY'); const rz = reaction('RZ');
          assert.ok(Math.abs(uy + 1000) < 1e-8); assert.ok(Math.abs(rz + 2400) < 1e-8);
          process.stdout.write(JSON.stringify({ status: result.status, semanticHash: result.semanticHash, uy, rz }));
          EOF
          node /tmp/p06a-m003-core-oracle.mjs /tmp/p08-anchor > /tmp/p08-m003.json
          node /tmp/p06a-m003-core-oracle.mjs "$GITHUB_WORKSPACE" > /tmp/p06a-m003.json
          cmp /tmp/p08-m003.json /tmp/p06a-m003.json

      - name: Linear piping consumer anti-drift
        run: node scripts/linear-piping-analysis-consumer-anti-drift-check.mjs

      - name: Prove PF-16 carried-red parity on P-08 anchor and P-06A head
        shell: bash
        run: |
          set -euo pipefail
          pattern='^PF-16 BLOCK cannot be overridden$'
          set +e
          (cd /tmp/p08-anchor && node --test --test-name-pattern="$pattern" test/lfea-prefea-gateway.test.js) > /tmp/p08-pf16.log 2>&1
          anchor_status=$?
          node --test --test-name-pattern="$pattern" test/lfea-prefea-gateway.test.js > /tmp/p06a-pf16.log 2>&1
          head_status=$?
          set -e
          test "$anchor_status" -ne 0
          test "$head_status" -ne 0
          for log in /tmp/p08-pf16.log /tmp/p06a-pf16.log; do
            grep -F 'Preparation retains prohibited runtime state.' "$log"
            grep -F '# fail 1' "$log"
          done

      - name: Pre-FEA gateway regressions excluding proven PF-16
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-name-pattern='^PF-(0[1-9]|1[0-5]|1[7-9]|2[0-4]) ' test/lfea-prefea-gateway.test.js
          node --test --test-name-pattern='^Exercise [GH] ' test/lfea-prefea-gateway.test.js
          node --test --test-name-pattern='^solver runtime ' test/lfea-prefea-gateway.test.js

      - name: Linear piping consumer regression
        run: node scripts/linear-piping-analysis-consumer-check.mjs

      - name: Closed-form mechanics P-08 P-06A equivalence
        shell: bash
        run: |
          set -euo pipefail
          for script in lfea-b3.7-simply-supported-beam-check.mjs lfea-b3.8-thermal-expansion-check.mjs lfea-b3.9-gravity-self-weight-check.mjs; do
            stem="${script%.mjs}"
            (cd /tmp/p08-anchor && node "scripts/$script") > "/tmp/p08-$stem.log"
            node "scripts/$script" > "/tmp/p06a-$stem.log"
            cmp "/tmp/p08-$stem.log" "/tmp/p06a-$stem.log"
          done

      - name: Required 1 — strict syntax
        run: npm run syntax:strict

      - name: Required 2 — import graph
        run: node scripts/import-check.mjs

      - name: Required 3 — enrichment UI phase 0
        run: node scripts/run-enrichment-ui-phase0-checks.mjs

      - name: Required 4 — linear piping workspace integration
        run: node scripts/linear-piping-workspace-integration-check.mjs

      - name: Required 5 — UI invariants
        run: node scripts/ui-invariant-check.mjs

      - name: Required 6 — production Vite build
        run: npx vite build

      - name: Report stacked P-10 P-09 P-07 P-08 P-06A qualification
        run: |
          printf '%s\n' \
            'P-10/P-09/P-07/P-08 frozen qualified anchors PRESERVED' \
            'P-06A closed 40-column ordinal schema PASS' \
            'P-06A caller-immutable input-order-independent indexed store PASS' \
            'P-06A duplicate target rejection and duplicate-key preservation PASS' \
            'P-06A 100k lines / 1m components structural digest PASS' \
            'P-06A bitset facets and six exception queues PASS' \
            'P-06A immutable proposal/review/undo ledger PASS' \
            'P-06A no DOM/live UI integration authority PASS' \
            'P-08/P-06A M003 and closed-form numerical equivalence PASS' \
            'PF-16 carried-red parity PROVEN' \
            'all other pre-FEA gateway tests PASS' \
            'all six #952 mandatory commands PASS'

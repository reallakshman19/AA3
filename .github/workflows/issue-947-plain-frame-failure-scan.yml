name: Issue 947 plain-frame failure localization

on:
  push:
    branches:
      - codex/issue-947-bm4nl-qualification
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download current-schema canonical package
        uses: actions/download-artifact@v4
        with:
          name: issue-947-bm4nl-qualification
          path: .work/package
          github-token: ${{ github.token }}
          repository: reallaksh19/Advanced_Analysis
          run-id: 31302834835

      - name: Download exact-head kappa-0.5 qualification
        uses: actions/download-artifact@v4
        with:
          name: issue-947-canonical-package-replay
          path: .work/replay
          github-token: ${{ github.token }}
          repository: reallaksh19/Advanced_Analysis
          run-id: 31304001795

      - name: Scan failing plain source elements under CAESAR displacement field
        run: |
          node scripts/lfea-issue947-plain-frame-failure-scan.mjs \
            --package .work/package/bm4nl-canonical-package.json \
            --qualification .work/replay/bm4nl-replay-qualification.json \
            --out .work/issue947-plain-frame-failure-scan.json

      - name: Run CAESAR shear authority regression
        run: node scripts/lfea-issue947-caesar-pipe-shear-authority-check.mjs

      - name: Upload localization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-947-plain-frame-failure-scan
          if-no-files-found: error
          path: .work/issue947-plain-frame-failure-scan.json

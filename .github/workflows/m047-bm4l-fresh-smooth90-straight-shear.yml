name: M047 fresh BM4_L smooth90 then straight shear

on:
  push:
    branches: [agent/m047-bm4l-fresh-qualification]
    paths: ['.github/workflows/m047-bm4l-fresh-smooth90-straight-shear.yml']

permissions:
  contents: read

jobs:
  sequence:
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      COMMON_COMMIT: '45d51ea18624f5775805f399110c1738301c0d90'
      ZIP_SHA256: '978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9'
      MEMBER_SHA256: '64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8'
      ACE_URL: 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe'
      ACE_SHA256: '04e96c9f1a1f7d251a88aececf1dc10ff65950392787427c00814a43308003de'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m047-bm4l-fresh-qualification
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Install authenticated ACE and fetch pinned BM4_L
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/fresh-sequence/source,artifacts/fresh-sequence/baseline,artifacts/fresh-sequence/smooth90,artifacts/fresh-sequence/combined | Out-Null
          $installer=Join-Path $PWD 'artifacts/fresh-sequence/accessdatabaseengine_X64.exe'
          Invoke-WebRequest -Uri $env:ACE_URL -OutFile $installer
          if((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ACE_SHA256){ throw 'ACE installer hash mismatch.' }
          $sig=Get-AuthenticodeSignature $installer
          if($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft'){ throw 'ACE signature validation failed.' }
          $p=Start-Process $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if($p.ExitCode -notin @(0,3010)){ throw "ACE install failed: $($p.ExitCode)" }
          Remove-Item $installer -Force
          $zip=Join-Path $PWD 'artifacts/fresh-sequence/BM4_L.zip'
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/reallaksh19/Common/$env:COMMON_COMMIT/LFEA/BM4/BM4_L.zip" -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ZIP_SHA256){ throw 'ZIP hash mismatch.' }
          Expand-Archive $zip -DestinationPath artifacts/fresh-sequence/source -Force
          $accdb=Join-Path $PWD 'artifacts/fresh-sequence/source/BM4_L.ACCDB'
          if((Get-FileHash $accdb -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:MEMBER_SHA256){ throw 'ACCDB member hash mismatch.' }
          "ACCDB=$accdb" >> $env:GITHUB_ENV

      - name: State A - clean current-main baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb $env:ACCDB `
            --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json `
            --solve-linear true `
            --solve-cases L2,L3,L4,L5,L6,L14 `
            --actual-out artifacts/fresh-sequence/baseline/actual.json `
            --out artifacts/fresh-sequence/baseline/report.json

      - name: Enable authority-backed B31J smooth-90 1.3/h
        shell: python
        run: |
          import json
          from pathlib import Path
          p=Path('benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json')
          data=json.loads(p.read_text())
          entry=data['linearSolve']['b31jSmooth90FlexibilityCorrection']
          entry['enabled']=True
          entry['authorityStatus']='RESOLVED'
          entry['source']='HEXAGON_CAESAR_II_V14_B31J_METHODS_SMOOTH_90_1.3_OVER_H'
          p.write_text(json.dumps(data,indent=2)+'\n')

      - name: State B - smooth90 only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node scripts/lfea-b3.19-b31-factor-calculator-check.mjs
          node scripts/lfea-b3.21-b31j-phase2-factor-benchmark-check.mjs
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb $env:ACCDB `
            --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json `
            --solve-linear true `
            --solve-cases L2,L3,L4,L5,L6,L14 `
            --actual-out artifacts/fresh-sequence/smooth90/actual.json `
            --out artifacts/fresh-sequence/smooth90/report.json

      - name: Add diagnostic straight-span shear to smooth90 parent
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/core/fea-benchmarks/caesar-accdb-linear-solve.js')
          t=p.read_text()
          needle="    section: input.section,\n  });\n  const length = frame.geometry.length;"
          replacement="    section: input.section,\n    profile: isCaesarStraightPipeSpan(input.kind) ? caesarStraightPipeFrameProfile() : frameProfile(),\n  });\n  const length = frame.geometry.length;"
          if t.count(needle)!=1: raise SystemExit(f'buildFrameElement site {t.count(needle)}')
          t=t.replace(needle,replacement,1)
          needle2="    profile: frameProfile(),\n    distributedLoads: [],"
          replacement2="    profile: input.profile ?? frameProfile(),\n    distributedLoads: [],"
          if t.count(needle2)!=1: raise SystemExit(f'compileUnloadedFrame site {t.count(needle2)}')
          t=t.replace(needle2,replacement2,1)
          marker="function frameProfile() {\n  return sealFrameElementProfile({"
          helper="""function isCaesarStraightPipeSpan(kind) {
            return kind === 'FRAME' || kind === 'BEND_INCOMING_STRAIGHT';
          }

          function caesarStraightPipeFrameProfile() {
            return sealFrameElementProfile({
              schema: 'fea-linear-frame-element-profile/v1', profileId: 'LINEAR-FRAME-ELEMENT-R1',
              straightPipeFormulation: 'PIPE_FRAME3D_TIMOSHENKO_V1', shearDeformation: true,
              shearCorrectionFactorY: { value: 0.5, source: 'M047-FRESH-DIAGNOSTIC-KAPPA-0.5' },
              shearCorrectionFactorZ: { value: 0.5, source: 'M047-FRESH-DIAGNOSTIC-KAPPA-0.5' },
              releaseRule: 'STATIC_CONDENSATION_V1', thermalStrainApproximation: 'UNIFORM_TEMPERATURE_ALPHA_DELTA_T_V1',
              releaseSingularityTolerance: { value: 1e-12, source: PROFILE_SOURCE }, semanticHash: '',
            });
          }

          function frameProfile() {
            return sealFrameElementProfile({"""
          if t.count(marker)!=1: raise SystemExit(f'frameProfile site {t.count(marker)}')
          p.write_text(t.replace(marker,helper,1))

      - name: State C - smooth90 plus straight shear
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check src/core/fea-benchmarks/caesar-accdb-linear-solve.js
          node scripts/lfea-b3.1-frame-element-check.mjs
          node scripts/lfea-b3.1-reviewer-check.mjs
          node scripts/lfea-b3.2-piping-component-check.mjs
          node scripts/lfea-b3.3-solver-check.mjs
          node scripts/lfea-b3.4-recovery-check.mjs
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb $env:ACCDB `
            --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json `
            --solve-linear true `
            --solve-cases L2,L3,L4,L5,L6,L14 `
            --actual-out artifacts/fresh-sequence/combined/actual.json `
            --out artifacts/fresh-sequence/combined/report.json
          npm run check:core-fea

      - name: Build three-state evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          const fs=require('fs');
          const names=['baseline','smooth90','combined'];
          const R=Object.fromEntries(names.map(n=>[n,JSON.parse(fs.readFileSync(`artifacts/fresh-sequence/${n}/report.json`,'utf8').replace(/^\uFEFF/,''))]));
          const A=Object.fromEntries(names.map(n=>[n,JSON.parse(fs.readFileSync(`artifacts/fresh-sequence/${n}/actual.json`,'utf8').replace(/^\uFEFF/,''))]));
          const cases=['L2','L3','L4','L5','L6','L14'];
          const counts=(r,c)=>({restraint:r.restraintBasis.cases[c].exceedingComponentCount,displacementRotation:r.displacementBasis.cases[c].exceedingComponentCount,elementEnd:r.elementBasis.cases[c].exceedingComponentCount});
          const rows=(r,c)=>r.qualification.cases.find(x=>x.caseId===c).comparison.rows;
          function find(r,c,kind,prefix,quantity,component){const m=rows(r,c).filter(x=>x.entityKind===kind&&String(x.entityId).startsWith(prefix)&&x.quantity===quantity&&x.component===component);if(m.length!==1)throw new Error(`row ${c} ${prefix} ${quantity} ${component}: ${m.length}`);return m[0];}
          const targets=[['node 20090 UY','L2','NODE','20090','FORCE','UY'],['E4 TO FY','L2','ELEMENT','INPUT_ELEMENT:4|','GLOBAL_END_FORCE_TO','FY'],['E4 TO MZ','L2','ELEMENT','INPUT_ELEMENT:4|','GLOBAL_END_MOMENT_TO','MZ'],['E5 FROM FY','L2','ELEMENT','INPUT_ELEMENT:5|','GLOBAL_END_FORCE_FROM','FY'],['E5 FROM MZ','L2','ELEMENT','INPUT_ELEMENT:5|','GLOBAL_END_MOMENT_FROM','MZ'],['node 20120 RZ','L2','NODE','20120','ROTATION','RZ']];
          const highSignal=targets.map(t=>{const vals=Object.fromEntries(names.map(n=>[n,find(R[n],...t.slice(1))]));return {name:t[0],reference:vals.baseline.referenceValue,baseline:vals.baseline.actualValue,smooth90:vals.smooth90.actualValue,combined:vals.combined.actualValue,baselineAbsError:Math.abs(vals.baseline.actualValue-vals.baseline.referenceValue),smooth90AbsError:Math.abs(vals.smooth90.actualValue-vals.smooth90.referenceValue),combinedAbsError:Math.abs(vals.combined.actualValue-vals.combined.referenceValue)};});
          for(const n of names)for(const c of cases){if(A[n].mechanics.cases[c].executionStatus!=='QUALIFIED'||A[n].mechanics.cases[c].recoveredEquilibrium.status!=='PASS')throw new Error(`${n} ${c} integrity failed`);}
          const weights=Object.fromEntries(names.map(n=>[n,A[n].mechanics.cases.L2.gravityWeightN]));
          if(Math.max(...Object.values(weights))-Math.min(...Object.values(weights))>1e-9*Math.max(1,weights.baseline))throw new Error('gravity changed');
          const out={schema:'m047-bm4l-fresh-smooth90-straight-shear-sequence/v1',authority:{smooth90:'HEXAGON CAESAR II V14 B31J Methods: smooth 90-degree bend flexibility 1.3/h vs B31.3 1.65/h',straightShear:'DIAGNOSTIC_ONLY_PENDING_EXACT_COEFFICIENT_AUTHORITY'},counts:Object.fromEntries(cases.map(c=>[c,Object.fromEntries(names.map(n=>[n,counts(R[n],c)]))])),highSignal,gravityWeightN:weights,equilibrium:Object.fromEntries(names.map(n=>[n,Object.fromEntries(cases.map(c=>[c,{status:A[n].mechanics.cases[c].recoveredEquilibrium.status,maxResidual:A[n].mechanics.cases[c].recoveredEquilibrium.maximumAbsoluteResidual}]))]))};
          fs.writeFileSync('artifacts/fresh-sequence/sequence.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          '@ | node

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m047-bm4l-fresh-sequence-${{ github.sha }}
          path: artifacts/fresh-sequence
          retention-days: 30
          if-no-files-found: error

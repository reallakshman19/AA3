name: agent16-p11-p12-p13-p14-qualification

on:
  pull_request:
    paths:
      - 'scripts/advanced-shell-contract-check.mjs'
      - 'scripts/linear-piping-analysis-consumer-anti-drift-check.mjs'
      - 'scripts/linear-piping-inputxml-source-binding-check.mjs'
      - 'scripts/linear-piping-inputxml-analysis-context-check.mjs'
      - 'scripts/master-data-containment-check.mjs'
      - 'tests/master-data-audit-defects.test.js'
      - 'test/lfea-prefea-gateway.test.js'
      - 'src/core/linear-piping-analysis-consumer/**'
      - 'src/workspace/master-data-standalone-adapter.js'
      - '.github/workflows/agent16-p11-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prove exact-head execution and stacked containment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --exit-code
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/agent16-stack-paths.txt
          cat /tmp/agent16-stack-paths.txt
          while IFS= read -r changed; do
            case "$changed" in
              scripts/advanced-shell-contract-check.mjs|test/lfea-prefea-gateway.test.js|.github/workflows/agent16-p11-qualification.yml) ;;
              scripts/linear-piping-analysis-consumer-anti-drift-check.mjs|scripts/linear-piping-inputxml-source-binding-check.mjs|scripts/linear-piping-inputxml-analysis-context-check.mjs) ;;
              scripts/master-data-containment-check.mjs|tests/master-data-audit-defects.test.js|src/workspace/master-data-standalone-adapter.js) ;;
              src/core/linear-piping-analysis-consumer/inputxml-feature-inventory.js|src/core/linear-piping-analysis-consumer/inputxml-feature-inventory-restraints.js) ;;
              src/core/linear-piping-analysis-consumer/inputxml-linear-governed-solve.js|src/core/linear-piping-analysis-consumer/inputxml-model-health.js) ;;
              src/core/linear-piping-analysis-consumer/inputxml-linear-model-health.js|src/core/linear-piping-analysis-consumer/inputxml-linear-model-health-contract.js) ;;
              src/core/linear-piping-analysis-consumer/inputxml-linear-model-health-finding-support.js|src/core/linear-piping-analysis-consumer/inputxml-linear-model-health-findings.js|src/core/linear-piping-analysis-consumer/inputxml-linear-model-health-capabilities.js) ;;
              src/core/linear-piping-analysis-consumer/inputxml-linear-physical-cases.js|src/core/linear-piping-analysis-consumer/inputxml-linear-physical-cases-contract.js|src/core/linear-piping-analysis-consumer/inputxml-linear-physical-case-builders.js) ;;
              src/core/linear-piping-analysis-consumer/inputxml-linear-prefea-contract.js|src/core/linear-piping-analysis-consumer/inputxml-linear-prefea-diagnostics.js|src/core/linear-piping-analysis-consumer/inputxml-linear-prefea-findings.js) ;;
              src/core/linear-piping-analysis-consumer/inputxml-linear-prefea-preparation.js|src/core/linear-piping-analysis-consumer/inputxml-linear-prefea-preparation-records.js) ;;
              src/core/linear-piping-analysis-consumer/inputxml-linear-preparation-authorities.js|src/core/linear-piping-analysis-consumer/inputxml-linear-preparation-authority-support.js) ;;
              src/core/linear-piping-analysis-consumer/inputxml-linear-preparation-material-section-authorities.js|src/core/linear-piping-analysis-consumer/inputxml-linear-preparation-load-authorities.js) ;;
              src/core/linear-piping-analysis-consumer/inputxml-linear-solve-preparation.js|src/core/linear-piping-analysis-consumer/inputxml-linear-solve-preparation-contract.js) ;;
              src/core/linear-piping-analysis-consumer/inputxml-linear-stiffness-preflight.js|src/core/linear-piping-analysis-consumer/inputxml-linear-stiffness-preflight-contract.js) ;;
              src/core/linear-piping-analysis-consumer/inputxml-linear-structural-preparation.js|src/core/linear-piping-analysis-consumer/inputxml-linear-structural-preparation-contract.js) ;;
              *) echo "Forbidden changed path for stacked P-11/P-12/P-13/P-14 qualification: $changed" >&2; exit 1 ;;
            esac
          done < /tmp/agent16-stack-paths.txt

      - name: Install dependencies
        run: npm ci

      - name: P-11 governed shell contract
        run: node scripts/advanced-shell-contract-check.mjs

      - name: P-12 focused pre-FEA gateway public export contract
        run: node --test --test-name-pattern='PF-22 every public InputXML solve path requires authorization' test/lfea-prefea-gateway.test.js

      - name: Full pre-FEA gateway suite diagnostic
        continue-on-error: true
        run: node --test test/lfea-prefea-gateway.test.js

      - name: P-13 hidden-default inventory contract
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = 'src/core/linear-piping-analysis-consumer';
          const pattern = /function\s+\w+\s*\([^)]*=/gu;
          let count = 0;
          for (const name of fs.readdirSync(root).filter((value) => value.endsWith('.js')).sort()) {
            const file = path.join(root, name);
            const text = fs.readFileSync(file, 'utf8');
            for (const match of text.matchAll(pattern)) {
              const line = text.slice(0, match.index).split(/\r?\n/u).length;
              console.log(`${file}:${line}: ${match[0].replace(/\s+/gu, ' ')}`);
              count += 1;
            }
          }
          console.log(`HIDDEN_DEFAULT_PARAMETER inventory count: ${count}`);
          if (count !== 0) process.exitCode = 1;
          EOF

      - name: P-13 anti-drift modularity contract
        run: node scripts/linear-piping-analysis-consumer-anti-drift-check.mjs

      - name: P-13 parent-vs-head authority equivalence
        shell: bash
        run: |
          set -euo pipefail
          parent_sha='61953e11bea2677fcee5f119adf9d00f79ecdc2e'
          rm -rf /tmp/p13-parent /tmp/p13-parent-evidence /tmp/p13-head-evidence
          git worktree add --detach /tmp/p13-parent "$parent_sha"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/p13-parent/node_modules
          cat > /tmp/p13-model-health.mjs <<'EOF'
          import { pathToFileURL } from 'node:url';
          import path from 'node:path';
          const root = path.resolve(process.argv[2]);
          const sourceBinding = await import(pathToFileURL(path.join(root, 'src/core/linear-piping-analysis-consumer/inputxml-source-binding.js')));
          const modelHealth = await import(pathToFileURL(path.join(root, 'src/core/linear-piping-analysis-consumer/inputxml-linear-model-health.js')));
          const xml = `<PIPINGMODEL JOBNAME="P13_EQUIVALENCE"><PIPINGELEMENT FROM_NODE="10" TO_NODE="20" DELTA_X="1000" DELTA_Y="0" DELTA_Z="0" DIAMETER="100" WALL_THICK="5" MATERIAL_NAME="A106-B" PRESSURE1="1" TEMP_EXP_C1="50"><RESTRAINT NODE="10" TYPE="1" XCOSINE="1" YCOSINE="0" ZCOSINE="0"/></PIPINGELEMENT></PIPINGMODEL>`;
          const source = sourceBinding.parseInputXmlModelHealthSource(xml, {
            unit: 'mm', source: 'P13_EQUIVALENCE', componentOrigins: {},
            restraintTypeCodeMap: { 1: 'ANCHOR' }, restraintTypeMutation: { enabled: false, rows: [] },
            bendRadiusTolerance: 0.001, fileName: 'p13-equivalence.xml',
          });
          process.stdout.write(JSON.stringify(modelHealth.diagnoseInputXmlLinearModelHealth(source)));
          EOF
          node /tmp/p13-model-health.mjs /tmp/p13-parent > /tmp/p13-parent-model-health.json
          node /tmp/p13-model-health.mjs "$GITHUB_WORKSPACE" > /tmp/p13-head-model-health.json
          cmp /tmp/p13-parent-model-health.json /tmp/p13-head-model-health.json
          PREFEA_EVIDENCE_DIR=/tmp/p13-parent-evidence node /tmp/p13-parent/scripts/lfea-prefea-qualification.mjs
          PREFEA_EVIDENCE_DIR=/tmp/p13-head-evidence node scripts/lfea-prefea-qualification.mjs
          for artifact in prefea-diagnostics.json prefea-preparation.json solve-authorization.json prefea-findings.csv prefea-capabilities.csv prefea-negative-controls.json; do
            cmp "/tmp/p13-parent-evidence/$artifact" "/tmp/p13-head-evidence/$artifact"
          done

      - name: P-14 delta containment — no active runtime or physics edit
        shell: bash
        run: |
          set -euo pipefail
          p13_sha='2c8b029ad8bbfd1a1a9e4d5cae6aeb548abd3d67'
          git diff --name-only "$p13_sha" HEAD > /tmp/p14-paths.txt
          cat /tmp/p14-paths.txt
          while IFS= read -r changed; do
            case "$changed" in
              scripts/master-data-containment-check.mjs|tests/master-data-audit-defects.test.js|src/workspace/master-data-standalone-adapter.js|.github/workflows/agent16-p11-qualification.yml) ;;
              *) echo "P-14 changed an active or unqualified path: $changed" >&2; exit 1 ;;
            esac
          done < /tmp/p14-paths.txt

      - name: P-14 F-001 through F-007 containment contract
        run: node scripts/master-data-containment-check.mjs

      - name: P-14 executable audit tests
        run: node --test tests/master-data-audit-defects.test.js

      - name: P-14 governed empirical consumer regression
        run: node scripts/authorized-enrichment-consumer-controller-check.mjs

      - name: P-14 governed empirical consumer anti-drift
        run: node scripts/authorized-enrichment-consumer-controller-anti-drift-check.mjs

      - name: Required 1 — strict syntax
        run: npm run syntax:strict

      - name: Required 2 — import graph
        run: node scripts/import-check.mjs

      - name: Required 3 — enrichment UI phase 0
        run: node scripts/run-enrichment-ui-phase0-checks.mjs

      - name: Required 4 — linear piping workspace integration
        run: node scripts/linear-piping-workspace-integration-check.mjs

      - name: Required 5 — UI invariants
        run: node scripts/ui-invariant-check.mjs

      - name: Required 6 — production Vite build
        run: npx vite build

      - name: Report qualification
        run: |
          printf '%s\n' \
            'P-11 governed shell contract PASS' \
            'P-12 focused gateway contract PASS' \
            'P-13 hidden-default inventory PASS' \
            'P-13 anti-drift modularity PASS' \
            'P-13 parent/head authority equivalence PASS' \
            'P-14 F-001..F-007 containment PASS' \
            'P-14 governed empirical consumer regression PASS' \
            'P-14 active-runtime delta containment PASS' \
            'npm run syntax:strict PASS' \
            'node scripts/import-check.mjs PASS' \
            'node scripts/run-enrichment-ui-phase0-checks.mjs PASS' \
            'node scripts/linear-piping-workspace-integration-check.mjs PASS' \
            'node scripts/ui-invariant-check.mjs PASS' \
            'npx vite build PASS'

name: M047 temporary pinned-source baseline probe

on:
  push:
    branches:
      - agent/m047-bm4l-root-cause
    paths:
      - '.github/workflows/m047-pinned-source-baseline-probe.yml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install authenticated Microsoft ACE provider
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/bm4l | Out-Null
          $installer = Join-Path $PWD 'artifacts/bm4l/accessdatabaseengine_X64.exe'
          $url = 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '04e96c9f1a1f7d251a88aececf1dc10ff65950392787427c00814a43308003de') { throw "ACE installer hash mismatch $hash" }
          $sig = Get-AuthenticodeSignature $installer
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'ACE installer signature invalid.' }
          $process = Start-Process $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if ($process.ExitCode -notin @(0,3010)) { throw "ACE install failed $($process.ExitCode)" }
          Remove-Item $installer -Force

      - name: Fetch exact pinned ZIP member
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD 'artifacts/bm4l/BM4_L.zip'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/reallaksh19/Common/45d51ea18624f5775805f399110c1738301c0d90/LFEA/BM4/BM4_L.zip' -OutFile $zip
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne '978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9') { throw "ZIP hash mismatch $zipHash" }
          Expand-Archive $zip -DestinationPath artifacts/bm4l/source -Force
          $accdb = Join-Path $PWD 'artifacts/bm4l/source/BM4_L.ACCDB'
          $hash = (Get-FileHash $accdb -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8') { throw "Pinned member hash changed $hash" }
          if ((Get-Item $accdb).Length -ne 5136384) { throw 'Pinned member size mismatch.' }

      - name: Run governed six-case benchmark from pinned member
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb artifacts/bm4l/source/BM4_L.ACCDB `
            --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json `
            --solve-linear true `
            --solve-cases L2,L3,L4,L5,L6,L14 `
            --actual-out artifacts/bm4l/bm4l-actual.json `
            --out artifacts/bm4l/bm4l-report.json `
            --summary-out artifacts/bm4l/bm4l-summary.md

      - name: Build root-cause report and print frozen counts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/lfea-bm4l-root-cause-report.mjs `
            --actual artifacts/bm4l/bm4l-actual.json `
            --report artifacts/bm4l/bm4l-report.json `
            --out artifacts/bm4l/bm4l-root-cause.json
          $report = Get-Content -Raw artifacts/bm4l/bm4l-report.json | ConvertFrom-Json -Depth 100
          $expected = @{
            L2=@(4,115,142); L3=@(9,98,179); L4=@(6,66,86);
            L5=@(3,72,162); L6=@(1,64,50); L14=@(9,98,179)
          }
          $observed = [ordered]@{}
          foreach ($case in $report.qualification.cases) {
            $id = [string]$case.caseId
            if (-not $expected.ContainsKey($id)) { continue }
            $rows = @($case.comparison.rows)
            $r = @($rows | Where-Object { $_.status -eq 'FAIL' -and $_.entityKind -eq 'NODE' -and $_.quantity -in @('FORCE','MOMENT') }).Count
            $d = @($rows | Where-Object { $_.status -eq 'FAIL' -and $_.entityKind -eq 'NODE' -and $_.quantity -in @('DISPLACEMENT','ROTATION') }).Count
            $e = @($rows | Where-Object { $_.status -eq 'FAIL' -and $_.entityKind -eq 'ELEMENT' -and $_.quantity -like 'GLOBAL_END_*' }).Count
            $observed[$id] = @($r,$d,$e)
            $want = $expected[$id]
            if ($r -ne $want[0] -or $d -ne $want[1] -or $e -ne $want[2]) {
              throw "Frozen baseline mismatch $id observed $r/$d/$e expected $($want -join '/')"
            }
          }
          [ordered]@{
            schema='m047-pinned-source-baseline-reproduction/v1'
            sourceAccdbSha256=$report.source.sha256
            frozenCountsReproduced=$true
            observed=$observed
          } | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 artifacts/bm4l/baseline-reproduction.json

      - name: Targeted regressions
        run: |
          node scripts/lfea-b3.3-solver-check.mjs
          node scripts/lfea-b3.4-recovery-check.mjs
          node scripts/lfea-b3.6-sparse-assembly-check.mjs
          node scripts/lfea-b3.9-gravity-self-weight-check.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m047-pinned-source-baseline-probe
          path: artifacts/bm4l
          if-no-files-found: error

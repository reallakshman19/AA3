name: M047 BM4_L bend axial-shape applicability audit

on:
  push:
    branches: [agent/m047-bm4l-root-cause]
    paths: ['.github/workflows/m047-bm4l-bend-axial-shape-audit.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      COMMON_COMMIT: '45d51ea18624f5775805f399110c1738301c0d90'
      ZIP_SHA256: '978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9'
      MEMBER_SHA256: '64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8'
      ACE_URL: 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe'
      ACE_SHA256: '04e96c9f1a1f7d251a88aececf1dc10ff65950392787427c00814a43308003de'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m047-bm4l-root-cause
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install authenticated ACE and fetch pinned source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/axial-shape/source | Out-Null
          $installer=Join-Path $PWD 'artifacts/axial-shape/accessdatabaseengine_X64.exe'
          Invoke-WebRequest -Uri $env:ACE_URL -OutFile $installer
          if((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ACE_SHA256){ throw 'ACE installer hash mismatch.' }
          $sig=Get-AuthenticodeSignature $installer
          if($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft'){ throw 'ACE signature validation failed.' }
          $p=Start-Process $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if($p.ExitCode -notin @(0,3010)){ throw "ACE install failed: $($p.ExitCode)" }
          Remove-Item $installer -Force
          $zip=Join-Path $PWD 'artifacts/axial-shape/BM4_L.zip'
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/reallaksh19/Common/$env:COMMON_COMMIT/LFEA/BM4/BM4_L.zip" -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ZIP_SHA256){ throw 'ZIP hash mismatch.' }
          Expand-Archive $zip -DestinationPath artifacts/axial-shape/source -Force
          $accdb=Join-Path $PWD 'artifacts/axial-shape/source/BM4_L.ACCDB'
          if((Get-FileHash $accdb -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:MEMBER_SHA256){ throw 'ACCDB member hash mismatch.' }
          "ACCDB=$accdb" >> $env:GITHUB_ENV

      - name: Export governed bend geometry tables
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\scripts\lfea-caesar-accdb-export.ps1 `
            -AccdbPath $env:ACCDB `
            -TablesCsv 'INPUT_BENDS,INPUT_BASIC_ELEMENT_DATA,INPUT_NODAL_COORDINATES' `
            | Set-Content -Encoding utf8 artifacts/axial-shape/bend-tables.json

      - name: Record profile consumption audit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $matches = Select-String -Path src/core/fea-benchmarks/caesar-accdb-linear-solve.js -Pattern 'bendAxialShape|BEND_AXIAL_SHAPE' -AllMatches
          $profile = Get-Content -Raw benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json | ConvertFrom-Json -Depth 100
          [ordered]@{
            schema='m047-bm4l-bend-axial-shape-consumption-audit/v1'
            sourceAccdbSha256=$env:MEMBER_SHA256
            configuredGlobalSetting=$profile.configurationAuthority.layers.overallGlobalDefault.settings.BEND_AXIAL_SHAPE
            normalizedSolveProfile=$profile.linearSolve.bendAxialShape
            solverSourceMatchCount=@($matches).Count
            solverSourceMatches=@($matches | ForEach-Object { [ordered]@{ lineNumber=$_.LineNumber; line=$_.Line.Trim() } })
            interpretation='A profile declaration alone is not evidence that the solve consumes the CAESAR bend axial shape mode.'
          } | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 artifacts/axial-shape/consumption-audit.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m047-bm4l-bend-axial-shape-audit-${{ github.sha }}
          path: artifacts/axial-shape
          retention-days: 14
          if-no-files-found: error

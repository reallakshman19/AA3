highest_risk: >-
  None blocking. ACCDB's full six-step production browser walkthrough remains
  NOT_RUN because no real CAESAR II .accdb binary is committed to this repo
  (a pre-existing, deliberate project decision -- see
  e2e/lfea-pipeline-accdb-input.spec.js and lfea-pipeline-accdb-real-model.spec.js
  -- fabricating one was already judged out of proportion). The ACCDB input
  panel's own structural spec, its source-picker option, and its common
  Error Check integration are all covered by focused/source checks that PASS.
real_defects_found_and_fixed:
  - scripts/lfea-ui-diagnostic-presentation-check.mjs used FakeDocument/FakeElement
    before their class declarations (classes are not hoisted like functions),
    throwing ReferenceError on every run. This blocked check:lfea-workbench from
    ever completing. Fixed by reordering; no assertion logic changed.
  - Six e2e specs from earlier UI03-UI07 stages had apparently never been run
    against the real app, and showed wrong data-role selectors, missing
    Apply-selection/re-authorize steps, a missing loaded-model precondition, a
    wrong tab click, and strict-mode text-matcher collisions. All fixed in the
    spec files only; zero product-code defects found among them.
out_of_scope_findings_not_fixed_here:
  - src/workspace/bootstrap.js queries the identical "lafea-consumer-root"
    selector for both its lafeaRoot and lfeaRoot variables (should be
    "lfea-consumer-root" for the latter). Currently harmless, as neither root
    is used by the live F LFEA pipeline shell this PR ships. Not in this PR's
    diff.
  - src/workspace/lfea-pipeline-stagedjson-input-panel.js (outside this PR's
    diff) duplicates the data-role "lfea-pipeline-stagedjson-infer-od" from
    src/workspace/lfea-source-acquisition.js. Harmless in production due to
    consistent DOM ordering, but ambiguous for any selector using it.
  - Production build's bundle-chunk-check.mjs fails on main-*.js exceeding its
    size budget. Confirmed via a direct build of base commit a222e18c that this
    is pre-existing on main (1,529,892 bytes there vs. 1,550,351 bytes on this
    PR's head against a 1,179,648 byte limit) -- this PR adds ~20KB on top of
    an already-over-budget baseline, not the ~370KB gap itself.

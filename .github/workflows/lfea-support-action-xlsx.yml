name: lfea-support-action-xlsx

on:
  pull_request:
    paths:
      - 'src/workspace/linear-piping-support-action-xlsx.js'
      - 'scripts/linear-piping-support-action-xlsx-check.mjs'
      - 'scripts/linear-piping-support-action-xlsx-source-guard.mjs'
      - '.github/workflows/lfea-support-action-xlsx.yml'

permissions:
  contents: read

jobs:
  qualify-support-action-xlsx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove exact-head execution
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --exit-code

      - name: Qualify engineering and audit-only XLSX behavior
        run: node scripts/linear-piping-support-action-xlsx-check.mjs

      - name: Enforce blocked-value and provenance custody
        run: node scripts/linear-piping-support-action-xlsx-source-guard.mjs

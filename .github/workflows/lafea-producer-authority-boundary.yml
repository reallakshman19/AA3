name: LAFEA producer authority boundary

on:
  pull_request:
    paths:
      - 'src/workspace/lafea-shell-mesh-producer.js'
      - 'scripts/lafea-producer-authority-boundary-check.mjs'
      - '.github/workflows/lafea-producer-authority-boundary.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --exit-code

      - name: Producer authority boundary
        run: node scripts/lafea-producer-authority-boundary-check.mjs

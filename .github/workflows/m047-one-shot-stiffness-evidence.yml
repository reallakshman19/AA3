name: M047 one-shot source replay stiffness evidence

on:
  push:
    branches: [agent/m047-bm4l-root-cause]
    paths: ['.github/workflows/m047-one-shot-stiffness-evidence.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m047-bm4l-root-cause
          fetch-depth: 0

      - name: Retain sealed element stiffness and axes in evidence ledger
        shell: python
        run: |
          from pathlib import Path
          path=Path('src/core/fea-benchmarks/caesar-accdb-linear-solve.js')
          text=path.read_text()
          old="""        jointDisplacement12: recoveredAction.jointDisplacement12,\n        globalElasticAction: recoveredAction.globalElasticAction,\n        equivalentLoadGlobal: recoveredAction.entry.contribution.equivalentLoadGlobal,"""
          new="""        jointDisplacement12: recoveredAction.jointDisplacement12,\n        globalStiffness: recoveredAction.entry.contribution.globalStiffness,\n        localAxes: recoveredAction.entry.axesResult.axes,\n        globalElasticAction: recoveredAction.globalElasticAction,\n        equivalentLoadGlobal: recoveredAction.entry.contribution.equivalentLoadGlobal,"""
          if text.count(old)!=1:
              raise SystemExit(f'expected one recovery-ledger insertion point, found {text.count(old)}')
          path.write_text(text.replace(old,new,1))

      - name: Validate syntax and core recovery checks
        shell: bash
        run: |
          node --check src/core/fea-benchmarks/caesar-accdb-linear-solve.js
          node scripts/lfea-b3.4-recovery-check.mjs

      - name: Retire one-shot and publish evidence-only change
        shell: bash
        run: |
          rm .github/workflows/m047-one-shot-stiffness-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/fea-benchmarks/caesar-accdb-linear-solve.js .github/workflows/m047-one-shot-stiffness-evidence.yml
          git diff --cached --check
          git commit -m "test(lfea): retain source replay stiffness evidence"
          git push origin HEAD:agent/m047-bm4l-root-cause

name: M047 BM4_L bend pressure-stiffening audit

on:
  push:
    branches: [agent/m047-bm4l-fresh-qualification]
    paths: ['.github/workflows/m047-bm4l-bend-pressure-stiffening-audit.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MODEL_COMMON_COMMIT: '45d51ea18624f5775805f399110c1738301c0d90'
      REPORT_COMMON_COMMIT: '179c4831cf521cf797c13699cfbbd118315c9244'
      ZIP_SHA256: '978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9'
      MEMBER_SHA256: '64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8'
      MISC_SHA256: 'a2f5d5d3d76c8c2ea48e32495129b3689a6c5679de7ba11f03d2f780625692c4'
      ACE_URL: 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe'
      ACE_SHA256: '04e96c9f1a1f7d251a88aececf1dc10ff65950392787427c00814a43308003de'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m047-bm4l-fresh-qualification
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Bind pinned model and CAESAR report
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $PSNativeCommandUseErrorActionPreference=$true
          New-Item -ItemType Directory -Force artifacts/bend-pressure/source,artifacts/bend-pressure/run | Out-Null
          $installer='artifacts/bend-pressure/accessdatabaseengine_X64.exe'
          Invoke-WebRequest -Uri $env:ACE_URL -OutFile $installer
          if((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ACE_SHA256){throw 'ACE hash mismatch'}
          $sig=Get-AuthenticodeSignature $installer
          if($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft'){throw 'ACE signature failure'}
          $p=Start-Process $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if($p.ExitCode -notin @(0,3010)){throw "ACE install failed $($p.ExitCode)"}
          Remove-Item $installer -Force
          $zip='artifacts/bend-pressure/BM4_L.zip'
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/reallaksh19/Common/$env:MODEL_COMMON_COMMIT/LFEA/BM4/BM4_L.zip" -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ZIP_SHA256){throw 'ZIP hash mismatch'}
          Expand-Archive $zip -DestinationPath artifacts/bend-pressure/source -Force
          $accdb=Join-Path $PWD 'artifacts/bend-pressure/source/BM4_L.ACCDB'
          if((Get-FileHash $accdb -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:MEMBER_SHA256){throw 'ACCDB hash mismatch'}
          "ACCDB=$accdb" >> $env:GITHUB_ENV
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/reallaksh19/Common/$env:REPORT_COMMON_COMMIT/LFEA/BM4/Miscdata_BM4_L.txt" -OutFile artifacts/bend-pressure/Miscdata_BM4_L.txt
          if((Get-FileHash artifacts/bend-pressure/Miscdata_BM4_L.txt -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:MISC_SHA256){throw 'Misc report hash mismatch'}

      - name: Add runtime-only effective bend factor evidence
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/core/fea-benchmarks/caesar-accdb-linear-solve.js')
          t=p.read_text()
          needle='      bendPointers: bendDefinitions.map((entry) => entry.pointer),'
          repl='''      bendPointers: bendDefinitions.map((entry) => entry.pointer),
                diagnosticBends: bendDefinitions.map((entry) => {
                  const sourceRow = sourceRows.find((row) => String(row.ELEMENTID) === entry.sourceElementId);
                  return {
                    pointer: entry.pointer,
                    sourceElementId: entry.sourceElementId,
                    fromNode: String(sourceRow.FROM_NODE),
                    toNode: String(sourceRow.TO_NODE),
                    pressure1Kpa: Number(sourceRow.PRESSURE1),
                    hydroPressureKpa: Number(sourceRow.HYDRO_PRESSURE),
                    componentFlexibility: entry.component.flexibility,
                  };
                }),'''
          if t.count(needle)!=1: raise SystemExit(f'bend evidence site count={t.count(needle)}')
          p.write_text(t.replace(needle,repl,1))

      - name: Solve production L4 and retain factor evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $PSNativeCommandUseErrorActionPreference=$true
          node --check src/core/fea-benchmarks/caesar-accdb-linear-solve.js
          node scripts/lfea-m047-caesar-straight-pipe-shear-authority-check.mjs
          node scripts/lfea-m047-mec21-bend-shear-authority-check.mjs
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb $env:ACCDB `
            --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json `
            --solve-linear true `
            --solve-cases L4 `
            --actual-out artifacts/bend-pressure/run/actual.json `
            --out artifacts/bend-pressure/run/report.json

      - name: Compare effective factors to CAESAR MISC BEND REPORT
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $PSNativeCommandUseErrorActionPreference=$true
          @'
          const fs=require('fs');
          const A=JSON.parse(fs.readFileSync('artifacts/bend-pressure/run/actual.json','utf8').replace(/^\uFEFF/,''));
          const text=fs.readFileSync('artifacts/bend-pressure/Miscdata_BM4_L.txt','utf8');
          const report=[];
          const re=/^\s*(\d+)\s+None\s+([0-9.]+)\s+[0-9.]+->\s*[0-9.]+\s+[0-9.]+->\s*[0-9.]+\s+[0-9.]+->\s*[0-9.]+\s+([0-9.]+)->\s*([0-9.]+)\s+([0-9.]+)->\s*([0-9.]+)/gm;
          let m;
          while((m=re.exec(text))!==null){
            report.push({nodeId:String(Number(m[1])),h:Number(m[2]),flexInMin:Number(m[3]),flexInMax:Number(m[4]),flexOutMin:Number(m[5]),flexOutMax:Number(m[6])});
          }
          if(report.length!==12) throw new Error(`expected 12 reported bends, parsed ${report.length}`);
          const byNode=new Map(report.map(r=>[r.nodeId,r]));
          const bends=A.mechanics.cases.L4.diagnosticBends;
          if(bends.length!==12) throw new Error(`expected 12 solver bends, got ${bends.length}`);
          const comparisons=bends.map(b=>{
            const r=byNode.get(String(b.toNode));
            if(!r) throw new Error(`no CAESAR bend report row for source ${b.sourceElementId} TO ${b.toNode}`);
            const f=Number(b.componentFlexibility.factor);
            const lower=Math.min(r.flexInMin,r.flexInMax),upper=Math.max(r.flexInMin,r.flexInMax);
            const roundedTolerance=0.0015;
            const withinPrintedRange=f>=lower-roundedTolerance&&f<=upper+roundedTolerance;
            const distanceToMin=Math.abs(f-r.flexInMin),distanceToMax=Math.abs(f-r.flexInMax);
            const unpressurizedSmooth90=1.3/r.h;
            return {
              sourceElementId:b.sourceElementId,bendNode:r.nodeId,h:r.h,
              solverEffectiveFlexibility:f,
              factorSource:b.componentFlexibility.factorSource,
              pressureBasis:b.componentFlexibility.pressureBasis,
              pressureStiffeningRule:b.componentFlexibility.pressureStiffeningRule,
              sourcePressure1Kpa:b.pressure1Kpa,sourceHydroPressureKpa:b.hydroPressureKpa,
              caesarPrinted:{min:r.flexInMin,max:r.flexInMax,outMin:r.flexOutMin,outMax:r.flexOutMax},
              smooth90UnpressurizedFromPrintedH:unpressurizedSmooth90,
              withinPrintedRange,distanceToMin,distanceToMax,
              closestPrintedEndpoint:distanceToMin<=distanceToMax?'MIN':'MAX'
            };
          });
          const failures=comparisons.filter(x=>!x.withinPrintedRange);
          const out={
            schema:'m047-bm4l-bend-pressure-stiffening-factor-audit/v1',
            source:{modelCommonCommit:process.env.MODEL_COMMON_COMMIT,reportCommonCommit:process.env.REPORT_COMMON_COMMIT,accdbSha256:process.env.MEMBER_SHA256,miscdataSha256:process.env.MISC_SHA256},
            profile:A.mechanics.profile.bendPressureStiffening,
            comparisons,failures,
            recoveredEquilibrium:A.mechanics.cases.L4.recoveredEquilibrium,
            disposition:failures.length===0?'PRESSURE_STIFFENED_FACTORS_MATCH_CAESAR_PRINTED_RANGES':'FACTOR_MISMATCH_REQUIRES_MECHANICS_INVESTIGATION'
          };
          fs.writeFileSync('artifacts/bend-pressure/audit.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          if(failures.length) process.exitCode=2;
          '@ | node

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m047-bm4l-bend-pressure-stiffening-audit-${{ github.sha }}
          path: artifacts/bend-pressure
          retention-days: 30
          if-no-files-found: error

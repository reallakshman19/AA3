name: M047 one-shot provenance repair

on:
  push:
    branches: [agent/m047-bm4l-root-cause]
    paths: ['.github/workflows/m047-one-shot-proof-hardening.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m047-bm4l-root-cause
          fetch-depth: 0

      - name: Allow canonical hashing of empty evidence sets
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/lfea-m047-bm4l-accdb-provenance.ps1')
          text = path.read_text()
          old = "param([Parameter(Mandatory = $true)][string]$Text)"
          new = "param([Parameter(Mandatory = $true)][AllowEmptyString()][string]$Text)"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Get-TextSha256 parameter declaration, found {text.count(old)}')
          path.write_text(text.replace(old, new))

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw 'scripts/lfea-m047-bm4l-accdb-provenance.ps1'))

      - name: Retire this one-shot and publish repair
        shell: bash
        run: |
          rm .github/workflows/m047-one-shot-proof-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lfea-m047-bm4l-accdb-provenance.ps1 .github/workflows/m047-one-shot-proof-hardening.yml
          git diff --cached --check
          git commit -m "fix BM4_L empty provenance hashing"
          git push origin HEAD:agent/m047-bm4l-root-cause

name: LoadCalc restraint semantics qualification

on:
  push:
    paths:
      - 'public/Sjson.json'
      - 'src/core/shared-piping-model/support-evidence.js'
      - 'src/core/support-restraints/**'
      - 'src/workspace/load-calc-consumer-view.js'
      - 'src/workspace/topology-edit/**'
      - 'tests/loadcalc-production-sjson-restraint-semantics.test.mjs'
      - 'tests/loadcalc-topology-review-separation.test.mjs'
      - 'tests/topology-edit-sjson-restraint-projection.test.mjs'
      - 'tests/topology-edit-production-sjson-topofix.test.mjs'
      - 'e2e/topology-edit-sjson-render-authority.spec.js'
      - 'scripts/w10.3-restraint-capability-contract-check.mjs'
      - '.github/workflows/loadcalc-restraint-semantics-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run production SJSON and restraint regressions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/qualification
          {
            node --test tests/loadcalc-production-sjson-restraint-semantics.test.mjs
            node --test tests/topology-edit-sjson-restraint-projection.test.mjs
            node --test tests/loadcalc-topology-review-separation.test.mjs
            node --test tests/topology-edit-production-sjson-topofix.test.mjs
            node scripts/w10.3-restraint-capability-contract-check.mjs
          } 2>&1 | tee reports/qualification/loadcalc-restraint-node.log
      - name: Build production bundle
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee reports/qualification/loadcalc-restraint-build.log
      - name: Install pinned Chromium runtime
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: npx playwright install --with-deps chromium
      - name: Run production SJSON Chromium authority journey
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-playwright.mjs e2e/topology-edit-sjson-render-authority.spec.js 2>&1 | tee reports/qualification/loadcalc-restraint-chromium.log
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadcalc-restraint-semantics-${{ github.sha }}
          path: |
            reports/qualification/*.log
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 30

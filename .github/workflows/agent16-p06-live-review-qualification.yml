name: agent16-p06-live-indexed-review

on:
  pull_request:
    paths:
      - 'src/workspace/lfea-preflight-ui.js'
      - 'src/workspace/lfea-preflight-phase1.css'
      - 'scripts/lfea-preflight-phase1-live-integration-check.mjs'
      - '.github/workflows/agent16-p06-live-review-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prove exact head and P-06 live containment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --exit-code
          anchor='373361648a71572be065f114588b2c3cd75fe2e0'
          git diff --name-only "$anchor" HEAD > /tmp/p06-live-paths.txt
          cat /tmp/p06-live-paths.txt
          while IFS= read -r changed; do
            case "$changed" in
              src/workspace/lfea-preflight-ui.js|src/workspace/lfea-preflight-phase1.css|scripts/lfea-preflight-phase1-live-integration-check.mjs|.github/workflows/agent16-p06-live-review-qualification.yml) ;;
              *) echo "P-06 live integration changed an unqualified path: $changed" >&2; exit 1 ;;
            esac
          done < /tmp/p06-live-paths.txt

      - name: Install dependencies
        run: npm ci

      - name: Materialize merged P-01 anchor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p01-anchor
          git worktree add --detach /tmp/p01-anchor 373361648a71572be065f114588b2c3cd75fe2e0
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/p01-anchor/node_modules

      - name: P-06 live indexed Phase-1 mount
        run: node scripts/lfea-preflight-phase1-live-integration-check.mjs

      - name: P-06C live review and Trace surface
        run: node scripts/lfea-preflight-phase1-review-surface-check.mjs

      - name: Preserve P-06A indexed review core
        run: node scripts/lfea-preflight-phase1-indexed-model-check.mjs

      - name: Preserve P-06B 100k-line / 1m-component virtualization
        run: node scripts/lfea-preflight-phase1-virtualization-v3-check.mjs

      - name: Preserve P-06C immutable review session
        run: node scripts/lfea-preflight-phase1-review-session-check.mjs

      - name: Preserve P-02A topology review contract
        run: node scripts/lfea-topology-review-model-check.mjs

      - name: Preserve P-02B retained topology review integration
        run: node scripts/lfea-topology-review-prefea-integration-v2-check.mjs

      - name: Preserve P-01 retired topology-autofix-log guard
        run: node scripts/lfea-p01-retired-topology-autofix-log-check.mjs

      - name: Preserve P-10 traceability
        run: node scripts/lfea-p10-capability-effects-traceability-check.mjs

      - name: Preserve P-09 sealed Run gate
        run: node scripts/linear-piping-run-gate-check.mjs

      - name: Preserve P-09 legacy M003 governed BLOCK
        run: node scripts/linear-piping-live-run-workbench-check.mjs

      - name: Preserve P-07 native InputXML intake
        run: node scripts/linear-piping-inputxml-native-intake-check.mjs

      - name: Preserve P-07 visible Source and Pre-flight workflow
        run: node scripts/linear-piping-inputxml-source-workflow-check.mjs

      - name: Preserve P-08 governed Analyzer integration
        run: node scripts/linear-piping-inputxml-analyzer-integration-check.mjs

      - name: M003 core mechanics merged-anchor/head equivalence
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/p06-live-m003.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const root = path.resolve(process.argv[2]);
          const { buildM003LiveRunRequest } = await import(pathToFileURL(path.join(root, 'scripts/m003-live-run-analysis-fixture.mjs')));
          const { compileLinearPipingInputXmlAnalysisContext } = await import(pathToFileURL(path.join(root, 'src/core/linear-piping-analysis-consumer/index.js')));
          const high = buildM003LiveRunRequest().cases.find((entry) => entry.caseId === 'HIGH');
          const context = compileLinearPipingInputXmlAnalysisContext(high.inputXmlAnalysisRequest, { factorizationCache: new Map() });
          const result = context.sourceAnalysisContext.analysisResult;
          const reaction = (dof) => result.execution.reactions.find((entry) => entry.nodeId === 'RED-001.N0' && entry.dof === dof)?.value;
          const uy = reaction('UY');
          const rz = reaction('RZ');
          assert.ok(Math.abs(uy + 1000) < 1e-8);
          assert.ok(Math.abs(rz + 2400) < 1e-8);
          process.stdout.write(JSON.stringify({ status: result.status, semanticHash: result.semanticHash, uy, rz }));
          EOF
          node /tmp/p06-live-m003.mjs /tmp/p01-anchor > /tmp/p01-m003.json
          node /tmp/p06-live-m003.mjs "$GITHUB_WORKSPACE" > /tmp/p06-live-m003.json
          cmp /tmp/p01-m003.json /tmp/p06-live-m003.json
          cat /tmp/p06-live-m003.json

      - name: Linear piping consumer anti-drift
        run: node scripts/linear-piping-analysis-consumer-anti-drift-check.mjs

      - name: Prove PF-16 carried-red parity on merged anchor and head
        shell: bash
        run: |
          set -euo pipefail
          pattern='^PF-16 BLOCK cannot be overridden$'
          set +e
          (cd /tmp/p01-anchor && node --test --test-name-pattern="$pattern" test/lfea-prefea-gateway.test.js) > /tmp/p01-pf16.log 2>&1
          anchor_status=$?
          node --test --test-name-pattern="$pattern" test/lfea-prefea-gateway.test.js > /tmp/p06-live-pf16.log 2>&1
          head_status=$?
          set -e
          test "$anchor_status" -ne 0
          test "$head_status" -ne 0
          for log in /tmp/p01-pf16.log /tmp/p06-live-pf16.log; do
            grep -F 'Preparation retains prohibited runtime state.' "$log"
            grep -F '# fail 1' "$log"
          done

      - name: Pre-FEA gateway regressions excluding proven PF-16
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-name-pattern='^PF-(0[1-9]|1[0-5]|1[7-9]|2[0-4]) ' test/lfea-prefea-gateway.test.js
          node --test --test-name-pattern='^Exercise [GH] ' test/lfea-prefea-gateway.test.js
          node --test --test-name-pattern='^solver runtime ' test/lfea-prefea-gateway.test.js

      - name: Linear piping consumer regression
        run: node scripts/linear-piping-analysis-consumer-check.mjs

      - name: Closed-form mechanics merged-anchor/head equivalence
        shell: bash
        run: |
          set -euo pipefail
          for script in lfea-b3.7-simply-supported-beam-check.mjs lfea-b3.8-thermal-expansion-check.mjs lfea-b3.9-gravity-self-weight-check.mjs; do
            stem="${script%.mjs}"
            (cd /tmp/p01-anchor && node "scripts/$script") > "/tmp/p01-$stem.log"
            node "scripts/$script" > "/tmp/p06-live-$stem.log"
            cmp "/tmp/p01-$stem.log" "/tmp/p06-live-$stem.log"
          done

      - name: Required 1 — strict syntax
        run: npm run syntax:strict

      - name: Required 2 — import graph
        run: node scripts/import-check.mjs

      - name: Required 3 — enrichment UI phase 0
        run: node scripts/run-enrichment-ui-phase0-checks.mjs

      - name: Required 4 — linear piping workspace integration
        run: node scripts/linear-piping-workspace-integration-check.mjs

      - name: Required 5 — UI invariants
        run: node scripts/ui-invariant-check.mjs

      - name: Required 6 — production Vite build
        run: npx vite build

      - name: Report P-06 live qualification
        run: |
          printf '%s\n' \
            'P-06 live Phase-1 indexed mount PASS' \
            'P-06 old 500/200 DOM caps retired PASS' \
            'P-06 lazy review-source v2 PASS' \
            'P-06 row/column/component virtualization PASS' \
            'P-06 queues/facets/presets/keyboard selection PASS' \
            'P-06C live immutable Review/Trace surface PASS' \
            'P-02A/B and P-01 preservation PASS' \
            'P-10/P-09/P-07/P-08 preservation PASS' \
            'merged-anchor/head mechanics equivalence PASS' \
            'PF-16 carried-red parity PROVEN' \
            'all other pre-FEA gateway tests PASS' \
            'all six #952 mandatory commands PASS'

name: EMP.1 primary-source qualification evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  primary-source-qualification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Advanced_Analysis candidate
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Re-observe frozen WRC and CAUx source custody
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/test-results/emp1-source-qualification"
          mkdir -p "$out"

          node scripts/emp1-source-custody-check.mjs --source-root "$PWD/docs/emp1" \
            | tee "$out/source-custody.json"

          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('test-results/emp1-source-qualification/source-custody.json', 'utf8'));
          if (report.status !== 'PASS') throw new Error(`EMP1_SOURCE_CUSTODY_NOT_PASS:${report.status}`);
          if (!Array.isArray(report.results) || report.results.length !== 2) throw new Error('EMP1_SOURCE_CUSTODY_RESULT_COUNT');
          for (const row of report.results) {
            if (row.status !== 'PASS' || row.code !== 'PASS_SOURCE_CUSTODY') {
              throw new Error(`EMP1_SOURCE_CUSTODY_ROW_NOT_PASS:${row.sourceId}:${row.code}`);
            }
          }
          NODE

      - name: Prepare PDF inspection tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null 2>&1 || ! command -v pdftoppm >/dev/null 2>&1 || ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi

      - name: Extract and render bounded primary-source review pages
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/test-results/emp1-source-qualification"
          mkdir -p "$out/wrc-pages" "$out/caux-pages"
          wrc="$PWD/docs/emp1/WRC537_2013.pdf"
          caux="$PWD/docs/emp1/CAUx 2017 - WRC01f.pdf"

          pdfinfo "$wrc" > "$out/WRC537_2013.pdfinfo.txt"
          pdfinfo "$caux" > "$out/CAUx_2017_WRC01f.pdfinfo.txt"

          # WRC computation/sign tables plus all retained SP/SM coefficient-table pages.
          pdftotext -f 33 -l 89 -layout "$wrc" "$out/WRC537_2013_pages_33-89.txt"
          for page in 33 34 35 36 37 38 51 52 54 56 58 60 62 64 66 68 70 71 74 76 78 80 82 84 86 89; do
            pdftoppm -f "$page" -l "$page" -singlefile -png -r 180 "$wrc" "$out/wrc-pages/page-${page}" >/dev/null
          done

          # CAUx benchmark authority is explicitly bounded to pp.24-31.
          pdftotext -f 24 -l 31 -layout "$caux" "$out/CAUx_2017_WRC01f_pages_24-31.txt"
          for page in 24 25 26 27 28 29 30 31; do
            pdftoppm -f "$page" -l "$page" -singlefile -png -r 180 "$caux" "$out/caux-pages/page-${page}" >/dev/null
          done

      - name: Verify retained-source arbitration remains fail closed until page arbitration is frozen
        shell: bash
        run: |
          set -euo pipefail
          node scripts/emp1-wrc-retained-source-arbitration-check.mjs \
            | tee test-results/emp1-source-qualification/retained-source-arbitration-check.json

      - name: Preserve pre-PR1286 coefficient contract as a blocked baseline
        shell: bash
        run: |
          set -euo pipefail
          node scripts/emp1-wrc-coefficient-transcription-self-test.mjs \
            | tee test-results/emp1-source-qualification/coefficient-transcription-self-test.json
          node scripts/emp1-wrc-coefficient-transcription-generate.mjs

      - name: Prove CAUx pp24-31 cannot be substituted before benchmark freeze
        shell: bash
        run: |
          set -euo pipefail
          node scripts/emp1-caux-pp24-31-extraction-gate-check.mjs \
            | tee test-results/emp1-source-qualification/caux-pp24-31-extraction-gate-check.json

      - name: Upload source qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emp1-primary-source-qualification-${{ github.sha }}
          path: test-results/emp1-source-qualification
          if-no-files-found: error
          retention-days: 30

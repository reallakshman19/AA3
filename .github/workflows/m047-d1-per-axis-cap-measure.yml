name: M047 D1 per-axis Coulomb-box pinned measurement

on:
  push:
    branches:
      - agent/m047-stage2-measure-per-axis-20260813
    paths:
      - '.github/workflows/m047-d1-per-axis-cap-measure.yml'

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_HEAD: '89ee02cf22412728819928d5d37146b573b9a82a'
      EVIDENCE_HEAD: 'fadcee224328ab1a9e3c27e741442654e6b5206c'
      BM4L_COMMON_COMMIT: '45d51ea18624f5775805f399110c1738301c0d90'
      BM4L_ZIP_SHA256: '978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9'
      BM4L_ZIP_SIZE: '582488'
      BM4L_ACCDB_SHA256: '64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8'
      BM4L_ACCDB_SIZE: '5136384'
    steps:
      - name: Checkout exact PR 1101 experiment source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          persist-credentials: false

      - name: Prove source custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain)"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Fetch accepted D1 evidence and pinned BM4_L
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/measurement/evidence artifacts/bm4l-stage2/source reports
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/reallaksh19/Advanced_Analysis/${EVIDENCE_HEAD}/reports/lfea-m047-stage2-real-d1-evidence.json" \
            -o artifacts/measurement/evidence/real-d1.json
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/reallaksh19/Common/${BM4L_COMMON_COMMIT}/LFEA/BM4/BM4_L.zip" \
            -o artifacts/measurement/BM4_L.zip
          test "$(stat -c '%s' artifacts/measurement/BM4_L.zip)" = "$BM4L_ZIP_SIZE"
          echo "${BM4L_ZIP_SHA256}  artifacts/measurement/BM4_L.zip" | sha256sum -c -
          unzip -q artifacts/measurement/BM4_L.zip -d artifacts/bm4l-stage2/source
          test -f artifacts/bm4l-stage2/source/BM4_L.ACCDB
          test "$(stat -c '%s' artifacts/bm4l-stage2/source/BM4_L.ACCDB)" = "$BM4L_ACCDB_SIZE"
          echo "${BM4L_ACCDB_SHA256}  artifacts/bm4l-stage2/source/BM4_L.ACCDB" | sha256sum -c -
          node - <<'NODE'
          const fs=require('fs');
          const d1=JSON.parse(fs.readFileSync('artifacts/measurement/evidence/real-d1.json','utf8'));
          if(d1.source?.accdbSha256!==process.env.BM4L_ACCDB_SHA256) throw new Error('D1 custody mismatch');
          if(d1.d1?.converged!==true || d1.d1?.summary?.tangentialVectorsWithinGoal!==13 || d1.d1?.summary?.normalWithinGoal!==23) throw new Error('D1 baseline mismatch');
          NODE
          sha256sum artifacts/measurement/evidence/real-d1.json artifacts/bm4l-stage2/source/BM4_L.ACCDB \
            > artifacts/measurement/input-sha256.txt

      - name: Validate per-axis experiment contract
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/lfea-m047-stage2-d1-per-axis-cap-experiment.mjs
          node --check scripts/lfea-m047-stage2-d1-per-axis-cap-experiment-check.mjs
          node scripts/lfea-m047-stage2-d1-per-axis-cap-experiment-check.mjs \
            > artifacts/measurement/preflight.stdout.txt \
            2> artifacts/measurement/preflight.stderr.txt

      - name: Execute real P1 nonlinear experiment twice
        id: experiment
        shell: bash
        run: |
          set +e
          node scripts/lfea-m047-stage2-d1-per-axis-cap-experiment.mjs \
            --accdb artifacts/bm4l-stage2/source/BM4_L.ACCDB \
            --d1-evidence artifacts/measurement/evidence/real-d1.json \
            --out reports/lfea-m047-stage2-d1-per-axis-cap-L13.json \
            > artifacts/measurement/experiment.stdout.txt \
            2> artifacts/measurement/experiment.stderr.txt
          code=$?
          echo "$code" > artifacts/measurement/experiment-exit-code.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Emit receipt
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='reports/lfea-m047-stage2-d1-per-axis-cap-L13.json';
          const result=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):null;
          const code=fs.existsSync('artifacts/measurement/experiment-exit-code.txt')?Number(fs.readFileSync('artifacts/measurement/experiment-exit-code.txt','utf8').trim()):null;
          fs.writeFileSync('artifacts/measurement/receipt.json',JSON.stringify({
            schema:'m047-d1-per-axis-actions-receipt/v1',
            sourceHead:process.env.SOURCE_HEAD,
            evidenceHead:process.env.EVIDENCE_HEAD,
            commonCommit:process.env.BM4L_COMMON_COMMIT,
            accdbSha256:process.env.BM4L_ACCDB_SHA256,
            experimentExitCode:code,
            result,
          },null,2)+'\n');
          NODE

      - name: Upload governed measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m047-d1-per-axis-cap-measurement
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/measurement/**
            reports/lfea-m047-stage2-d1-per-axis-cap-L13.json

      - name: Enforce experiment success after upload
        if: always()
        shell: bash
        run: |
          test -f artifacts/measurement/experiment-exit-code.txt
          code="$(cat artifacts/measurement/experiment-exit-code.txt)"
          if [ "$code" != "0" ]; then
            echo "P1 experiment failed with exit code $code; uploaded evidence is authoritative."
            exit "$code"
          fi

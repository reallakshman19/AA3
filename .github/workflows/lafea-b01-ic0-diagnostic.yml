name: LAFEA B01 IC0-PCG diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/core/local-continuum/ic0-preconditioner.js'
      - '.github/workflows/lafea-b01-ic0-diagnostic.yml'

permissions:
  contents: read

jobs:
  ic0-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Patch solver workspace to IC0-PCG candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/core/local-continuum/solver.js')
          s = p.read_text()
          marker = "import { rigidReferenceConditioning } from './rigid-reference-conditioning.js';\n"
          insert = marker + "import { buildIncompleteCholesky0, applyIncompleteCholesky0 } from './ic0-preconditioner.js';\n"
          if s.count(marker) != 1:
              raise RuntimeError('solver import marker mismatch')
          s = s.replace(marker, insert, 1)
          marker = """  const iterationLimit = Math.min(\n    50000,\n    Math.max(1000, matrix.size * 16),\n  );\n  const solution = Array(matrix.size).fill(0);"""
          replacement = """  const iterationLimit = Math.min(\n    50000,\n    Math.max(1000, matrix.size * 16),\n  );\n  const ic0 = buildIncompleteCholesky0(matrix, diagonalTolerance);\n  const solution = Array(matrix.size).fill(0);"""
          if s.count(marker) != 1:
              raise RuntimeError('solver IC0 construction marker mismatch')
          s = s.replace(marker, replacement, 1)
          old = 'applyJacobi(matrix.diagonal, residual)'
          count = s.count(old)
          if count != 3:
              raise RuntimeError(f'expected 3 Jacobi applications, found {count}')
          s = s.replace(old, 'applyIncompleteCholesky0(ic0, residual)')
          p.write_text(s)
          PY
          node --check src/core/local-continuum/ic0-preconditioner.js
          node --check src/core/local-continuum/solver.js
      - name: Execute frozen B01 Lamé L3 sweep
        shell: bash
        run: |
          node scripts/lafea-b01-bbar-lame-diagnostic.mjs > /tmp/b01-ic0.json
          cat /tmp/b01-ic0.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('/tmp/b01-ic0.json', 'utf8'));
          if (report.firstL3SolverFailure !== null) {
            console.error(JSON.stringify(report.firstL3SolverFailure, null, 2));
            process.exit(1);
          }
          console.log('B01 IC0-PCG L3 sweep PASS');
          NODE

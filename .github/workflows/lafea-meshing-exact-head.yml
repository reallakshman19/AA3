# P2-8 planar shell and P2-9 retained-refinement qualification are permanent exact-head gates.
name: LAFEA meshing exact-head qualification

on:
  pull_request:
    paths:
      - 'src/core/lafea-meshing/**'
      - 'src/workspace/lafea-mesh-*.js'
      - 'src/workspace/lafea-retained-mesh-refinement.js'
      - 'src/workspace/lafea-shell-*.js'
      - 'src/workspace/lafea-analysis-mesh-*.js'
      - 'src/workspace/lafea-domain-first-mesh-custody.js'
      - 'src/workspace/lafea-discretization*.js'
      - 'src/workspace/lafea-workbench*.js'
      - 'src/workspace/lafea-stage-analysis-adapter.js'
      - 'src/workspace/lafea-selected-pilot-evidence-handoff.js'
      - 'src/workspace/lafea-b7d-recovery-render-bridge.js'
      - 'src/workspace/lafea-canvas/**'
      - 'scripts/lafea.10-*.mjs'
      - 'scripts/lafea-mesh-producer-binding-check.mjs'
      - 'scripts/lafea-retained-mesh-refinement-check.mjs'
      - 'scripts/lafea-shell-mesh-producer-check.mjs'
      - 'scripts/lafea-shell-workbench-route-check.mjs'
      - 'scripts/lafea-mesh-dof-policy-check.mjs'
      - 'scripts/lafea-meshing-system-check.mjs'
      - 'scripts/lafea-p2-11-triage.mjs'
      - 'scripts/lafea-accessory-panel-source-guard.mjs'
      - 'scripts/lafea-nb-t4b-recovery-render-check.mjs'
      - 'scripts/lafea-nb-t6e-workbench-display-handoff-check.mjs'
      - 'scripts/lafea-nonbucket-scope-guard.mjs'
      - 'scripts/lafea-u2b-editor-store-check.mjs'
      - '.github/workflows/lafea-nonbucket-stack.yml'
      - 'package.json'
      - '.github/workflows/lafea-meshing-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "Candidate head: $actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Qualify stage-aware mesh DOF policy
        run: node scripts/lafea-mesh-dof-policy-check.mjs

      - name: Qualify governed canvas meshing intent
        run: node scripts/lafea-meshing-system-check.mjs

      - name: Qualify retained-mesh local refinement
        run: node scripts/lafea-retained-mesh-refinement-check.mjs

      - name: Qualify planar shell mesh producer mechanics
        run: node scripts/lafea-shell-mesh-producer-check.mjs

      - name: Qualify shell workbench custody and Discretization route
        run: node scripts/lafea-shell-workbench-route-check.mjs

      - name: Qualify P2-11 check classification
        run: node scripts/lafea-p2-11-triage.mjs

      - name: Run governed LAFEA meshing gate
        shell: bash
        run: |
          set -o pipefail
          npm run check:lafea-meshing 2>&1 | tee meshing-aggregate.log

      - name: Upload meshing aggregate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-meshing-aggregate-log
          path: meshing-aggregate.log
          if-no-files-found: ignore

name: M047 independent Appendix S Cowper shear A-B v2

on:
  push:
    branches: [agent/m047-bm4l-root-cause-991]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appendix-s-cowper-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7a08f9db84f298990250793226b36d4a82dbe01e
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Write metrics helper
        shell: bash
        run: |
          mkdir -p artifacts
          cat > artifacts/metrics.mjs <<'EOF'
          import {PUBLISHED_DISPLACEMENTS,PUBLISHED_SUPPORT_LOADS,OUTER_DIAMETER,WALL_THICKNESS,POISSON_RATIO,solveAppendixS} from '../scripts/lfea-b3.12-appendix-s-example1-fixtures.mjs';
          const x=solveAppendixS();
          const disp=(n,d)=>x.execution.displacement.find(r=>r.nodeId===n&&r.dof===d)?.value;
          const react=(n,d)=>x.execution.reactions.find(r=>r.nodeId===n&&r.dof===d)?.value;
          const dr=[];
          for(const r of PUBLISHED_DISPLACEMENTS) for(const [d,e] of [['UX',r.uxMm],['UY',r.uyMm]]) if(e!==0){const a=disp(r.nodeId,d)*1000,s=Math.max(Math.abs(e),1.5);dr.push({label:r.label,dof:d,actual:a,expected:e,error:a-e,normalized:(a-e)/s});}
          const sr=[];
          for(const r of PUBLISHED_SUPPORT_LOADS){const p=-react(r.nodeId,r.dof),a=r.absolute?Math.abs(p):p,e=r.absolute?Math.abs(r.value):r.value,s=Math.max(Math.abs(e),r.quantity==='moment'?1500:1200);sr.push({nodeId:r.nodeId,dof:r.dof,actual:a,expected:e,error:a-e,normalized:(a-e)/s});}
          const rms=a=>Math.sqrt(a.reduce((s,r)=>s+r.normalized**2,0)/a.length);
          const q=(OUTER_DIAMETER-2*WALL_THICKNESS)/OUTER_DIAMETER,u=1+q*q,k=6*(1+POISSON_RATIO)*u*u/((7+6*POISSON_RATIO)*u*u+(20+12*POISSON_RATIO)*q*q);
          console.log(JSON.stringify({schema:'m047-appendix-s-metrics/v2',status:x.execution.status,kappa:k,displacement:{rms:rms(dr),maxAbsErrorMm:Math.max(...dr.map(r=>Math.abs(r.error))),rows:dr},support:{rms:rms(sr),maxAbsNormalized:Math.max(...sr.map(r=>Math.abs(r.normalized))),rows:sr},diagnostics:x.execution.diagnostics},null,2));
          EOF
      - name: Baseline Euler evidence
        shell: bash
        run: |
          node scripts/lfea-b3.12-appendix-s-example1-check.mjs > artifacts/baseline-check.log
          node artifacts/metrics.mjs > artifacts/baseline.json
      - name: Patch ordinary straight spans only
        shell: bash
        run: |
          cat > artifacts/patch.mjs <<'EOF'
          import fs from 'node:fs';
          const p='scripts/lfea-b3.12-appendix-s-example1-fixtures.mjs';
          let t=fs.readFileSync(p,'utf8').replace(/\r\n/g,'\n');
          const once=(a,b,n)=>{const c=t.split(a).length-1;if(c!==1)throw new Error(`${n}: ${c}`);t=t.replace(a,b);};
          once("import { eulerBernoulliProfile } from './lfea-b3.1-frame-element-fixtures.mjs';","import { eulerBernoulliProfile, timoshenkoProfile } from './lfea-b3.1-frame-element-fixtures.mjs';",'import');
          once("  const frameProfile = eulerBernoulliProfile();\n  const bendProfile = componentProfile({",`  const frameProfile = eulerBernoulliProfile();
  const cowperA = section.dimensions.innerDiameter / section.dimensions.outerDiameter;
  const cowperU = 1 + cowperA ** 2;
  const cowperNu = material.materialState.poissonRatio;
  const cowperKappa = 6 * (1 + cowperNu) * cowperU ** 2
    / ((7 + 6 * cowperNu) * cowperU ** 2 + (20 + 12 * cowperNu) * cowperA ** 2);
  const straightFrameProfile = timoshenkoProfile({
    shearCorrectionFactorY: { value: cowperKappa, source: 'COWPER-1966-HOLLOW-CIRCLE-INDEPENDENT-APPENDIX-S-A-B' },
    shearCorrectionFactorZ: { value: cowperKappa, source: 'COWPER-1966-HOLLOW-CIRCLE-INDEPENDENT-APPENDIX-S-A-B' },
  });
  const bendProfile = componentProfile({`,'profile declaration');
          once("      profile: frameProfile,\n      distributedLoads: [],\n      temperature: temperaturesByElement.get(span.elementId),","      profile: straightFrameProfile,\n      distributedLoads: [],\n      temperature: temperaturesByElement.get(span.elementId),",'straight ownership');
          fs.writeFileSync(p,t);
          EOF
          node artifacts/patch.mjs
          git diff -- scripts/lfea-b3.12-appendix-s-example1-fixtures.mjs > artifacts/cowper.patch
          grep -q 'profile: straightFrameProfile' artifacts/cowper.patch
          test "$(grep -c 'frameElementProfile: frameProfile' scripts/lfea-b3.12-appendix-s-example1-fixtures.mjs)" -eq 2
      - name: Cowper independent evidence
        shell: bash
        run: |
          set +e
          node scripts/lfea-b3.12-appendix-s-example1-check.mjs > artifacts/cowper-check.log 2>&1
          echo $? > artifacts/cowper-check-exit.txt
          set -e
          node artifacts/metrics.mjs > artifacts/cowper.json
      - name: Compare without BM4 reference
        shell: bash
        run: |
          cat > artifacts/compare.mjs <<'EOF'
          import fs from 'node:fs';
          const b=JSON.parse(fs.readFileSync('artifacts/baseline.json'));
          const c=JSON.parse(fs.readFileSync('artifacts/cowper.json'));
          const checkExit=Number(fs.readFileSync('artifacts/cowper-check-exit.txt','utf8').trim());
          const out={schema:'lfea-m047-independent-appendix-s-cowper-ab/v2',benchmark:'ASME B31.3-2006 Appendix S Example 1',bm4ReferenceUsed:false,kappa:c.kappa,cowperExistingQualificationCheckPassed:checkExit===0,displacement:{baselineRms:b.displacement.rms,cowperRms:c.displacement.rms,ratio:c.displacement.rms/b.displacement.rms,baselineMaxAbsErrorMm:b.displacement.maxAbsErrorMm,cowperMaxAbsErrorMm:c.displacement.maxAbsErrorMm},support:{baselineRms:b.support.rms,cowperRms:c.support.rms,ratio:c.support.rms/b.support.rms,baselineMaxAbsNormalized:b.support.maxAbsNormalized,cowperMaxAbsNormalized:c.support.maxAbsNormalized},decisionRule:'Independent published-benchmark discriminator; BM4 residuals excluded.'};
          fs.writeFileSync('artifacts/result.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          EOF
          node artifacts/compare.mjs
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m047-independent-appendix-s-cowper-v2-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

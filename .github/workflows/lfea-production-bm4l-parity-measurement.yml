name: LFEA production real BM4_L CAESAR parity measurement

on:
  pull_request:
    paths:
      - 'scripts/lfea-production-caesar-parity-check.mjs'
      - 'scripts/lfea-production-caesar-parity-evidence-check*.mjs'
      - 'scripts/lfea-bm4l-rx-source-topology-check.mjs'
      - 'scripts/lfea-bm4l-rx-increment-budget.mjs'
      - 'scripts/lfea-bm4l-e75-local-rotation-budget.mjs'
      - 'scripts/lfea-bm4l-e75-load-increment-budget.mjs'
      - 'scripts/lib/lfea-bm4l-e75-source-section-load.mjs'
      - 'scripts/lib/lfea-bm4l-e75-weight-bending-forensic.mjs'
      - 'scripts/lib/lfea-bm4l-e75-w-system-perturbation.mjs'
      - 'scripts/lfea-bm4l-e75-w-system-reference-check.mjs'
      - 'scripts/lfea-bm4l-e75-weight-bending-evidence-check.mjs'
      - 'scripts/lfea-bm4l-e75-section-load-evidence-check.mjs'
      - 'scripts/lfea-reducer-pressure-custody-guard-check.mjs'
      - 'scripts/lfea-s4-taper-pressure-mathematical-hypothesis-check.mjs'
      - 'scripts/lfea-bm4l-e75-pressure-research-evidence-check.mjs'
      - 'scripts/lib/lfea-reducer-pressure-control-volume.mjs'
      - 'scripts/lfea-reducer-pressure-control-volume-check.mjs'
      - 'scripts/lfea-bm4l-e75-pressure-boundary-check.mjs'
      - 'scripts/lib/lfea-bm4l-e75-reducer-matrix-diagnostic.mjs'
      - 'scripts/lfea-bm4l-e75-matrix-evidence-check.mjs'
      - 'src/core/linear-piping-analysis-consumer/reducer-condensation-augmentation.js'
      - 'scripts/lib/lfea-production-benchmark-actual.mjs'
      - 'src/core/linear-piping-analysis-consumer/**'
      - 'src/core/linear-fea-**'
      - 'src/core/fea-benchmarks/**'
      - 'src/lfea/**'
      - 'benchmarks/LFEA/BM4/BM4_L/BM4_L.ACCDB'
      - 'benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json'
      - 'package-lock.json'
      - '.github/workflows/lfea-production-bm4l-parity-measurement.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/lfea-production-caesar-parity-check.mjs'
      - 'scripts/lfea-production-caesar-parity-evidence-check*.mjs'
      - 'scripts/lfea-bm4l-rx-source-topology-check.mjs'
      - 'scripts/lfea-bm4l-rx-increment-budget.mjs'
      - 'scripts/lfea-bm4l-e75-local-rotation-budget.mjs'
      - 'scripts/lfea-bm4l-e75-load-increment-budget.mjs'
      - 'scripts/lib/lfea-bm4l-e75-source-section-load.mjs'
      - 'scripts/lib/lfea-bm4l-e75-weight-bending-forensic.mjs'
      - 'scripts/lib/lfea-bm4l-e75-w-system-perturbation.mjs'
      - 'scripts/lfea-bm4l-e75-w-system-reference-check.mjs'
      - 'scripts/lfea-bm4l-e75-weight-bending-evidence-check.mjs'
      - 'scripts/lfea-bm4l-e75-section-load-evidence-check.mjs'
      - 'scripts/lfea-reducer-pressure-custody-guard-check.mjs'
      - 'scripts/lfea-s4-taper-pressure-mathematical-hypothesis-check.mjs'
      - 'scripts/lfea-bm4l-e75-pressure-research-evidence-check.mjs'
      - 'scripts/lib/lfea-reducer-pressure-control-volume.mjs'
      - 'scripts/lfea-reducer-pressure-control-volume-check.mjs'
      - 'scripts/lfea-bm4l-e75-pressure-boundary-check.mjs'
      - 'scripts/lib/lfea-bm4l-e75-reducer-matrix-diagnostic.mjs'
      - 'scripts/lfea-bm4l-e75-matrix-evidence-check.mjs'
      - 'src/core/linear-piping-analysis-consumer/reducer-condensation-augmentation.js'
      - 'scripts/lib/lfea-production-benchmark-actual.mjs'
      - 'src/core/linear-piping-analysis-consumer/**'
      - 'src/core/linear-fea-**'
      - 'src/core/fea-benchmarks/**'
      - 'src/lfea/**'
      - 'benchmarks/LFEA/BM4/BM4_L/BM4_L.ACCDB'
      - 'benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json'
      - 'package-lock.json'
      - '.github/workflows/lfea-production-bm4l-parity-measurement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-bm4l-measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Verify measurement validator negative controls
        run: node scripts/lfea-production-caesar-parity-evidence-check.test.mjs
      - name: Verify reducer beam-theory equivalence before matrix experiment
        run: node scripts/lfea-reducer-beam-theory-consistency-check.mjs
      - name: Prove ten-cylinder pressure axial source-basis guard fails closed
        run: node scripts/lfea-reducer-pressure-custody-guard-check.mjs
      - name: Prove hypothetical cylinder pressure free-expansion and uniform limits
        run: node scripts/lfea-s4-taper-pressure-mathematical-hypothesis-check.mjs
      - name: Verify signed fluid pressure control-volume force balance
        run: node scripts/lfea-reducer-pressure-control-volume-check.mjs
      - name: Run actual LFEA production execution and CAESAR II comparison
        shell: bash
        env:
          LFEA_BM4L_PARITY_EVIDENCE_DIR: test-results/lfea
          LFEA_BM4L_E75_MATRIX_EVIDENCE_DIR: test-results/lfea
          LFEA_BM4L_E75_SOURCE_SECTION_EVIDENCE_DIR: test-results/lfea
          LFEA_BM4L_E75_WEIGHT_BENDING_EVIDENCE_DIR: test-results/lfea
          LFEA_BM4L_E75_W_SYSTEM_EVIDENCE_DIR: test-results/lfea
        run: |
          mkdir -p test-results/lfea
          node scripts/lfea-production-caesar-parity-check.mjs > test-results/lfea/bm4l-production-stdout.log 2>&1
          tail -n 90 test-results/lfea/bm4l-production-stdout.log
      - name: Assert inactive E75 reducer matrices and print source-axis evidence
        run: |
          node scripts/lfea-bm4l-e75-matrix-evidence-check.mjs \
            test-results/lfea/bm4l-e75-native-versus-candidate-matrices.json
      - name: Verify native E75 from/to source section and physical-case load custody
        run: |
          node scripts/lfea-bm4l-e75-section-load-evidence-check.mjs \
            test-results/lfea/bm4l-e75-source-section-and-loads.json
      - name: Validate source E75 W gravity and independent bending compliance
        run: |
          node scripts/lfea-bm4l-e75-weight-bending-evidence-check.mjs \
            test-results/lfea/bm4l-e75-weight-bending-compliance.json
      - name: Measure nonproduction cylinder pressure hypothesis against authentic E75 input
        run: |
          node scripts/lfea-bm4l-e75-pressure-research-evidence-check.mjs \
            --source-section test-results/lfea/bm4l-e75-source-section-and-loads.json \
            --out test-results/lfea/bm4l-e75-pressure-research-hypothesis.json
      - name: Cross-check E75 original reducer declarations and full pressure boundary signs
        run: |
          node scripts/lfea-bm4l-e75-pressure-boundary-check.mjs \
            --accdb benchmarks/LFEA/BM4/BM4_L/BM4_L.ACCDB \
            --pressure-research test-results/lfea/bm4l-e75-pressure-research-hypothesis.json \
            --source-section test-results/lfea/bm4l-e75-source-section-and-loads.json \
            --out test-results/lfea/bm4l-e75-pressure-boundary-control-volume.json
      - name: Validate real-model measurement coverage and retain comparison receipt
        run: |
          node scripts/lfea-production-caesar-parity-evidence-check.mjs \
            --log test-results/lfea/bm4l-production-stdout.log \
            --accdb benchmarks/LFEA/BM4/BM4_L/BM4_L.ACCDB \
            --out test-results/lfea/bm4l-production-parity-measurement.json
      - name: Reconstruct the 221xx rotational hotspot from authentic source elements
        run: |
          node scripts/lfea-bm4l-rx-source-topology-check.mjs \
            --accdb benchmarks/LFEA/BM4/BM4_L/BM4_L.ACCDB \
            --out test-results/lfea/bm4l-rx-source-topology.json
      - name: Quantify global RX increment mismatch across reducer and rigid chain
        run: |
          node scripts/lfea-bm4l-rx-increment-budget.mjs \
            --full-report test-results/lfea/bm4l-caesar-full-comparison.json \
            --topology test-results/lfea/bm4l-rx-source-topology.json \
            --out test-results/lfea/bm4l-221xx-rx-increment-budget.json
      - name: Verify local/global rotation reconstruction negative control
        run: node scripts/lfea-bm4l-e75-local-rotation-budget.mjs --self-test
      - name: Project E75 endpoint rotation differences into source-local coordinates
        run: |
          node scripts/lfea-bm4l-e75-local-rotation-budget.mjs \
            --full-report test-results/lfea/bm4l-caesar-full-comparison.json \
            --matrix-evidence test-results/lfea/bm4l-e75-native-versus-candidate-matrices.json \
            --out test-results/lfea/bm4l-e75-local-rotation-budget.json
      - name: Verify pressure/temperature signed case-difference attribution controls
        run: node scripts/lfea-bm4l-e75-load-increment-budget.mjs --self-test
      - name: Attribute E75 local-rotation mismatch to W, incremental P1 and incremental T1
        run: |
          node scripts/lfea-bm4l-e75-load-increment-budget.mjs \
            --rotation-budget test-results/lfea/bm4l-e75-local-rotation-budget.json \
            --out test-results/lfea/bm4l-e75-rotation-case-difference-attribution.json
      - name: Verify E75 full-system W-only perturbation source-anchor negative controls
        run: node scripts/lfea-bm4l-e75-w-system-reference-check.mjs --self-test
      - name: Compare four E75 W-only full-system scenarios to retained CAESAR L2
        run: |
          node scripts/lfea-bm4l-e75-w-system-reference-check.mjs \
            --experiment test-results/lfea/bm4l-e75-w-system-perturbation.json \
            --rotation-budget test-results/lfea/bm4l-e75-local-rotation-budget.json \
            --out test-results/lfea/bm4l-e75-w-system-counterfactual-versus-caesar-l2.json
      - name: Retain measured numerical discrepancies and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lfea-bm4l-production-caesar-parity-measurement
          path: test-results/lfea/
          if-no-files-found: warn

name: LAFEA B01 bounded exact-residual refinement temporary

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/lafea-b01-cap-defect-correction-temp.yml'

permissions:
  contents: read

jobs:
  cap-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Apply up to three exact-residual minimum-residual refinement steps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/core/local-continuum/jacobi-equilibrated-cg.js')
          s = p.read_text()
          old = """  const solution = unscaleSolution(scaledSolution, inverseSqrtDiagonal);\n  originalResidualInfinity = maxAbs(exactOriginalResidual(matrix, rightHandSide, solution));\n  if (originalResidualInfinity > convergenceTarget) {\n    throw solverError(\n      'JACOBI_EQUILIBRATED_CG_DID_NOT_CONVERGE',\n      `${originalResidualInfinity} > ${convergenceTarget} after ${iterations}`,\n    );\n  }\n  return result(\n    solution,\n"""
          new = """  let solution = unscaleSolution(scaledSolution, inverseSqrtDiagonal);\n  let exact = exactOriginalResidual(matrix, rightHandSide, solution);\n  originalResidualInfinity = maxAbs(exact);\n  const refinementHistory = [originalResidualInfinity];\n  let refinementSteps = 0;\n  while (originalResidualInfinity > convergenceTarget && refinementSteps < 3) {\n    const scaledExact = exact.map(\n      (value, index) => value * inverseSqrtDiagonal[index],\n    );\n    const unscaledDirection = scaledExact.map(\n      (value, index) => value * inverseSqrtDiagonal[index],\n    );\n    const unscaledAction = sparseMatrixVectorRaw(matrix, unscaledDirection);\n    const scaledAction = unscaledAction.map(\n      (value, index) => value * inverseSqrtDiagonal[index],\n    );\n    const numerator = compensatedDot(scaledAction, scaledExact);\n    const denominator = compensatedDot(scaledAction, scaledAction);\n    if (!(denominator > 0) || !Number.isFinite(denominator)\n      || !Number.isFinite(numerator)) {\n      throw solverError('JACOBI_EQUILIBRATED_CG_REFINEMENT_INVALID', `${numerator}/${denominator}`);\n    }\n    const alpha = numerator / denominator;\n    if (!Number.isFinite(alpha)) {\n      throw solverError('JACOBI_EQUILIBRATED_CG_REFINEMENT_ALPHA_INVALID', alpha);\n    }\n    const candidateScaled = scaledSolution.map(\n      (value, index) => value + alpha * scaledExact[index],\n    );\n    const candidateSolution = unscaleSolution(candidateScaled, inverseSqrtDiagonal);\n    const candidateExact = exactOriginalResidual(matrix, rightHandSide, candidateSolution);\n    const candidateInfinity = maxAbs(candidateExact);\n    if (!(candidateInfinity < originalResidualInfinity)) break;\n    for (let index = 0; index < scaledSolution.length; index += 1) {\n      scaledSolution[index] = candidateScaled[index];\n    }\n    solution = candidateSolution;\n    exact = candidateExact;\n    originalResidualInfinity = candidateInfinity;\n    refinementSteps += 1;\n    refinementHistory.push(candidateInfinity);\n  }\n  if (originalResidualInfinity > convergenceTarget) {\n    throw solverError(\n      'JACOBI_EQUILIBRATED_CG_DID_NOT_CONVERGE',\n      `${originalResidualInfinity} > ${convergenceTarget} after ${iterations} iterations and ${refinementSteps} exact-residual refinement steps; history=${refinementHistory.join(',')}`,\n    );\n  }\n  return result(\n    solution,\n"""
          if s.count(old) != 1:
              raise RuntimeError('expected one post-loop convergence block')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check src/core/local-continuum/jacobi-equilibrated-cg.js
      - name: Execute exact L4 near-incompressible B01 case
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { executeLameBbarQualificationCase } from './scripts/lib/lafea-plane-strain-bbar-lame-fixture.mjs';
          const definition = JSON.parse(fs.readFileSync('validation/lafea-incompressible/plane-strain-bbar-v1.json', 'utf8'));
          const meshPolicy = JSON.parse(fs.readFileSync('validation/lafea-incompressible/plane-strain-bbar-probe-mesh-policy-v1.json', 'utf8'));
          const level = definition.benchmarks.THICK_CYLINDER.meshLadder.levels.find((row) => row.levelId === 'L4');
          const distortion = definition.distortionMatrix.find((row) => row.distortionId === 'REGULAR');
          const run = executeLameBbarQualificationCase(definition, meshPolicy, {
            elementType: 'T6', poissonRatio: 0.4999, level, distortion,
          });
          console.log(JSON.stringify({
            case: 'T6/0.4999/L4/REGULAR',
            state: run.result.qualification.state,
            solverEvidence: run.loadCase.solverEvidence,
            equilibrium: run.loadCase.equilibrium,
          }, null, 2));
          NODE

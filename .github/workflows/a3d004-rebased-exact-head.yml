name: A3D-004 rebased exact-head

on:
  push:
    branches:
      - qualification/a3d004-rebased-120f3ec2

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: 258f567afa350f6f2d6ffa93bd80756596444596
      CANDIDATE_SHA: 120f3ec2be045ac44bb9e0bbbbb152e8760109e6
      PLAYWRIGHT_BROWSERS_PATH: '0'
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: 120f3ec2be045ac44bb9e0bbbbb152e8760109e6
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 120f3ec2be045ac44bb9e0bbbbb152e8760109e6
          fetch-depth: 0
      - name: Verify exact eight-file ledger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          expected=$'e2e/helpers/topology-edit-ghost-applied-differential.js\ne2e/topology-edit-a3d004-ghost-applied.spec.js\nsrc/workspace/topology-edit-3d-authoring-controller.js\nsrc/workspace/topology-edit-3d-productivity-controller.js\nsrc/workspace/topology-edit/authoring/topology-edit-authored-bend-geometry.js\nsrc/workspace/topology-edit/topology-edit-navigation-hud-viewport-backend.js\nsrc/workspace/viewport-productivity/topology-edit-table-workflow.js\ntests/topology-edit-authored-bend-typed-projection.test.mjs'
          test "$(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA")" = "$expected"
          git diff --check "$BASE_SHA" "$CANDIDATE_SHA"
          node --check e2e/helpers/topology-edit-ghost-applied-differential.js
          node --check e2e/topology-edit-a3d004-ghost-applied.spec.js
          node --check src/workspace/topology-edit-3d-authoring-controller.js
          node --check src/workspace/topology-edit-3d-productivity-controller.js
          node --check src/workspace/topology-edit/authoring/topology-edit-authored-bend-geometry.js
          node --check src/workspace/topology-edit/topology-edit-navigation-hud-viewport-backend.js
          node --check src/workspace/viewport-productivity/topology-edit-table-workflow.js
          node --check tests/topology-edit-authored-bend-typed-projection.test.mjs
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused governed candidate tests
        run: >-
          node --test
          tests/topology-edit-authored-bend-geometry.test.mjs
          tests/topology-edit-authored-bend-typed-projection.test.mjs
          tests/topology-edit-authoring-planner.test.mjs
          tests/topology-edit-table-m04-m06-m10.test.mjs
          tests/topology-edit-table-support-restraint.test.mjs
          tests/topology-edit-validation-runtime-identity.test.mjs
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Run A3D-004 semantic ghost applied matrix
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/a3d004-playwright.json
        run: >-
          node scripts/run-playwright.mjs
          e2e/topology-edit-a3d004-ghost-applied.spec.js
          --workers=1
          --retries=0
          --trace=on
          --reporter=line,json
      - name: Record exact-head identity
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          printf '{"schema":"A3D004RunIdentity.v1","baseSha":"%s","candidateSha":"%s","runId":"%s","attempt":%s,"workers":1,"retries":0,"trace":"on"}\n' \
            "$BASE_SHA" "$CANDIDATE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > artifacts/a3d004-run-identity.json
      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a3d004-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: |
            artifacts
            reports/qualification/topology-edit-a3d004-ghost-applied.json
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 30

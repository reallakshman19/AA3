name: 3D Edit Tool Audit

on:
  pull_request:
    paths:
      - '.github/workflows/topology-edit-tool-audit.yml'
      - 'e2e/topology-edit-tool-*.spec.js'
      - 'e2e/topology-edit-ray-*.spec.js'
      - 'e2e/helpers/topology-edit-icon-qualification.js'
      - 'tests/topology-edit-navigation-pick-fallback.test.mjs'
      - 'tests/topology-edit-icon-*.test.mjs'
      - 'src/workspace/topology-edit-3d-*.js'
      - 'src/workspace/topology-edit-*.css'
      - 'src/workspace/topology-edit/**'
      - 'src/workspace/viewport-interaction/**'
      - 'src/workspace/viewport-presentation/**'
      - 'src/workspace/viewport-productivity/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topology-edit-tool-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium-tool-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSER_CHANNEL: chromium
      PLAYWRIGHT_ENABLE_VIDEO: '1'

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify audit sources
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"
          node --check src/workspace/topology-edit/topology-edit-navigation-hud-viewport-backend.js
          node --check src/workspace/topology-edit-3d-professional-controller.js
          node --check src/workspace/viewport-productivity/topology-edit-icon-manifest.js
          node --check src/workspace/viewport-productivity/topology-edit-icon-sprite.js
          node --check src/workspace/viewport-productivity/topology-edit-icon-presentation-runtime.js
          node --check src/workspace/viewport-productivity/topology-edit-icon-reference-runtime.js
          node --check tests/topology-edit-icon-manifest.test.mjs
          node --check tests/topology-edit-icon-sprite.test.mjs
          node --check tests/topology-edit-icon-visual-evidence.test.mjs
          node --check tests/topology-edit-navigation-pick-fallback.test.mjs
          node --check e2e/helpers/topology-edit-icon-qualification.js
          node --check e2e/helpers/topology-edit-icon-visual-evidence.js
          node --check e2e/helpers/topology-edit-icon-navigation.js
          node --check e2e/helpers/topology-edit-icon-custody-support.js
          node --check e2e/topology-edit-tool-audit.spec.js
          node --check e2e/topology-edit-tool-icon-manifest.spec.js
          node --check e2e/topology-edit-tool-icon-custody.spec.js
          node --check e2e/topology-edit-tool-icon-remount-custody.spec.js
          node --check e2e/topology-edit-tool-icon-mutation.spec.js
          node --check e2e/topology-edit-tool-icon-clipping.spec.js
          node --check e2e/topology-edit-tool-icon-reference.spec.js
          node --check e2e/topology-edit-ray-scan.spec.js
          git diff --check

      - name: Execute production icon static contracts
        run: |
          set -euo pipefail
          node tests/topology-edit-icon-manifest.test.mjs
          node tests/topology-edit-icon-sprite.test.mjs
          node --test tests/topology-edit-icon-visual-evidence.test.mjs

      - name: Execute GPU-to-ray fallback unit contract
        run: node tests/topology-edit-navigation-pick-fallback.test.mjs

      - name: Execute production icon manifest qualification
        run: |
          set -euo pipefail
          evidence_dir='reports/qualification/playwright-traces/manifest'
          rm -rf "$evidence_dir"
          mkdir -p "$evidence_dir"
          set +e
          npx playwright test e2e/topology-edit-tool-icon-manifest.spec.js \
            --project=chromium --workers=1 --retries=0 --reporter=line --trace=on
          status=$?
          set -e
          if [ -d test-results ]; then cp -R test-results/. "$evidence_dir/"; fi
          if [ "$status" -eq 0 ] && ! find "$evidence_dir" -type f -name 'trace.zip' -print -quit | grep -q .; then
            echo '::error::Manifest qualification succeeded without a retained Playwright trace.'
            exit 1
          fi
          exit "$status"

      - name: Execute production icon visual custody qualification
        run: |
          set -euo pipefail
          evidence_dir='reports/qualification/playwright-traces/custody'
          rm -rf "$evidence_dir"
          mkdir -p "$evidence_dir"
          set +e
          npx playwright test e2e/topology-edit-tool-icon-custody.spec.js \
            e2e/topology-edit-tool-icon-remount-custody.spec.js \
            --project=chromium --workers=1 --retries=0 --reporter=line --trace=on
          status=$?
          set -e
          if [ -d test-results ]; then cp -R test-results/. "$evidence_dir/"; fi
          if [ "$status" -eq 0 ] && ! find "$evidence_dir" -type f -name 'trace.zip' -print -quit | grep -q .; then
            echo '::error::Visual custody qualification succeeded without a retained Playwright trace.'
            exit 1
          fi
          exit "$status"

      - name: Execute production icon mutation sanity
        run: |
          set -euo pipefail
          evidence_dir='reports/qualification/playwright-traces/mutation'
          rm -rf "$evidence_dir"
          mkdir -p "$evidence_dir"
          set +e
          npx playwright test e2e/topology-edit-tool-icon-mutation.spec.js \
            --project=chromium --workers=1 --retries=0 --reporter=line --trace=on
          status=$?
          set -e
          if [ -d test-results ]; then cp -R test-results/. "$evidence_dir/"; fi
          if [ "$status" -eq 0 ] && ! find "$evidence_dir" -type f -name 'trace.zip' -print -quit | grep -q .; then
            echo '::error::Mutation sanity succeeded without a retained Playwright trace.'
            exit 1
          fi
          exit "$status"

      - name: Execute production icon clipping sanity
        run: |
          set -euo pipefail
          evidence_dir='reports/qualification/playwright-traces/presentation-custody'
          rm -rf "$evidence_dir"
          mkdir -p "$evidence_dir"
          set +e
          npx playwright test e2e/topology-edit-tool-icon-clipping.spec.js \
            --project=chromium --workers=1 --retries=0 --reporter=line --trace=on
          status=$?
          set -e
          if [ -d test-results ]; then cp -R test-results/. "$evidence_dir/"; fi
          if [ "$status" -eq 0 ] && ! find "$evidence_dir" -type f -name 'trace.zip' -print -quit | grep -q .; then
            echo '::error::Presentation/custody sanity succeeded without a retained Playwright trace.'
            exit 1
          fi
          exit "$status"

      - name: Verify retained exact-head Playwright traces
        run: |
          set -euo pipefail
          for suite in manifest custody mutation presentation-custody; do
            trace_dir="reports/qualification/playwright-traces/$suite"
            trace_count="$(find "$trace_dir" -type f -name 'trace.zip' | wc -l)"
            test "$trace_count" -ge 1
            echo "$suite trace count: $trace_count"
          done

      - name: Execute SVG icon reference defense regression
        run: |
          set -euo pipefail
          npx playwright test e2e/topology-edit-tool-icon-reference.spec.js \
            --project=chromium --workers=1 --retries=0 --reporter=line

      - name: Execute full-canvas pick regression
        run: |
          set -euo pipefail
          npx playwright test e2e/topology-edit-ray-scan.spec.js \
            --project=chromium --workers=1 --retries=0 --reporter=line

      - name: Execute complete 3D tool audit
        run: |
          set -euo pipefail
          npx playwright test e2e/topology-edit-tool-audit.spec.js \
            --project=chromium --workers=1 --retries=0 --reporter=line

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-tool-audit-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}-${{ github.run_attempt }}
          path: |
            reports/qualification/topology-edit-tool-audit.json
            reports/qualification/topology-edit-icon-manifest.json
            reports/qualification/topology-edit-icon-manifest.png
            reports/qualification/topology-edit-icon-custody.json
            reports/qualification/topology-edit-icon-remount-custody.json
            reports/qualification/topology-edit-icon-stale-import-custody.json
            reports/qualification/topology-edit-icon-state-custody.png
            reports/qualification/topology-edit-icon-mutation-sanity.json
            reports/qualification/topology-edit-icon-clipping-sanity.json
            reports/qualification/playwright-traces
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30

name: LAFEA meshing exact-head qualification

on:
  pull_request:
    paths:
      - 'src/core/lafea-meshing/**'
      - 'src/workspace/lafea-mesh-*.js'
      - 'src/workspace/lafea-analysis-mesh-*.js'
      - 'src/workspace/lafea-domain-first-mesh-custody.js'
      - 'src/workspace/lafea-discretization*.js'
      - 'src/workspace/lafea-workbench*.js'
      - 'src/workspace/lafea-stage-analysis-adapter.js'
      - 'src/workspace/lafea-canvas/**'
      - 'scripts/lafea.10-*.mjs'
      - 'scripts/lafea-mesh-producer-binding-check.mjs'
      - 'scripts/lafea-mesh-dof-policy-check.mjs'
      - 'scripts/lafea-meshing-system-check.mjs'
      - 'scripts/lafea-p2-11-triage.mjs'
      - 'scripts/lafea-p2-11-handoff-patch-probe.mjs'
      - 'package.json'
      - '.github/workflows/lafea-meshing-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "Candidate head: $actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Qualify stage-aware mesh DOF policy
        run: node scripts/lafea-mesh-dof-policy-check.mjs

      - name: Qualify governed canvas meshing intent
        run: node scripts/lafea-meshing-system-check.mjs

      - name: Probe current selected-pilot result schema
        run: node scripts/lafea-p2-11-handoff-patch-probe.mjs

      - name: Upload probed handoff source
        uses: actions/upload-artifact@v4
        with:
          name: lafea-selected-pilot-handoff-probe
          path: patched-selected-pilot-evidence-handoff.js
          if-no-files-found: error

      - name: Capture P2-11 registered check triage
        run: node scripts/lafea-p2-11-triage.mjs

      - name: Upload P2-11 triage
        uses: actions/upload-artifact@v4
        with:
          name: lafea-p2-11-triage
          path: lafea-p2-11-triage.json
          if-no-files-found: error

      - name: Run governed LAFEA meshing gate
        run: npm run check:lafea-meshing

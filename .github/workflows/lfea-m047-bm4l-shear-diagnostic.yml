name: M047 BM4_L transverse shear diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shear-diagnostic:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/m047-bm4l-root-cause-991'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout canonical 788 implementation
        uses: actions/checkout@v4
        with:
          ref: 78652ac554dd4f1f4a6c230b891122bd9386077a
          fetch-depth: 1

      - name: Checkout pinned Common source
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 179c4831cf521cf797c13699cfbbd118315c9244
          path: _common
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install signed Microsoft ACE 2016 x64
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'accessdatabaseengine_X64.exe'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe' -OutFile $installer
          $sig=Get-AuthenticodeSignature $installer
          if($sig.Status-ne'Valid' -or [string]$sig.SignerCertificate.Subject-notmatch'Microsoft'){throw 'ACE signature check failed.'}
          $p=Start-Process $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if($p.ExitCode-notin@(0,3010)){throw "ACE install failed: $($p.ExitCode)"}

      - name: Verify source custody
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path artifacts|Out-Null
          $zip='_common/LFEA/BM4/BM4_L.zip'
          if((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()-ne'978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9'){throw 'ZIP custody mismatch.'}
          $dir=Join-Path $env:RUNNER_TEMP 'bm4l-shear-ownership'
          Expand-Archive $zip $dir -Force
          $accdb=Join-Path $dir 'BM4_L.ACCDB'
          if((Get-FileHash -Algorithm SHA256 $accdb).Hash.ToLowerInvariant()-ne'64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8'){throw 'ACCDB custody mismatch.'}
          "BM4L_ACCDB=$accdb"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run canonical 788 baseline
        shell: pwsh
        run: |
          node scripts/lfea-caesar-accdb-benchmark.mjs --accdb "$env:BM4L_ACCDB" --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json --solve-linear true --solve-cases L2,L3,L4,L5,L6,L14 --actual-out artifacts/baseline-actual.json --out artifacts/baseline-report.json --summary-out artifacts/baseline-summary.md

      - name: Patch bend arcs only to Timoshenko kappa 0.50
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='src/core/fea-benchmarks/caesar-accdb-linear-solve.js'
          $text=Get-Content $path -Raw
          $needle='      frameElementProfile: frameProfile(),'
          if(($text.Split($needle).Count-1)-ne1){throw 'Expected exactly one bend frame profile call.'}
          $text=$text.Replace($needle,'      frameElementProfile: diagnosticTimoshenkoFrameProfile(),')
          $marker='function frameProfile() {'
          if(-not $text.Contains($marker)){throw 'frameProfile marker missing.'}
          $func=@'
function diagnosticTimoshenkoFrameProfile() {
  return sealFrameElementProfile({
    schema: 'fea-linear-frame-element-profile/v1',
    profileId: 'M047-DIAGNOSTIC-TIMO-K050-BEND',
    straightPipeFormulation: 'PIPE_FRAME3D_TIMOSHENKO_V1',
    shearDeformation: true,
    shearCorrectionFactorY: { value: 0.50, source: 'M047_DIAGNOSTIC_NOT_AUTHORITY' },
    shearCorrectionFactorZ: { value: 0.50, source: 'M047_DIAGNOSTIC_NOT_AUTHORITY' },
    releaseRule: 'STATIC_CONDENSATION_V1',
    thermalStrainApproximation: 'UNIFORM_TEMPERATURE_ALPHA_DELTA_T_V1',
    releaseSingularityTolerance: { value: 1e-12, source: 'CAESAR_ACCDB_LINEAR_SOLVE_PROFILE_V1' },
    semanticHash: '',
  });
}

'@
          $text=$text.Replace($marker,$func+$marker)
          [IO.File]::WriteAllText((Join-Path $PWD $path),$text,(New-Object Text.UTF8Encoding($false)))

      - name: Run bend-only shear diagnostic
        shell: pwsh
        run: |
          node scripts/lfea-caesar-accdb-benchmark.mjs --accdb "$env:BM4L_ACCDB" --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json --solve-linear true --solve-cases L2,L3,L4,L5,L6,L14 --actual-out artifacts/bend-only-actual.json --out artifacts/bend-only-report.json --summary-out artifacts/bend-only-summary.md

      - name: Patch non-bend elements only to Timoshenko kappa 0.50
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='src/core/fea-benchmarks/caesar-accdb-linear-solve.js'
          git checkout -- $path
          $text=Get-Content $path -Raw
          $needle='      frameElementProfile: frameProfile(),'
          if(($text.Split($needle).Count-1)-ne1){throw 'Expected exactly one bend frame profile call.'}
          $text=$text.Replace($needle,'      frameElementProfile: diagnosticEulerFrameProfile(),')
          $old=@'
function frameProfile() {
  return sealFrameElementProfile({
    schema: 'fea-linear-frame-element-profile/v1',
    profileId: 'LINEAR-FRAME-ELEMENT-R1',
    straightPipeFormulation: 'PIPE_FRAME3D_EULER_BERNOULLI_V1',
    shearDeformation: false,
    releaseRule: 'STATIC_CONDENSATION_V1',
    thermalStrainApproximation: 'UNIFORM_TEMPERATURE_ALPHA_DELTA_T_V1',
    releaseSingularityTolerance: { value: 1e-12, source: PROFILE_SOURCE },
    semanticHash: '',
  });
}
'@
          if(-not $text.Contains($old)){throw 'Canonical frameProfile block missing.'}
          $new=@'
function diagnosticEulerFrameProfile() {
  return sealFrameElementProfile({
    schema: 'fea-linear-frame-element-profile/v1',
    profileId: 'M047-DIAGNOSTIC-EULER-BEND',
    straightPipeFormulation: 'PIPE_FRAME3D_EULER_BERNOULLI_V1',
    shearDeformation: false,
    releaseRule: 'STATIC_CONDENSATION_V1',
    thermalStrainApproximation: 'UNIFORM_TEMPERATURE_ALPHA_DELTA_T_V1',
    releaseSingularityTolerance: { value: 1e-12, source: PROFILE_SOURCE },
    semanticHash: '',
  });
}

function frameProfile() {
  return sealFrameElementProfile({
    schema: 'fea-linear-frame-element-profile/v1',
    profileId: 'M047-DIAGNOSTIC-TIMO-K050-NONBEND',
    straightPipeFormulation: 'PIPE_FRAME3D_TIMOSHENKO_V1',
    shearDeformation: true,
    shearCorrectionFactorY: { value: 0.50, source: 'M047_DIAGNOSTIC_NOT_AUTHORITY' },
    shearCorrectionFactorZ: { value: 0.50, source: 'M047_DIAGNOSTIC_NOT_AUTHORITY' },
    releaseRule: 'STATIC_CONDENSATION_V1',
    thermalStrainApproximation: 'UNIFORM_TEMPERATURE_ALPHA_DELTA_T_V1',
    releaseSingularityTolerance: { value: 1e-12, source: PROFILE_SOURCE },
    semanticHash: '',
  });
}
'@
          $text=$text.Replace($old,$new)
          [IO.File]::WriteAllText((Join-Path $PWD $path),$text,(New-Object Text.UTF8Encoding($false)))

      - name: Run non-bend-only shear diagnostic
        shell: pwsh
        run: |
          node scripts/lfea-caesar-accdb-benchmark.mjs --accdb "$env:BM4L_ACCDB" --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json --solve-linear true --solve-cases L2,L3,L4,L5,L6,L14 --actual-out artifacts/nonbend-only-actual.json --out artifacts/nonbend-only-report.json --summary-out artifacts/nonbend-only-summary.md

      - name: Compare ownership signatures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Stats($report,$id){
            $case=$report.qualification.cases|Where-Object caseId -eq $id
            $fails=@($case.comparison.rows|Where-Object status -eq 'FAIL')
            $r=@($fails|Where-Object{$_.entityKind-eq'NODE' -and $_.quantity-in@('FORCE','MOMENT')}).Count
            $d=@($fails|Where-Object{$_.entityKind-eq'NODE' -and $_.quantity-in@('DISPLACEMENT','ROTATION')}).Count
            $e=@($fails|Where-Object{$_.entityKind-eq'ELEMENT' -and $_.quantity-like'GLOBAL_END_*'}).Count
            [ordered]@{restraint=$r;deformation=$d;elementEnd=$e;total=$r+$d+$e}
          }
          $base=Get-Content artifacts/baseline-report.json -Raw|ConvertFrom-Json
          $bend=Get-Content artifacts/bend-only-report.json -Raw|ConvertFrom-Json
          $non=Get-Content artifacts/nonbend-only-report.json -Raw|ConvertFrom-Json
          $expected=[ordered]@{L2=227;L3=129;L4=120;L5=97;L6=86;L14=129}
          $rows=[ordered]@{};$bt=0;$bendt=0;$nont=0
          foreach($id in $expected.Keys){
            $b=Stats $base $id;$x=Stats $bend $id;$y=Stats $non $id
            if($b.total-ne$expected[$id]){throw "788 baseline drift in $id"}
            foreach($pair in @(@($base,'baseline'),@($bend,'bend-only'),@($non,'nonbend-only'))){if($pair[0].mechanics.cases.$id.recoveredEquilibrium.status-eq'FAIL'){throw "$($pair[1]) equilibrium failed in $id"}}
            $rows[$id]=[ordered]@{baseline=$b;bendOnly=$x;nonBendOnly=$y;deltaBendOnly=$x.total-$b.total;deltaNonBendOnly=$y.total-$b.total}
            $bt+=$b.total;$bendt+=$x.total;$nont+=$y.total
          }
          [ordered]@{
            schema='lfea-m047-shear-ownership-diagnostic/v1'
            authorityStatus='DIAGNOSTIC_ONLY_NOT_RETAINABLE'
            kappa=0.50
            baselineTotal=$bt
            bendOnlyTotal=$bendt
            bendOnlyDelta=$bendt-$bt
            nonBendOnlyTotal=$nont
            nonBendOnlyDelta=$nont-$bt
            cases=$rows
            acceptanceBoundary='Localization only. Kappa 0.50 is not CAESAR authority and cannot be retained or optimized against reference residuals.'
          }|ConvertTo-Json -Depth 20|Tee-Object artifacts/shear-ownership.json

      - name: Upload shear diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bm4l-shear-diagnostic-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

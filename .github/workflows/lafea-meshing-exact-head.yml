name: LAFEA meshing exact-head qualification

on:
  pull_request:
    paths:
      - 'src/core/lafea-meshing/**'
      - 'src/workspace/lafea-mesh-*.js'
      - 'src/workspace/lafea-analysis-mesh-*.js'
      - 'src/workspace/lafea-domain-first-mesh-custody.js'
      - 'src/workspace/lafea-discretization*.js'
      - 'src/workspace/lafea-workbench*.js'
      - 'scripts/lafea.10-*.mjs'
      - 'scripts/lafea-mesh-producer-binding-check.mjs'
      - 'package.json'
      - '.github/workflows/lafea-meshing-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "Candidate head: $actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run governed LAFEA meshing gate
        run: npm run check:lafea-meshing

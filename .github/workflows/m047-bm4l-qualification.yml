name: M047 BM4_L qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/m047-bm4l-qualification.yml'
      - 'benchmarks/LFEA/CAESAR_ACCDB/**'
      - 'scripts/lfea-caesar-accdb-*.mjs'
      - 'scripts/lfea-caesar-accdb-export.ps1'
      - 'scripts/lfea-bm4l-root-cause-report.mjs'
      - 'scripts/lfea-m047-bm4l-accdb-provenance.ps1'
      - 'scripts/lfea-m047-bm4l-recovery-proof.mjs'
      - 'scripts/lfea-m047-bm4l-root-cause-diagnostics.mjs'
      - 'src/core/fea-benchmarks/**'
      - 'src/core/linear-fea-*/**'
      - 'src/core/centerline-beam-fea/**'

permissions:
  contents: read

jobs:
  bm4l-accdb:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      BM4L_COMMON_COMMIT: '45d51ea18624f5775805f399110c1738301c0d90'
      BM4L_ZIP_SHA256: '978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9'
      BM4L_ZIP_SIZE: '582488'
      BM4L_PINNED_MEMBER_SHA256: '64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8'
      BM4L_DECLARED_ACCDB_SHA256: 'e21b0862851ea2bb6f20d55e4a3a94f501537b618b98dd46afa9f6777ee38d3c'
      BM4L_ACCDB_SIZE: '5136384'
      ACE_INSTALLER_URL: 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe'
      ACE_INSTALLER_SHA256: '04e96c9f1a1f7d251a88aececf1dc10ff65950392787427c00814a43308003de'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Syntax-check qualification code
        shell: pwsh
        run: |
          node --check scripts/lfea-bm4l-root-cause-report.mjs
          node --check scripts/lfea-m047-bm4l-recovery-proof.mjs
          node --check scripts/lfea-m047-bm4l-root-cause-diagnostics.mjs
          node --check src/core/fea-benchmarks/caesar-accdb-linear-solve.js
          powershell -NoProfile -Command "[void][scriptblock]::Create((Get-Content -Raw 'scripts/lfea-m047-bm4l-accdb-provenance.ps1'))"

      - name: Run evidence instrumentation regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/lfea-b3.3-solver-check.mjs
          node scripts/lfea-b3.4-recovery-check.mjs
          node scripts/lfea-b3.6-sparse-assembly-check.mjs
          node scripts/lfea-b3.9-gravity-self-weight-check.mjs

      - name: Download and authenticate Microsoft ACE installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts/bm4l/provider | Out-Null
          $installer = Join-Path $PWD 'artifacts/bm4l/provider/accessdatabaseengine_X64.exe'
          Invoke-WebRequest -Uri $env:ACE_INSTALLER_URL -OutFile $installer
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:ACE_INSTALLER_SHA256) {
            throw "Microsoft ACE installer SHA-256 mismatch: $hash != $env:ACE_INSTALLER_SHA256"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw "Microsoft ACE installer Authenticode validation failed: $($signature.Status), $($signature.SignerCertificate.Subject)"
          }
          [ordered]@{
            schema = 'bm4l-ace-installer-evidence/v1'
            url = $env:ACE_INSTALLER_URL
            byteLength = (Get-Item -LiteralPath $installer).Length
            sha256 = $hash
            signatureStatus = [string]$signature.Status
            signerSubject = $signature.SignerCertificate.Subject
            signerIssuer = $signature.SignerCertificate.Issuer
            signerThumbprint = $signature.SignerCertificate.Thumbprint
          } | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 artifacts/bm4l/provider/installer.json

      - name: Install Microsoft ACE provider
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $PWD 'artifacts/bm4l/provider/accessdatabaseengine_X64.exe'
          $process = Start-Process -FilePath $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Microsoft ACE installer exited $($process.ExitCode)."
          }
          $process.ExitCode | Set-Content artifacts/bm4l/provider/install-exit-code.txt

      - name: Fetch and verify pinned BM4_L source
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts/bm4l | Out-Null
          $zipPath = Join-Path $PWD 'artifacts/bm4l/BM4_L.zip'
          $url = "https://raw.githubusercontent.com/reallaksh19/Common/$env:BM4L_COMMON_COMMIT/LFEA/BM4/BM4_L.zip"
          Invoke-WebRequest -Uri $url -OutFile $zipPath

          $zip = Get-Item -LiteralPath $zipPath
          $zipHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          if ($zip.Length -ne [int64]$env:BM4L_ZIP_SIZE) {
            throw "Pinned BM4_L.zip size mismatch: $($zip.Length) != $env:BM4L_ZIP_SIZE"
          }
          if ($zipHash -ne $env:BM4L_ZIP_SHA256) {
            throw "Pinned BM4_L.zip SHA-256 mismatch: $zipHash != $env:BM4L_ZIP_SHA256"
          }

          $extractDir = Join-Path $PWD 'artifacts/bm4l/source'
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractDir -Force
          $members = @(Get-ChildItem -LiteralPath $extractDir -File -Recurse)
          if ($members.Count -ne 1 -or $members[0].Name -ne 'BM4_L.ACCDB') {
            throw "Pinned ZIP must contain exactly BM4_L.ACCDB; found $($members.Count) members."
          }
          $pristineAccdbPath = $members[0].FullName
          $pristineHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $pristineAccdbPath).Hash.ToLowerInvariant()
          if ($members[0].Length -ne [int64]$env:BM4L_ACCDB_SIZE) {
            throw "Pinned BM4_L.ACCDB size mismatch: $($members[0].Length) != $env:BM4L_ACCDB_SIZE"
          }
          if ($pristineHash -ne $env:BM4L_PINNED_MEMBER_SHA256) {
            throw "Pinned ZIP member SHA-256 mismatch: $pristineHash != $env:BM4L_PINNED_MEMBER_SHA256"
          }

          $workDir = Join-Path $PWD 'artifacts/bm4l/work'
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null
          $workAccdbPath = Join-Path $workDir 'BM4_L.ACCDB'
          Copy-Item -LiteralPath $pristineAccdbPath -Destination $workAccdbPath -Force

          $custody = [ordered]@{
            schema = 'bm4l-source-custody/v3'
            authorityRule = 'PINNED_COMMON_COMMIT_AND_ZIP_SHA256_DEFINE_ACCDB_MEMBER_BYTES'
            commonCommit = $env:BM4L_COMMON_COMMIT
            zip = [ordered]@{
              byteLength = $zip.Length
              sha256 = $zipHash
              expectedSha256 = $env:BM4L_ZIP_SHA256
              exactMatch = $true
            }
            accdb = [ordered]@{
              fileName = $members[0].Name
              byteLength = $members[0].Length
              authorizedPinnedMemberSha256 = $pristineHash
              declaredConflictingSha256 = $env:BM4L_DECLARED_ACCDB_SHA256
              declaredHashMatchesPinnedMember = ($pristineHash -eq $env:BM4L_DECLARED_ACCDB_SHA256)
              declaredHashClassification = if ($pristineHash -eq $env:BM4L_DECLARED_ACCDB_SHA256) { 'CONSISTENT' } else { 'CONTRADICTED_BY_PINNED_ARCHIVE_MEMBER' }
              state = 'PRISTINE_ZIP_MEMBER_BEFORE_PROVIDER_OPEN'
            }
          }
          $custody | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 artifacts/bm4l/custody.json
          "pristine_accdb_path=$pristineAccdbPath" >> $env:GITHUB_OUTPUT
          "accdb_path=$workAccdbPath" >> $env:GITHUB_OUTPUT

      - name: Prove Microsoft ACE provider and source-byte stability
        id: ace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $progId = 'Microsoft.ACE.OLEDB.12.0'
          $progIdKey = "Registry::HKEY_CLASSES_ROOT\$progId\CLSID"
          if (-not (Test-Path -LiteralPath $progIdKey)) { throw "$progId is not registered after installation." }
          $clsid = (Get-ItemProperty -LiteralPath $progIdKey).'(default)'
          $binary = (Get-ItemProperty -LiteralPath "Registry::HKEY_CLASSES_ROOT\CLSID\$clsid\InprocServer32").'(default)'
          $providerFile = Get-Item -LiteralPath $binary
          $providerSignature = Get-AuthenticodeSignature -LiteralPath $providerFile.FullName
          if ($providerSignature.Status -ne 'Valid' -or $providerSignature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw "ACE provider binary Authenticode validation failed: $($providerSignature.Status), $($providerSignature.SignerCertificate.Subject)"
          }

          $workPath = "${{ steps.source.outputs.accdb_path }}"
          $beforeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $workPath).Hash.ToLowerInvariant()
          $connection = New-Object -ComObject ADODB.Connection
          try {
            $connection.Open("Provider=$progId;Data Source=$workPath;Mode=Read;Persist Security Info=False;")
            $schema = $connection.OpenSchema(20)
            $tableCount = 0
            try {
              while (-not $schema.EOF) {
                if ([string]$schema.Fields.Item('TABLE_TYPE').Value -eq 'TABLE') { $tableCount += 1 }
                $schema.MoveNext()
              }
            }
            finally {
              $schema.Close()
              [void][System.Runtime.InteropServices.Marshal]::ReleaseComObject($schema)
            }
          }
          finally {
            if ($connection.State -ne 0) { $connection.Close() }
            [void][System.Runtime.InteropServices.Marshal]::ReleaseComObject($connection)
          }
          $afterHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $workPath).Hash.ToLowerInvariant()
          $sourceAuthorized = $beforeHash -eq $env:BM4L_PINNED_MEMBER_SHA256 -and $afterHash -eq $env:BM4L_PINNED_MEMBER_SHA256

          [ordered]@{
            schema = 'bm4l-accdb-provider-probe/v3'
            provider = $progId
            clsid = [string]$clsid
            binaryPath = $providerFile.FullName
            binarySha256 = (Get-FileHash -LiteralPath $providerFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            fileVersion = $providerFile.VersionInfo.FileVersion
            productVersion = $providerFile.VersionInfo.ProductVersion
            signatureStatus = [string]$providerSignature.Status
            signerSubject = $providerSignature.SignerCertificate.Subject
            preOpenSha256 = $beforeHash
            postOpenSha256 = $afterHash
            pinnedMemberSha256 = $env:BM4L_PINNED_MEMBER_SHA256
            declaredConflictingSha256 = $env:BM4L_DECLARED_ACCDB_SHA256
            providerOpenChangedBytes = ($beforeHash -ne $afterHash)
            tableCount = $tableCount
            sourceAuthorized = $sourceAuthorized
          } | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 artifacts/bm4l/provider.json
          "available=true" >> $env:GITHUB_OUTPUT
          "source_authorized=$($sourceAuthorized.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $sourceAuthorized) {
            throw 'Pinned ACCDB member bytes changed or no longer match the archive-defined authority.'
          }

      - name: Emit ACCDB table, field and provider provenance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tables = @(
            'INPUT_BASIC_ELEMENT_DATA','INPUT_BENDS','INPUT_CONTROL','INPUT_FORCMNT',
            'INPUT_NODAL_COORDINATES','INPUT_OFFSETS','INPUT_REDUCERS','INPUT_RESTRAINTS',
            'INPUT_RIGIDS','INPUT_SIFTEES','INPUT_UNITS',
            'OUTPUT_DISPLACEMENTS','OUTPUT_RESTRAINTS_SUMMARY','OUTPUT_GLOBAL_ELEMENT_FORCES'
          ) -join ','
          .\scripts\lfea-m047-bm4l-accdb-provenance.ps1 `
            -AccdbPath "${{ steps.source.outputs.accdb_path }}" `
            -ProfilePath .\benchmarks\LFEA\CAESAR_ACCDB\bm4l-validation.profile.json `
            -TablesCsv $tables `
            -ExpectedAccdbSha256 $env:BM4L_PINNED_MEMBER_SHA256 `
            -DeclaredAccdbSha256 $env:BM4L_DECLARED_ACCDB_SHA256 `
            -ExpectedAccdbBytes ([int64]$env:BM4L_ACCDB_SIZE) `
            -OutPath .\artifacts\bm4l\bm4l-provenance.json

      - name: Reproduce governed six-case baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb "${{ steps.source.outputs.accdb_path }}" `
            --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json `
            --solve-linear true `
            --solve-cases L2,L3,L4,L5,L6,L14 `
            --actual-out artifacts/bm4l/bm4l-actual.json `
            --out artifacts/bm4l/bm4l-report.json `
            --summary-out artifacts/bm4l/bm4l-summary.md

      - name: Verify solver source binding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = Get-Content -Raw artifacts/bm4l/bm4l-actual.json | ConvertFrom-Json
          if ($actual.sourceAccdbSha256 -ne $env:BM4L_PINNED_MEMBER_SHA256) {
            throw "Solver actual package source hash $($actual.sourceAccdbSha256) does not equal pinned archive member $env:BM4L_PINNED_MEMBER_SHA256"
          }

      - name: Build root-cause and recovery evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/lfea-bm4l-root-cause-report.mjs `
            --actual artifacts/bm4l/bm4l-actual.json `
            --report artifacts/bm4l/bm4l-report.json `
            --out artifacts/bm4l/bm4l-root-cause.json
          node scripts/lfea-m047-bm4l-root-cause-diagnostics.mjs `
            --actual artifacts/bm4l/bm4l-actual.json `
            --report artifacts/bm4l/bm4l-report.json `
            --out artifacts/bm4l/bm4l-diagnostics.json
          node scripts/lfea-m047-bm4l-recovery-proof.mjs `
            --actual artifacts/bm4l/bm4l-actual.json `
            --out artifacts/bm4l/bm4l-recovery-proof.json

      - name: Run full reusable mechanics regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run check:lfea-b3.3
          npm run check:lfea-b3.4
          npm run check:lfea-b3.8
          npm run check:lfea-b3.9
          npm run check:lfea-b3.22
          npm run check:lfea-b3.23
          npm run check:core-fea

      - name: Publish qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m047-bm4l-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/bm4l
          if-no-files-found: error
          retention-days: 14

      - name: Enforce governed source/provider gate
        if: always()
        shell: pwsh
        env:
          ACE_AVAILABLE: ${{ steps.ace.outputs.available }}
          SOURCE_AUTHORIZED: ${{ steps.ace.outputs.source_authorized }}
        run: |
          if ($env:ACE_AVAILABLE -ne 'true') {
            throw 'BLOCKED: authenticated Microsoft.ACE.OLEDB.12.0 provider is unavailable.'
          }
          if ($env:SOURCE_AUTHORIZED -ne 'true') {
            throw 'BLOCKED: pinned BM4_L archive-member bytes were not preserved through provider open.'
          }

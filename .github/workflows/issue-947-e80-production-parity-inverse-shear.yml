name: Issue 947 E80 production parity inverse shear audit

on:
  push:
    branches:
      - codex/issue-947-bm4nl-qualification
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download pinned canonical BM4_NL package
        uses: actions/download-artifact@v4
        with:
          name: issue-947-bm4nl-qualification
          path: .work/package
          github-token: ${{ github.token }}
          repository: reallaksh19/Advanced_Analysis
          run-id: 31302834835

      - name: Run E80 production parity and inverse shear audit
        run: |
          node scripts/lfea-issue947-e80-production-parity-inverse-shear.mjs \
            --package .work/package/bm4nl-canonical-package.json \
            --out .work/issue947-e80-production-parity-inverse-shear.json

      - name: Upload E80 parity and inverse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-947-e80-production-parity-inverse-shear
          if-no-files-found: error
          path: .work/issue947-e80-production-parity-inverse-shear.json

name: M047 BM4_L authoritative smooth-90 A-B

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smooth90-authoritative-ab:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/m047-bm4l-root-cause-991'
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout Advanced_Analysis
        uses: actions/checkout@v4

      - name: Checkout pinned Common source
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 45d51ea18624f5775805f399110c1738301c0d90
          path: _common
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install signed Microsoft ACE 2016 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'accessdatabaseengine_X64.exe'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid' -or [string]$signature.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'Microsoft ACE installer signature check failed.' }
          $p = Start-Process -FilePath $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if ($p.ExitCode -notin @(0,3010)) { throw "ACE install failed with exit $($p.ExitCode)" }

      - name: Extract and verify pinned BM4_L source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $zip = '_common/LFEA/BM4/BM4_L.zip'
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant() -ne '978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9') { throw 'ZIP custody mismatch.' }
          $extract = Join-Path $env:RUNNER_TEMP 'bm4l-smooth90-authoritative-ab'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $accdb = Join-Path $extract 'BM4_L.ACCDB'
          if ((Get-FileHash -Algorithm SHA256 $accdb).Hash.ToLowerInvariant() -ne '64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8') { throw 'ACCDB custody mismatch.' }
          "BM4L_ACCDB=$accdb" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build source-backed CAESAR 14 smooth-90 profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json'
          $profile = Get-Content $source -Raw | ConvertFrom-Json
          if ([string]$profile.configurationAuthority.caesarVersion -ne '14.000') { throw 'Expected CAESAR II 14.000 authority.' }
          if ([string]$profile.configurationAuthority.layers.overallGlobalDefault.settings.DEFAULT_CODE -ne 'B31.3_2022') { throw 'Expected B31.3-2022 authority.' }
          if ([string]$profile.configurationAuthority.layers.overallGlobalDefault.settings.APPLY_B31J_SIFS_AND_FLEX -ne 'DEFAULT') { throw 'Expected Apply B31J=DEFAULT authority.' }
          if ($profile.linearSolve.b31jSmooth90FlexibilityCorrection.enabled -ne $false) { throw 'Frozen baseline smooth-90 state changed.' }
          $profile.profileId = 'BM4L-VALIDATION-V1-SOURCE-BACKED-SMOOTH90-ON'
          $profile.configurationAuthority.unresolvedSettings = @(
            $profile.configurationAuthority.unresolvedSettings | Where-Object { $_.setting -ne 'B31J_SMOOTH_90_CORRECTION' }
          )
          $profile.linearSolve.b31jSmooth90FlexibilityCorrection.enabled = $true
          $profile.linearSolve.b31jSmooth90FlexibilityCorrection.authorityStatus = 'RESOLVED'
          $profile.linearSolve.b31jSmooth90FlexibilityCorrection.source = 'HEXAGON_CAESAR_II_14_B31J_METHODS_B31_3_2022_DEFAULT_APPLIES_B31J_2017_SMOOTH90_1_3_OVER_H'
          $profile | ConvertTo-Json -Depth 40 | Out-File artifacts/bm4l-smooth90-authoritative.profile.json -Encoding utf8
          [ordered]@{
            caesarVersion=$profile.configurationAuthority.caesarVersion
            code=$profile.configurationAuthority.layers.overallGlobalDefault.settings.DEFAULT_CODE
            applyB31J=$profile.configurationAuthority.layers.overallGlobalDefault.settings.APPLY_B31J_SIFS_AND_FLEX
            smooth90=$profile.linearSolve.b31jSmooth90FlexibilityCorrection
            remainingUnresolved=@($profile.configurationAuthority.unresolvedSettings | ForEach-Object setting)
          } | ConvertTo-Json -Depth 8 | Out-File artifacts/smooth90-authority.json -Encoding utf8

      - name: Run frozen six-case baseline
        shell: pwsh
        run: |
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb "$env:BM4L_ACCDB" `
            --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json `
            --solve-linear true `
            --solve-cases L2,L3,L4,L5,L6,L14 `
            --actual-out artifacts/base-actual.json `
            --out artifacts/base-report.json `
            --summary-out artifacts/base-summary.md

      - name: Run source-backed smooth-90 six-case candidate
        shell: pwsh
        run: |
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb "$env:BM4L_ACCDB" `
            --profile artifacts/bm4l-smooth90-authoritative.profile.json `
            --solve-linear true `
            --solve-cases L2,L3,L4,L5,L6,L14 `
            --actual-out artifacts/test-actual.json `
            --out artifacts/test-report.json `
            --summary-out artifacts/test-summary.md

      - name: Compare all cases and equilibrium
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Get-Content artifacts/base-report.json -Raw | ConvertFrom-Json
          $test = Get-Content artifacts/test-report.json -Raw | ConvertFrom-Json
          if ($base.source.sha256 -ne $test.source.sha256) { throw 'Source changed across A-B.' }
          function Counts($r,$caseId) {
            $c=$r.qualification.cases|Where-Object caseId -eq $caseId
            $rows=@($c.comparison.rows|Where-Object status -eq 'FAIL')
            $restraint=@($rows|Where-Object{ $_.entityKind-eq'NODE' -and $_.quantity-in@('FORCE','MOMENT') }).Count
            $disp=@($rows|Where-Object{ $_.entityKind-eq'NODE' -and $_.quantity-in@('DISPLACEMENT','ROTATION') }).Count
            $end=@($rows|Where-Object{ $_.entityKind-eq'ELEMENT' -and $_.quantity-like'GLOBAL_END_*' }).Count
            [ordered]@{restraint=$restraint; displacementRotation=$disp; elementEnd=$end; totalTargeted=$restraint+$disp+$end; allFailures=$rows.Count}
          }
          $cases=[ordered]@{}
          $baseTotal=0; $testTotal=0
          foreach($id in @('L2','L3','L4','L5','L6','L14')) {
            $b=Counts $base $id; $t=Counts $test $id
            $beq=$base.mechanics.cases.$id.recoveredEquilibrium
            $teq=$test.mechanics.cases.$id.recoveredEquilibrium
            if ($teq.status -eq 'FAIL') { throw "Smooth-90 candidate violates recovered equilibrium in $id." }
            $cases[$id]=[ordered]@{
              baseline=$b; test=$t
              delta=[ordered]@{restraint=$t.restraint-$b.restraint; displacementRotation=$t.displacementRotation-$b.displacementRotation; elementEnd=$t.elementEnd-$b.elementEnd; totalTargeted=$t.totalTargeted-$b.totalTargeted; allFailures=$t.allFailures-$b.allFailures}
              equilibrium=[ordered]@{baseline=$beq; test=$teq}
            }
            $baseTotal += $b.totalTargeted; $testTotal += $t.totalTargeted
          }
          $out=[ordered]@{
            schema='lfea-m047-authoritative-ab/v1'
            hypothesis='CAESAR14_B31J2017_SMOOTH90_1_3_OVER_H_REQUIRED'
            changedField='profile smooth-90: UNRESOLVED/OFF -> RESOLVED/ON; no solver code change'
            authority=@(
              'Hexagon CAESAR II Version 14 Apply B31J SIFs and Flexibilities: Default applies B31J for B31.3-2020 and later',
              'Hexagon CAESAR II Version 14 B31J Methods: smooth 90-degree bend uses 1.3/h instead of B31.3 1.65/h'
            )
            sourceSha256=$base.source.sha256
            total=[ordered]@{baseline=$baseTotal; test=$testTotal; delta=$testTotal-$baseTotal}
            cases=$cases
            acceptanceNote='L3/L5/L14 still contain provisional [GUESSED] thermal strain and are regression evidence only, not acceptance authority.'
          }
          $out|ConvertTo-Json -Depth 20|Out-File artifacts/smooth90-authoritative-ab.json -Encoding utf8
          $out|ConvertTo-Json -Depth 20

      - name: Upload A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bm4l-smooth90-authoritative-ab-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

name: LAFEA P2-11 one-shot handoff materializer

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply validated selected-pilot schema correction
        run: node scripts/lafea-p2-11-materialize-handoff.mjs

      - name: Commit exact source correction if needed
        shell: bash
        run: |
          set -euo pipefail
          target='src/workspace/lafea-selected-pilot-evidence-handoff.js'
          if git diff --quiet -- "$target"; then
            echo 'Validated handoff correction already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$target"
          git commit -m 'fix(lafea): align selected-pilot handoff with retained result schema'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

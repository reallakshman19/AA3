name: M047 publish verified D1 load-path evidence retry

on:
  push:
    branches: [agent/m047-stage2-measure-load-path-20260813]
    paths: ['.github/workflows/m047-d1-load-path-publish-retry.yml']

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: agent/m047-stage2-r1-r3-evidence
      TARGET_HEAD: 862fa28f328ce279aca421044bee486246427583
      RUN_ID: '31682260399'
      ARTIFACT_ID: '9175161189'
      ARTIFACT_DIGEST: 'sha256:2498b5ce9fa8d730c47730a587bb00786beb654d0303de1553f04e38c2675caf'
      EVIDENCE_HEAD: ee777d92c6fa833e33639de58e16637855b2402f
      ACCDB_SHA256: 64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Verify exact target and make measured syntax fix permanent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test -z "$(git status --porcelain)"
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/lfea-m047-stage2-d1-load-path-experiment.mjs')
          s=p.read_text()
          old="""      const error = new Error(\n        `${caseRecord.caseId} project load-path substep lambda=${physicalLoadFraction} `\n        + `did not converge within ${profile.maximumIterations} iterations.`,\n      );"""
          new="""      const error = new Error(\n        caseRecord.caseId + ' project load-path substep lambda=' + physicalLoadFraction + ' '\n        + 'did not converge within ' + profile.maximumIterations + ' iterations.',\n      );"""
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          node --check scripts/lfea-m047-stage2-d1-load-path-experiment.mjs
      - uses: actions/download-artifact@v4
        with:
          name: m047-d1-load-path-measurement
          path: .measurement
          repository: reallaksh19/Advanced_Analysis
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify, normalize repository EOF, and stage reports
        shell: bash
        run: |
          set -euo pipefail
          cp .measurement/reports/lfea-m047-stage2-d1-load-path-L13.json reports/
          cp .measurement/reports/lfea-m047-stage2-d1-load-path-finalization.json reports/
          python - <<'PY'
          from pathlib import Path
          for name in ['reports/lfea-m047-stage2-d1-load-path-L13.json','reports/lfea-m047-stage2-d1-load-path-finalization.json']:
              p=Path(name); p.write_text(p.read_text().rstrip('\n')+'\n')
          PY
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('reports/lfea-m047-stage2-d1-load-path-L13.json','utf8'));
          const f=JSON.parse(fs.readFileSync('reports/lfea-m047-stage2-d1-load-path-finalization.json','utf8'));
          if(e.sourceAccdbSha256!==process.env.ACCDB_SHA256||f.sourceAccdbSha256!==process.env.ACCDB_SHA256) throw Error('ACCDB custody');
          if(e.n1Reproduction.status!=='PASS'||!e.runs.every(r=>r.converged&&r.deterministic)) throw Error('run validity');
          if(e.refinement.status!=='FAIL'||f.status!=='NO_CONTINUATION_PROMOTION_KEEP_D1_EXPERIMENTAL_BASELINE') throw Error('unexpected disposition');
          if(e.toleranceChanged||e.comparisonPolicyChanged||e.productionSourceModified||f.toleranceChanged||f.comparisonPolicyChanged) throw Error('forbidden mutation');
          const by=Object.fromEntries(e.runs.map(r=>[r.runId,r]));
          const get=(id,n)=>by[id].restraints.find(r=>r.nodeId===n);
          const pct=x=>Number(x).toFixed(2)+'%';
          const md=[
            '# M047 Stage 2 D1 physical-load continuation — real pinned-ACCDB measurement','',
            'Completed real `BM4_L.ACCDB` project-declared continuation RCA. This does not claim CAESAR II internally performs static load stepping.','',
            '## Custody','',
            `- PR #1101 measured source head: \`${process.env.TARGET_HEAD}\``,
            `- sibling evidence head: \`${process.env.EVIDENCE_HEAD}\``,
            `- pinned ACCDB SHA-256: \`${process.env.ACCDB_SHA256}\``,
            `- Actions run: \`${process.env.RUN_ID}\`; artifact ID \`${process.env.ARTIFACT_ID}\`; digest \`${process.env.ARTIFACT_DIGEST}\``,
            `- experiment semantic hash: \`${e.semanticHash}\``,
            `- finalization semantic hash: \`${f.semanticHash}\``,
            `- production solver SHA-256: \`${f.sourceFingerprints.productionSolverSha256}\``,
            `- ephemeral candidate SHA-256: \`${f.sourceFingerprints.ephemeralCandidateSha256}\``, '',
            'Pinned ZIP/member custody and Stage 2 preflight passed before solving. No production-solver, tolerance, comparison-policy, or node-exception change was used.','',
            '## Accuracy','',
            '| run | vectors ≤10% | normals ≤10% | state matches | median vector error | worst above-R1 vector error | total iterations |','|---|---:|---:|---:|---:|---:|---:|',
            ...e.runs.map(r=>`| ${r.runId} | ${r.summary.tangentialVectorsWithinGoal}/23 | ${r.summary.normalWithinGoal}/23 | ${r.summary.constitutiveStateMatches}/23 | ${pct(r.summary.tangentialMedianVectorErrorPct)} | ${pct(r.summary.aboveR1WorstVectorErrorPct)} | ${r.totalIterationCount} |`),'',
            `N1 reproduction: **${e.n1Reproduction.status}**, 396 iterations; max normal difference ${e.n1Reproduction.maximumNormalDifferenceN.toExponential(3)} N; max tangential-component difference ${e.n1Reproduction.maximumTangentialComponentDifferenceN.toExponential(3)} N.`,'',
            '| node | D1/N1 | N5 | N10 | N5 raw state | N10 raw state |','|---|---:|---:|---:|---|---|',
            ...['20710','22140','22220','20440','22370','22120'].map(n=>`| ${n} | ${pct(get('D1-L13-PATH-N1',n).vectorErrorPct)} | ${pct(get('D1-L13-PATH-N5',n).vectorErrorPct)} | ${pct(get('D1-L13-PATH-N10',n).vectorErrorPct)} | ${get('D1-L13-PATH-N5',n).state.solvedRaw} | ${get('D1-L13-PATH-N10',n).state.solvedRaw} |`),'',
            '## Refinement','',
            `N5 vs N10: **${e.refinement.status}**; max normal difference ${e.refinement.maximumNormalDifferenceN.toFixed(2)} N; max tangential-component difference ${e.refinement.maximumTangentialComponentDifferenceN.toFixed(2)} N against the existing ${e.refinement.forceDifferenceLimitN} N force-difference limit.`,
            `Raw-state mismatches: ${e.refinement.stateMismatchRestraintIds.join(', ')}.`,'',
            '## Disposition','',
            `**${f.status}**`,'',
            '- Retain D1 as the experimental L13 baseline.','- Reject physical-load continuation for promotion: N5/N10 both fall to 12/23 vectors and are not refinement-stable.','- L7 and BM4_NL remain blocked.','- Keep 20710 one-axis capacity/path signal open.',''
          ];
          fs.writeFileSync('reports/lfea-m047-stage2-d1-load-path-real-measurement.md',md.join('\n'));
          NODE
          rm -rf .measurement
      - name: Verify contracts and commit to PR 1101 only
        shell: bash
        run: |
          set -euo pipefail
          node scripts/lfea-m047-stage2-d1-load-path-plan-check.mjs
          node scripts/lfea-m047-stage2-d1-load-path-experiment-check.mjs
          node scripts/lfea-m047-stage2-d1-load-path-finalize-check.mjs
          git config user.name reallaksh19
          git config user.email reallaksh19@gmail.com
          git add scripts/lfea-m047-stage2-d1-load-path-experiment.mjs reports/lfea-m047-stage2-d1-load-path-L13.json reports/lfea-m047-stage2-d1-load-path-finalization.json reports/lfea-m047-stage2-d1-load-path-real-measurement.md
          git diff --cached --check
          git commit -m 'M047 Stage 2: record real D1 load-path measurement'
          git push origin HEAD:${TARGET_BRANCH}

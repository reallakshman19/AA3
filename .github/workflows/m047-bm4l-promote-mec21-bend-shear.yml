name: M047 promote MEC-21 bend shear

on:
  push:
    branches: [agent/m047-bm4l-fresh-qualification]
    paths: ['.github/workflows/m047-bm4l-promote-mec21-bend-shear.yml']

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m047-bm4l-fresh-qualification
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Prove independent MEC-21 bend shear mapping
        run: node scripts/lfea-m047-mec21-bend-shear-authority-check.mjs

      - name: Apply bend-arc transverse shear only
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/core/fea-benchmarks/caesar-accdb-linear-solve.js'); t=p.read_text()
          needle="      frameElementProfile: frameProfile(),\n      localAxisProfile: FRAME_LOCAL_AXIS_PROFILE,"
          repl="      frameElementProfile: mec21BendFrameProfile(section),\n      localAxisProfile: FRAME_LOCAL_AXIS_PROFILE,"
          if t.count(needle)!=1: raise SystemExit(f'bend profile site count={t.count(needle)}')
          t=t.replace(needle,repl,1)

          marker="function isCaesarStraightPipeSpan(kind) {"
          helper="""function mec21BendFrameProfile(section) {
            const ro = section.dimensions.outerDiameter / 2;
            const ri = ro - section.dimensions.wallThickness;
            if (!(ri > 0 && ro > ri)) {
              throw new TypeError('MEC-21 bend annulus geometry is invalid.');
            }
            const alpha = (4 / 3)
              * ((ro ** 3) - (ri ** 3))
              / (((ro ** 2) + (ri ** 2)) * (ro - ri));
            const kappa = 1 / alpha;
            return sealFrameElementProfile({
              schema: 'fea-linear-frame-element-profile/v1',
              profileId: 'LINEAR-FRAME-ELEMENT-R1',
              straightPipeFormulation: 'PIPE_FRAME3D_TIMOSHENKO_V1',
              shearDeformation: true,
              shearCorrectionFactorY: {
                value: kappa,
                source: 'INTERGRAPH_CAUX_2015_MEC21_ANNULAR_ALPHA',
              },
              shearCorrectionFactorZ: {
                value: kappa,
                source: 'INTERGRAPH_CAUX_2015_MEC21_ANNULAR_ALPHA',
              },
              releaseRule: 'STATIC_CONDENSATION_V1',
              thermalStrainApproximation: 'UNIFORM_TEMPERATURE_ALPHA_DELTA_T_V1',
              releaseSingularityTolerance: { value: 1e-12, source: PROFILE_SOURCE },
              semanticHash: '',
            });
          }

          function isCaesarStraightPipeSpan(kind) {"""
          if t.count(marker)!=1: raise SystemExit(f'helper insertion site count={t.count(marker)}')
          t=t.replace(marker,helper,1)

          old="        'Bend stiffness uses the qualified B31.3/B31J factor calculator and true tangent-to-tangent arc components; the smooth-90 correction follows the resolved BM4_L profile authority.',"
          new="        'Bend stiffness uses the qualified B31.3/B31J factor calculator and true tangent-to-tangent arc components; the smooth-90 correction follows the resolved BM4_L profile authority, and bend-arc transverse shear follows the MEC-21 annular alpha term mapped as kappa=1/alpha.',"
          if t.count(old)!=1: raise SystemExit(f'limitation text site count={t.count(old)}')
          p.write_text(t.replace(old,new,1))

      - name: Validate production patch
        run: |
          node --check src/core/fea-benchmarks/caesar-accdb-linear-solve.js
          node scripts/lfea-m047-caesar-straight-pipe-shear-authority-check.mjs
          node scripts/lfea-m047-mec21-bend-shear-authority-check.mjs
          node scripts/lfea-b3.1-frame-element-check.mjs
          node scripts/lfea-b3.1-reviewer-check.mjs
          node scripts/lfea-b3.2-piping-component-check.mjs
          node scripts/lfea-b3.3-solver-check.mjs
          node scripts/lfea-b3.4-recovery-check.mjs
          npm run check:core-fea

      - name: Publish patch and retire promoter
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/m047-bm4l-promote-mec21-bend-shear.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/fea-benchmarks/caesar-accdb-linear-solve.js .github/workflows/m047-bm4l-promote-mec21-bend-shear.yml
          git diff --cached --check
          git commit -m "apply MEC-21 bend transverse shear"
          git push origin HEAD:agent/m047-bm4l-fresh-qualification

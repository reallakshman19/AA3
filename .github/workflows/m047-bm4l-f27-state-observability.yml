name: M047 BM4_L F2.7 state observability

on:
  pull_request:
    branches:
      - agent/m047-bm4l-f27-observability-base
    paths:
      - 'agents/PR_M047_bm4l_f27_exact_build_state_observability.md'
      - 'benchmarks/LFEA/CAESAR_ACCDB/m047-bm4l-f27-state-observability-intent.json'

permissions:
  contents: read

jobs:
  audit-retained-state-evidence:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      COMMON_COMMIT: '179c4831cf521cf797c13699cfbbd118315c9244'
      OUTPUT_XML_BLOB: 'd36be50bc8e272c2ab29e279f25bba55b2ccc392'
      INPUT_XML_BLOB: '3423d220374a17f67addd3c8c0c44300ffa46251'
      BM4_NL_ZIP_BLOB: '86a803ed27ebdbd2836452dc2e874c3458aa204c'

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch and authenticate pinned Common objects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts/f27/source | Out-Null
          $objects = @(
            @{ path='LFEA/BM4/Output_BM4.xml'; out='Output_BM4.xml'; blob=$env:OUTPUT_XML_BLOB },
            @{ path='LFEA/BM4/InputXML_BM4.xml'; out='InputXML_BM4.xml'; blob=$env:INPUT_XML_BLOB },
            @{ path='LFEA/BM4/BM4_NL.zip'; out='BM4_NL.zip'; blob=$env:BM4_NL_ZIP_BLOB }
          )
          foreach ($object in $objects) {
            $target = Join-Path $PWD ('artifacts/f27/source/' + $object.out)
            $url = "https://raw.githubusercontent.com/reallaksh19/Common/$env:COMMON_COMMIT/$($object.path)"
            Invoke-WebRequest -Uri $url -OutFile $target
            $actualBlob = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($actualBlob -ne $object.blob) {
              throw "Git blob mismatch for $($object.path): expected $($object.blob), found $actualBlob"
            }
          }

      - name: Audit retained nonlinear state observability
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keywords = @('ACTIVE','BOUNDARY','STATUS','STICK','SLID','FRICT','CONTACT','ITER','CONVERG','GAP','RESTRAINT','STATE','OPEN','CLOSED','REOPEN')

          function Get-Sha256 {
            param([string]$Path)
            return (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
          }

          function Audit-Text {
            param([string]$Path, [string]$Label)
            $text = [System.IO.File]::ReadAllText($Path)
            $elements = @()
            $elementGroups = [regex]::Matches($text, '<\/?\s*([A-Za-z_][A-Za-z0-9_.:-]*)\b') |
              Group-Object { $_.Groups[1].Value } | Sort-Object Name
            foreach ($group in $elementGroups) {
              $elements += [ordered]@{ name=$group.Name; count=$group.Count }
            }
            $attributes = @()
            $attributeGroups = [regex]::Matches($text, '\b([A-Za-z_][A-Za-z0-9_.:-]*)\s*=') |
              Group-Object { $_.Groups[1].Value } | Sort-Object Name
            foreach ($group in $attributeGroups) {
              $attributes += [ordered]@{ name=$group.Name; count=$group.Count }
            }
            $hits = [ordered]@{}
            foreach ($keyword in $keywords) {
              $matches = [regex]::Matches($text, [regex]::Escape($keyword), [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)
              $snippets = @()
              foreach ($match in @($matches | Select-Object -First 5)) {
                $start = [Math]::Max(0, $match.Index - 80)
                $length = [Math]::Min(220, $text.Length - $start)
                $snippets += ($text.Substring($start, $length) -replace '[\r\n\t]+',' ')
              }
              $hits[$keyword] = [ordered]@{ count=$matches.Count; snippets=$snippets }
            }
            $case13 = @()
            foreach ($match in [regex]::Matches($text, '<PWCASE\s+NUMBER="13"[^>]*>(.*?)</PWCASE>', [System.Text.RegularExpressions.RegexOptions]::IgnoreCase -bor [System.Text.RegularExpressions.RegexOptions]::Singleline)) {
              $case13 += (($match.Groups[1].Value -replace '[\r\n\t]+',' ').Trim())
            }
            return [ordered]@{
              label=$Label
              byteLength=(Get-Item -LiteralPath $Path).Length
              sha256=(Get-Sha256 -Path $Path)
              elementCounts=$elements
              attributeCounts=$attributes
              keywordHits=$hits
              pwCase13=$case13
              loadCase13AttributeCount=[regex]::Matches($text, '\bLOAD_CASE\s*=\s*"13"', [System.Text.RegularExpressions.RegexOptions]::IgnoreCase).Count
            }
          }

          function Audit-Binary {
            param([string]$Path, [string]$Label)
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
            $utf16 = [System.Text.Encoding]::Unicode.GetString($bytes)
            $hits = [ordered]@{}
            foreach ($keyword in $keywords) {
              $hits[$keyword] = [ordered]@{
                asciiCount=[regex]::Matches($ascii, [regex]::Escape($keyword), [System.Text.RegularExpressions.RegexOptions]::IgnoreCase).Count
                utf16LeCount=[regex]::Matches($utf16, [regex]::Escape($keyword), [System.Text.RegularExpressions.RegexOptions]::IgnoreCase).Count
              }
            }
            return [ordered]@{ label=$Label; byteLength=$bytes.Length; sha256=(Get-Sha256 -Path $Path); keywordHits=$hits }
          }

          $sourceDir = Join-Path $PWD 'artifacts/f27/source'
          $outXml = Join-Path $sourceDir 'Output_BM4.xml'
          $inputXml = Join-Path $sourceDir 'InputXML_BM4.xml'
          $nlZip = Join-Path $sourceDir 'BM4_NL.zip'
          $nlDir = Join-Path $PWD 'artifacts/f27/nl'
          Expand-Archive -LiteralPath $nlZip -DestinationPath $nlDir -Force

          $textExtensions = @('.xml','.txt','.csv','.log','.out','.lis','.dat','.json','.ini','.cfg')
          $members = @()
          $memberAudits = @()
          foreach ($file in @(Get-ChildItem -LiteralPath $nlDir -File -Recurse | Sort-Object FullName)) {
            $relative = [System.IO.Path]::GetRelativePath($nlDir, $file.FullName).Replace('\','/')
            $extension = $file.Extension.ToLowerInvariant()
            $members += [ordered]@{ path=$relative; byteLength=$file.Length; sha256=(Get-Sha256 -Path $file.FullName); extension=$extension }
            if ($textExtensions -contains $extension) {
              $memberAudits += Audit-Text -Path $file.FullName -Label $relative
            } else {
              $memberAudits += Audit-Binary -Path $file.FullName -Label $relative
            }
          }

          $audit = [ordered]@{
            schema='m047-bm4l-f27-state-observability-audit/v1'
            exactHead='${{ github.event.pull_request.head.sha }}'
            commonCommit=$env:COMMON_COMMIT
            authenticatedObjects=@(
              [ordered]@{ path='LFEA/BM4/Output_BM4.xml'; gitBlobSha=$env:OUTPUT_XML_BLOB; byteLength=(Get-Item $outXml).Length; sha256=(Get-Sha256 -Path $outXml) },
              [ordered]@{ path='LFEA/BM4/InputXML_BM4.xml'; gitBlobSha=$env:INPUT_XML_BLOB; byteLength=(Get-Item $inputXml).Length; sha256=(Get-Sha256 -Path $inputXml) },
              [ordered]@{ path='LFEA/BM4/BM4_NL.zip'; gitBlobSha=$env:BM4_NL_ZIP_BLOB; byteLength=(Get-Item $nlZip).Length; sha256=(Get-Sha256 -Path $nlZip) }
            )
            outputXml=(Audit-Text -Path $outXml -Label 'Output_BM4.xml')
            inputXml=(Audit-Text -Path $inputXml -Label 'InputXML_BM4.xml')
            nonlinearZip=[ordered]@{ gitBlobSha=$env:BM4_NL_ZIP_BLOB; memberCount=$members.Count; members=$members; memberAudits=$memberAudits }
            policy=[ordered]@{ finalResponseMaySelectState=$false; responseFittingAllowed=$false; productionMechanicsAuthorized=$false; l13RescoreAuthorized=$false }
          }

          New-Item -ItemType Directory -Force -Path artifacts/f27/out | Out-Null
          $audit | ConvertTo-Json -Depth 64 | Set-Content -Encoding utf8 artifacts/f27/out/state-observability.json
          [ordered]@{
            schema='m047-bm4l-f27-state-observability-check/v1'
            status='PASS'
            exactHead='${{ github.event.pull_request.head.sha }}'
            commonCommit=$env:COMMON_COMMIT
            nonlinearZipMemberCount=$members.Count
            outputCase13=$audit.outputXml.pwCase13
            sourceObjectsAuthenticated=$true
            productionMechanicsAuthorized=$false
            l13RescoreAuthorized=$false
          } | ConvertTo-Json -Depth 12 | Set-Content -Encoding utf8 artifacts/f27/out/check.json

      - name: Upload F2.7 observability evidence
        uses: actions/upload-artifact@v4
        with:
          name: m047-bm4l-f27-state-observability-${{ github.event.pull_request.head.sha }}
          path: artifacts/f27/out/*
          if-no-files-found: error
          retention-days: 14

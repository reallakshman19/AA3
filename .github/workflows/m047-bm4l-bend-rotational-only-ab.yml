name: M047 BM4_L bend rotational-only A-B

on:
  push:
    branches: [agent/m047-bm4l-root-cause]
    paths: ['.github/workflows/m047-bm4l-bend-rotational-only-ab.yml']

permissions:
  contents: read

jobs:
  ab:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      COMMON_COMMIT: '45d51ea18624f5775805f399110c1738301c0d90'
      ZIP_SHA256: '978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9'
      MEMBER_SHA256: '64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8'
      ACE_URL: 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe'
      ACE_SHA256: '04e96c9f1a1f7d251a88aececf1dc10ff65950392787427c00814a43308003de'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Install authenticated Microsoft ACE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/ab | Out-Null
          $installer=Join-Path $PWD 'artifacts/ab/accessdatabaseengine_X64.exe'
          Invoke-WebRequest -Uri $env:ACE_URL -OutFile $installer
          $hash=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne $env:ACE_SHA256){ throw "ACE installer hash mismatch: $hash" }
          $sig=Get-AuthenticodeSignature $installer
          if($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft'){ throw 'ACE signature validation failed.' }
          $p=Start-Process $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if($p.ExitCode -notin @(0,3010)){ throw "ACE install failed: $($p.ExitCode)" }

      - name: Fetch pinned source
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $PWD 'artifacts/ab/BM4_L.zip'
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/reallaksh19/Common/$env:COMMON_COMMIT/LFEA/BM4/BM4_L.zip" -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ZIP_SHA256){ throw 'ZIP hash mismatch.' }
          Expand-Archive $zip -DestinationPath artifacts/ab/source -Force
          $accdb=Join-Path $PWD 'artifacts/ab/source/BM4_L.ACCDB'
          if((Get-FileHash $accdb -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:MEMBER_SHA256){ throw 'ACCDB member hash mismatch.' }
          "accdb=$accdb" >> $env:GITHUB_OUTPUT

      - name: Run current governed six-case baseline
        shell: pwsh
        run: |
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb "${{ steps.source.outputs.accdb }}" `
            --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json `
            --solve-linear true `
            --solve-cases L2,L3,L4,L5,L6,L14 `
            --actual-out artifacts/ab/baseline-actual.json `
            --out artifacts/ab/baseline-report.json `
            --summary-out artifacts/ab/baseline-summary.md

      - name: Patch only B31J bend flexibility insertion
        shell: python
        run: |
          from pathlib import Path
          import re
          path=Path('src/core/linear-fea-piping-components/component-elements.js')
          text=path.read_text()
          old="""  compileFrameElement,\n  frameLocalStiffness,\n  transformStiffnessToGlobal,"""
          new="""  compileFrameElement,\n  condenseEndConditions,\n  frameLocalStiffness,\n  transformStiffnessToGlobal,"""
          if old not in text:
              raise SystemExit('frame-element import insertion point missing')
          text=text.replace(old,new,1)
          pattern=r"export function applyBendingFlexibilityCorrection\(frameElement, factor\) \{.*?\n\}\n\n/\*\*\n \* Represent a valve"
          replacement="""export function applyBendingFlexibilityCorrection(frameElement, factor) {
            const value = requirePositive(factor, 'flexibilityFactor', 'PIPING_COMPONENT_FACTOR_SET_INVALID');
            if (value === 1) {
              return Object.freeze({
                kind: 'B31J_ROTATIONAL_ONLY_FLEXIBILITY_DIAGNOSTIC_V1',
                factor: value,
                appliedTo: Object.freeze(['BENDING_Y', 'BENDING_Z']),
                localStiffness: frameElement.localStiffness,
                globalStiffness: frameElement.globalStiffness,
              });
            }
            const extra = value - 1;
            const e = frameElement.material.elasticModulus;
            const length = frameElement.geometry.length;
            const ky = (2 * e * frameElement.section.secondMomentY) / (extra * length);
            const kz = (2 * e * frameElement.section.secondMomentZ) / (extra * length);
            const condensed = condenseEndConditions(
              frameElement.localStiffness,
              [],
              [
                { index: 4, stiffness: ky },
                { index: 10, stiffness: ky },
                { index: 5, stiffness: kz },
                { index: 11, stiffness: kz },
              ],
              1e-12,
            );
            const local = condensed.matrix;
            return Object.freeze({
              kind: 'B31J_ROTATIONAL_ONLY_FLEXIBILITY_DIAGNOSTIC_V1',
              factor: value,
              appliedTo: Object.freeze(['BENDING_Y', 'BENDING_Z']),
              springStiffnessY: ky,
              springStiffnessZ: kz,
              localStiffness: local,
              globalStiffness: transformStiffnessToGlobal(local, frameElement.transformation.matrix),
            });
          }

          /**
           * Represent a valve"""
          text2,n=re.subn(pattern,replacement,text,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'expected one flexibility function replacement, found {n}')
          path.write_text(text2)

      - name: Prove candidate preserves declared pure-moment bend factor
        shell: pwsh
        run: |
          node --check src/core/linear-fea-piping-components/component-elements.js
          npm run check:lfea-b3.2

      - name: Run rotational-only candidate six cases
        shell: pwsh
        run: |
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb "${{ steps.source.outputs.accdb }}" `
            --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json `
            --solve-linear true `
            --solve-cases L2,L3,L4,L5,L6,L14 `
            --actual-out artifacts/ab/candidate-actual.json `
            --out artifacts/ab/candidate-report.json `
            --summary-out artifacts/ab/candidate-summary.md

      - name: Build signed A-B evidence
        shell: pwsh
        run: |
          @'
          const fs=require('fs');
          const base=JSON.parse(fs.readFileSync('artifacts/ab/baseline-report.json','utf8'));
          const test=JSON.parse(fs.readFileSync('artifacts/ab/candidate-report.json','utf8'));
          const cases=['L2','L3','L4','L5','L6','L14'];
          function counts(r,c){return {restraint:r.restraintBasis.cases[c].exceedingComponentCount,disp:r.displacementBasis.cases[c].exceedingComponentCount,end:r.elementBasis.cases[c].exceedingComponentCount};}
          function rows(r,c){return r.qualification.cases.find(x=>x.caseId===c).comparison.rows;}
          function key(x){return [x.entityKind,x.entityId,x.quantity,x.component,x.unit].join('|');}
          const out={schema:'m047-b31j-bend-rotational-only-ab/v1',hypothesis:'same B31J factor represented only as end rotational compliance; translational DOFs unmodified',cases:{}};
          for(const c of cases){
            const bm=new Map(rows(base,c).map(x=>[key(x),x])); const tm=new Map(rows(test,c).map(x=>[key(x),x]));
            const changed=[];
            for(const [k,b] of bm){const t=tm.get(k); if(t && t.actualValue!==b.actualValue) changed.push({key:k,reference:b.referenceValue,baseline:b.actualValue,candidate:t.actualValue,baselineStatus:b.status,candidateStatus:t.status,delta:t.actualValue-b.actualValue});}
            changed.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
            out.cases[c]={baselineCounts:counts(base,c),candidateCounts:counts(test,c),changedRowCount:changed.length,largestSignedDeltas:changed.slice(0,150)};
          }
          fs.writeFileSync('artifacts/ab/bend-rotational-only-ab.json',JSON.stringify(out,null,2)+'\n');
          '@ | node
          Get-Content artifacts/ab/bend-rotational-only-ab.json

      - name: Run solver/recovery integrity checks
        shell: pwsh
        run: |
          npm run check:lfea-b3.3
          npm run check:lfea-b3.4
          npm run check:core-fea

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m047-bm4l-bend-rotational-only-ab-${{ github.sha }}
          path: artifacts/ab
          retention-days: 14

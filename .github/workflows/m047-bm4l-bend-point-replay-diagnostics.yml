name: M047 BM4_L bend point/replay diagnostics

on:
  push:
    branches: [agent/m047-bm4l-root-cause]
    paths:
      - '.github/workflows/m047-bm4l-bend-point-replay-diagnostics.yml'
      - 'scripts/lfea-m047-bm4l-bend-point-replay-diagnostics.mjs'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      COMMON_COMMIT: '45d51ea18624f5775805f399110c1738301c0d90'
      ZIP_SHA256: '978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9'
      MEMBER_SHA256: '64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8'
      ACE_URL: 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe'
      ACE_SHA256: '04e96c9f1a1f7d251a88aececf1dc10ff65950392787427c00814a43308003de'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m047-bm4l-root-cause
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Install authenticated ACE and fetch pinned source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/bend-point/source | Out-Null
          $installer=Join-Path $PWD 'artifacts/bend-point/accessdatabaseengine_X64.exe'
          Invoke-WebRequest -Uri $env:ACE_URL -OutFile $installer
          if((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ACE_SHA256){ throw 'ACE installer hash mismatch.' }
          $sig=Get-AuthenticodeSignature $installer
          if($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft'){ throw 'ACE signature validation failed.' }
          $p=Start-Process $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if($p.ExitCode -notin @(0,3010)){ throw "ACE install failed: $($p.ExitCode)" }
          Remove-Item $installer -Force
          $zip=Join-Path $PWD 'artifacts/bend-point/BM4_L.zip'
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/reallaksh19/Common/$env:COMMON_COMMIT/LFEA/BM4/BM4_L.zip" -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ZIP_SHA256){ throw 'ZIP hash mismatch.' }
          Expand-Archive $zip -DestinationPath artifacts/bend-point/source -Force
          $accdb=Join-Path $PWD 'artifacts/bend-point/source/BM4_L.ACCDB'
          if((Get-FileHash $accdb -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:MEMBER_SHA256){ throw 'ACCDB member hash mismatch.' }
          "ACCDB=$accdb" >> $env:GITHUB_ENV

      - name: Export bend geometry source tables
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\scripts\lfea-caesar-accdb-export.ps1 `
            -AccdbPath $env:ACCDB `
            -TablesCsv 'INPUT_BENDS,INPUT_BASIC_ELEMENT_DATA,INPUT_NODAL_COORDINATES' `
            | Set-Content -Encoding utf8 artifacts/bend-point/bend-tables.json

      - name: Run governed L2 state
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb $env:ACCDB `
            --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json `
            --solve-linear true `
            --solve-cases L2 `
            --actual-out artifacts/bend-point/actual.json `
            --out artifacts/bend-point/report.json `
            --summary-out artifacts/bend-point/summary.md

      - name: Normalize canonical flat 12x12 storage for legacy replay consumer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          const fs = require('fs');
          const source = 'artifacts/bend-point/actual.json';
          const target = 'artifacts/bend-point/replay-actual.json';
          const actual = JSON.parse(fs.readFileSync(source, 'utf8').replace(/^\uFEFF/, ''));
          for (const evidence of Object.values(actual.mechanics?.cases ?? {})) {
            for (const row of evidence.recoveryLedger ?? []) {
              if (Array.isArray(row.globalStiffness) && row.globalStiffness.length === 144 && !Array.isArray(row.globalStiffness[0])) {
                row.globalStiffness = Array.from({ length: 12 }, (_unused, i) => row.globalStiffness.slice(i * 12, (i + 1) * 12));
              }
            }
          }
          fs.writeFileSync(target, `${JSON.stringify(actual)}\n`);
          '@ | node

      - name: Run bend point and replay sensitivity diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/lfea-m047-bm4l-bend-point-replay-diagnostics.mjs
          node scripts/lfea-m047-bm4l-bend-point-replay-diagnostics.mjs `
            --actual artifacts/bend-point/replay-actual.json `
            --report artifacts/bend-point/report.json `
            --tables artifacts/bend-point/bend-tables.json `
            --case L2 `
            --out artifacts/bend-point/bend-point-replay.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m047-bm4l-bend-point-replay-${{ github.sha }}
          path: artifacts/bend-point
          retention-days: 14
          if-no-files-found: error

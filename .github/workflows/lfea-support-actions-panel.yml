name: lfea-support-actions-panel

on:
  pull_request:
    paths:
      - 'src/workspace/event-topics.js'
      - 'src/workspace/properties-panel.js'
      - 'src/workspace/lfea-support-actions-panel.js'
      - 'src/workspace/topology-edit/topology-edit-lifecycle-controller.js'
      - 'scripts/lfea-support-actions-panel-check.mjs'
      - 'scripts/lfea-support-actions-panel-source-guard.mjs'
      - '.github/workflows/lfea-support-actions-panel.yml'

permissions:
  contents: read

jobs:
  qualify-support-actions-panel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove exact-head execution
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --exit-code

      - name: Validate event provenance and panel states
        run: node scripts/lfea-support-actions-panel-check.mjs

      - name: Enforce read-only panel custody
        run: node scripts/lfea-support-actions-panel-source-guard.mjs

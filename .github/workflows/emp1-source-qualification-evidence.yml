name: EMP.1 primary-source qualification evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  primary-source-qualification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Advanced_Analysis candidate
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Observe exact PR1286 PDF bytes and candidate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/test-results/emp1-source-qualification"
          mkdir -p "$out"

          set +e
          node scripts/emp1-source-custody-check.mjs --source-root "$PWD/docs/emp1" \
            > "$out/source-custody.json" 2> "$out/source-custody.stderr.txt"
          rc=$?
          set -e

          cat "$out/source-custody.json"
          printf '%s\n' "$rc" > "$out/source-custody.exit-code.txt"

          # Before SHA-256 is frozen, BLOCKED/rc=2 is the required state.
          # Any byte-count/blob mismatch or malformed ledger must fail the job.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            cat "$out/source-custody.stderr.txt" >&2 || true
            exit "$rc"
          fi

          node --input-type=module <<'NODE' > "$out/pr1286-blob-identity.json"
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';

          const files = [
            {
              id: 'WRC537_2013',
              path: 'docs/emp1/WRC537_2013.pdf',
              expectedBlob: 'ce861233928154145a9257efbbf8dbef3f5a17d1',
              expectedBytes: 1443744,
            },
            {
              id: 'CAUX_2017_WRC01F_PP24_31',
              path: 'docs/emp1/CAUx 2017 - WRC01f.pdf',
              expectedBlob: '76573b41462943b2987e28b23ebbbf7e51ac0a02',
              expectedBytes: 7260396,
            },
          ];

          const rows = [];
          for (const item of files) {
            const bytes = await readFile(item.path);
            const git = createHash('sha1')
              .update(Buffer.from(`blob ${bytes.length}\0`, 'utf8'))
              .update(bytes)
              .digest('hex');
            const sha256 = createHash('sha256').update(bytes).digest('hex');
            const row = {
              ...item,
              observedBytes: bytes.length,
              observedBlob: git,
              candidateRawPdfSha256: sha256,
              byteCountMatches: bytes.length === item.expectedBytes,
              blobMatches: git === item.expectedBlob,
            };
            if (!row.byteCountMatches || !row.blobMatches) {
              throw new Error(`EMP1_PR1286_SOURCE_IDENTITY_MISMATCH:${item.id}`);
            }
            rows.push(row);
          }
          console.log(JSON.stringify({
            schema: 'emp1-pr1286-source-byte-observation/v1',
            status: 'PASS',
            authority: 'CANDIDATE_HASH_OBSERVATION_ONLY_UNTIL_LEDGER_FREEZE_AND_REOBSERVATION',
            rows,
          }, null, 2));
          NODE
          cat "$out/pr1286-blob-identity.json"

      - name: Verify retained-source arbitration remains fail closed
        shell: bash
        run: |
          set -euo pipefail
          node scripts/emp1-wrc-retained-source-arbitration-check.mjs \
            | tee test-results/emp1-source-qualification/retained-source-arbitration-check.json

      - name: Preserve pre-PR1286 coefficient contract as a blocked baseline
        shell: bash
        run: |
          set -euo pipefail
          node scripts/emp1-wrc-coefficient-transcription-self-test.mjs \
            | tee test-results/emp1-source-qualification/coefficient-transcription-self-test.json
          node scripts/emp1-wrc-coefficient-transcription-generate.mjs

      - name: Prove CAUx pp24-31 cannot be substituted or observed early
        shell: bash
        run: |
          set -euo pipefail
          node scripts/emp1-caux-pp24-31-extraction-gate-check.mjs \
            | tee test-results/emp1-source-qualification/caux-pp24-31-extraction-gate-check.json

      - name: Upload source qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emp1-primary-source-qualification-${{ github.sha }}
          path: test-results/emp1-source-qualification
          if-no-files-found: error
          retention-days: 30

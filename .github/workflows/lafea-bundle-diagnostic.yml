name: LAFEA bundle diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/lafea-bundle-diagnostic.yml'
      - 'src/workspace/lafea-workbench-controller*.js'
      - 'src/workspace/lafea-*.js'
      - 'vite.config.js'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Locate static workbench importers
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n --include='*.js' "lafea-workbench-controller" src || true
          grep -R -n --include='*.js' "LafeaWorkbenchController" src || true
      - run: npm ci
      - name: Build and list chunks
        shell: bash
        run: |
          set -euo pipefail
          npx vite build
          find dist/assets -maxdepth 1 -type f -name '*.js' -printf '%s %f\n' | sort -nr | head -20

reconciliation_note: >
  Source labels must be preserved as printed. The EI material includes an AIV
  Flowchart T2-6 for welded-discontinuity assessment and other T2 flowchart labels
  that can collide in secondary transcriptions. Local software may disambiguate by
  module/context, but it must not invent a replacement EI identifier.
calculation_chain:
  source_pwl:
    source: T2-5_flowchart.yaml
    authority: VERIFIED_FOR_D2_3_SOURCE_PWL_ANCHORS
    equation: "10*log10(W^2 * ((P1-P2)/P1)^3.6 * (Te/Mw)^1.2) + 126.1 + SFF"
  spatial_attenuation:
    source: T2-5_flowchart.yaml
    authority: VERIFIED_FOR_D2_3_ATTENUATION_ANCHOR
    equation: "attenuation_dB = 60 * L_dis_m / Dint_mm; PWL_dis = PWL_effective - attenuation_dB"
    empirical_unit_basis: "L in m; Dint in mm"
  multi_source_combination:
    candidate_equation: "PWL_total = 10 * log10(sum(10^(PWL_i/10)))"
    authority: UNRESOLVED_PENDING_DIRECT_T2_5_RECONCILIATION_AND_INDEPENDENT_BENCHMARK
  discontinuity_fatigue:
    source: T2-6_flowchart.yaml
    authority: VERIFIED_SUBSET_ONLY
    unresolved:
      - A_S_B_EQUATIONS
      - D_OVER_d_10_AND_ABOVE
      - NON_WELDOLET_CONNECTION_MODIFIERS
      - GENERAL_MATERIAL_MODIFIER
      - LOF_MAPPING_FOR_Lf_GE_0_5
  modifiers:
    FLM1:
      file: T2-6_diameter_ratio_modifier.csv
      authority: VERIFIED_UNDER_10_FORMULA_WITH_OPEN_D2_3_PUBLISHED_VARIANCE
    FLM2:
      file: T2-6_connection_modifier.csv
      authority: VERIFIED_WELDOLET_PATH_ONLY
    material:

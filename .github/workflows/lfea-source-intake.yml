name: lfea-source-intake

on:
  pull_request:
    paths:
      - 'src/workspace/lfea-source-intake.js'
      - 'src/workspace/lfea-topology-edit-source-capture.js'
      - 'scripts/lfea-source-intake-check.mjs'
      - 'scripts/lfea-source-intake-source-guard.mjs'
      - '.github/workflows/lfea-source-intake.yml'

permissions:
  contents: read

jobs:
  qualify-source-intake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove exact-head execution
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --exit-code

      - name: Seal and capture all LFEA source kinds
        run: node scripts/lfea-source-intake-check.mjs

      - name: Enforce read-only editor custody
        run: node scripts/lfea-source-intake-source-guard.mjs

name: M047 one-shot Windows CLI guard repair

on:
  push:
    branches: [agent/m047-bm4l-root-cause]
    paths: ['.github/workflows/m047-one-shot-cli-guard-repair.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m047-bm4l-root-cause
          fetch-depth: 0

      - name: Make CLI entry guards platform-correct
        shell: python
        run: |
          from pathlib import Path

          targets = [
              Path('scripts/lfea-bm4l-root-cause-report.mjs'),
              Path('scripts/lfea-m047-bm4l-baseline-parity.mjs'),
          ]
          for path in targets:
              text = path.read_text()
              if "from 'node:url'" not in text:
                  marker = "import { resolve } from 'node:path';"
                  if marker not in text:
                      raise SystemExit(f'{path}: missing path import marker')
                  text = text.replace(marker, marker + "\nimport { pathToFileURL } from 'node:url';", 1)
              old = "if (import.meta.url === `file://${process.argv[1]}`) main(process.argv.slice(2));"
              new = "if (process.argv[1] && import.meta.url === pathToFileURL(resolve(process.argv[1])).href) main(process.argv.slice(2));"
              if old not in text:
                  raise SystemExit(f'{path}: broken CLI guard not found exactly once')
              text = text.replace(old, new, 1)
              path.write_text(text)

      - name: Validate Node syntax
        shell: bash
        run: |
          node --check scripts/lfea-bm4l-root-cause-report.mjs
          node --check scripts/lfea-m047-bm4l-baseline-parity.mjs

      - name: Retire this one-shot and publish repair
        shell: bash
        run: |
          rm .github/workflows/m047-one-shot-cli-guard-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lfea-bm4l-root-cause-report.mjs scripts/lfea-m047-bm4l-baseline-parity.mjs .github/workflows/m047-one-shot-cli-guard-repair.yml
          git diff --cached --check
          git commit -m "fix BM4_L Windows diagnostic entrypoints"
          git push origin HEAD:agent/m047-bm4l-root-cause

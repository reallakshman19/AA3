name: B02D V2 exact-main observer (temporary)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  exact-main-observer:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact main base SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exact main base SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Execute B02D V2 exact-head governing response observer
        run: node scripts/lafea-b02d-v2-governing-response-exact-head-check.mjs

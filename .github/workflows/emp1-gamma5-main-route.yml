name: EMP.1 gamma5 bounded route on current main
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-gamma5-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enforce independent-oracle import firewall
        run: node scripts/emp1-wrc537-independent-oracle-import-firewall-check.mjs
      - name: Qualify independent oracle interpretation decoupling
        run: node scripts/emp1-wrc537-independent-oracle-decoupling-check.mjs
      - name: Prove oracle catches sign/figure/load corruption
        run: node scripts/emp1-wrc537-independent-oracle-falsifiers.mjs
      - name: Re-observe independent gamma5 full Table-5 oracle
        run: node scripts/emp1-wrc-gamma5-full-table5-independent-handcalc.mjs
      - name: Qualify WRC r0 outside-radius custody
        run: node scripts/emp1-wrc537-r0-outside-radius-custody-check.mjs
      - name: Qualify WRC 4.5 cylindrical applicability
        run: node scripts/emp1-wrc537-cylindrical-applicability-check.mjs
      - name: Qualify WRC eight-point extrema authority
        run: node scripts/emp1-wrc537-eight-point-extrema-scope-check.mjs
      - name: Qualify longitudinal-moment curve selection policy
        run: node scripts/emp1-wrc537-longitudinal-moment-curve-selection-check.mjs
      - name: Re-observe qualified zero-dp upstream load producer
        run: node scripts/emp1-a-zero-dp-wrc-load-producer-qualification.mjs
      - name: Re-observe fail-closed gamma5 authority
        run: node scripts/emp1-wrc-gamma5-axis-authority-suspension-check.mjs
      - name: Preserve EMP.1 public product truth
        run: node scripts/emp1-public-product-check.mjs

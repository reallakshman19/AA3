name: M047 BM4_L shared CAESAR Timoshenko profile A/B

on:
  push:
    branches: [agent/m047-bm4l-root-cause]
    paths: ['.github/workflows/m047-bm4l-global-timoshenko-ab.yml']

permissions:
  contents: read

jobs:
  ab:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m047-bm4l-root-cause
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Install authenticated ACE and fetch canonical source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';New-Item -ItemType Directory -Force artifacts/global-shear|Out-Null
          $installer=Join-Path $PWD 'artifacts/global-shear/accessdatabaseengine_X64.exe';Invoke-WebRequest -Uri 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe' -OutFile $installer
          if((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()-ne'04e96c9f1a1f7d251a88aececf1dc10ff65950392787427c00814a43308003de'){throw'ACE hash mismatch'};$sig=Get-AuthenticodeSignature $installer;if($sig.Status-ne'Valid'-or$sig.SignerCertificate.Subject-notmatch'Microsoft'){throw'ACE signature invalid'}
          $p=Start-Process $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru;if($p.ExitCode-notin@(0,3010)){throw"ACE install failed $($p.ExitCode)"};Remove-Item $installer -Force
          $zip=Join-Path $PWD 'artifacts/global-shear/BM4_L.zip';Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/reallaksh19/Common/45d51ea18624f5775805f399110c1738301c0d90/LFEA/BM4/BM4_L.zip' -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()-ne'978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9'){throw'ZIP hash mismatch'};Expand-Archive $zip -DestinationPath artifacts/global-shear/source -Force
          if((Get-FileHash artifacts/global-shear/source/BM4_L.ACCDB -Algorithm SHA256).Hash.ToLowerInvariant()-ne'64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8'){throw'ACCDB hash mismatch'}

      - name: Run Euler-Bernoulli baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';New-Item -ItemType Directory -Force artifacts/global-shear/before|Out-Null
          node scripts/lfea-caesar-accdb-benchmark.mjs --accdb artifacts/global-shear/source/BM4_L.ACCDB --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json --solve-linear true --solve-cases L2,L3,L4,L5,L6,L14 --actual-out artifacts/global-shear/before/actual.json --out artifacts/global-shear/before/report.json

      - name: Apply only shared CAESAR frame-profile shear formulation
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/core/fea-benchmarks/caesar-accdb-linear-solve.js');t=p.read_text()
          old="""function frameProfile() {\n  return sealFrameElementProfile({\n    schema: 'fea-linear-frame-element-profile/v1',\n    profileId: 'LINEAR-FRAME-ELEMENT-R1',\n    straightPipeFormulation: 'PIPE_FRAME3D_EULER_BERNOULLI_V1',\n    shearDeformation: false,\n    releaseRule: 'STATIC_CONDENSATION_V1',"""
          new="""function frameProfile() {\n  return sealFrameElementProfile({\n    schema: 'fea-linear-frame-element-profile/v1',\n    profileId: 'LINEAR-FRAME-ELEMENT-R1',\n    straightPipeFormulation: 'PIPE_FRAME3D_TIMOSHENKO_V1',\n    shearDeformation: true,\n    shearCorrectionFactorY: { value: 0.5, source: 'INTERGRAPH-CAESAR-II-CAUX-2015-FKX-SHEAR-COEFFICIENT-2' },\n    shearCorrectionFactorZ: { value: 0.5, source: 'INTERGRAPH-CAESAR-II-CAUX-2015-FKX-SHEAR-COEFFICIENT-2' },\n    releaseRule: 'STATIC_CONDENSATION_V1',"""
          if t.count(old)!=1:raise SystemExit(f'frame profile guard expected 1, found {t.count(old)}')
          p.write_text(t.replace(old,new))

      - name: Run authority, reusable checks and six-case candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';node --check src/core/fea-benchmarks/caesar-accdb-linear-solve.js;node scripts/lfea-m047-caesar-pipe-shear-authority-check.mjs
          node scripts/lfea-b3.1-frame-element-check.mjs;node scripts/lfea-b3.2-piping-component-check.mjs;node scripts/lfea-b3.3-solver-check.mjs;node scripts/lfea-b3.4-recovery-check.mjs;node scripts/lfea-b3.6-sparse-assembly-check.mjs;node scripts/lfea-b3.9-gravity-self-weight-check.mjs
          New-Item -ItemType Directory -Force artifacts/global-shear/after|Out-Null
          node scripts/lfea-caesar-accdb-benchmark.mjs --accdb artifacts/global-shear/source/BM4_L.ACCDB --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json --solve-linear true --solve-cases L2,L3,L4,L5,L6,L14 --actual-out artifacts/global-shear/after/actual.json --out artifacts/global-shear/after/report.json
          node scripts/lfea-m047-bm4l-recovery-proof.mjs --actual artifacts/global-shear/after/actual.json --expected-source-sha 64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8 --out artifacts/global-shear/after/recovery-proof.json

      - name: Quantify shared-profile A/B
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$a=Get-Content -Raw artifacts/global-shear/before/report.json|ConvertFrom-Json -Depth 100;$b=Get-Content -Raw artifacts/global-shear/after/report.json|ConvertFrom-Json -Depth 100;$aa=Get-Content -Raw artifacts/global-shear/before/actual.json|ConvertFrom-Json -Depth 100;$ba=Get-Content -Raw artifacts/global-shear/after/actual.json|ConvertFrom-Json -Depth 100;$proof=Get-Content -Raw artifacts/global-shear/after/recovery-proof.json|ConvertFrom-Json -Depth 100
          function Counts($r,$c){$case=@($r.qualification.cases|?{$_.caseId-eq$c})[0];$rows=@($case.comparison.rows);[ordered]@{restraint=@($rows|?{$_.status-eq'FAIL'-and$_.entityKind-eq'NODE'-and$_.quantity-in@('FORCE','MOMENT')}).Count;displacementRotation=@($rows|?{$_.status-eq'FAIL'-and$_.entityKind-eq'NODE'-and$_.quantity-in@('DISPLACEMENT','ROTATION')}).Count;elementEnd=@($rows|?{$_.status-eq'FAIL'-and$_.entityKind-eq'ELEMENT'-and$_.quantity-like'GLOBAL_END_*'}).Count}}
          function FindRow($r,$c,$k,$p,$q,$x){$case=@($r.qualification.cases|?{$_.caseId-eq$c})[0];$rows=@($case.comparison.rows|?{$_.entityKind-eq$k-and([string]$_.entityId).StartsWith($p)-and$_.quantity-eq$q-and$_.component-eq$x});if($rows.Count-ne1){throw"row count $($rows.Count)"};$rows[0]};function Err($r){[math]::Abs([double]$r.actualValue-[double]$r.referenceValue)}
          $targets=@(@('L2 node 20090 UY','L2','NODE','20090','FORCE','UY'),@('L2 E4 TO MZ','L2','ELEMENT','INPUT_ELEMENT:4|','GLOBAL_END_MOMENT_TO','MZ'),@('L2 E5 FROM MZ','L2','ELEMENT','INPUT_ELEMENT:5|','GLOBAL_END_MOMENT_FROM','MZ'),@('L2 E5 FROM FY','L2','ELEMENT','INPUT_ELEMENT:5|','GLOBAL_END_FORCE_FROM','FY'),@('L2 node 20120 RZ','L2','NODE','20120','ROTATION','RZ'),@('L4 node 22120 UY','L4','NODE','22120','FORCE','UY'))
          $signal=[System.Collections.Generic.List[object]]::new();foreach($t in $targets){$x=FindRow $a $t[1] $t[2] $t[3] $t[4] $t[5];$y=FindRow $b $t[1] $t[2] $t[3] $t[4] $t[5];$ex=Err $x;$ey=Err $y;$signal.Add([ordered]@{name=$t[0];reference=[double]$x.referenceValue;before=[double]$x.actualValue;after=[double]$y.actualValue;beforeAbsoluteError=$ex;afterAbsoluteError=$ey;improved=($ey-lt$ex)})}
          $counts=[ordered]@{};foreach($c in @('L2','L3','L4','L5','L6','L14')){$counts[$c]=[ordered]@{before=(Counts $a $c);after=(Counts $b $c)}}
          if([math]::Abs([double]$aa.mechanics.cases.L2.gravityWeightN-[double]$ba.mechanics.cases.L2.gravityWeightN)-gt1e-9){throw'gravity changed'};if($proof.status-ne'PASS'-or$proof.commonOperator.status-ne'PASS'){throw'proof failed'};foreach($c in @('L2','L3','L4','L5','L6','L14')){if($ba.mechanics.cases.$c.recoveredEquilibrium.status-ne'PASS'){throw"$c equilibrium failed"}}
          [ordered]@{schema='m047-bm4l-shared-caesar-timoshenko-ab/v1';classification='AUTHORITY_BACKED_SHARED_FRAME_PROFILE_TEST';source='INTERGRAPH-CAESAR-II-CAUX-2015-FKX';kappa=0.5;sourceAccdbSha256='64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8';highSignal=$signal;failureCounts=$counts;recoveryAndEquilibriumPass=$true}|ConvertTo-Json -Depth 20|Set-Content -Encoding utf8 artifacts/global-shear/ab-evidence.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m047-bm4l-global-timoshenko-ab
          path: artifacts/global-shear
          if-no-files-found: error

name: LFEA S1-S2 bend geometry promotion

on:
  pull_request:
    paths:
      - 'agents/PR1348_workreport.md'
      - 'src/core/geometry/adapters/accdb-to-canonical-geometry.js'
      - 'src/core/geometry/adapters/inputXmlToCanonicalGeometry.js'
      - 'src/core/linear-piping-analysis-consumer/bend-retopology*.js'
      - 'src/core/linear-piping-analysis-consumer/inputxml-linear-structural-preparation.js'
      - 'src/core/linear-piping-analysis-consumer/inputxml-linear-structural-constraints.js'
      - 'src/core/linear-piping-analysis-consumer/inputxml-linear-structural-profile.js'
      - 'src/core/linear-piping-analysis-consumer/inputxml-linear-structural-retopology.js'
      - 'scripts/lfea-bend-tangent-custody-check.mjs'
      - 'scripts/lfea-bend-retopology-check.mjs'
      - 'scripts/lfea-bm4l-bend-tangent-source-check.mjs'
      - 'scripts/lfea-bm4l-bend-retopology-source-check.mjs'
      - 'scripts/lfea-bm4l-bend-tangent-source-check.ps1'
      - '.github/workflows/lfea-piping-promotion-s1-bend-tangent.yml'

permissions:
  contents: read

jobs:
  deterministic-s1-s2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check changed JavaScript syntax
        run: |
          node --check src/core/linear-piping-analysis-consumer/bend-retopology.js
          node --check src/core/linear-piping-analysis-consumer/bend-retopology-contract.js
          node --check src/core/linear-piping-analysis-consumer/bend-retopology-geometry.js
          node --check src/core/linear-piping-analysis-consumer/bend-retopology-bindings.js
          node --check src/core/linear-piping-analysis-consumer/inputxml-linear-structural-preparation.js
          node --check src/core/linear-piping-analysis-consumer/inputxml-linear-structural-retopology.js
          node --check src/core/linear-piping-analysis-consumer/inputxml-linear-structural-constraints.js
          node --check src/core/linear-piping-analysis-consumer/inputxml-linear-structural-profile.js
          node --check scripts/lfea-bend-tangent-custody-check.mjs
          node --check scripts/lfea-bend-retopology-check.mjs
          node --check scripts/lfea-bm4l-bend-retopology-source-check.mjs

      - name: Run deterministic S1 tangent custody check
        run: node scripts/lfea-bend-tangent-custody-check.mjs

      - name: Run deterministic S2 retopology check
        run: node scripts/lfea-bend-retopology-check.mjs

      - name: Run existing ACCDB geometry regression
        run: node scripts/accdb-to-canonical-geometry-check.mjs

      - name: Enforce linear piping anti-drift rules
        run: node scripts/linear-piping-analysis-consumer-anti-drift-check.mjs

  real-bm4l-s1-s2:
    needs: deterministic-s1-s2
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Acquire pinned BM4_L source and authenticated ACE provider
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zipUrl = 'https://raw.githubusercontent.com/reallaksh19/Common/3fe20c7db76feb6ea583fb658b67b3a55afd4fe3/LFEA/BM4/BM4_L.zip'
          $zipSha = '978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9'
          $zipBytes = [int64]582488
          $aceUrl = 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe'
          $aceSha = '04e96c9f1a1f7d251a88aececf1dc10ff65950392787427c00814a43308003de'
          $progIdKey = 'Registry::HKEY_CLASSES_ROOT\Microsoft.ACE.OLEDB.12.0\CLSID'

          New-Item -ItemType Directory -Force artifacts/s1-bm4l/source, artifacts/s1-bm4l/provider | Out-Null
          $zipPath = 'artifacts/s1-bm4l/BM4_L.zip'
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
          $zip = Get-Item $zipPath
          $actualZipSha = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zip.Length -ne $zipBytes -or $actualZipSha -ne $zipSha) {
            throw "Pinned BM4_L.zip custody mismatch: bytes=$($zip.Length), sha=$actualZipSha"
          }
          Expand-Archive $zipPath -DestinationPath artifacts/s1-bm4l/source -Force
          $members = @(Get-ChildItem artifacts/s1-bm4l/source -File -Recurse)
          if ($members.Count -ne 1 -or $members[0].Name -ne 'BM4_L.ACCDB') {
            throw 'Pinned BM4_L.zip must contain exactly BM4_L.ACCDB.'
          }

          if (-not (Test-Path $progIdKey)) {
            $installer = 'artifacts/s1-bm4l/provider/accessdatabaseengine_X64.exe'
            Invoke-WebRequest -Uri $aceUrl -OutFile $installer
            $actualAceSha = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualAceSha -ne $aceSha) { throw "ACE installer SHA-256 mismatch: $actualAceSha" }
            $sig = Get-AuthenticodeSignature -LiteralPath $installer
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') {
              throw "ACE installer Authenticode validation failed: $($sig.Status), $($sig.SignerCertificate.Subject)"
            }
            $process = Start-Process $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "ACE installer exited $($process.ExitCode)." }
          }
          if (-not (Test-Path $progIdKey)) { throw 'Microsoft.ACE.OLEDB.12.0 is not registered after setup.' }

      - name: Qualify real BM4_L S1 tangents and S2 retopology
        shell: pwsh
        run: |
          ./scripts/lfea-bm4l-bend-tangent-source-check.ps1 `
            -AccdbPath 'artifacts/s1-bm4l/source/BM4_L.ACCDB' `
            -TablesOut 'artifacts/s1-bm4l/accdb-tables.json'

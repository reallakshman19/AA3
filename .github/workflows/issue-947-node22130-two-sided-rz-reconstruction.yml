name: Issue 947 node 22130 two-sided RZ reconstruction
# Diagnostic revision: exact E79 adjacency and production Timoshenko rigid-frame profile.

on:
  push:
    branches:
      - codex/issue-947-bm4nl-qualification
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci(issue947): run two-sided node 22130 RZ reconstruction' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download pinned canonical BM4_NL package
        uses: actions/download-artifact@v4
        with:
          name: issue-947-bm4nl-qualification
          path: .work/package
          github-token: ${{ github.token }}
          repository: reallaksh19/Advanced_Analysis
          run-id: 31302834835

      - name: Align standalone E79 evaluator with current production frame profile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          path = Path('scripts/lfea-issue947-node22130-two-sided-rz-reconstruction.mjs')
          text = path.read_text()
          old = """    length,\n    shearDeformation: false,\n  }).matrix;"""
          new = """    length,\n    shearDeformation: true,\n    shearCorrectionFactorY: 0.5,\n    shearCorrectionFactorZ: 0.5,\n  }).matrix;"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one E79 rigid evaluator patch site, found {count}.')
          before = hashlib.sha256(text.encode()).hexdigest()
          patched = text.replace(old, new)
          path.write_text(patched)
          after = hashlib.sha256(patched.encode()).hexdigest()
          Path('.work').mkdir(exist_ok=True)
          Path('.work/issue947-node22130-rigid-evaluator-production-parity-patch.json').write_text(json.dumps({
              'schema': 'lfea-issue947-diagnostic-patch/v1',
              'scope': 'DIAGNOSTIC_ONLY_E79_STANDALONE_EVALUATOR',
              'reason': 'Current ACCDB production buildRigidElement resolves the 10x-wall rigid section and compiles it through frameProfile(), which is PIPE_FRAME3D_TIMOSHENKO_V1 with kappaY=kappaZ=0.5.',
              'productionSourceChanged': False,
              'beforeSha256': before,
              'afterSha256': after,
              'replacementCount': count,
          }, indent=2) + '\n')
          PY

      - name: Run two-sided node 22130 RZ reconstruction
        shell: bash
        run: |
          set +e
          mkdir -p .work
          node scripts/lfea-issue947-node22130-two-sided-rz-reconstruction.mjs \
            --package .work/package/bm4nl-canonical-package.json \
            --out .work/issue947-node22130-two-sided-rz-reconstruction.json \
            > .work/issue947-node22130-two-sided-rz-reconstruction.log 2>&1
          status=$?
          cat .work/issue947-node22130-two-sided-rz-reconstruction.log
          exit $status

      - name: Upload two-sided RZ evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-947-node22130-two-sided-rz-reconstruction
          if-no-files-found: error
          path: |
            .work/issue947-node22130-two-sided-rz-reconstruction.json
            .work/issue947-node22130-two-sided-rz-reconstruction.log
            .work/issue947-node22130-rigid-evaluator-production-parity-patch.json

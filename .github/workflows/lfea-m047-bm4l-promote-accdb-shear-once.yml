name: M047 promote BM4_L ACCDB-qualified shear once

on:
  push:
    branches: [agent/m047-bm4l-root-cause-991]
    paths:
      - '.github/workflows/lfea-m047-bm4l-promote-accdb-shear-once.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/m047-bm4l-root-cause-991
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply ACCDB-qualified straight-pipe formulation
        run: node scripts/lfea-m047-promote-bm4l-accdb-shear.mjs

      - name: Validate staged production change
        shell: bash
        run: |
          set -euo pipefail
          node --check src/core/fea-benchmarks/caesar-accdb-package.js
          node --check src/core/fea-benchmarks/caesar-accdb-linear-solve.js
          node --check src/core/fea-benchmarks/caesar-accdb-straight-pipe-profile.js
          node scripts/lfea-m047-cowper-straight-pipe-profile-check.mjs
          node -e "JSON.parse(require('fs').readFileSync('benchmarks/LFEA/CAESAR_ACCDB/profile.schema.json','utf8')); JSON.parse(require('fs').readFileSync('benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json','utf8'));"
          git diff --check
          git diff -- src/core/fea-benchmarks/caesar-accdb-package.js src/core/fea-benchmarks/caesar-accdb-linear-solve.js benchmarks/LFEA/CAESAR_ACCDB/profile.schema.json benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json

      - name: Commit retained mechanics correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/core/fea-benchmarks/caesar-accdb-package.js \
            src/core/fea-benchmarks/caesar-accdb-linear-solve.js \
            benchmarks/LFEA/CAESAR_ACCDB/profile.schema.json \
            benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json
          if git diff --cached --quiet; then
            echo 'No production change required.'
            exit 0
          fi
          git commit -m 'fix(lfea): use ACCDB-qualified Cowper shear for BM4_L'
          git push origin HEAD:agent/m047-bm4l-root-cause-991

name: EMP.1 integration custody fix

on:
  push:
    branches:
      - agent/emp1-a-run-state-retention-issue1261
    paths:
      - .github/workflows/emp1-integration-custody-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/emp1-a-run-state-retention-issue1261
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch legacy source-custody predicate and add CAUx falsifier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          lib = Path('scripts/emp1-c-qualification-evidence-lib.mjs')
          text = lib.read_text()
          anchor = "const SHA256_HEX = /^[a-f0-9]{64}$/u;\n"
          const = "const SOURCE_CUSTODY_QUALIFICATION_STATE = 'PASS_SOURCE_CUSTODY';\n"
          if const not in text:
              assert text.count(anchor) == 1, 'SHA anchor drift'
              text = text.replace(anchor, anchor + const, 1)
          old = "    && ledger.qualificationState === 'PASS'\n"
          new = "    && ledger.qualificationState === SOURCE_CUSTODY_QUALIFICATION_STATE\n"
          assert text.count(old) == 1, 'legacy custody predicate drift'
          text = text.replace(old, new, 1)
          lib.write_text(text)

          test = Path('scripts/emp1-c-qualification-evidence-self-test.mjs')
          t = test.read_text()
          marker = "const forgedAudit = fullyQualifiedSyntheticArtifacts(retained);\n"
          block = """const genericCauxSourcePassCannotAuthorizeBenchmark = fullyQualifiedSyntheticArtifacts(retained);\ngenericCauxSourcePassCannotAuthorizeBenchmark.cauxSourceLedger.qualificationState = 'PASS';\nassert.throws(\n  () => deriveEmp1CQualificationEvidence(genericCauxSourcePassCannotAuthorizeBenchmark),\n  /EMP1_C_CAUX_QUALIFICATION_WITHOUT_SOURCE_CUSTODY/u,\n  'Generic PASS must not masquerade as PASS_SOURCE_CUSTODY for CAUx benchmark custody',\n);\n\n"""
          if block not in t:
              assert t.count(marker) == 1, 'self-test insertion marker drift'
              t = t.replace(marker, block + marker, 1)
          neg = "    'generic source PASS cannot masquerade as PASS_SOURCE_CUSTODY',\n"
          neg2 = "    'generic CAUx source PASS cannot masquerade as PASS_SOURCE_CUSTODY',\n"
          if neg2 not in t:
              assert t.count(neg) == 1, 'negative-case list marker drift'
              t = t.replace(neg, neg + neg2, 1)
          test.write_text(t)
          PY
          node --check scripts/emp1-c-qualification-evidence-lib.mjs
          node scripts/emp1-c-qualification-evidence-self-test.mjs
      - name: Commit only custody compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/emp1-integration-custody-fix.yml
          git add -- scripts/emp1-c-qualification-evidence-lib.mjs scripts/emp1-c-qualification-evidence-self-test.mjs
          git diff --cached --check
          git commit -m 'fix(emp1): align retained CAUx custody semantics'
          git push origin HEAD:agent/emp1-a-run-state-retention-issue1261

name: agent16-p10-p09-governed-run-gate

on:
  pull_request:
    paths:
      - 'src/core/linear-piping-analysis-consumer/inputxml-linear-prefea-findings.js'
      - 'src/workspace/linear-piping-run-request.js'
      - 'src/workspace/linear-piping-run-gate.js'
      - 'src/workspace/linear-piping-run-analysis.js'
      - 'src/workspace/linear-piping-prerun-check.js'
      - 'src/workspace/linear-piping-prerun-view.js'
      - 'src/workspace/linear-piping-results-workbench.js'
      - 'scripts/lfea-p10-capability-effects-traceability-check.mjs'
      - 'scripts/linear-piping-run-gate-check.mjs'
      - 'scripts/linear-piping-live-run-workbench-check.mjs'
      - '.github/workflows/agent16-p10-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prove exact head and stacked containment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --exit-code
          base='0cb5c6a04f865a4d6890edc59b29c3892af8c5ba'
          p10='5353ae5eb0f441652db8227c64674ecb4694f950'

          git diff --name-only "$base" "$p10" > /tmp/p10-paths.txt
          cat /tmp/p10-paths.txt
          while IFS= read -r changed; do
            case "$changed" in
              src/core/linear-piping-analysis-consumer/inputxml-linear-prefea-findings.js|scripts/lfea-p10-capability-effects-traceability-check.mjs|.github/workflows/agent16-p10-qualification.yml) ;;
              *) echo "Frozen P-10 anchor contains an unexpected path: $changed" >&2; exit 1 ;;
            esac
          done < /tmp/p10-paths.txt

          git diff --name-only "$p10" HEAD > /tmp/p09-paths.txt
          cat /tmp/p09-paths.txt
          while IFS= read -r changed; do
            case "$changed" in
              src/workspace/linear-piping-run-request.js|src/workspace/linear-piping-run-gate.js|src/workspace/linear-piping-run-analysis.js|src/workspace/linear-piping-prerun-check.js|src/workspace/linear-piping-prerun-view.js|src/workspace/linear-piping-results-workbench.js|scripts/linear-piping-run-gate-check.mjs|scripts/linear-piping-live-run-workbench-check.mjs|.github/workflows/agent16-p10-qualification.yml) ;;
              *) echo "P-09 changed an unqualified path: $changed" >&2; exit 1 ;;
            esac
          done < /tmp/p09-paths.txt

      - name: Install dependencies
        run: npm ci

      - name: Materialize P-10 anchor and merge base
        shell: bash
        run: |
          set -euo pipefail
          base='0cb5c6a04f865a4d6890edc59b29c3892af8c5ba'
          p10='5353ae5eb0f441652db8227c64674ecb4694f950'
          rm -rf /tmp/p10-base /tmp/p10-anchor
          git worktree add --detach /tmp/p10-base "$base"
          git worktree add --detach /tmp/p10-anchor "$p10"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/p10-base/node_modules
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/p10-anchor/node_modules

      - name: Preserve P-10 lossless capability-effects projection
        run: node scripts/lfea-p10-capability-effects-traceability-check.mjs

      - name: Preserve P-10 base-to-head semantic transition
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/p10-projection.mjs <<'EOF'
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const root = path.resolve(process.argv[2]);
          const { collectFindings } = await import(pathToFileURL(path.join(root, 'src/core/linear-piping-analysis-consumer/inputxml-linear-prefea-findings.js')));
          const { semanticHash } = await import(pathToFileURL(path.join(root, 'src/core/shared-piping-model/canonical-json.js')));
          const capabilityEffects = {
            STRICT_LINEAR_STATIC: { disposition: 'CONDITIONAL', limitationCode: 'P10_STRICT_LIMITATION' },
            OPERATING_CASE_STRICT: { disposition: 'BLOCK', limitationCode: 'P10_OPERATING_BLOCK' },
          };
          const finding = collectFindings({
            sourceBundle: { geometry: { diagnostics: [] } }, topology: { findings: [] }, proximity: { findings: [] },
            representability: { findings: [{
              code: 'P10_TRACEABILITY_FIXTURE', category: 'RESTRAINT', severity: 'warning', disposition: 'CONDITIONAL',
              message: 'P-10 traceability fixture.', technicalBasis: 'P-10 retained capability effects.',
              evidence: { inventoryId: 'P10-INV-001', sourceRecordSemanticHash: 'p10-source-record-hash' },
              remediation: 'Review the disclosed capability effects.', capabilityEffects,
              sourceFeatureIds: ['P10-SF-001'], sourcePaths: ['/PIPINGMODEL/PIPINGELEMENT[1]/RESTRAINT[1]'],
              canonicalEntityIds: ['P10-NODE-10'], physicalCaseIds: ['P10-W'], approximationEligible: true, authorizationRequired: true,
            }], capabilities: [] }, engineeringSanity: { findings: [] },
          })[0];
          process.stdout.write(JSON.stringify({ findingId: finding.findingId, capabilityEffects: finding.capabilityEffects, evidence: finding.evidence, semanticHash: semanticHash(finding) }));
          EOF
          node /tmp/p10-projection.mjs /tmp/p10-base > /tmp/p10-base.json
          node /tmp/p10-projection.mjs "$GITHUB_WORKSPACE" > /tmp/p10-head.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const base = JSON.parse(fs.readFileSync('/tmp/p10-base.json', 'utf8'));
          const head = JSON.parse(fs.readFileSync('/tmp/p10-head.json', 'utf8'));
          assert.deepEqual(head.capabilityEffects, base.capabilityEffects);
          assert.equal(Object.hasOwn(base.evidence, 'upstreamCapabilityEffects'), false);
          assert.deepEqual(head.evidence.upstreamCapabilityEffects, {
            OPERATING_CASE_STRICT: { disposition: 'BLOCK', limitationCode: 'P10_OPERATING_BLOCK' },
            STRICT_LINEAR_STATIC: { disposition: 'CONDITIONAL', limitationCode: 'P10_STRICT_LIMITATION' },
          });
          assert.notEqual(head.findingId, base.findingId);
          assert.notEqual(head.semanticHash, base.semanticHash);
          EOF

      - name: P-09 sealed PASS WARN BLOCK authorization contract
        run: node scripts/linear-piping-run-gate-check.mjs

      - name: P-09 legacy M003 bypass is governed BLOCK with no override
        run: node scripts/linear-piping-live-run-workbench-check.mjs

      - name: M003 core mechanics P-10 P-09 equivalence beneath workspace gate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/p09-m003-core-oracle.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const root = path.resolve(process.argv[2]);
          const { buildM003LiveRunRequest } = await import(pathToFileURL(path.join(root, 'scripts/m003-live-run-analysis-fixture.mjs')));
          const { compileLinearPipingInputXmlAnalysisContext } = await import(pathToFileURL(path.join(root, 'src/core/linear-piping-analysis-consumer/index.js')));
          const request = buildM003LiveRunRequest();
          const high = request.cases.find((entry) => entry.caseId === 'HIGH');
          assert.ok(high, 'M003 HIGH case is required.');
          const context = compileLinearPipingInputXmlAnalysisContext(
            high.inputXmlAnalysisRequest,
            { factorizationCache: new Map() },
          );
          const result = context.sourceAnalysisContext.analysisResult;
          const reaction = (dof) => result.execution.reactions.find(
            (entry) => entry.nodeId === 'RED-001.N0' && entry.dof === dof,
          )?.value;
          const uy = reaction('UY');
          const rz = reaction('RZ');
          assert.ok(Number.isFinite(uy));
          assert.ok(Number.isFinite(rz));
          assert.ok(Math.abs(uy + 1000) < 1e-8, `M003 UY reaction drifted: ${uy}`);
          assert.ok(Math.abs(rz + 2400) < 1e-8, `M003 RZ reaction drifted: ${rz}`);
          process.stdout.write(JSON.stringify({
            status: result.status,
            semanticHash: result.semanticHash,
            uy,
            rz,
          }));
          EOF
          node /tmp/p09-m003-core-oracle.mjs /tmp/p10-anchor > /tmp/p10-m003-core.json
          node /tmp/p09-m003-core-oracle.mjs "$GITHUB_WORKSPACE" > /tmp/p09-m003-core.json
          cat /tmp/p09-m003-core.json
          cmp /tmp/p10-m003-core.json /tmp/p09-m003-core.json
          printf '%s\n' 'M003 core analysis result and reaction anchors are byte-identical P-10 anchor to P-09 head.'

      - name: Linear piping consumer anti-drift
        run: node scripts/linear-piping-analysis-consumer-anti-drift-check.mjs

      - name: Prove PF-16 carried-red parity on P-10 anchor and P-09 head
        shell: bash
        run: |
          set -euo pipefail
          pattern='^PF-16 BLOCK cannot be overridden$'
          set +e
          (cd /tmp/p10-anchor && node --test --test-name-pattern="$pattern" test/lfea-prefea-gateway.test.js) > /tmp/p10-pf16.log 2>&1
          anchor_status=$?
          node --test --test-name-pattern="$pattern" test/lfea-prefea-gateway.test.js > /tmp/p09-pf16.log 2>&1
          head_status=$?
          set -e
          test "$anchor_status" -ne 0
          test "$head_status" -ne 0
          for log in /tmp/p10-pf16.log /tmp/p09-pf16.log; do
            grep -F 'Preparation retains prohibited runtime state.' "$log"
            grep -F '# fail 1' "$log"
          done

      - name: Pre-FEA PF-01..15 and PF-17..24 regression
        run: node --test --test-name-pattern='^PF-(0[1-9]|1[0-5]|1[7-9]|2[0-4]) ' test/lfea-prefea-gateway.test.js

      - name: Pre-FEA exercise G H regression
        run: node --test --test-name-pattern='^Exercise [GH] ' test/lfea-prefea-gateway.test.js

      - name: Pre-FEA runtime-creation regression
        run: node --test --test-name-pattern='^solver runtime ' test/lfea-prefea-gateway.test.js

      - name: Linear piping consumer regression
        run: node scripts/linear-piping-analysis-consumer-check.mjs

      - name: Closed-form mechanics P-10 P-09 equivalence
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            lfea-b3.7-simply-supported-beam-check.mjs \
            lfea-b3.8-thermal-expansion-check.mjs \
            lfea-b3.9-gravity-self-weight-check.mjs
          do
            stem="${script%.mjs}"
            (cd /tmp/p10-anchor && node "scripts/$script") > "/tmp/p10-$stem.log"
            node "scripts/$script" > "/tmp/p09-$stem.log"
            cmp "/tmp/p10-$stem.log" "/tmp/p09-$stem.log"
          done
          printf '%s\n' 'B-3.7/B-3.8/B-3.9 numerical outputs are byte-identical P-10 anchor to P-09 head.'

      - name: Required 1 — strict syntax
        run: npm run syntax:strict

      - name: Required 2 — import graph
        run: node scripts/import-check.mjs

      - name: Required 3 — enrichment UI phase 0
        run: node scripts/run-enrichment-ui-phase0-checks.mjs

      - name: Required 4 — linear piping workspace integration
        run: node scripts/linear-piping-workspace-integration-check.mjs

      - name: Required 5 — UI invariants
        run: node scripts/ui-invariant-check.mjs

      - name: Required 6 — production Vite build
        run: npx vite build

      - name: Report stacked P-10 P-09 qualification
        run: |
          printf '%s\n' \
            'P-10 frozen qualified anchor 5353ae5eb0f441652db8227c64674ecb4694f950 PRESERVED' \
            'P-09 PASS automatic sealed authorization PASS' \
            'P-09 WARN explicit complete-limitation authorization PASS' \
            'P-09 BLOCK no-bypass policy PASS' \
            'P-09 stale request and receipt-tamper rejection PASS' \
            'P-09 M003 formerly executable bypass now governed BLOCK PASS' \
            'M003 core P-10/P-09 numerical oracle equivalence PASS' \
            'linear-piping anti-drift PASS' \
            'PF-16 carried-red parity PROVEN' \
            'all other pre-FEA gateway tests PASS' \
            'B-3.7/B-3.8/B-3.9 P-10/P-09 numerical equivalence PASS' \
            'all six #952 mandatory commands PASS'

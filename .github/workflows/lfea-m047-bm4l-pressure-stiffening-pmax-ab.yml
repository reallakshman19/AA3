name: M047 BM4_L pressure stiffening Pmax A-B

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pressure-stiffening-pmax-ab:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/m047-bm4l-root-cause-991'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout Advanced_Analysis
        uses: actions/checkout@v4

      - name: Checkout pinned Common source
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 45d51ea18624f5775805f399110c1738301c0d90
          path: _common
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install signed Microsoft ACE 2016 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'accessdatabaseengine_X64.exe'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid' -or [string]$signature.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'Microsoft ACE installer signature check failed.' }
          $p = Start-Process -FilePath $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if ($p.ExitCode -notin @(0,3010)) { throw "ACE install failed with exit $($p.ExitCode)" }

      - name: Extract and verify pinned BM4_L ACCDB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $zip = Join-Path $PWD '_common/LFEA/BM4/BM4_L.zip'
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant() -ne '978617cba50fa0b1a16c2fa71dc1e0d38e55ac834b191f887d100c6951abd8b9') { throw 'ZIP custody mismatch.' }
          $extract = Join-Path $env:RUNNER_TEMP 'bm4l-pressure-stiffening-pmax-ab'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $accdb = Join-Path $extract 'BM4_L.ACCDB'
          if ((Get-FileHash -Algorithm SHA256 $accdb).Hash.ToLowerInvariant() -ne '64c05a50e9ed0452622ff5880335460486f24ac8e6adecc9a300b549c9aa82f8') { throw 'ACCDB custody mismatch.' }
          "BM4L_ACCDB=$accdb" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prove BM4_L pressure inventory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $json = & scripts/lfea-caesar-accdb-export.ps1 -AccdbPath $env:BM4L_ACCDB -TablesCsv 'INPUT_BASIC_ELEMENT_DATA'
          $data = $json | ConvertFrom-Json
          $bends = @($data.tables.INPUT_BASIC_ELEMENT_DATA.rows | Where-Object { [double]$_.BEND_PTR -gt 0 })
          $inventory = foreach ($row in $bends) {
            $operating = @(1..9 | ForEach-Object { [double]$row.("PRESSURE$_") })
            [ordered]@{
              elementId = [int]$row.ELEMENTID
              p1KPa = [double]$row.PRESSURE1
              pmaxP1ThroughP9KPa = ($operating | Measure-Object -Maximum).Maximum
              pHydroKPa = [double]$row.HYDRO_PRESSURE
            }
          }
          $inventory | ConvertTo-Json -Depth 5 | Out-File artifacts/bend-pressure-inventory.json -Encoding utf8
          if (@($inventory | Where-Object { $_.pmaxP1ThroughP9KPa -ne 11600 -or $_.pHydroKPa -ne 22035 }).Count -ne 0) {
            throw 'BM4_L bend pressure inventory differs from expected governed input.'
          }

      - name: Run frozen L2 and L4 baseline
        shell: pwsh
        run: |
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb "$env:BM4L_ACCDB" `
            --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json `
            --solve-linear true `
            --solve-cases L2,L4 `
            --actual-out artifacts/baseline-actual.json `
            --out artifacts/baseline-report.json `
            --summary-out artifacts/baseline-summary.md

      - name: Change only stiffening pressure from P1-P9-plus-hydro to CAESAR Pmax P1-P9
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src/core/fea-benchmarks/caesar-accdb-linear-solve.js'
          $text = Get-Content $path -Raw
          $old = @'
          const definedPressures = [
            ...Array.from({ length: 9 }, (_value, index) => Number(row[`PRESSURE${index + 1}`])),
            Number(row.HYDRO_PRESSURE),
          ].filter((value) => Number.isFinite(value) && value >= 0);
          '@
          $new = @'
          const definedPressures = Array.from(
            { length: 9 },
            (_value, index) => Number(row[`PRESSURE${index + 1}`]),
          ).filter((value) => Number.isFinite(value) && value >= 0);
          '@
          if (-not $text.Contains($old)) { throw 'Bend stiffening pressure source shape changed.' }
          $text = $text.Replace($old, $new)
          Set-Content -Path $path -Value $text -Encoding utf8
          $diff = (git diff -- $path) -join "`n"
          $diff | Out-File artifacts/pressure-stiffening-pmax-transient.patch -Encoding utf8
          if (-not $diff.Contains('HYDRO_PRESSURE') -or -not $diff.Contains('Array.from')) { throw 'Pmax transient patch was not recorded.' }

      - name: Run L2 and L4 with Pmax P1-P9 stiffening pressure
        shell: pwsh
        run: |
          node scripts/lfea-caesar-accdb-benchmark.mjs `
            --accdb "$env:BM4L_ACCDB" `
            --profile benchmarks/LFEA/CAESAR_ACCDB/bm4l-validation.profile.json `
            --solve-linear true `
            --solve-cases L2,L4 `
            --actual-out artifacts/pmax-actual.json `
            --out artifacts/pmax-report.json `
            --summary-out artifacts/pmax-summary.md

      - name: Record A-B counts by case
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Get-Content artifacts/baseline-report.json -Raw | ConvertFrom-Json
          $test = Get-Content artifacts/pmax-report.json -Raw | ConvertFrom-Json
          function Counts($r,$caseId) {
            $case = $r.qualification.cases | Where-Object caseId -eq $caseId
            $rows = @($case.comparison.rows | Where-Object status -eq 'FAIL')
            $restraint = @($rows | Where-Object { $_.entityKind -eq 'NODE' -and $_.quantity -in @('FORCE','MOMENT') }).Count
            $disp = @($rows | Where-Object { $_.entityKind -eq 'NODE' -and $_.quantity -in @('DISPLACEMENT','ROTATION') }).Count
            $actions = @($rows | Where-Object { $_.entityKind -eq 'ELEMENT' -and $_.quantity -like 'GLOBAL_END_*' }).Count
            [ordered]@{ restraint=$restraint; displacementRotation=$disp; elementEnd=$actions; totalTargeted=$restraint+$disp+$actions }
          }
          $cases = [ordered]@{}
          foreach ($caseId in @('L2','L4')) {
            $b=Counts $base $caseId; $t=Counts $test $caseId
            $cases[$caseId]=[ordered]@{ baseline=$b; test=$t; delta=[ordered]@{ restraint=$t.restraint-$b.restraint; displacementRotation=$t.displacementRotation-$b.displacementRotation; elementEnd=$t.elementEnd-$b.elementEnd; totalTargeted=$t.totalTargeted-$b.totalTargeted } }
          }
          $out=[ordered]@{
            schema='lfea-m047-single-factor-ab/v1'
            hypothesis='CAESAR_ELBOW_STIFFENING_PRESSURE_PMAX_SEMANTICS'
            changedField='MAX_DEFINED stiffening pressure: max(P1..P9,Phydro) -> Pmax=max(P1..P9)'
            sourceSha256=$base.source.sha256
            documentedSemantics='Hexagon Elbow Stiffening Pressure: Pmax is maximum P1 through P9; Phydro is a separate selection.'
            cases=$cases
          }
          $out | ConvertTo-Json -Depth 14 | Out-File artifacts/pressure-stiffening-pmax-ab.json -Encoding utf8
          $out | ConvertTo-Json -Depth 14

      - name: Upload A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bm4l-pressure-stiffening-pmax-ab-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
